<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes"
>

<title>2棟 フロアマップ</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* =========================================
   全体
========================================= */

html,
body {
  width: 100%;
  min-height: 100%;

  margin: 0;
  padding: 0;

  overflow-x: hidden;
  overflow-y: auto;

  background-color: #eeedeb !important;
  color: black;

  font-family: sans-serif;

  overscroll-behavior-x: none;
}


/* =========================================
   背景
   TOPページと統一
========================================= */

.bg-shapes {
  position: absolute !important;

  top: 0;
  left: 0;

  width: 100%;

  height: max(100vh, 1100px);

  z-index: 0 !important;

  pointer-events: none;

  overflow: hidden;

  opacity: 0.55 !important;
}


/*
   背景図形を表示
   TOPページと同じ図形を
   薄く透けるように表示
*/

.bg-shapes .shape {
  display: block !important;

  opacity: 0.45;
}

.bg-shapes::before,
.bg-shapes::after {
  display: block;
}


/* =========================================
   ヘッダー
========================================= */

#header {
  position: relative;
  z-index: 100;
}


/* =========================================
   フロアマップ画面
========================================= */

.floor-page {
  position: relative;

  top: auto;
  left: auto;

  width: 100%;

  min-height: calc(100vh - 80px);

  overflow: visible;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  touch-action: pan-y;

  background: transparent !important;

  z-index: 1;
}


/* =========================================
   マップ表示エリア
========================================= */

.map-view {
  position: relative;

  width: 100%;

  min-height: calc(100vh - 80px);

  height: auto;

  padding-top: 70px;
  padding-bottom: 80px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  overflow: visible;

  touch-action: pan-y;

  background: transparent !important;

  box-sizing: border-box;
}


/* =========================================
   マップ画像ラッパー
========================================= */

.map-image-wrapper {
  position: relative;

  max-width: 90vw;
  max-height: 75vh;

  display: flex;
  align-items: center;
  justify-content: center;

  transform-origin: center center;

  touch-action: pan-y;

  user-select: none;
  -webkit-user-select: none;

  flex-shrink: 0;

  cursor: default;

  will-change: transform;

  margin: 0 auto;
}


/* =========================================
   マップ画像
========================================= */

.map-image {
  display: block;

  max-width: 90vw;
  max-height: 75vh;

  width: auto;
  height: auto;

  object-fit: contain;

  user-select: none;
  -webkit-user-drag: none;
  -webkit-user-select: none;

  pointer-events: none;
}


/* =========================================
   透明な当たり判定
========================================= */

.map-hotspots {
  position: absolute;

  inset: 0;

  width: 100%;
  height: 100%;

  pointer-events: none;

  z-index: 10;
}


.map-hotspot {
  position: absolute;

  display: none;

  box-sizing: border-box;

  border-radius: 8px;

  background: transparent;

  border: 2px solid transparent;

  box-shadow: none;

  pointer-events: auto;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;

  transition: none;
}


.map-hotspot:hover {
  background: transparent;

  border-color: transparent;
}


.map-hotspot:active {
  background: transparent;

  border-color: transparent;
}


/* =========================================
   2棟1階
========================================= */

.hotspot-cha {

  left: 63.2%;
  top: 43.5%;

  width: 12.3%;
  height: 26.8%;
}


.hotspot-science-kagaku {

  left: 28.4%;
  top: 43.5%;

  width: 18.0%;
  height: 26.8%;
}


.hotspot-kado {
  left: 49.5%;
  top: 47.3%;
  width: 4.0%;
  height: 19.8%;
}


.hotspot-oami-special {
  left: 46.5%;
  top: 65.9%;
  width: 2.2%;
  height: 34.1%;
}


/* =========================================
   2棟2階
========================================= */

.hotspot-art {

  left: 87.9%;
  top: 43.5%;

  width: 12.0%;
  height: 26.8%;
}


.hotspot-science-butsuri {

  left: 28.4%;
  top: 43.5%;

  width: 18.0%;
  height: 26.8%;
}


.hotspot-shogi {

  left: 0%;
  top: 43.5%;

  width: 18.0%;
  height: 26.8%;
}


.hotspot-photo {
  left: 48.0%;
  top: 43.5%;
  width: 3.8%;
  height: 26.8%;
}


/* =========================================
   2棟3階
========================================= */

.hotspot-science-seibutsu {

  left: 28.4%;
  top: 43.5%;

  width: 18.0%;
  height: 26.8%;
}


/* =========================================
   2棟4階
========================================= */

.hotspot-science-chigaku {

  left: 28.4%;
  top: 43.5%;

  width: 18.0%;
  height: 26.8%;
}


.hotspot-science-sugaku {
  left: 72.9%;
  top: 43.5%;
  width: 15.0%;
  height: 26.8%;
}


/* =========================================
   場所詳細モーダル
========================================= */

#placeModalOverlay {

  position: fixed;

  inset: 0;

  z-index: 2000;

  display: none;

  background: rgba(6, 37, 79, 0.58);

  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}


#placeModalOverlay.active {
  display: block;
}


#placeModalFrame {

  display: block;

  width: 100%;
  height: 100%;

  border: 0;

  background: transparent;
}


/* =========================================
   上部ボタンエリア
========================================= */

.top-controls {
  position: absolute;

  top: 8px;
  left: 50%;

  transform: translateX(-50%);

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 7px;

  z-index: 50;

  white-space: nowrap;
}


.back-to-map {

  border: none;

  background: #06254f;

  color: #fff;

  padding: 6px 13px;

  border-radius: 8px;

  font-size: 15px;
  font-weight: 700;

  letter-spacing: 0.04em;

  white-space: nowrap;

  cursor: pointer;

  box-shadow: none;

  -webkit-tap-highlight-color: transparent;
}


.back-to-map:active {
  opacity: 0.65;
}


.help-button {

  border: none;

  background: #15929e;

  color: #fff;

  padding: 6px 13px;

  border-radius: 8px;

  font-size: 15px;
  font-weight: 700;

  letter-spacing: 0.04em;

  white-space: nowrap;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}


.help-button:active {
  opacity: 0.65;
}


/* =========================================
   左右ボタン
========================================= */

.floor-arrow {
  position: absolute;

  top: 0;

  transform: translateY(-50%);

  width: 48px;
  height: 80px;

  border: none;

  background: transparent;

  font-size: 52px;
  line-height: 1;

  color: #d92a21;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  z-index: 30;

  padding: 0;

  text-shadow: none;

  -webkit-tap-highlight-color: transparent;
}


.floor-arrow:active {
  opacity: 0.5;
}


.floor-prev {
  left: 4px;

  color: #d92a21;
}


.floor-next {
  right: 4px;

  color: #d92a21;
}


/* =========================================
   棟切り替え
========================================= */

.building-switch {
  position: absolute;

  left: 50%;
  top: 100%;

  transform: translateX(-50%);

  width: 48px;
  height: 50px;

  border: none;

  background: transparent;

  color: #15929e;

  font-size: 52px;
  line-height: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  z-index: 40;

  padding: 0;

  border-radius: 0;

  text-shadow: none;

  -webkit-tap-highlight-color: transparent;
}


.building-switch:active {
  opacity: 0.5;
}


/* =========================================
   操作説明モーダル
========================================= */

.help-overlay {

  position: fixed;

  inset: 0;

  z-index: 1000;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(6, 37, 79, 0.55);

  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}


.help-overlay.active {
  display: flex;
}


.help-modal {

  position: relative;

  width: min(430px, 92vw);

  max-height: 82vh;

  overflow-y: auto;

  background: #eeedeb;

  border-radius: 18px;

  padding: 24px 20px 20px;

  box-shadow: 0 15px 40px rgba(0,0,0,0.25);

  border-top: 7px solid #06254f;

  box-sizing: border-box;
}


.help-title {

  margin: 0 35px 5px 0;

  color: #06254f;

  font-size: 23px;

  font-weight: 800;

  letter-spacing: 0.05em;
}


.help-subtitle {

  margin: 0 0 18px;

  color: #555;

  font-size: 13px;

  font-weight: 600;
}


.help-item {

  display: flex;

  align-items: center;

  gap: 13px;

  margin-bottom: 10px;

  padding: 11px 12px;

  background: #fff;

  border-radius: 10px;

  border-left: 5px solid #15929e;

  box-sizing: border-box;
}


.help-icon {

  width: 34px;
  min-width: 34px;
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 21px;

  border-radius: 8px;

  background: #eeedeb;
}


.help-icon.gesture-red-square {

  width: 34px;
  min-width: 34px;
  height: 34px;

  background: #d92a21;

  border-radius: 8px;

  font-size: 0;
}


.help-icon.gesture-square {

  width: 34px;
  min-width: 34px;
  height: 34px;

  background: #ff9d1c;

  border-radius: 8px;

  font-size: 0;
}


.help-icon.gesture-pan-square {

  width: 34px;
  min-width: 34px;
  height: 34px;

  background: #15929e;

  border-radius: 8px;

  font-size: 0;
}


.help-text {

  color: #222;

  font-size: 13px;

  line-height: 1.55;

  font-weight: 600;
}


.help-text strong {

  color: #06254f;

  font-size: 14px;
}


/* =========================================
   閉じる
========================================= */

.help-close {

  width: 100%;

  margin-top: 8px;

  border: none;

  border-radius: 9px;

  padding: 11px;

  background: #06254f;

  color: #fff;

  font-size: 15px;

  font-weight: 700;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}


.help-close:active {
  opacity: 0.65;
}


/* =========================================
   ×
========================================= */

.help-x {

  position: absolute;

  top: 13px;
  right: 14px;

  width: 32px;
  height: 32px;

  border: none;

  border-radius: 50%;

  background: #d92a21;

  color: #fff;

  font-size: 19px;

  line-height: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}


.help-x:active {
  opacity: 0.65;
}


/* =========================================
   スマートフォン
========================================= */

@media (max-width: 600px) {

  .floor-page {

    min-height: calc(100vh - 50px);

    overflow: visible;

  .map-view {

  }


  #placeModalOverlay {
    z-index: 2000;
  }


  .help-overlay {

    padding: 15px;
  }


  .help-modal {

    width: 94vw;

    max-height: 84vh;

    padding: 21px 16px 16px;

    border-top-width: 6px;
  }


  .help-title {
    font-size: 20px;
  }


  .help-subtitle {

    font-size: 12px;

    margin-bottom: 14px;
  }


  .help-item {

    gap: 10px;

    margin-bottom: 8px;

    padding: 9px 10px;

    border-left-width: 4px;
  }


  .help-icon {

    width: 31px;
    min-width: 31px;
    height: 31px;

    font-size: 18px;
  }


  .help-icon.gesture-red-square {

    width: 31px;
    min-width: 31px;
    height: 31px;

    background: #d92a21;

    border-radius: 7px;
  }


  .help-icon.gesture-square {

    width: 31px;
    min-width: 31px;
    height: 31px;

    background: #ff9d1c;

    border-radius: 7px;
  }


  .help-icon.gesture-pan-square {

    width: 31px;
    min-width: 31px;
    height: 31px;

    background: #15929e;

    border-radius: 7px;
  }


  .help-text {
    font-size: 12px;
  }


  .help-text strong {
    font-size: 13px;
  }


  /* -------------------------
     背景
  ------------------------- */

  .bg-shapes {

    width: 100%;

    height: max(100vh, 1050px);

    opacity: 0.55 !important;
  }


  .bg-shapes .shape {
    display: block !important;
    opacity: 0.45;
  }

}


/* =========================================
   極端に狭い画面
========================================= */

@media (max-width: 360px) {

  .map-view {
    padding-top: 105px;
  }


  .top-controls {
    top: 52px;
  }


  .back-to-map,
  .help-button {

    font-size: 12px;

    padding: 5px 8px;
  }

}


/* =========================================
   横向きスマートフォン
========================================= */

@media screen and (max-width: 900px) and (orientation: landscape) {

  .map-view {

    padding-top: 75px;

    max-width: 80vw;

  }

    max-height: 72vh;
  }

}

</style>

</head>

<body>


<div class="bg-shapes">

  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>
  <div class="shape s4"></div>
  <div class="shape s5"></div>
  <div class="shape s6"></div>
  <div class="shape s7"></div>
  <div class="shape s8"></div>

</div>


<!-- =========================================
     ヘッダー
========================================= -->

<div id="header"></div>


<script>

fetch("header.html")
  .then(res => res.text())
  .then(data => {

    document.getElementById("header").innerHTML = data;

    const btn =
      document.querySelector(".menu-btn");

    const nav =
      document.querySelector(".nav");


    if (btn && nav) {

      btn.addEventListener(
        "click",
        (e) => {

          e.stopPropagation();

          nav.classList.toggle("active");

        }
      );


      document.addEventListener(
        "click",
        (e) => {

          if (
            !nav.contains(e.target) &&
            !btn.contains(e.target)
          ) {

            nav.classList.remove("active");

          }

        }
      );

    }

  });

</script>


<!-- =========================================
     フロアマップ
========================================= -->

<div class="floor-page">

  <div class="map-view">


    <div class="top-controls">

      <button
        class="back-to-map"
        id="backToMap"
        type="button"
      >
        全体図に戻る
      </button>


      <button

        type="button"
      >

      </button>

    <button

      id="imageWrapper"

      <div

        <button

        <button

        ></button>


        <button

          data-modal-type="kado"

          type="button"
        ></button>


        <button

        <button

        <button

        <button

        <button

<!-- =========================================

========================================= -->

<div

>

    role="dialog"
    aria-modal="true"

      class="help-x"
      id="helpX"
      type="button"
      aria-label="操作説明を閉じる"
    >

    </button>


    <h2
      class="help-title"
      id="helpTitle"
    >
      フロアマップの操作方法
    </h2>

      画像を動かしたり拡大したりできます
    </p>


    <div class="help-item">

      <div class="help-icon gesture-red-square"></div>

      <div class="help-text">

        <strong>
          赤い文字をタップで詳細表示
        </strong>

        <br>

        赤い文字をタップすると詳細を表示できます。(制作中)

      </div>

    </div>


    <div class="help-item">

      <div class="help-text">

        <strong>
          2本指で拡大・縮小
        </strong>

        <br>

        画像の上で2本の指を広げたり閉じたりすると、
        マップを拡大・縮小できます。

      </div>

    </div>


    <div class="help-item">

      <div class="help-icon gesture-pan-square"></div>

      <div class="help-text">

        <strong>
          拡大後は1本指で移動
        </strong>

        <br>

        拡大した状態で1本指を動かすと、
        マップを見る位置を移動できます。

      </div>

    </div>


    <div class="help-item">

      <div class="help-icon">
        〈〉
      </div>

      <div class="help-text">

        <strong>
          階を切り替える
        </strong>

        <br>

        左右の「〈」「〉」ボタンで
        1階・2階・3階・4階を切り替えられます。

      </div>

    </div>


    <div class="help-item">

      <div class="help-icon">
        ⌃
      </div>

      <div class="help-text">

        <strong>
          棟を切り替える
        </strong>

        <br>

        画像の下にある「⌃」を押すと、
        1棟のフロアマップへ移動します。

      </div>

    </div>


    <button
      class="help-close"
      id="helpClose"
      type="button"
    >
      マップを見る
    </button>

  </div>

</div>


<script>

/* =========================================
   2棟 フロア設定
========================================= */

const floors = [

  {
    name: "2棟 1階",
    image: "images/2tou_1f.jpg"
  },

  {
    name: "2棟 2階",
    image: "images/2tou_2f.jpg"
  },

  {
    name: "2棟 3階",
    image: "images/2tou_3f.jpg"
  },

  {
    name: "2棟 4階",
    image: "images/2tou_4f.jpg"
  }

];


let currentFloor = 0;


/* =========================================
   要素
========================================= */

const floorImage =
  document.getElementById("floorImage");

const prevButton =
  document.getElementById("prevButton");

const nextButton =
  document.getElementById("nextButton");

const buildingSwitch =
  document.getElementById("buildingSwitch");

const imageWrapper =
  document.getElementById("imageWrapper");

const backToMap =
  document.getElementById("backToMap");

const mapView =
  document.querySelector(".map-view");

const mapHotspots =
  document.querySelectorAll(".map-hotspot");


/* =========================================
   場所詳細モーダル
========================================= */

const placeModalOverlay =
  document.getElementById("placeModalOverlay");

const placeModalFrame =
  document.getElementById("placeModalFrame");


function openPlaceModal(type) {

  if (
    !placeModalOverlay ||
    !placeModalFrame
  ) {
    return;
  }


  placeModalFrame.src =
    "modal3.html?type=" +
    encodeURIComponent(type);


  placeModalOverlay.classList.add(
    "active"
  );


  placeModalOverlay.setAttribute(
    "aria-hidden",
    "false"
  );


  document.body.style.overflow =
    "hidden";
}


function closePlaceModal() {

  if (
    !placeModalOverlay ||
    !placeModalFrame
  ) {
    return;
  }


  placeModalOverlay.classList.remove(
    "active"
  );


  placeModalOverlay.setAttribute(
    "aria-hidden",
    "true"
  );


  placeModalFrame.src =
    "about:blank";


  document.body.style.overflow =
    "";
}


mapHotspots.forEach(
  (hotspot) => {

    hotspot.addEventListener(
      "click",
      (e) => {

        e.preventDefault();

        e.stopPropagation();


        const type =
          hotspot.dataset.modalType;


        if (type) {

          openPlaceModal(type);

        }

      }
    );

  }
);


window.addEventListener(
  "message",
  (e) => {

    if (
      e.source !==
      placeModalFrame?.contentWindow
    ) {
      return;
    }


    if (
      e.data &&
      e.data.type ===
      "close-map-modal"
    ) {

      closePlaceModal();

    }

  }
);


/* =========================================
   操作説明
========================================= */

const helpButton =
  document.getElementById("helpButton");

const helpOverlay =
  document.getElementById("helpOverlay");

const helpClose =
  document.getElementById("helpClose");

const helpX =
  document.getElementById("helpX");


const HELP_STORAGE_KEY =
  "choko_floor_map_help_shown";


function openHelp() {

  helpOverlay.classList.add(
    "active"
  );

}


function closeHelp() {

  helpOverlay.classList.remove(
    "active"
  );


  localStorage.setItem(
    HELP_STORAGE_KEY,
    "true"
  );

}


helpButton.addEventListener(
  "click",
  () => {

    openHelp();

  }
);


helpClose.addEventListener(
  "click",
  () => {

    closeHelp();

  }
);


helpX.addEventListener(
  "click",
  () => {

    closeHelp();

  }
);


helpOverlay.addEventListener(
  "click",
  (e) => {

    if (
      e.target ===
      helpOverlay
    ) {

      closeHelp();

    }

  }
);


if (
  localStorage.getItem(
    HELP_STORAGE_KEY
  ) !== "true"
) {

  setTimeout(
    () => {

      openHelp();

    },
    350
  );

}


/* =========================================
   当たり判定表示
========================================= */

function updateHotspots() {

  mapHotspots.forEach(
    (hotspot) => {

      const floor =
        Number(
          hotspot.dataset.floor
        );


      if (
        floor === currentFloor
      ) {

        hotspot.style.display =
          "block";

      } else {

        hotspot.style.display =
          "none";

      }

    }
  );

}


/* =========================================
   ズーム・移動
========================================= */

let scale = 1;

let translateX = 0;
let translateY = 0;

let startDistance = 0;
let startScale = 1;

let startPanX = 0;
let startPanY = 0;

let startTouchX = 0;
let startTouchY = 0;

let startCenterX = 0;
let startCenterY = 0;

let isDragging = false;


function getDistance(touches) {

  const dx =
    touches[0].clientX -
    touches[1].clientX;

  const dy =
    touches[0].clientY -
    touches[1].clientY;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


function updateArrowPosition() {

  if (!imageWrapper) {
    return;
  }


  const imageTop =
    imageWrapper.offsetTop;

  const imageHeight =
    imageWrapper.offsetHeight;


  const centerY =
    imageTop +
    (imageHeight / 2);


  prevButton.style.top =
    centerY + "px";

  nextButton.style.top =
    centerY + "px";

}


function clampPosition() {

  const wrapperWidth =
    imageWrapper.offsetWidth;

  const wrapperHeight =
    imageWrapper.offsetHeight;


  const maxX =
    Math.max(
      0,
      (wrapperWidth *
      (scale - 1)) / 2
    );


  const maxY =
    Math.max(
      0,
      (wrapperHeight *
      (scale - 1)) / 2
    );


  translateX =
    Math.min(
      Math.max(
        translateX,
        -maxX
      ),
      maxX
    );


  translateY =
    Math.min(
      Math.max(
        translateY,
        -maxY
      ),
      maxY
    );

}


function updateTransform() {

  clampPosition();


  imageWrapper.style.transform =
    "translate3d(" +
    translateX +
    "px, " +
    translateY +
    "px, 0) scale(" +
    scale +
    ")";

}


function setZoom(value) {

  scale =
    Math.min(
      Math.max(
        value,
        1
      ),
      5
    );


  updateTransform();

}


function resetZoom() {

  scale = 1;

  translateX = 0;
  translateY = 0;


  imageWrapper.style.transform =
    "translate3d(0, 0, 0) scale(1)";


  updateArrowPosition();

}


function showFloor(index) {

  currentFloor =
    (index + floors.length) %
    floors.length;


  floorImage.src =
    floors[currentFloor].image;


  floorImage.alt =
    floors[currentFloor].name +
    " フロアマップ";


  resetZoom();


  updateHotspots();

}


floorImage.addEventListener(
  "load",
  () => {

    resetZoom();

    updateArrowPosition();

    updateHotspots();

  }
);


prevButton.addEventListener(
  "click",
  () => {

    showFloor(
      currentFloor - 1
    );

  }
);


nextButton.addEventListener(
  "click",
  () => {

    showFloor(
      currentFloor + 1
    );

  }
);


backToMap.addEventListener(
  "click",
  () => {

    closePlaceModal();

    location.href =
      "map.html";

  }
);


buildingSwitch.addEventListener(
  "click",
  (e) => {

    e.stopPropagation();


    closePlaceModal();


    location.href =
      "1tou.html";

  }
);


imageWrapper.addEventListener(
  "touchstart",
  (e) => {

    if (
      e.touches.length === 2
    ) {

      startDistance =
        getDistance(
          e.touches
        );


      startScale =
        scale;


      startPanX =
        translateX;

      startPanY =
        translateY;


      startCenterX =
        (
          e.touches[0].clientX +
          e.touches[1].clientX
        ) / 2;


      startCenterY =
        (
          e.touches[0].clientY +
          e.touches[1].clientY
        ) / 2;


      isDragging = false;

      return;

    }


    if (
      e.touches.length === 1 &&
      scale > 1
    ) {

      isDragging = true;


      startTouchX =
        e.touches[0].clientX;

      startTouchY =
        e.touches[0].clientY;


      startPanX =
        translateX;

      startPanY =
        translateY;

    }

  },
  {
    passive: false
  }
);


imageWrapper.addEventListener(
  "touchmove",
  (e) => {

    if (
      e.touches.length === 2
    ) {

      e.preventDefault();


      const distance =
        getDistance(
          e.touches
        );


      if (
        startDistance > 0
      ) {

        const ratio =
          distance /
          startDistance;


        scale =
          Math.min(
            Math.max(
              startScale *
              ratio,
              1
            ),
            5
          );

      }


      const centerX =
        (
          e.touches[0].clientX +
          e.touches[1].clientX
        ) / 2;


      const centerY =
        (
          e.touches[0].clientY +
          e.touches[1].clientY
        ) / 2;


      translateX =
        startPanX +
        (
          centerX -
          startCenterX
        );


      translateY =
        startPanY +
        (
          centerY -
          startCenterY
        );


      updateTransform();

      return;

    }


    if (
      e.touches.length === 1 &&
      isDragging &&
      scale > 1
    ) {

      e.preventDefault();


      const x =
        e.touches[0].clientX;

      const y =
        e.touches[0].clientY;


      translateX =
        startPanX +
        (
          x -
          startTouchX
        );


      translateY =
        startPanY +
        (
          y -
          startTouchY
        );


      updateTransform();

    }

  },
  {
    passive: false
  }
);


imageWrapper.addEventListener(
  "touchend",
  (e) => {

    if (
      e.touches.length === 0
    ) {

      isDragging = false;

      startDistance = 0;

      startTouchX = 0;
      startTouchY = 0;

      startCenterX = 0;
      startCenterY = 0;

    }

  },
  {
    passive: false
  }
);


imageWrapper.addEventListener(
  "mousedown",
  (e) => {

    if (
      e.target.classList.contains(
        "map-hotspot"
      )
    ) {

      return;

    }


    if (
      e.button !== 0 ||
      scale <= 1
    ) {
      return;
    }


    isDragging = true;


    startTouchX =
      e.clientX;

    startTouchY =
      e.clientY;


    startPanX =
      translateX;

    startPanY =
      translateY;


    imageWrapper.style.cursor =
      "grabbing";


    e.preventDefault();

  }
);


document.addEventListener(
  "mousemove",
  (e) => {

    if (
      !isDragging ||
      scale <= 1
    ) {
      return;
    }


    translateX =
      startPanX +
      (
        e.clientX -
        startTouchX
      );


    translateY =
      startPanY +
      (
        e.clientY -
        startTouchY
      );


    updateTransform();

  }
);


document.addEventListener(
  "mouseup",
  () => {

    if (isDragging) {

      isDragging = false;


      imageWrapper.style.cursor =
        scale > 1
          ? "grab"
          : "default";

    }

  }
);


imageWrapper.addEventListener(
  "wheel",
  (e) => {

    e.preventDefault();


    const delta =
      e.deltaY > 0
        ? -0.15
        : 0.15;


    setZoom(
      scale + delta
    );


    imageWrapper.style.cursor =
      scale > 1
        ? "grab"
        : "default";

  },
  {
    passive: false
  }
);


imageWrapper.style.cursor =
  "default";


window.addEventListener(
  "load",
  () => {

    updateArrowPosition();

    updateHotspots();

  }
);


window.addEventListener(
  "resize",
  () => {

    if (scale > 1) {

      updateTransform();

    }


    updateArrowPosition();

  }
);

</script>

</body>
</html>
