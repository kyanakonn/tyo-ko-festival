<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes"
>

<title>2棟 フロアマップ</title>

<link rel="stylesheet" href="css/style.css">

<style>


/* =========================================
   全体
========================================= */

html,
body {
  width: 100%;
  min-width: 0;
  min-height: 100%;

  margin: 0;
  padding: 0;

  overflow-x: hidden;
  overflow-y: auto;

  background-color: #eeedeb !important;
  color: black;

  font-family: sans-serif;

  overscroll-behavior-x: none;
}


/* =========================================
   背景
   TOPページと統一
========================================= */

.bg-shapes {
  position: fixed !important;

  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 0 !important;

  pointer-events: none;

  overflow: hidden;

  /* TOPページと同じように透けて表示 */
  opacity: 0.24 !important;

  /* 背景として少し馴染ませる */
  filter: blur(1px);

  transform: translateZ(0);
}


/* 背景図形 */

.bg-shapes .shape {
  display: block !important;

  position: absolute;
}


/* =========================================
   三角形
========================================= */

.s1 {
  top: 5%;
  left: -50px;

  width: 0;
  height: 0;

  border-left: 90px solid transparent;
  border-right: 90px solid transparent;
  border-bottom: 170px solid #c96d80;

  transform: rotate(-25deg);
}

.s2 {
  top: 25%;
  left: -35px;

  width: 0;
  height: 0;

  border-left: 70px solid transparent;
  border-right: 70px solid transparent;
  border-bottom: 130px solid #8870a8;

  transform: rotate(20deg);
}

.s3 {
  bottom: 5%;
  left: -30px;

  width: 0;
  height: 0;

  border-left: 100px solid transparent;
  border-right: 100px solid transparent;
  border-bottom: 180px solid #cfb25a;

  transform: rotate(12deg);
}

.s4 {
  bottom: 28%;
  left: 20px;

  width: 0;
  height: 0;

  border-left: 60px solid transparent;
  border-right: 60px solid transparent;
  border-bottom: 120px solid #65a6ae;

  transform: rotate(-15deg);
}

.s5 {
  top: 12%;
  right: -80px;

  width: 0;
  height: 0;

  border-left: 150px solid transparent;
  border-right: 150px solid transparent;
  border-bottom: 260px solid #6aa8ad;

  transform: rotate(30deg);
}

.s6 {
  bottom: -40px;
  right: -30px;

  width: 0;
  height: 0;

  border-left: 100px solid transparent;
  border-right: 100px solid transparent;
  border-bottom: 190px solid #c96d80;

  transform: rotate(-15deg);
}

.s7 {
  top: 8%;
  right: 40px;

  width: 0;
  height: 0;

  border-left: 55px solid transparent;
  border-right: 55px solid transparent;
  border-bottom: 100px solid #8870a8;

  transform: rotate(35deg);
}

.s8 {
  bottom: 20%;
  right: 40px;

  width: 0;
  height: 0;

  border-left: 70px solid transparent;
  border-right: 70px solid transparent;
  border-bottom: 130px solid #cfb25a;

  transform: rotate(-20deg);
}


/* =========================================
   四角形
========================================= */

.bg-shapes::before,
.bg-shapes::after {
  content: "";

  position: absolute;

  display: block;
}


.bg-shapes::before {
  width: 85px;
  height: 150px;

  left: 7%;
  top: 45%;

  background: #a57999;

  transform: rotate(28deg);
}


.bg-shapes::after {
  width: 110px;
  height: 70px;

  right: 4%;
  top: 55%;

  background: #65a0a8;

  transform: rotate(-20deg);
}


/* =========================================
   追加四角形
========================================= */

.s9 {
  top: 38%;
  left: 12%;

  width: 90px;
  height: 55px;

  background: #c87382;

  transform: rotate(-18deg);
}


.s10 {
  top: 70%;
  left: 18%;

  width: 65px;
  height: 100px;

  background: #766990;

  transform: rotate(25deg);
}


.s11 {
  top: 32%;
  right: 15%;

  width: 75px;
  height: 75px;

  background: #c8a75a;

  transform: rotate(18deg);
}


.s12 {
  bottom: 10%;
  right: 20%;

  width: 100px;
  height: 55px;

  background: #609da4;

  transform: rotate(-30deg);
}


/* =========================================
   ヘッダー
========================================= */

#header {
  position: relative;
  z-index: 100;
}


/* =========================================
   フロアマップ画面
========================================= */

.floor-page {
  position: relative;

  top: auto;
  left: auto;

  width: 100%;
  max-width: 100%;

  min-height: calc(100vh - 80px);

  overflow: visible;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  touch-action: pan-y;

  background: transparent !important;

  z-index: 1;
}


/* =========================================
   マップ表示エリア
========================================= */

.map-view {
  position: relative;

  width: 100%;
  max-width: 100%;

  min-height: calc(100vh - 80px);

  height: auto;

  padding-top: 92px;
  padding-bottom: 80px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  overflow: visible;

  touch-action: pan-y;

  background: transparent !important;

  box-sizing: border-box;
}


/* =========================================
   マップ画像
========================================= */

.map-image-wrapper {
  position: relative;

  max-width: 90vw;
  max-height: 75vh;

  display: flex;
  align-items: center;
  justify-content: center;

  transform-origin: center center;

  touch-action: pan-y;

  user-select: none;
  -webkit-user-select: none;

  flex-shrink: 0;

  cursor: default;

  will-change: transform;

  margin: 0 auto;
}


.map-image {
  display: block;

  max-width: 90vw;
  max-height: 75vh;

  width: auto;
  height: auto;

  object-fit: contain;

  user-select: none;
  -webkit-user-drag: none;
  -webkit-user-select: none;

  pointer-events: none;
}


/* =========================================
   上部ボタンエリア
========================================= */

.top-controls {
  position: absolute;

  top: 12px;
  left: 50%;

  transform: translateX(-50%);

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 8px;

  z-index: 50;

  white-space: nowrap;
}


/* =========================================
   全体図に戻るボタン
========================================= */

.back-to-map {
  appearance: none;
  border: 2px solid rgba(36,36,42,.12);
  background: #fff;
  color: #555;
  padding: 8px 14px;
  border-radius: 0;
  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  cursor: pointer;
  box-shadow: 4px 4px 0 rgba(0,0,0,.09);
  -webkit-tap-highlight-color: transparent;
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
}

.back-to-map:hover {
  transform: translate(-1px,-1px);
  background: #fff;
  box-shadow: 6px 6px 0 rgba(0,0,0,.09);
}

.back-to-map:active {
  transform: translate(2px,2px);
  box-shadow: 2px 2px 0 rgba(0,0,0,.09);
  opacity: 1;
}


/* =========================================
   操作説明ボタン
========================================= */

.help-button {
  appearance: none;
  border: 2px solid #65a6ae;
  background: #65a6ae;
  color: #fff;
  padding: 8px 14px;
  border-radius: 0;
  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  cursor: pointer;
  box-shadow: 4px 4px 0 rgba(0,0,0,.09);
  -webkit-tap-highlight-color: transparent;
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
}

.help-button:hover {
  transform: translate(-1px,-1px);
  background: #5b969d;
  box-shadow: 6px 6px 0 rgba(0,0,0,.09);
}

.help-button:active {
  transform: translate(2px,2px);
  box-shadow: 2px 2px 0 rgba(0,0,0,.09);
  opacity: 1;
}

/* =========================================
   混雑表示コントロール
========================================= */

.crowd-toggle-button {
  appearance: none;
  border: 2px solid rgba(36,36,42,.12);
  background: #fff;
  color: #555;
  padding: 8px 13px;
  border-radius: 0;
  font-family: inherit;
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  cursor: pointer;
  box-shadow: 4px 4px 0 rgba(0,0,0,.09);
  -webkit-tap-highlight-color: transparent;
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
}

.crowd-toggle-button:hover {
  transform: translate(-1px,-1px);
  box-shadow: 6px 6px 0 rgba(0,0,0,.09);
}

.crowd-toggle-button:active {
  transform: translate(2px,2px);
  box-shadow: 2px 2px 0 rgba(0,0,0,.09);
  opacity: 1;
}

.crowd-toggle-button.off {
  background: #f1f1ef;
  color: #777;
}

.crowd-toggle-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 6px;
  border-radius: 50%;
  background: #4f9d69;
  vertical-align: 1px;
}

.crowd-toggle-button.off .crowd-toggle-dot {
  background: #aaa;
}

.crowd-legend {
  position: absolute;
  top: calc(100% + 7px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 7px 10px;
  border: 1px solid rgba(36,36,42,.10);
  border-radius: 0;
  background: rgba(255,255,255,.92);
  box-shadow: 4px 4px 0 rgba(0,0,0,.07);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  z-index: 60;
  pointer-events: none;
  white-space: nowrap;
}

.crowd-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: #333;
  font-size: 11px;
  font-weight: 700;
}

.crowd-legend-unknown {
  gap: 0;
}

.crowd-legend-color {
  display: inline-block;
  width: 13px;
  height: 13px;
  border-radius: 4px;
  box-sizing: border-box;
}

.crowd-legend-color.empty {
  background: rgba(79,157,105,.48);
  border: 1px solid rgba(79,157,105,.70);
}

.crowd-legend-color.normal {
  background: rgba(215,168,61,.48);
  border: 1px solid rgba(215,168,61,.70);
}

.crowd-legend-color.crowded {
  background: rgba(212,91,88,.48);
  border: 1px solid rgba(212,91,88,.70);
}
/* =========================================
   左右ボタン
========================================= */

.floor-arrow {
  position: absolute;

  top: 0;

  transform: translateY(-50%);

  width: 48px;
  height: 80px;

  border: none;

  background: transparent;

  font-size: 52px;
  line-height: 1;

  color: #d92a21;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  z-index: 30;

  padding: 0;

  text-shadow: none;

  -webkit-tap-highlight-color: transparent;
}

.floor-arrow:active {
  opacity: 0.5;
}

.floor-prev {
  left: 4px;
}

.floor-next {
  right: 4px;

  color: #d92a21;
}


/* =========================================
   棟切り替えボタン
========================================= */

.building-switch {
  position: absolute;

  left: 50%;
  top: 100%;

  transform: translateX(-50%);

  width: 48px;
  height: 50px;

  border: none;

  background: transparent;

  color: #15929e;

  font-size: 52px;
  line-height: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  z-index: 40;

  padding: 0;

  border-radius: 0;

  text-shadow: none;

  -webkit-tap-highlight-color: transparent;
}

.building-switch:active {
  opacity: 0.5;
}


/* =========================================
   操作説明モーダル
========================================= */

.help-overlay {

  position: fixed;

  inset: 0;

  z-index: 1000;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(6, 37, 79, 0.55);

  backdrop-filter: blur(5px);

  -webkit-backdrop-filter: blur(5px);
}

.help-overlay.active {
  display: flex;
}


/* =========================================
   操作説明本体
========================================= */

.help-modal {

  position: relative;

  width: min(430px, 92vw);

  max-height: 82vh;

  overflow-y: auto;

  background: #eeedeb;

  border-radius: 18px;

  padding: 24px 20px 20px;

  box-shadow: 0 15px 40px rgba(0,0,0,0.25);

  border-top: 7px solid #06254f;

  box-sizing: border-box;
}


/* =========================================
   モーダルタイトル
========================================= */

.help-title {

  margin: 0 35px 5px 0;

  color: #06254f;

  font-size: 23px;

  font-weight: 800;

  letter-spacing: 0.05em;
}


.help-subtitle {

  margin: 0 0 18px;

  color: #555;

  font-size: 13px;

  font-weight: 600;
}


/* =========================================
   操作項目
========================================= */

.help-item {

  display: flex;

  align-items: center;

  gap: 13px;

  margin-bottom: 10px;

  padding: 11px 12px;

  background: #fff;

  border-radius: 10px;

  border-left: 5px solid #15929e;

  box-sizing: border-box;
}


.help-icon {

  width: 34px;
  min-width: 34px;
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 21px;

  border-radius: 8px;

  background: #eeedeb;
}


/* =========================================
   赤い文字タップアイコン
========================================= */

.help-icon.gesture-red-square {

  width: 34px;
  min-width: 34px;
  height: 34px;

  background: #d92a21;

  border-radius: 8px;

  font-size: 0;
}


/* =========================================
   2本指アイコン部分
========================================= */

.help-icon.gesture-square {

  width: 34px;
  min-width: 34px;
  height: 34px;

  background: #ff9d1c;

  border-radius: 8px;

  font-size: 0;
}


/* =========================================
   1本指移動アイコン部分
========================================= */

.help-icon.gesture-pan-square {

  width: 34px;
  min-width: 34px;
  height: 34px;

  background: #15929e;

  border-radius: 8px;

  font-size: 0;
}


/* =========================================
   操作説明テキスト
========================================= */

.help-text {

  color: #222;

  font-size: 13px;

  line-height: 1.55;

  font-weight: 600;
}


.help-text strong {

  color: #06254f;

  font-size: 14px;
}


/* =========================================
   閉じるボタン
========================================= */

.help-close {

  width: 100%;

  margin-top: 8px;

  border: none;

  border-radius: 9px;

  padding: 11px;

  background: #06254f;

  color: #fff;

  font-size: 15px;

  font-weight: 700;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.help-close:active {
  opacity: 0.65;
}


/* =========================================
   モーダル右上閉じる
========================================= */

.help-x {

  position: absolute;

  top: 13px;
  right: 14px;

  width: 32px;
  height: 32px;

  border: none;

  border-radius: 50%;

  background: #d92a21;

  color: #fff;

  font-size: 19px;

  line-height: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.help-x:active {
  opacity: 0.65;
}


/* =========================================
   スマートフォン
========================================= */

@media (max-width: 600px) {

  .floor-page {

    width: 100%;
    max-width: 100%;

    min-height: calc(100vh - 50px);

    overflow: visible;
  }


  .map-view {

    width: 100%;
    max-width: 100%;

    min-height: calc(100vh - 50px);

    height: auto;

    padding-top: 115px;

    padding-bottom: 75px;

    justify-content: flex-start;

    overflow: visible;
  }


  .map-image {

    max-width: 82vw;
    max-height: 68vh;
  }


  .map-image-wrapper {

    max-width: 82vw;
    max-height: 68vh;

    position: relative;

    left: auto;
    top: auto;

    transform: none;

    width: auto;
    height: auto;

    margin: 0 auto;
  }


  /* -------------------------
     上部ボタン
  ------------------------- */

  .top-controls {

    top: 58px;

    gap: 5px;
  }


  .back-to-map,
  .help-button {

    font-size: 12px;

    padding: 7px 9px;

    border-radius: 0;
  }

  .crowd-toggle-button {
    font-size: 11px;
    padding: 7px 8px;
  }

  .crowd-legend {
    top: calc(100% + 6px);
    max-width: 96vw;
    gap: 5px;
    padding: 6px 7px;
  }

  .crowd-legend-item {
    font-size: 9px;
    gap: 3px;
  }

  .crowd-legend-color {
    width: 10px;
    height: 10px;
  }


  /* -------------------------
     左右矢印
  ------------------------- */

  .floor-arrow {

    width: 40px;
    height: 70px;

    font-size: 44px;

    top: 0;

    color: #d92a21;
  }

  .floor-prev {
    left: 0;
  }

  .floor-next {
    right: 0;

    color: #d92a21;
  }


  /* -------------------------
     棟切り替え
  ------------------------- */

  .building-switch {

    width: 40px;
    height: 50px;

    font-size: 44px;

    top: 100%;
  }


  /* -------------------------
     操作説明
  ------------------------- */

  .help-overlay {
    padding: 15px;
  }


  .help-modal {

    width: 94vw;

    max-height: 84vh;

    padding: 21px 16px 16px;

    border-radius: 16px;

    border-top-width: 6px;
  }


  .help-title {
    font-size: 20px;
  }


  .help-subtitle {
    font-size: 12px;

    margin-bottom: 14px;
  }


  .help-item {
    gap: 10px;

    margin-bottom: 8px;

    padding: 9px 10px;

    border-left-width: 4px;
  }


  .help-icon {

    width: 31px;
    min-width: 31px;
    height: 31px;

    font-size: 18px;
  }


  .help-icon.gesture-red-square {

    width: 31px;
    min-width: 31px;
    height: 31px;

    background: #d92a21;

    border-radius: 7px;
  }


  .help-icon.gesture-square {

    width: 31px;
    min-width: 31px;
    height: 31px;

    background: #ff9d1c;

    border-radius: 7px;
  }


  .help-icon.gesture-pan-square {

    width: 31px;
    min-width: 31px;
    height: 31px;

    background: #15929e;

    border-radius: 7px;
  }


  .help-text {
    font-size: 12px;
  }


  .help-text strong {
    font-size: 13px;
  }


  /* -------------------------
     背景
     TOPページと同じように
     スマホではさらに控えめ
  ------------------------- */

  .bg-shapes {

    width: 100%;
    height: 100%;

    opacity: 0.18 !important;

    filter: blur(1px);
  }

}


/* =========================================
   極端に狭い画面への対応
========================================= */

@media (max-width: 360px) {

  .map-view {
    padding-top: 135px;
  }

  .top-controls {
    top: 52px;
  }

  .back-to-map,
  .help-button {
    font-size: 11px;
    padding: 6px 8px;
  }

}


/* =========================================
   横向きスマートフォン
========================================= */

@media screen and (max-width: 900px) and (orientation: landscape) {

  .map-view {

    padding-top: 100px;
    padding-bottom: 60px;

  }


  .top-controls {

    top: 48px;

  }


  .map-image {

    max-width: 80vw;
    max-height: 72vh;

  }


  .map-image-wrapper {

    max-width: 80vw;
    max-height: 72vh;

  }

}



/* =========================================
   赤文字エリアのクリック判定
   ※クリック判定のみ。表示は完全透明
========================================= */

.map-hotspot {
  position: absolute;
  z-index: 25;
  display: block;
  padding: 0;
  margin: 0;
  border: 2px solid transparent;
  border-radius: 10px;
  background: transparent;
  box-shadow: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  box-sizing: border-box;
  transition: none;
}

.map-hotspot:hover {
  background: transparent;
  border-color: transparent;
}

.map-hotspot:active {
  background: transparent;
  border-color: transparent;
  transform: none;
}


/* =========================================
   1棟1階
========================================= */

.map-hotspot.ten-yen-bread {
  left: 40.8%;
  top: 26.4%;
  width: 15.2%;
  height: 26.7%;
}


/* =========================================
   1棟2階
========================================= */

.map-hotspot.room-2d {
  left: 0%;
  top: 73.9%;
  width: 8.2%;
  height: 26.4%;
}

.map-hotspot.room-3a {
  left: 8.5%;
  top: 73.9%;
  width: 8.2%;
  height: 26.4%;
}

.map-hotspot.room-2a {
  left: 16.8%;
  top: 73.9%;
  width: 8.1%;
  height: 26.4%;
}

.map-hotspot.room-jrc {
  left: 36.0%;
  top: 28.8%;
  width: 4.8%;
  height: 28.0%;
}

.map-hotspot.room-1a {
  left: 52.4%;
  top: 73.9%;
  width: 8.3%;
  height: 26.4%;
}

.map-hotspot.room-3g {
  left: 61.0%;
  top: 73.9%;

/* =========================================
   2棟 フロア設定
========================================= */

const floors = [

  {
    name: "2棟 1階",
    image: "images/2tou_1f.jpg"
  },

  {
    name: "2棟 2階",
    image: "images/2tou_2f.jpg"
  },

  {
    name: "2棟 3階",
    image: "images/2tou_3f.jpg"
  },

  {
    name: "2棟 4階",
    image: "images/2tou_4f.jpg"
  }

];


let currentFloor = 0;


/* =========================================
   要素
========================================= */

const floorImage =
  document.getElementById("floorImage");

const prevButton =
  document.getElementById("prevButton");

const nextButton =
  document.getElementById("nextButton");

const buildingSwitch =
  document.getElementById("buildingSwitch");

const imageWrapper =
  document.getElementById("imageWrapper");

const backToMap =
  document.getElementById("backToMap");

const mapView =
  document.querySelector(".map-view");


/* =========================================
   場所詳細モーダル
========================================= */

const placeModalOverlay =
  document.getElementById("placeModalOverlay");

const placeModalFrame =
  document.getElementById("placeModalFrame");

const mapHotspots =
  document.querySelectorAll(".map-hotspot");


function openPlaceModal(type) {

  if (!placeModalOverlay || !placeModalFrame) {
    return;
  }

  placeModalFrame.src =
    "modal3.html?type=" + encodeURIComponent(type);

  placeModalOverlay.classList.add("active");
  placeModalOverlay.setAttribute("aria-hidden", "false");

  document.body.style.overflow = "hidden";
}


function closePlaceModal() {

  if (!placeModalOverlay || !placeModalFrame) {
    return;
  }

  placeModalOverlay.classList.remove("active");
  placeModalOverlay.setAttribute("aria-hidden", "true");
  placeModalFrame.src = "about:blank";

  document.body.style.overflow = "";
}


mapHotspots.forEach((hotspot) => {

  hotspot.addEventListener("click", (e) => {

    e.preventDefault();
    e.stopPropagation();

    const type = hotspot.dataset.modalType;

    if (type) {
      openPlaceModal(type);
    }

  });

});


window.addEventListener("message", (e) => {

  if (e.source !== placeModalFrame?.contentWindow) {
    return;
  }

  if (e.data && e.data.type === "close-map-modal") {
    closePlaceModal();
  }

});


function updateHotspots() {

  mapHotspots.forEach((hotspot) => {

    const isFloor1Hotspot =
      hotspot.classList.contains("floor-1-hotspot");

    const isFloor2Hotspot =
      hotspot.classList.contains("floor-2-hotspot");

    const isFloor3Hotspot =
      hotspot.classList.contains("floor-3-hotspot");

    const isFloor4Hotspot =
      hotspot.classList.contains("floor-4-hotspot");

    if (isFloor1Hotspot) {
      hotspot.hidden = currentFloor !== 0;
      return;
    }

    if (isFloor2Hotspot) {
      hotspot.hidden = currentFloor !== 1;
      return;
    }

    if (isFloor3Hotspot) {
      hotspot.hidden = currentFloor !== 2;
      return;
    }

    if (isFloor4Hotspot) {
      hotspot.hidden = currentFloor !== 3;
      return;
    }

    hotspot.hidden = true;

  });

}


/* =========================================
   操作説明
========================================= */

const helpButton =
  document.getElementById("helpButton");

const helpOverlay =
  document.getElementById("helpOverlay");

const helpClose =
  document.getElementById("helpClose");

const helpX =
  document.getElementById("helpX");


const HELP_STORAGE_KEY =
  "choko_floor_map_help_shown";


function openHelp() {

  helpOverlay.classList.add("active");

}


function closeHelp() {

  helpOverlay.classList.remove("active");

  localStorage.setItem(
    HELP_STORAGE_KEY,
    "true"
  );

}


helpButton.addEventListener(
  "click",
  () => {

    openHelp();

  }
);


helpClose.addEventListener(
  "click",
  () => {

    closeHelp();

  }
);


helpX.addEventListener(
  "click",
  () => {

    closeHelp();

  }
);


helpOverlay.addEventListener(
  "click",
  (e) => {

    if (e.target === helpOverlay) {

      closeHelp();

    }

  }
);


if (
  localStorage.getItem(
    HELP_STORAGE_KEY
  ) !== "true"
) {

  setTimeout(
    () => {

      openHelp();

    },
    350
  );

}


/* =========================================
   ズーム・移動
========================================= */

let scale = 1;

let translateX = 0;
let translateY = 0;

let startDistance = 0;
let startScale = 1;

let startPanX = 0;
let startPanY = 0;

let startTouchX = 0;
let startTouchY = 0;

let startCenterX = 0;
let startCenterY = 0;

let isDragging = false;


function getDistance(touches) {

  const dx =
    touches[0].clientX -
    touches[1].clientX;

  const dy =
    touches[0].clientY -
    touches[1].clientY;

  return Math.sqrt(
    dx * dx + dy * dy
  );

}


function updateArrowPosition() {

  if (!imageWrapper) {
    return;
  }

  const imageTop =
    imageWrapper.offsetTop;

  const imageHeight =
    imageWrapper.offsetHeight;

  const centerY =
    imageTop + (imageHeight / 2);

  prevButton.style.top =
    centerY + "px";

  nextButton.style.top =
    centerY + "px";

}


function clampPosition() {

  const wrapperWidth =
    imageWrapper.offsetWidth;

  const wrapperHeight =
    imageWrapper.offsetHeight;


  const maxX =
    Math.max(
      0,
      (wrapperWidth * (scale - 1)) / 2
    );

  const maxY =
    Math.max(
      0,
      (wrapperHeight * (scale - 1)) / 2
    );


  translateX =
    Math.min(
      Math.max(translateX, -maxX),
      maxX
    );

  translateY =
    Math.min(
      Math.max(translateY, -maxY),
      maxY
    );

}


function updateTransform() {

  clampPosition();

  imageWrapper.style.transform =
    "translate3d(" +
    translateX +
    "px, " +
    translateY +
    "px, 0) scale(" +
    scale +
    ")";

}


function setZoom(value) {

  scale =
    Math.min(
      Math.max(value, 1),
      5
    );

  updateTransform();

}


function resetZoom() {

  scale = 1;

  translateX = 0;
  translateY = 0;

  imageWrapper.style.transform =
    "translate3d(0, 0, 0) scale(1)";

  updateArrowPosition();

}


function showFloor(index) {

  currentFloor =
    (index + floors.length) % floors.length;

  floorImage.src =
    floors[currentFloor].image;

  floorImage.alt =
    floors[currentFloor].name +
    " フロアマップ";

  resetZoom();
  updateHotspots();

}


floorImage.addEventListener(
  "load",
  () => {

    resetZoom();

    updateArrowPosition();

  }
);


prevButton.addEventListener(
  "click",
  () => {

    showFloor(currentFloor - 1);

  }
);


nextButton.addEventListener(
  "click",
  () => {

    showFloor(currentFloor + 1);

  }
);


backToMap.addEventListener(
  "click",
  () => {

    location.href = "map.html";

  }
);


buildingSwitch.addEventListener(
  "click",
  (e) => {

    e.stopPropagation();

    closePlaceModal();

    location.href =
      "1tou.html";

  }
);


imageWrapper.addEventListener(
  "touchstart",
  (e) => {

    if (e.touches.length === 2) {

      startDistance =
        getDistance(e.touches);

      startScale =
        scale;

      startPanX =
        translateX;

      startPanY =
        translateY;

      startCenterX =
        (
          e.touches[0].clientX +
          e.touches[1].clientX
        ) / 2;

      startCenterY =
        (
          e.touches[0].clientY +
          e.touches[1].clientY
        ) / 2;

      isDragging = false;

      return;

    }


    if (
      e.touches.length === 1 &&
      scale > 1
    ) {

      isDragging = true;

      startTouchX =
        e.touches[0].clientX;

      startTouchY =
        e.touches[0].clientY;

      startPanX =
        translateX;

      startPanY =
        translateY;

    }

  },
  { passive: false }
);


imageWrapper.addEventListener(
  "touchmove",
  (e) => {

    if (e.touches.length === 2) {

      e.preventDefault();

      const distance =
        getDistance(e.touches);

      if (startDistance > 0) {

        const ratio =
          distance / startDistance;

        scale =
          Math.min(
            Math.max(
              startScale * ratio,
              1
            ),
            5
          );

      }


      const centerX =
        (
          e.touches[0].clientX +
          e.touches[1].clientX
        ) / 2;

      const centerY =
        (
          e.touches[0].clientY +
          e.touches[1].clientY
        ) / 2;


      translateX =
        startPanX +
        (centerX - startCenterX);

      translateY =
        startPanY +
        (centerY - startCenterY);

      updateTransform();

      return;

    }


    if (
      e.touches.length === 1 &&
      isDragging &&
      scale > 1
    ) {

      e.preventDefault();

      const x =
        e.touches[0].clientX;

      const y =
        e.touches[0].clientY;

      translateX =
        startPanX +
        (x - startTouchX);

      translateY =
        startPanY +
        (y - startTouchY);

      updateTransform();

    }

  },
  { passive: false }
);


imageWrapper.addEventListener(
  "touchend",
  (e) => {

    if (e.touches.length === 0) {

      isDragging = false;

      startDistance = 0;

      startTouchX = 0;
      startTouchY = 0;

      startCenterX = 0;
      startCenterY = 0;

    }

  },
  { passive: false }
);


imageWrapper.addEventListener(
  "mousedown",
  (e) => {

    if (
      e.button !== 0 ||
      scale <= 1
    ) {
      return;
    }

    isDragging = true;

    startTouchX =
      e.clientX;

    startTouchY =
      e.clientY;

    startPanX =
      translateX;

    startPanY =
      translateY;

    imageWrapper.style.cursor =
      "grabbing";

    e.preventDefault();

  }
);


document.addEventListener(
  "mousemove",
  (e) => {

    if (
      !isDragging ||
      scale <= 1
    ) {
      return;
    }

    translateX =
      startPanX +
      (e.clientX - startTouchX);

    translateY =
      startPanY +
      (e.clientY - startTouchY);

    updateTransform();

  }
);


document.addEventListener(
  "mouseup",
  () => {

    if (isDragging) {

      isDragging = false;

      imageWrapper.style.cursor =
        scale > 1
          ? "grab"
          : "default";

    }

  }
);


imageWrapper.addEventListener(
  "wheel",
  (e) => {

    e.preventDefault();

    const delta =
      e.deltaY > 0
        ? -0.15
        : 0.15;

    setZoom(scale + delta);

    imageWrapper.style.cursor =
      scale > 1
        ? "grab"
        : "default";

  },
  { passive: false }
);


imageWrapper.style.cursor = "default";

updateHotspots();


window.addEventListener(
  "load",
  () => {

    updateArrowPosition();

  }
);


window.addEventListener(
  "resize",
  () => {

    if (scale > 1) {

      updateTransform();

    }

    updateArrowPosition();

  }
);

</script>

<script>
/* =========================================
   2棟フロアマップ 混雑状況表示

   ★重要：企画IDと2棟の教室の対応は
   このファイル内で完全固定しています。

   events.html を検索して対応を推測する処理は行いません。
   1棟の企画・教室は一切扱いません。
========================================= */
(() => {

  const API_URL = "https://chosei-fes.onrender.com/api/crowd";
  const REFRESH_MS = 15000;
  const STORAGE_KEY = "choko_crowd_map_visible_v3";

  let crowdEnabled = true;
  let requestController = null;

  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved === "false") {
      crowdEnabled = false;
    }
  } catch (_) {}

  /* =========================================
     2棟：企画ID → マップの対応を完全固定

     左側：crowd API に送られる企画ID
     右側：1棟マップ上の .map-hotspot の data-modal-type

     1Eはマップ上にクリック範囲が2か所ありますが、
     どちらも同じ企画ID「1e」を使用します。

     special-support は混雑状況の企画IDではないため除外。
     ========================================= */
  const FIXED_CROWD_MAP = Object.freeze({

    /* 2棟1階 */
    "cha": ["hotspot-cha"],
    "science-kagaku": ["hotspot-science-kagaku"],
    "kado": ["hotspot-kado"],
    "oami-special": ["hotspot-oami-special"],

    /* 2棟2階 */
    "art": ["hotspot-art"],
    "science-butsuri": ["hotspot-science-butsuri"],
    "shogi": ["hotspot-shogi"],
    "photo": ["hotspot-photo"],

    /* 2棟3階 */
    "science-seibutsu": ["hotspot-science-seibutsu"],

    /* 2棟4階 */
    "science-chigaku": ["hotspot-science-chigaku"],
    "science-sugaku": ["hotspot-science-sugaku"]
  });

  /* =========================================
     逆引きも固定生成
     ========================================= */
  const HOTSPOT_TO_CROWD_ID = Object.freeze(
    Object.entries(FIXED_CROWD_MAP).reduce(
      (result, [crowdId, hotspots]) => {
        hotspots.forEach(hotspotId => {
          result[hotspotId] = crowdId;
        });
        return result;
      },
      {}
    )
  );

  /* =========================================
     ステータス正規化
     ========================================= */
  function normalizeStatus(value) {
    const status = String(value ?? "")
      .trim()
      .toLowerCase();

    if ([
      "empty",
      "low",
      "free",
      "空",
      "空いている",
      "比較的空いている"
    ].includes(status)) {
      return "empty";
    }

    if ([
      "normal",
      "medium",
      "moderate",
      "普通",
      "やや混雑",
      "やや混雑している"
    ].includes(status)) {
      return "normal";
    }

    if ([
      "crowded",
      "high",
      "busy",
      "混雑",
      "混雑している"
    ].includes(status)) {
      return "crowded";
    }

    return "unknown";
  }

  /* =========================================
     APIレコードから状態を取得
     ========================================= */
  function getStatus(record) {
    if (record === null || record === undefined) {
      return "unknown";
    }

    if (typeof record === "string") {
      return normalizeStatus(record);
    }

    if (typeof record !== "object") {
      return "unknown";
    }

    const directStatus = normalizeStatus(
      record.status ??
      record.crowdStatus ??
      record.crowd_status ??
      record.state ??
      record.level
    );

    if (directStatus !== "unknown") {
      return directStatus;
    }

    /* server.js が score を返す場合の保険 */
    const score = Number(record.score);

    if (Number.isFinite(score)) {
      if (score < 34) {
        return "empty";
      }

      if (score < 67) {
        return "normal";
      }

      return "crowded";
    }

    return "unknown";
  }

  /* =========================================
     APIレスポンスから企画IDのレコードを取得

     server.js の現在の形式：
       {
         "1a": { status: "normal", ... },
         "2e": { status: "crowded", ... }
       }
     ========================================= */
  function getApiRecord(crowdData, targetId) {
    const id = String(targetId ?? "")
      .trim()
      .toLowerCase();

    if (!crowdData || !id) {
      return null;
    }

    const containers = [
      crowdData,
      crowdData?.data,
      crowdData?.events,
      crowdData?.crowd,
      crowdData?.results
    ];

    for (const container of containers) {
      if (!container) {
        continue;
      }

      if (Array.isArray(container)) {
        const found = container.find(item => {
          if (!item || typeof item !== "object") {
            return false;
          }

          const itemId = String(
            item.id ??
            item.eventId ??
            item.event_id ??
            item.modalId ??
            item.modal_id ??
            item.key ??
            ""
          )
            .trim()
            .toLowerCase();

          return itemId === id;
        });

        if (found) {
          return found;
        }

        continue;
      }

      if (typeof container === "object") {
        if (
          Object.prototype.hasOwnProperty.call(
            container,
            targetId
          )
        ) {
          return container[targetId];
        }

        if (
          Object.prototype.hasOwnProperty.call(
            container,
            id
          )
        ) {
          return container[id];
        }

        const key = Object.keys(container).find(
          itemKey =>
            String(itemKey)
              .trim()
              .toLowerCase() === id
        );

        if (key !== undefined) {
          return container[key];
        }
      }
    }

    return null;
  }

  /* =========================================
     色を適用

     map-hotspot自身に直接色を付けます。
     ========================================= */
  function applyColor(hotspot, status) {
    const safeStatus = normalizeStatus(status);

    hotspot.dataset.crowdStatus = safeStatus;

    hotspot.classList.remove(
      "crowd-empty",
      "crowd-normal",
      "crowd-crowded",
      "crowd-unknown",
      "crowd-disabled"
    );

    if (!crowdEnabled) {
      hotspot.classList.add("crowd-disabled");

      hotspot.style.setProperty(
        "background",
        "transparent",
        "important"
      );

      hotspot.style.setProperty(
        "border-color",
        "transparent",
        "important"
      );

      return;
    }

    if (safeStatus === "empty") {
      hotspot.classList.add("crowd-empty");

      hotspot.style.setProperty(
        "background",
        "rgba(79,157,105,0.38)",
        "important"
      );

      hotspot.style.setProperty(
        "border",
        "2px solid rgba(79,157,105,0.68)",
        "important"
      );

      return;
    }

    if (safeStatus === "normal") {
      hotspot.classList.add("crowd-normal");

      hotspot.style.setProperty(
        "background",
        "rgba(215,168,61,0.38)",
        "important"
      );

      hotspot.style.setProperty(
        "border",
        "2px solid rgba(215,168,61,0.68)",
        "important"
      );

      return;
    }

    if (safeStatus === "crowded") {
      hotspot.classList.add("crowd-crowded");

      hotspot.style.setProperty(
        "background",
        "rgba(212,91,88,0.38)",
        "important"
      );

      hotspot.style.setProperty(
        "border",
        "2px solid rgba(212,91,88,0.68)",
        "important"
      );

      return;
    }

    hotspot.classList.add("crowd-unknown");

    hotspot.style.setProperty(
      "background",
      "transparent",
      "important"
    );

    hotspot.style.setProperty(
      "border-color",
      "transparent",
      "important"
    );
  }

  /* =========================================
     固定マッピングを全ホットスポットへ反映
     ========================================= */
  function applyCrowdData(crowdData) {
    const hotspots = Array.from(
      document.querySelectorAll(".map-hotspot")
    );

    let matchedCount = 0;

    hotspots.forEach(hotspot => {
      const hotspotId = String(
        hotspot.dataset.modalType ?? ""
      )
        .trim()
        .toLowerCase();

      /*
        完全固定された対応表以外は
        APIを絶対に参照しません。
      */
      const crowdId =
        HOTSPOT_TO_CROWD_ID[hotspotId] ?? "";

      if (!crowdId) {
        applyColor(hotspot, "unknown");
        return;
      }

      const record = getApiRecord(
        crowdData,
        crowdId
      );

      if (record !== null) {
        matchedCount++;
      }

      const status = getStatus(record);

      applyColor(
        hotspot,
        status
      );

      console.log(
        "2棟固定混雑対応",
        {
          mapHotspot: hotspotId,
          crowdId,
          status,
          matched: record !== null
        }
      );
    });

    console.log(
      "2棟：固定マッピングによる混雑情報反映",
      matchedCount + "/" + Object.keys(HOTSPOT_TO_CROWD_ID).length
    );
  }

  /* =========================================
     ON/OFFボタン
     ========================================= */
  function updateToggleButton() {
    const button =
      document.getElementById(
        "crowdToggleButton"
      );

    if (!button) {
      return;
    }

    button.classList.toggle(
      "off",
      !crowdEnabled
    );

    button.setAttribute(
      "aria-pressed",
      String(crowdEnabled)
    );

    button.innerHTML =
      '<span class="crowd-toggle-dot"></span>' +
      (
        crowdEnabled
          ? "混雑表示：ON"
          : "混雑表示：OFF"
      );
  }

  function setupToggle() {
    const button =
      document.getElementById(
        "crowdToggleButton"
      );

    if (!button) {
      return;
    }

    if (
      button.dataset.crowdReady ===
      "true"
    ) {
      updateToggleButton();
      return;
    }

    button.dataset.crowdReady = "true";

    button.addEventListener(
      "click",
      event => {
        event.preventDefault();
        event.stopPropagation();

        crowdEnabled = !crowdEnabled;

        try {
          localStorage.setItem(
            STORAGE_KEY,
            String(crowdEnabled)
          );
        } catch (_) {}

        document
          .querySelectorAll(".map-hotspot")
          .forEach(hotspot => {
            applyColor(
              hotspot,
              hotspot.dataset.crowdStatus ||
              "unknown"
            );
          });

        updateToggleButton();
      }
    );

    updateToggleButton();
  }

  /* =========================================
     API取得
     ========================================= */
  async function loadCrowd() {
    if (requestController) {
      try {
        requestController.abort();
      } catch (_) {}
    }

    requestController =
      new AbortController();

    try {
      const response =
        await fetch(
          API_URL + "?_=" + Date.now(),
          {
            method: "GET",
            cache: "no-store",
            signal: requestController.signal,
            headers: {
              "Accept": "application/json",
              "Cache-Control": "no-cache"
            }
          }
        );

      if (!response.ok) {
        throw new Error(
          "HTTP " + response.status
        );
      }

      const data =
        await response.json();

      console.log(
        "2棟：取得した混雑API",
        data
      );

      applyCrowdData(data);

    } catch (error) {
      if (
        error &&
        error.name === "AbortError"
      ) {
        return;
      }

      console.error(
        "2棟：混雑情報取得失敗",
        error
      );
    }
  }

  /* =========================================
     初期化
     ========================================= */
  function init() {
    setupToggle();

    /* 初期状態は透明 */
    document
      .querySelectorAll(".map-hotspot")
      .forEach(hotspot => {
        hotspot.dataset.crowdStatus =
          "unknown";

        applyColor(
          hotspot,
          "unknown"
        );
      });

    loadCrowd();

    setInterval(
      loadCrowd,
      REFRESH_MS
    );

    document.addEventListener(
      "visibilitychange",
      () => {
        if (
          document.visibilityState ===
          "visible"
        ) {
          loadCrowd();
        }
      }
    );

    window.addEventListener(
      "online",
      loadCrowd
    );
  }

  if (
    document.readyState ===
    "loading"
  ) {
    document.addEventListener(
      "DOMContentLoaded",
      init,
      { once: true }
    );
  } else {
    init();
  }

})();
</script>
