/* =========================================
   混雑状況表示
========================================= */

const CROWD_API_URL =
  "https://chosei-fes.onrender.com";

let crowdDisplayEnabled =
  localStorage.getItem("choko_crowd_map_visible") !== "false";

const crowdToggleButton =
  document.getElementById("crowdToggleButton");

function normalizeCrowdStatus(value){
  const status = String(value || "").trim();
  return ["empty","normal","crowded"].includes(status)
    ? status
    : "unknown";
}

function getCrowdRecord(crowdData, targetId){
  if(!crowdData || !targetId){
    return null;
  }

  const containers = [
    crowdData,
    crowdData.data,
    crowdData.events,
    crowdData.crowd,
    crowdData.results
  ];

  for(const container of containers){
    if(!container){
      continue;
    }

    if(Array.isArray(container)){
      const found = container.find(item =>
        item && String(item.id || "").trim() === targetId
      );
      if(found){
        return found;
      }
    }else if(
      typeof container === "object" &&
      container[targetId] &&
      typeof container[targetId] === "object"
    ){
      return container[targetId];
    }
  }

  return null;
}

function applyCrowdVisual(hotspot, status){
  if(!hotspot){
    return;
  }

  hotspot.classList.remove(
    "crowd-empty",
    "crowd-normal",
    "crowd-crowded",
    "crowd-unknown",
    "crowd-visible"
  );

  const safeStatus = normalizeCrowdStatus(status);
  hotspot.classList.add("crowd-" + safeStatus);

  if(crowdDisplayEnabled && safeStatus !== "unknown"){
    hotspot.classList.add("crowd-visible");
  }
}

function refreshCrowdVisibility(){
  document.querySelectorAll(".map-hotspot").forEach(hotspot => {
    const status =
      hotspot.dataset.crowdStatus || "unknown";
    applyCrowdVisual(hotspot, status);
  });

  if(crowdToggleButton){
    crowdToggleButton.classList.toggle("off", !crowdDisplayEnabled);
    crowdToggleButton.setAttribute(
      "aria-pressed",
      String(crowdDisplayEnabled)
    );
    crowdToggleButton.innerHTML =
      '<span class="crowd-toggle-dot"></span>' +
      (crowdDisplayEnabled ? "混雑表示：ON" : "混雑表示：OFF");
  }
}

async function loadCrowdMapStatus(){
  try{
    const response = await fetch(
      CROWD_API_URL + "/api/crowd",
      {cache:"no-store"}
    );

    if(!response.ok){
      throw new Error("混雑情報の取得に失敗しました");
    }

    const crowdData = await response.json();

    document.querySelectorAll(".map-hotspot").forEach(hotspot => {
      let targetId =
        hotspot.dataset.modalType || "";

      if(targetId === "gymnasium" || targetId === "gymnasium-performance"){
        targetId = "gymnasium-performance";
      }

      const saved = getCrowdRecord(crowdData, targetId);
      const status = saved
        ? normalizeCrowdStatus(
            saved.status ||
            saved.crowdStatus ||
            saved.crowd_status
          )
        : "unknown";

      hotspot.dataset.crowdStatus = status;
      applyCrowdVisual(hotspot, status);
    });
  }catch(error){
    console.error("混雑情報の取得に失敗しました", error);
  }

  refreshCrowdVisibility();
}

if(crowdToggleButton){
  crowdToggleButton.addEventListener("click", () => {
    crowdDisplayEnabled = !crowdDisplayEnabled;
    localStorage.setItem(
      "choko_crowd_map_visible",
      String(crowdDisplayEnabled)
    );
    refreshCrowdVisibility();
  });
}

// 当たり判定の中に、クリックを邪魔しない表示レイヤーを追加。
document.querySelectorAll(".map-hotspot").forEach(hotspot => {
  const layer = document.createElement("span");
  layer.className = "crowd-visual-layer";
  layer.setAttribute("aria-hidden", "true");
  hotspot.appendChild(layer);
});

refreshCrowdVisibility();
loadCrowdMapStatus();
setInterval(loadCrowdMapStatus, 15000);

  .help-icon.gesture-pan-square {

  .help-text {

<body>


<div class="bg-shapes">

  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>
  <div class="shape s4"></div>
  <div class="shape s5"></div>
  <div class="shape s6"></div>
  <div class="shape s7"></div>
  <div class="shape s8"></div>

<!-- =========================================
     ヘッダー
========================================= -->

<div id="header"></div>


<script>

fetch("header.html")
  .then(res => res.text())
  .then(data => {

    document.getElementById("header").innerHTML = data;

    const btn =
      document.querySelector(".menu-btn");

    const nav =
      document.querySelector(".nav");


    if (btn && nav) {

      btn.addEventListener(
        "click",
        (e) => {

          e.stopPropagation();

          nav.classList.toggle("active");

        }
      );


      document.addEventListener(
        "click",
        (e) => {

          if (
            !nav.contains(e.target) &&
            !btn.contains(e.target)
          ) {

            nav.classList.remove("active");

          }

        }
      );

    }

  });

</script>


<!-- =========================================
     フロアマップ
========================================= -->

<div class="floor-page">

  <div class="map-view">


    <div class="top-controls">

      <button
        class="back-to-map"
        id="backToMap"
        type="button"
      >
        全体図に戻る
      </button>


      <button
        class="help-button"
        id="helpButton"
        type="button"
      >
        操作説明
      </button>


      <button
        class="crowd-toggle-button"
        id="crowdToggleButton"
        type="button"
        aria-pressed="true"
      >
        <span class="crowd-toggle-dot"></span>
        混雑表示：ON
      </button>


      <div
        class="crowd-legend"
        id="crowdLegend"
        aria-label="混雑状況の凡例"
      >
        <span class="crowd-legend-item">
          <i class="crowd-legend-color empty"></i>
          <span>比較的空いている</span>
        </span>
        <span class="crowd-legend-item">
          <i class="crowd-legend-color normal"></i>
          <span>やや混雑している</span>
        </span>
        <span class="crowd-legend-item">
          <i class="crowd-legend-color crowded"></i>
          <span>混雑している</span>
        </span>
      </div>

    </div>


    <button
      class="floor-arrow floor-prev"
      id="prevButton"
      aria-label="前の階"
      type="button"
    >
      〈
    </button>


    <div
      class="map-image-wrapper"
      id="imageWrapper"
    >

      <img
        id="floorImage"
        class="map-image"
        src="images/2tou_1f.jpg"
        alt="2棟 1階 フロアマップ"
      >


      <div
        class="map-hotspots"
        id="mapHotspots"
      >

        <button
          class="map-hotspot hotspot-cha"
          data-floor="0"
          data-modal-type="cha"
          aria-label="茶道部"
          title="茶道部"
          type="button"
        ></button>


        <button
          class="map-hotspot hotspot-science-kagaku"
          data-floor="0"
          data-modal-type="science-kagaku"
          aria-label="サイエンス部 科学班"
          title="サイエンス部 科学班"
          type="button"
        ></button>


        <button
          class="map-hotspot hotspot-kado"
          data-floor="0"
          data-modal-type="kado"
          aria-label="華道部"
          title="華道部"
          type="button"
        ></button>


        <button
          class="map-hotspot hotspot-oami-special"
          data-floor="0"
          data-modal-type="oami-special"
          aria-label="大網白里特別支援学校"
          title="大網白里特別支援学校"
          type="button"
        ></button>


        <button
          class="map-hotspot hotspot-art"
          data-floor="1"
          data-modal-type="art"
          aria-label="美術部の詳細を表示"
          title="美術部"
          type="button"
        ></button>


        <button
          class="map-hotspot hotspot-science-butsuri"
          data-floor="1"
          data-modal-type="science-butsuri"
          aria-label="サイエンス部 物理班"
          title="サイエンス部 物理班"
          type="button"
        ></button>


        <button
          class="map-hotspot hotspot-shogi"
          data-floor="1"
          data-modal-type="shogi"
          aria-label="将棋部"
          title="将棋部"
          type="button"
        ></button>


        <button
          class="map-hotspot hotspot-photo"
          data-floor="1"
          data-modal-type="photo"
          aria-label="写真部"
          title="写真部"
          type="button"
        ></button>


        <button
          class="map-hotspot hotspot-science-seibutsu"
          data-floor="2"
          data-modal-type="science-seibutsu"
          aria-label="サイエンス部 生物班"
          title="サイエンス部 生物班"
          type="button"
        ></button>


        <button
          class="map-hotspot hotspot-science-chigaku"
          data-floor="3"
          data-modal-type="science-chigaku"
          aria-label="サイエンス部 地学班"
          title="サイエンス部 地学班"
          type="button"
        ></button>


        <button
          class="map-hotspot hotspot-science-sugaku"
          data-floor="3"
          data-modal-type="science-sugaku"
          aria-label="サイエンス部 数学班"
          title="サイエンス部 数学班"
          type="button"
        ></button>

      </div>


      <button
        class="building-switch"
        id="buildingSwitch"
        aria-label="1棟へ"
        type="button"
      >
        ⌃
      </button>

    </div>


    <button
      class="floor-arrow floor-next"
      id="nextButton"
      aria-label="次の階"
      type="button"
    >
      〉
    </button>

  </div>

</div>


<!-- =========================================
     場所詳細モーダル
========================================= -->

<div
  id="placeModalOverlay"
  aria-hidden="true"
>

  <iframe
    id="placeModalFrame"
    title="場所の詳細"
    src="about:blank"
  ></iframe>

</div>


<!-- =========================================
     操作説明
========================================= -->

<div
  class="help-overlay"
  id="helpOverlay"
>

  <div
    class="help-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="helpTitle"
  >

    <button
      class="help-x"
      id="helpX"
      type="button"
      aria-label="操作説明を閉じる"
    >
      ×
    </button>


    <h2
      class="help-title"
      id="helpTitle"
    >
      フロアマップの操作方法
    </h2>


    <p class="help-subtitle">
      画像を動かしたり拡大したりできます
    </p>


    <div class="help-item">

      <div class="help-icon gesture-red-square"></div>

      <div class="help-text">

        <strong>
          赤い文字をタップで詳細表示
        </strong>

        <br>

        赤い文字をタップすると詳細を表示できます。(制作中)

      </div>

    </div>


    <div class="help-item">

      <div class="help-icon gesture-square"></div>

      <div class="help-text">

        <strong>
          2本指で拡大・縮小
        </strong>

        <br>

        画像の上で2本の指を広げたり閉じたりすると、
        マップを拡大・縮小できます。

      </div>

    </div>


    <div class="help-item">

      <div class="help-icon gesture-pan-square"></div>

      <div class="help-text">

        <strong>
          拡大後は1本指で移動
        </strong>

        <br>

        拡大した状態で1本指を動かすと、
        マップを見る位置を移動できます。

      </div>

    </div>


    <div class="help-item">

      <div class="help-icon">
        〈〉
      </div>

      <div class="help-text">

        <strong>
          階を切り替える
        </strong>

        <br>

        左右の「〈」「〉」ボタンで
        1階・2階・3階・4階を切り替えられます。

      </div>

    </div>


    <div class="help-item">

      <div class="help-icon">
        ⌃
      </div>

      <div class="help-text">

        <strong>
          棟を切り替える
        </strong>

        <br>

        画像の下にある「⌃」を押すと、
        1棟のフロアマップへ移動します。

      </div>

    </div>


    <button
      class="help-close"
      id="helpClose"
      type="button"
    >
      マップを見る
    </button>

  </div>

</div>


<script>

/* =========================================
   2棟 フロア設定
========================================= */

const floors = [

  {
    name: "2棟 1階",
    image: "images/2tou_1f.jpg"
  },

  {
    name: "2棟 2階",
    image: "images/2tou_2f.jpg"
  },

  {
    name: "2棟 3階",
    image: "images/2tou_3f.jpg"
  },

  {
    name: "2棟 4階",
    image: "images/2tou_4f.jpg"
  }

];


let currentFloor = 0;


/* =========================================
   要素
========================================= */

const floorImage =
  document.getElementById("floorImage");

const prevButton =
  document.getElementById("prevButton");

const nextButton =
  document.getElementById("nextButton");

const buildingSwitch =
  document.getElementById("buildingSwitch");

const imageWrapper =
  document.getElementById("imageWrapper");

const backToMap =
  document.getElementById("backToMap");

const mapView =
  document.querySelector(".map-view");

const mapHotspots =
  document.querySelectorAll(".map-hotspot");


/* =========================================
   場所詳細モーダル
========================================= */

const placeModalOverlay =
  document.getElementById("placeModalOverlay");

const placeModalFrame =
  document.getElementById("placeModalFrame");


function openPlaceModal(type) {

  if (
    !placeModalOverlay ||
    !placeModalFrame
  ) {
    return;
  }


  placeModalFrame.src =
    "modal3.html?type=" +
    encodeURIComponent(type);


  placeModalOverlay.classList.add(
    "active"
  );


  placeModalOverlay.setAttribute(
    "aria-hidden",
    "false"
  );


  document.body.style.overflow =
    "hidden";
}


function closePlaceModal() {

  if (
    !placeModalOverlay ||
    !placeModalFrame
  ) {
    return;
  }


  placeModalOverlay.classList.remove(
    "active"
  );


  placeModalOverlay.setAttribute(
    "aria-hidden",
    "true"
  );


  placeModalFrame.src =
    "about:blank";


  document.body.style.overflow =
    "";
}


mapHotspots.forEach(
  (hotspot) => {

    hotspot.addEventListener(
      "click",
      (e) => {

        e.preventDefault();

        e.stopPropagation();


        const type =
          hotspot.dataset.modalType;


        if (type) {

          openPlaceModal(type);

        }

      }
    );

  }
);


window.addEventListener(
  "message",
  (e) => {

    if (
      e.source !==
      placeModalFrame?.contentWindow
    ) {
      return;
    }


    if (
      e.data &&
      e.data.type ===
      "close-map-modal"
    ) {

      closePlaceModal();

    }

  }
);


/* =========================================
   操作説明
========================================= */

const helpButton =
  document.getElementById("helpButton");

const helpOverlay =
  document.getElementById("helpOverlay");

const helpClose =
  document.getElementById("helpClose");

const helpX =
  document.getElementById("helpX");


const HELP_STORAGE_KEY =
  "choko_floor_map_help_shown";


function openHelp() {

  helpOverlay.classList.add(
    "active"
  );

}


function closeHelp() {

  helpOverlay.classList.remove(
    "active"
  );


  localStorage.setItem(
    HELP_STORAGE_KEY,
    "true"
  );

}


helpButton.addEventListener(
  "click",
  () => {

    openHelp();

  }
);


helpClose.addEventListener(
  "click",
  () => {

    closeHelp();

  }
);


helpX.addEventListener(
  "click",
  () => {

    closeHelp();

  }
);


helpOverlay.addEventListener(
  "click",
  (e) => {

    if (
      e.target ===
      helpOverlay
    ) {

      closeHelp();

    }

  }
);


if (
  localStorage.getItem(
    HELP_STORAGE_KEY
  ) !== "true"
) {

  setTimeout(
    () => {

      openHelp();

    },
    350
  );

}


/* =========================================
   当たり判定表示
========================================= */

function updateHotspots() {

  mapHotspots.forEach(
    (hotspot) => {

      const floor =
        Number(
          hotspot.dataset.floor
        );


      if (
        floor === currentFloor
      ) {

        hotspot.style.display =
          "block";

      } else {

        hotspot.style.display =
          "none";

      }

    }
  );

}


/* =========================================
   ズーム・移動
========================================= */

let scale = 1;

let translateX = 0;
let translateY = 0;

let startDistance = 0;
let startScale = 1;

let startPanX = 0;
let startPanY = 0;

let startTouchX = 0;
let startTouchY = 0;

let startCenterX = 0;
let startCenterY = 0;

let isDragging = false;


function getDistance(touches) {

  const dx =
    touches[0].clientX -
    touches[1].clientX;

  const dy =
    touches[0].clientY -
    touches[1].clientY;


  return Math.sqrt(
    dx * dx +
    dy * dy
  );

}


function updateArrowPosition() {

  if (!imageWrapper) {
    return;
  }


  const imageTop =
    imageWrapper.offsetTop;

  const imageHeight =
    imageWrapper.offsetHeight;


  const centerY =
    imageTop +
    (imageHeight / 2);


  prevButton.style.top =
    centerY + "px";

  nextButton.style.top =
    centerY + "px";

}


function clampPosition() {

  const wrapperWidth =
    imageWrapper.offsetWidth;

  const wrapperHeight =
    imageWrapper.offsetHeight;


  const maxX =
    Math.max(
      0,
      (wrapperWidth *
      (scale - 1)) / 2
    );


  const maxY =
    Math.max(
      0,
      (wrapperHeight *
      (scale - 1)) / 2
    );


  translateX =
    Math.min(
      Math.max(
        translateX,
        -maxX
      ),
      maxX
    );


  translateY =
    Math.min(
      Math.max(
        translateY,
        -maxY
      ),
      maxY
    );

}


function updateTransform() {

  clampPosition();


  imageWrapper.style.transform =
    "translate3d(" +
    translateX +
    "px, " +
    translateY +
    "px, 0) scale(" +
    scale +
    ")";

}


function setZoom(value) {

  scale =
    Math.min(
      Math.max(
        value,
        1
      ),
      5
    );


  updateTransform();

}


function resetZoom() {

  scale = 1;

  translateX = 0;
  translateY = 0;


  imageWrapper.style.transform =
    "translate3d(0, 0, 0) scale(1)";


  updateArrowPosition();

}


function showFloor(index) {

  currentFloor =
    (index + floors.length) %
    floors.length;


  floorImage.src =
    floors[currentFloor].image;


  floorImage.alt =
    floors[currentFloor].name +
    " フロアマップ";


  resetZoom();


  updateHotspots();

}


floorImage.addEventListener(
  "load",
  () => {

    resetZoom();

    updateArrowPosition();

    updateHotspots();

  }
);


prevButton.addEventListener(
  "click",
  () => {

    showFloor(
      currentFloor - 1
    );

  }
);


nextButton.addEventListener(
  "click",
  () => {

    showFloor(
      currentFloor + 1
    );

  }
);


backToMap.addEventListener(
  "click",
  () => {

    closePlaceModal();

    location.href =
      "map.html";

  }
);


buildingSwitch.addEventListener(
  "click",
  (e) => {

    e.stopPropagation();


    closePlaceModal();


    location.href =
      "1tou.html";

  }
);


imageWrapper.addEventListener(
  "touchstart",
  (e) => {

    if (
      e.touches.length === 2
    ) {

      startDistance =
        getDistance(
          e.touches
        );


      startScale =
        scale;


      startPanX =
        translateX;

      startPanY =
        translateY;


      startCenterX =
        (
          e.touches[0].clientX +
          e.touches[1].clientX
        ) / 2;


      startCenterY =
        (
          e.touches[0].clientY +
          e.touches[1].clientY
        ) / 2;


      isDragging = false;

      return;

    }


    if (
      e.touches.length === 1 &&
      scale > 1
    ) {

      isDragging = true;


      startTouchX =
        e.touches[0].clientX;

      startTouchY =
        e.touches[0].clientY;


      startPanX =
        translateX;

      startPanY =
        translateY;

    }

  },
  {
    passive: false
  }
);


imageWrapper.addEventListener(
  "touchmove",
  (e) => {

    if (
      e.touches.length === 2
    ) {

      e.preventDefault();


      const distance =
        getDistance(
          e.touches
        );


      if (
        startDistance > 0
      ) {

        const ratio =
          distance /
          startDistance;


        scale =
          Math.min(
            Math.max(
              startScale *
              ratio,
              1
            ),
            5
          );

      }


      const centerX =
        (
          e.touches[0].clientX +
          e.touches[1].clientX
        ) / 2;


      const centerY =
        (
          e.touches[0].clientY +
          e.touches[1].clientY
        ) / 2;


      translateX =
        startPanX +
        (
          centerX -
          startCenterX
        );


      translateY =
        startPanY +
        (
          centerY -
          startCenterY
        );


      updateTransform();

      return;

    }


    if (
      e.touches.length === 1 &&
      isDragging &&
      scale > 1
    ) {

      e.preventDefault();


      const x =
        e.touches[0].clientX;

      const y =
        e.touches[0].clientY;


      translateX =
        startPanX +
        (
          x -
          startTouchX
        );


      translateY =
        startPanY +
        (
          y -
          startTouchY
        );


      updateTransform();

    }

  },
  {
    passive: false
  }
);


imageWrapper.addEventListener(
  "touchend",
  (e) => {

    if (
      e.touches.length === 0
    ) {

      isDragging = false;

      startDistance = 0;

      startTouchX = 0;
      startTouchY = 0;

      startCenterX = 0;
      startCenterY = 0;

    }

  },
  {
    passive: false
  }
);


imageWrapper.addEventListener(
  "mousedown",
  (e) => {

    if (
      e.target.classList.contains(
        "map-hotspot"
      )
    ) {

      return;

    }


    if (
      e.button !== 0 ||
      scale <= 1
    ) {
      return;
    }


    isDragging = true;


    startTouchX =
      e.clientX;

    startTouchY =
      e.clientY;


    startPanX =
      translateX;

    startPanY =
      translateY;


    imageWrapper.style.cursor =
      "grabbing";


    e.preventDefault();

  }
);


document.addEventListener(
  "mousemove",
  (e) => {

    if (
      !isDragging ||
      scale <= 1
    ) {
      return;
    }


    translateX =
      startPanX +
      (
        e.clientX -
        startTouchX
      );


    translateY =
      startPanY +
      (
        e.clientY -
        startTouchY
      );


    updateTransform();

  }
);


document.addEventListener(
  "mouseup",
  () => {

    if (isDragging) {

      isDragging = false;


      imageWrapper.style.cursor =
        scale > 1
          ? "grab"
          : "default";

    }

  }
);


imageWrapper.addEventListener(
  "wheel",
  (e) => {

    e.preventDefault();


    const delta =
      e.deltaY > 0
        ? -0.15
        : 0.15;


    setZoom(
      scale + delta
    );


    imageWrapper.style.cursor =
      scale > 1
        ? "grab"
        : "default";

  },
  {
    passive: false
  }
);


imageWrapper.style.cursor =
  "default";


window.addEventListener(
  "load",
  () => {

    updateArrowPosition();

    updateHotspots();

  }
);


window.addEventListener(
  "resize",
  () => {

    if (scale > 1) {

      updateTransform();

    }


    updateArrowPosition();

  }
);

</script>

</body>
