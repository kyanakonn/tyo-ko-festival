<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>文化祭（一般公開時）来校上のお願い | 長高祭</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>

    /* =========================================
       基本設定
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --main-color: #d96b8a;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }

    body {
      background: #ffffff;
      font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
    }


    /* =========================================
       ヘッダー
    ========================================= */

    #header {
      position: relative;
      z-index: 10000;
    }


    /* =========================================
       背景図形
    ========================================= */

    .bg-shapes {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
      opacity: 0.85;
    }

    .shape {
      position: absolute;
    }


    /* 三角形 */

    .s1 {
      top: 5%;
      left: -50px;
      width: 0;
      height: 0;
      border-left: 90px solid transparent;
      border-right: 90px solid transparent;
      border-bottom: 170px solid #c85c72;
      transform: rotate(-25deg);
    }

    .s2 {
      top: 25%;
      left: -35px;
      width: 0;
      height: 0;
      border-left: 70px solid transparent;
      border-right: 70px solid transparent;
      border-bottom: 130px solid #8060a8;
      transform: rotate(20deg);
    }

    .s3 {
      bottom: 5%;
      left: -30px;
      width: 0;
      height: 0;
      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-bottom: 180px solid #d1a92f;
      transform: rotate(12deg);
    }

    .s4 {
      bottom: 28%;
      left: 20px;
      width: 0;
      height: 0;
      border-left: 60px solid transparent;
      border-right: 60px solid transparent;
      border-bottom: 120px solid #3f9da9;
      transform: rotate(-15deg);
    }

    .s5 {
      top: 12%;
      right: -80px;
      width: 0;
      height: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-bottom: 260px solid #4f9fa5;
      transform: rotate(30deg);
    }

    .s6 {
      bottom: -40px;
      right: -30px;
      width: 0;
      height: 0;
      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-bottom: 190px solid #c85c72;
      transform: rotate(-15deg);
    }

    .s7 {
      top: 8%;
      right: 40px;
      width: 0;
      height: 0;
      border-left: 55px solid transparent;
      border-right: 55px solid transparent;
      border-bottom: 100px solid #8060a8;
      transform: rotate(35deg);
    }

    .s8 {
      bottom: 20%;
      right: 40px;
      width: 0;
      height: 0;
      border-left: 70px solid transparent;
      border-right: 70px solid transparent;
      border-bottom: 130px solid #d1a92f;
      transform: rotate(-20deg);
    }


    /* =========================================
       メイン
    ========================================= */

    .visitor-container {
      position: relative;
      z-index: 1;

      width: 100%;
      min-height: calc(100vh - 70px);

      padding-top: 20px;
      padding-bottom: 25px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }


    /* =========================================
       タイトル
    ========================================= */

    .visitor-title {
      color: var(--main-color);

      font-weight: 700;
      line-height: 1.2;

      font-size: clamp(1.2rem, 4vw, 3rem);

      text-align: center;

      margin-bottom: 15px;

      padding: 0 15px;
    }


    /* =========================================
       スライダー全体
    ========================================= */

    .slider-wrapper {
      width: 100%;
      max-width: 1400px;

      display: flex;
      flex-direction: column;
      align-items: center;
    }


    /* =========================================
       画像表示部分
    ========================================= */

    .slider {
      width: 100%;

      display: flex;
      justify-content: center;

      overflow: hidden;
    }

    .slides {
      display: flex;

      width: 100%;

      transition: transform 0.45s ease;

      will-change: transform;
    }

    .slide {
      flex: 0 0 100%;

      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 0 10px;
    }

    .slide img {
      display: block;

      width: 100%;
      max-width: 1200px;

      /*
        画像をできるだけ大きく表示。
        縦長画像でも切れないようにする。
      */
      height: calc(100vh - 180px);

      object-fit: contain;

      border-radius: 0;

      background: transparent;
    }


    /* =========================================
       左右ボタン
       ※画像の下
    ========================================= */

    .slider-controls {
      width: 100%;

      display: flex;
      justify-content: center;
      align-items: center;

      gap: 30px;

      margin-top: 15px;
    }

    .slider-btn {
      width: 60px;
      height: 60px;

      border: none;
      border-radius: 50%;

      background: #ffffff;

      color: var(--main-color);

      font-size: 32px;
      font-weight: bold;

      cursor: pointer;

      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);

      display: flex;
      align-items: center;
      justify-content: center;

      transition: 0.2s;
    }

    .slider-btn:hover {
      transform: scale(1.08);
    }

    .slider-btn:active {
      transform: scale(0.95);
    }


    /* =========================================
       ページ番号
    ========================================= */

    .page-number {
      margin-top: 12px;

      color: var(--main-color);

      font-size: 28px;
      font-weight: bold;

      letter-spacing: 2px;
    }


    /* =========================================
       スマホ
    ========================================= */

    @media (max-width: 768px) {

      .visitor-container {
        min-height: calc(100vh - 60px);

        padding-top: 10px;
        padding-bottom: 15px;
      }

      .visitor-title {
        font-size: clamp(1rem, 5vw, 1.8rem);

        margin-bottom: 8px;
      }

      .slide {
        padding: 0;
      }

      .slide img {
        width: 100%;

        /*
          スマホでは画面の高さを最大限利用
        */
        height: calc(100vh - 150px);

        max-width: 100%;

        object-fit: contain;
      }

      .slider-controls {
        gap: 25px;

        margin-top: 10px;
      }

      .slider-btn {
        width: 52px;
        height: 52px;

        font-size: 28px;
      }

      .page-number {
        font-size: 24px;

        margin-top: 8px;
      }

    }

  </style>
</head>


<body>

  <!-- =========================================
       共通ヘッダー
  ========================================= -->

  <div id="header"></div>

  <script>
    fetch("header.html")
      .then(res => res.text())
      .then(data => {

        document.getElementById("header").innerHTML = data;

        const btn = document.querySelector(".menu-btn");
        const nav = document.querySelector(".nav");

        if (btn && nav) {

          btn.addEventListener("click", (e) => {
            e.stopPropagation();
            nav.classList.toggle("active");
          });

          document.addEventListener("click", (e) => {

            if (
              !nav.contains(e.target) &&
              !btn.contains(e.target)
            ) {
              nav.classList.remove("active");
            }

          });

        }

      });
  </script>


  <!-- =========================================
       背景図形
  ========================================= -->

  <div class="bg-shapes">

    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="shape s4"></div>
    <div class="shape s5"></div>
    <div class="shape s6"></div>
    <div class="shape s7"></div>
    <div class="shape s8"></div>

  </div>


  <!-- =========================================
       メイン
  ========================================= -->

  <main class="visitor-container">

    <h1 class="visitor-title">
      文化祭（一般公開時）来校上のお願い
    </h1>


    <!-- スライダー -->

    <div class="slider-wrapper">

      <div class="slider">

        <div class="slides" id="slides">

          <!-- 1枚目 -->
          <div class="slide">
            <img src="images/1.jpeg" alt="来校上のお願い 1ページ">
          </div>

          <!-- 2枚目 -->
          <div class="slide">
            <img src="images/2.jpeg" alt="来校上のお願い 2ページ">
          </div>

          <!-- 3枚目 -->
          <div class="slide">
            <img src="images/3.jpeg" alt="来校上のお願い 3ページ">
          </div>

          <!-- 4枚目 -->
          <div class="slide">
            <img src="images/4.jpeg" alt="来校上のお願い 4ページ">
          </div>

          <!-- 5枚目 -->
          <div class="slide">
            <img src="images/5.jpeg" alt="来校上のお願い 5ページ">
          </div>

          <!-- 6枚目 -->
          <div class="slide">
            <img src="images/6.jpeg" alt="来校上のお願い 6ページ">
          </div>

        </div>

      </div>


      <!-- =========================================
           左右ボタン
           画像の下
      ========================================= -->

      <div class="slider-controls">

        <button
          class="slider-btn"
          id="prevBtn"
          aria-label="前のページ">
          ‹
        </button>

        <button
          class="slider-btn"
          id="nextBtn"
          aria-label="次のページ">
          ›
        </button>

      </div>


      <!-- ページ番号 -->

      <div class="page-number" id="pageNumber">
        1 / 6
      </div>

    </div>

  </main>


  <!-- =========================================
       スライダーJavaScript
  ========================================= -->

  <script>

    const slides = document.getElementById("slides");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageNumber = document.getElementById("pageNumber");

    const totalPages = 6;

    let currentPage = 0;


    /* -----------------------------------------
       スライドを移動
    ----------------------------------------- */

    function updateSlider() {

      slides.style.transform =
        `translateX(-${currentPage * 100}%)`;

      pageNumber.textContent =
        `${currentPage + 1} / ${totalPages}`;

    }


    /* -----------------------------------------
       次へ
    ----------------------------------------- */

    nextBtn.addEventListener("click", () => {

      if (currentPage < totalPages - 1) {

        currentPage++;

      } else {

        /*
          6ページ目で次を押したら
          1ページ目に戻る
        */

        currentPage = 0;

      }

      updateSlider();

    });


    /* -----------------------------------------
       前へ
    ----------------------------------------- */

    prevBtn.addEventListener("click", () => {

      if (currentPage > 0) {

        currentPage--;

      } else {

        /*
          1ページ目で前を押したら
          6ページ目に戻る
        */

        currentPage = totalPages - 1;

      }

      updateSlider();

    });


    /* -----------------------------------------
       初期表示
    ----------------------------------------- */

    updateSlider();


    /* -----------------------------------------
       スワイプ対応
    ----------------------------------------- */

    let touchStartX = 0;
    let touchEndX = 0;

    slides.addEventListener("touchstart", (e) => {

      touchStartX = e.changedTouches[0].screenX;

    });


    slides.addEventListener("touchend", (e) => {

      touchEndX = e.changedTouches[0].screenX;

      const difference =
        touchStartX - touchEndX;


      /* 左にスワイプ → 次へ */

      if (difference > 50) {

        if (currentPage < totalPages - 1) {
          currentPage++;
        } else {
          currentPage = 0;
        }

        updateSlider();

      }


      /* 右にスワイプ → 前へ */

      if (difference < -50) {

        if (currentPage > 0) {
          currentPage--;
        } else {
          currentPage = totalPages - 1;
        }

        updateSlider();

      }

    });

  </script>

</body>
</html>
