<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>文化祭（一般公開時）来校上のお願い | 長高祭</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="css/style.css">


  <style>

    /* =========================================
       基本設定
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    :root {
      --main-color: #d96b8a;
    }


    html,
    body {

      width: 100%;

      min-height: 100%;

      margin: 0;
      padding: 0;

      overflow-x: hidden;
      overflow-y: auto;

      overscroll-behavior-x: none;
      overscroll-behavior-y: auto;
    }


    body {

      background: #ffffff;

      font-family:
        "Yu Gothic",
        "Hiragino Sans",
        sans-serif;

      /*
        等倍時：
        縦方向のページスクロールを許可

        拡大時：
        JS側で必要に応じて
        preventDefault() を使用
      */
      touch-action: pan-y;
    }


    /* =========================================
       ヘッダー
    ========================================= */

    #header {

      position: relative;

      z-index: 10000;

      width: 100%;
    }


    /* =========================================
       背景図形
    ========================================= */

    .bg-shapes {

      position: fixed;

      inset: 0;

      z-index: 0;

      pointer-events: none;

      overflow: hidden;

      opacity: 0.85;
    }


    .shape {
      position: absolute;
    }


    /* =========================================
       三角形
    ========================================= */

    .s1 {

      top: 5%;
      left: -50px;

      width: 0;
      height: 0;

      border-left: 90px solid transparent;
      border-right: 90px solid transparent;
      border-bottom: 170px solid #c85c72;

      transform: rotate(-25deg);
    }


    .s2 {

      top: 25%;
      left: -35px;

      width: 0;
      height: 0;

      border-left: 70px solid transparent;
      border-right: 70px solid transparent;
      border-bottom: 130px solid #8060a8;

      transform: rotate(20deg);
    }


    .s3 {

      bottom: 5%;
      left: -30px;

      width: 0;
      height: 0;

      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-bottom: 180px solid #d1a92f;

      transform: rotate(12deg);
    }


    .s4 {

      bottom: 28%;
      left: 20px;

      width: 0;
      height: 0;

      border-left: 60px solid transparent;
      border-right: 60px solid transparent;
      border-bottom: 120px solid #3f9da9;

      transform: rotate(-15deg);
    }


    .s5 {

      top: 12%;
      right: -80px;

      width: 0;
      height: 0;

      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-bottom: 260px solid #4f9fa5;

      transform: rotate(30deg);
    }


    .s6 {

      bottom: -40px;
      right: -30px;

      width: 0;
      height: 0;

      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-bottom: 190px solid #c85c72;

      transform: rotate(-15deg);
    }


    .s7 {

      top: 8%;
      right: 40px;

      width: 0;
      height: 0;

      border-left: 55px solid transparent;
      border-right: 55px solid transparent;
      border-bottom: 100px solid #8060a8;

      transform: rotate(35deg);
    }


    .s8 {

      bottom: 20%;
      right: 40px;

      width: 0;
      height: 0;

      border-left: 70px solid transparent;
      border-right: 70px solid transparent;
      border-bottom: 130px solid #d1a92f;

      transform: rotate(-20deg);
    }


    /* =========================================
       メイン
    ========================================= */

    .visitor-container {

      position: relative;

      z-index: 1;

      width: 100%;

      height: auto;

      min-height: 0;

      padding: 0;

      margin-top: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      overflow: visible;
    }


    /* =========================================
       スライダー全体
    ========================================= */

    .slider-wrapper {

      position: relative;

      width: 100%;

      height: auto;

      min-height: 0;

      max-width: 1400px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: flex-start;

      overflow: visible;
    }


    /* =========================================
       画像エリア
    ========================================= */

    .slider {

      position: relative;

      width: 100%;

      height: auto;

      flex: none;

      min-height: 0;

      overflow: visible;

      /*
        通常時：
        縦方向 → ブラウザスクロール

        JSで横スワイプ時だけ
        preventDefault()

        拡大時：
        JSで画像移動
      */
      touch-action: pan-y;

      contain: layout paint;

      /*
        ピンチ中のブラウザ側の
       視覚的な遅延を抑える
      */
      -webkit-user-select: none;
      user-select: none;
    }


    /* =========================================
       スライド全体
    ========================================= */

    .slides {

      display: flex;

      width: 100%;

      height: auto;

      flex-shrink: 0;

      transition:
        transform 0.3s ease-out;

      will-change: transform;

      touch-action: pan-y;
    }


    /* =========================================
       各ページ
    ========================================= */

    .slide {

      position: relative;

      flex: 0 0 100%;

      width: 100%;

      min-height: calc(
        100vh - var(--header-height, 70px)
      );

      height: auto;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 0;

      overflow: visible;

      touch-action: pan-y;
    }


    /* =========================================
       画像
    ========================================= */

    .slide img {

      display: block;

      width: 100%;

      height: auto;

      max-width: none;

      max-height: none;

      object-fit: contain;

      object-position: center center;

      border-radius: 0;

      background: transparent;

      cursor: default;

      user-select: none;

      -webkit-user-select: none;

      -webkit-user-drag: none;

      /*
        通常時は縦スクロールを許可
      */
      touch-action: pan-y;

      /*
        JSで完全に制御するため
        transformアニメーションは使用しない
      */
      transform:
        translate3d(0, 0, 0)
        scale(1);

      transform-origin: center center;

      will-change: transform;

      transition: none;
    }


    /* =========================================
       左右ボタン
    ========================================= */

    .slider-controls {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0;

      pointer-events: none;

      z-index: 100;
    }


    /* =========================================
       ボタン本体
    ========================================= */

    .slider-btn {

      width: auto;

      height: auto;

      min-width: 52px;

      min-height: 90px;

      padding: 0 6px;

      margin: 0;

      border: none;

      border-radius: 0;

      background: transparent;

      color: var(--main-color);

      font-size: 76px;

      font-family:
        Arial,
        "Helvetica Neue",
        sans-serif;

      font-weight: 300;

      line-height: 1;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-shrink: 0;

      pointer-events: auto;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;

      box-shadow: none;

      outline: none;

      text-shadow:
        0 2px 6px rgba(255, 255, 255, 0.85);

      transition:
        transform 0.12s ease,
        opacity 0.12s ease;
    }


    .slider-btn:hover {

      background: transparent;

      box-shadow: none;

      transform: scale(1.08);
    }


    .slider-btn:active {

      background: transparent;

      box-shadow: none;

      transform: scale(0.9);
    }


    .slider-btn:focus {

      outline: none;

      background: transparent;
    }


    /* =========================================
       スマホ
    ========================================= */

    @media (max-width: 768px) {

      .visitor-container {

        height: auto;

        min-height: 0;

        padding: 0;

        overflow: visible;
      }


      .slider-wrapper {

        width: 100%;

        height: auto;

        min-height: 0;

        overflow: visible;
      }


      .slider {

        width: 100%;

        height: auto;

        flex: none;

        min-height: 0;

        overflow: visible;

        touch-action: pan-y;
      }


      .slides {

        width: 100%;

        height: auto;

        transition:
          transform 0.3s ease-out;

        touch-action: pan-y;
      }


      .slide {

        width: 100%;

        min-height: calc(
          100vh - var(--header-height, 60px)
        );

        height: auto;

        align-items: center;

        justify-content: center;

        padding: 0;

        overflow: visible;

        touch-action: pan-y;
      }


      .slide img {

        width: 100%;

        height: auto;

        max-width: none;

        max-height: none;

        object-fit: contain;

        object-position: center center;

        touch-action: pan-y;

        transition: none;
      }


      .slider-controls {

        width: 100%;

        height: 100%;

        padding: 0;
      }


      .slider-btn {

        min-width: 44px;

        min-height: 76px;

        padding: 0 3px;

        font-size: 62px;

        font-weight: 300;

        text-shadow:
          0 2px 5px rgba(255, 255, 255, 0.9);
      }

    }


    /* =========================================
       横向きスマホ
    ========================================= */

    @media (max-width: 768px) and (orientation: landscape) {

      .visitor-container {

        height: auto;

        min-height: 0;
      }


      .slider {

        height: auto;

        flex: none;
      }


      .slide {

        min-height: calc(
          100vh - var(--header-height, 55px)
        );
      }


      .slider-btn {

        min-width: 38px;

        min-height: 58px;

        font-size: 48px;

        padding: 0 2px;
      }

    }


    /* =========================================
       非常に小さい画面
    ========================================= */

    @media (max-height: 650px) {

      .slider-btn {

        min-width: 40px;

        min-height: 62px;

        font-size: 52px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================================
       共通ヘッダー
  ========================================= -->

  <div id="header"></div>


  <script>

    fetch("header.html")
      .then(res => res.text())
      .then(data => {

        document.getElementById("header").innerHTML = data;

        const btn =
          document.querySelector(".menu-btn");

        const nav =
          document.querySelector(".nav");


        /*
          実際のヘッダー高さを取得
        */

        const headerElement =
          document.querySelector(
            "#header header"
          );

        if (headerElement) {

          const headerHeight =
            headerElement.getBoundingClientRect().height;

          document.documentElement.style.setProperty(
            "--header-height",
            `${headerHeight}px`
          );

        }


        if (btn && nav) {

          btn.addEventListener(
            "click",
            (e) => {

              e.stopPropagation();

              nav.classList.toggle("active");

            }
          );


          document.addEventListener(
            "click",
            (e) => {

              if (
                !nav.contains(e.target) &&
                !btn.contains(e.target)
              ) {

                nav.classList.remove("active");

              }

            }
          );

        }

      });

  </script>


  <!-- =========================================
       背景図形
  ========================================= -->

  <div class="bg-shapes">

    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="shape s4"></div>
    <div class="shape s5"></div>
    <div class="shape s6"></div>
    <div class="shape s7"></div>
    <div class="shape s8"></div>

  </div>


  <!-- =========================================
       メイン
  ========================================= -->

  <main class="visitor-container">

    <div class="slider-wrapper">

      <!-- =====================================
           画像スライダー
      ====================================== -->

      <div
        class="slider"
        id="slider"
      >

        <div
          class="slides"
          id="slides"
        >

          <!-- 1ページ目 -->

          <div class="slide">

            <img
              src="images/visitor1.jpeg"
              alt="来校案内 1ページ目"
              draggable="false"
            >

          </div>


          <!-- 2ページ目 -->

          <div class="slide">

            <img
              src="images/visitor2.jpeg"
              alt="来校案内 2ページ目"
              draggable="false"
            >

          </div>


          <!-- 3ページ目 -->

          <div class="slide">

            <img
              src="images/visitor3.jpeg"
              alt="来校案内 3ページ目"
              draggable="false"
            >

          </div>


          <!-- 4ページ目 -->

          <div class="slide">

            <img
              src="images/visitor4.jpeg"
              alt="来校案内 4ページ目"
              draggable="false"
            >

          </div>


          <!-- 5ページ目 -->

          <div class="slide">

            <img
              src="images/visitor5.jpeg"
              alt="来校案内 5ページ目"
              draggable="false"
            >

          </div>


          <!-- 6ページ目 -->

          <div class="slide">

            <img
              src="images/visitor6.jpeg"
              alt="来校案内 6ページ目"
              draggable="false"
            >

          </div>

        </div>


        <!-- =====================================
             左右ボタン
        ====================================== -->

        <div class="slider-controls">

          <button
            type="button"
            class="slider-btn"
            id="prevBtn"
            aria-label="前のページ"
          >
            ‹
          </button>


          <button

          >
            ›
          </button>

        </div>

      </div>

    </div>

  </main>


  <!-- =========================================
       JavaScript
  ========================================= -->

  <script>

    /* =========================================
       要素取得
    ========================================= */

    const slider =
      document.getElementById("slider");


    const slides =
      document.getElementById("slides");


    const prevBtn =
      document.getElementById("prevBtn");


    const nextBtn =
      document.getElementById("nextBtn");


    const images =
      Array.from(
        document.querySelectorAll(
          ".slide img"
        )
      );


    /* =========================================
       ページ数
    ========================================= */

    const totalPages =
      images.length;


    /* =========================================
       現在のページ
    ========================================= */

    let currentPage = 0;


    /* =========================================
       拡大設定
    ========================================= */

    const MAX_ZOOM = 4;

    const MIN_ZOOM = 1;


    let zoomScale = 1;

    let panX = 0;

    let panY = 0;


    /* =========================================
       ポインター情報
    ========================================= */

    const activePointers =
      new Map();


    /*
      1本指ドラッグ用
    */

    let singlePointerId = null;

    let lastPointerX = 0;

    let lastPointerY = 0;


    /*
      ページスワイプ開始位置
    */

    let swipeStartX = 0;

    let swipeStartY = 0;


    /*
      状態
    */

    let isDragging = false;

    let isHorizontalGesture = false;

    let isPinching = false;


    /*
      ピンチ開始時の情報
    */

    let pinchStartDistance = 0;

    let pinchStartScale = 1;

    let pinchStartCenterX = 0;

    let pinchStartCenterY = 0;

    let pinchStartPanX = 0;

    let pinchStartPanY = 0;

    /*
      ピンチ開始時点で
      画像上のどの場所を掴んでいたか
    */

    let pinchContentX = 0;

    let pinchContentY = 0;

    /*
      ピンチ開始時の
      画像のレイアウト上の中心
    */

    let pinchLayoutCenterX = 0;

    let pinchLayoutCenterY = 0;


    /*
      しきい値
    */

    const SWIPE_DISTANCE = 45;

    const DIRECTION_THRESHOLD = 8;

    const DRAG_THRESHOLD = 4;


    /* =========================================
       現在の画像
    ========================================= */

    function getCurrentImage() {

      return images[currentPage];

    }


    /* =========================================
       拡大率制限
    ========================================= */

    function clampZoom(value) {

      return Math.max(
        MIN_ZOOM,
        Math.min(
          MAX_ZOOM,
          value
        )
      );

    }


    /* =========================================
       ポインター距離
    ========================================= */

    function getPointerDistance() {

      const points =
        Array.from(
          activePointers.values()
        );


      if (
        points.length < 2
      ) {

        return 0;

      }


      const dx =
        points[0].x -
        points[1].x;


      const dy =
        points[0].y -
        points[1].y;


      return Math.hypot(
        dx,
        dy
      );

    }


    /* =========================================
       2本指の中心
    ========================================= */

    function getPointerCenter() {

      const points =
        Array.from(
          activePointers.values()
        );


      if (
        points.length < 2
      ) {

        return {
          x: 0,
          y: 0
        };

      }


      return {

        x:
          (
            points[0].x +
            points[1].x
          ) / 2,

        y:
          (
            points[0].y +
            points[1].y
          ) / 2

      };

    }


    /* =========================================
       現在の画像の
       レイアウト中心を取得
    ========================================= */

    function getImageLayoutCenter() {

      const image =
        getCurrentImage();


      if (!image) {

        return {
          x: window.innerWidth / 2,
          y: window.innerHeight / 2
        };

      }


      /*
        getBoundingClientRect() は
        transform後の位置。

        現在のpanを引くことで
        transform前の中心位置を求める。
      */

      const rect =
        image.getBoundingClientRect();


      return {

        x:
          rect.left +
          rect.width / 2 -
          panX,

        y:
          rect.top +
          rect.height / 2 -
          panY

      };

    }


    /* =========================================
       画像の移動範囲
       
       実際の画像サイズを基準にする
    ========================================= */

    function limitPan() {

      const image =
        getCurrentImage();


      if (!image) {
        return;
      }


      if (
        zoomScale <= 1
      ) {

        panX = 0;

        panY = 0;

        return;

      }


      /*
        transform前の画像サイズ
      */

      const rect =
        image.getBoundingClientRect();


      const baseWidth =
        rect.width /
        Math.max(
          zoomScale,
          0.0001
        );


      const baseHeight =
        rect.height /
        Math.max(
          zoomScale,
          0.0001
        );


      /*
        画像の拡大後サイズ
      */

      const scaledWidth =
        baseWidth *
        zoomScale;


      const scaledHeight =
        baseHeight *
        zoomScale;


      /*
        スライダー表示領域
      */

      const viewportWidth =
        slider.clientWidth;


      /*
        縦方向については
        実際の画像の高さと
        ビューポート高さの差を使用
      */

      const viewportHeight =
        Math.max(
          slider.clientHeight,
          window.innerHeight
        );


      /*
        横方向
      */

      const maxPanX =
        Math.max(
          0,
          (
            scaledWidth -
            viewportWidth
          ) / 2
        );


      /*
        縦方向
      */

      const maxPanY =
        Math.max(
          0,
          (
            scaledHeight -
            viewportHeight
          ) / 2
        );


      panX =
        Math.max(
          -maxPanX,
          Math.min(
            maxPanX,
            panX
          )
        );


      panY =
        Math.max(
          -maxPanY,
          Math.min(
            maxPanY,
            panY
          )
        );

    }


    /* =========================================
       transform適用
    ========================================= */

    function applyZoomTransform() {

      const image =
        getCurrentImage();


      if (!image) {
        return;
      }


      image.style.transform =
        `translate3d(${panX}px, ${panY}px, 0) scale(${zoomScale})`;

    }


    /* =========================================
       拡大位置リセット
    ========================================= */

    function resetZoomPosition() {

      zoomScale = 1;

      panX = 0;

      panY = 0;


      images.forEach(
        (image) => {

          image.style.transform =
            "translate3d(0, 0, 0) scale(1)";

        }
      );

    }


    /* =========================================
       ページ更新
    ========================================= */

    function updateSlider(
      animate = true
    ) {

      if (animate) {

        slides.style.transition =
          "transform 0.3s ease-out";

      }

      else {

        slides.style.transition =
          "none";

      }


      slides.style.transform =
        `translate3d(-${currentPage * 100}%, 0, 0)`;


      /*
        ページを変えたら
        必ず拡大解除
      */

      resetZoomPosition();

    }


    /* =========================================
       次ページ
    ========================================= */

    function nextPage() {

      if (
        totalPages <= 0
      ) {
        return;
      }


      if (
        currentPage <
        totalPages - 1
      ) {

        currentPage++;

      }

      else {

        currentPage = 0;

      }


      updateSlider(true);

    }


    /* =========================================
       前ページ
    ========================================= */

    function previousPage() {

      if (
        totalPages <= 0
      ) {
        return;
      }


      if (
        currentPage > 0
      ) {

        currentPage--;

      }

      else {

        currentPage =
          totalPages - 1;

      }


      updateSlider(true);

    }


    /* =========================================
       ボタン
    ========================================= */

    prevBtn.addEventListener(
      "click",
      (e) => {

        e.preventDefault();

        e.stopPropagation();

        previousPage();

      }
    );


    nextBtn.addEventListener(
      "click",
      (e) => {

        e.preventDefault();

        e.stopPropagation();

        nextPage();

      }
    );


    prevBtn.addEventListener(
      "pointerdown",
      (e) => {

        e.stopPropagation();

      }
    );


    nextBtn.addEventListener(
      "pointerdown",
      (e) => {

        e.stopPropagation();

      }
    );


    /* =========================================
       ピンチ開始
       
       ★指の位置を基準にする
    ========================================= */

    function startPinch() {

      if (
        activePointers.size < 2
      ) {
        return;
      }


      const image =
        getCurrentImage();


      if (!image) {
        return;
      }


      isPinching = true;

      isDragging = false;

      isHorizontalGesture = false;


      /*
        現在の2本指距離
      */

      pinchStartDistance =
        getPointerDistance();


      /*
        現在の2本指中心
      */

      const center =
        getPointerCenter();


      pinchStartCenterX =
        center.x;

      pinchStartCenterY =
        center.y;


      /*
        開始時の拡大率
      */

      pinchStartScale =
        zoomScale;


      pinchStartPanX =
        panX;

      pinchStartPanY =
        panY;


      /*
        現在の画像の
        transform前の中心
      */

      const rect =
        image.getBoundingClientRect();


      pinchLayoutCenterX =
        rect.left +
        rect.width / 2 -
        panX;


      pinchLayoutCenterY =
        rect.top +
        rect.height / 2 -
        panY;


      /*
        ピンチ中心が画像上の
        どの位置なのかを保存
      */

      pinchContentX =
        (
          pinchStartCenterX -
          pinchLayoutCenterX -
          pinchStartPanX
        ) /
        Math.max(
          pinchStartScale,
          0.0001
        );


      pinchContentY =
        (
          pinchStartCenterY -
          pinchLayoutCenterY -
          pinchStartPanY
        ) /
        Math.max(
          pinchStartScale,
          0.0001
        );

    }


    /* =========================================
       pointerdown
    ========================================= */

    slider.addEventListener(
      "pointerdown",
      (e) => {

        /*
          ボタンは無視
        */

        if (
          e.target.closest(
            ".slider-btn"
          )
        ) {

          return;

        }


        /*
          マウスは左クリックのみ
        */

        if (
          e.pointerType === "mouse" &&
          e.button !== 0
        ) {

          return;

        }


        /*
          ポインター登録
        */

        activePointers.set(
          e.pointerId,
          {
            x: e.clientX,
            y: e.clientY
          }
        );


        try {

          slider.setPointerCapture(
            e.pointerId
          );

        }

        catch (error) {
          // 無視
        }


        /* -------------------------------------
           2本目の指
           → ピンチ開始
        ------------------------------------- */

        if (
          activePointers.size >= 2
        ) {

          startPinch();

          return;

        }


        /* -------------------------------------
           1本指
        ------------------------------------- */

        singlePointerId =
          e.pointerId;


        lastPointerX =
          e.clientX;

        lastPointerY =
          e.clientY;


        swipeStartX =
          e.clientX;

        swipeStartY =
          e.clientY;


        isDragging = false;

        isHorizontalGesture = false;

      }
    );


    /* =========================================
       pointermove
    ========================================= */

    slider.addEventListener(
      "pointermove",
      (e) => {

        /*
          ポインター位置を更新
        */

        if (
          activePointers.has(
            e.pointerId
          )
        ) {

          activePointers.set(
            e.pointerId,
            {
              x: e.clientX,
              y: e.clientY
            }
          );

        }


        /* =====================================
           2本指ピンチ
        ===================================== */

        if (
          isPinching &&
          activePointers.size >= 2
        ) {

          /*
            ブラウザの通常操作を止める
          */

          e.preventDefault();


          /*
            現在の距離
          */

          const currentDistance =
            getPointerDistance();


          if (
            pinchStartDistance <= 0
          ) {

            return;

          }


          /*
            拡大率
          */

          const ratio =
            currentDistance /
            pinchStartDistance;


          let newScale =
            clampZoom(
              pinchStartScale *
              ratio
            );


          /*
            2本指中心
          */

          const center =
            getPointerCenter();


          /*
            ★重要
            ピンチの中心位置を維持する

            これにより、
            指でつまんだ場所を中心に
            拡大・縮小できる
          */

          panX =
            center.x -
            pinchLayoutCenterX -
            pinchContentX *
              newScale;


          panY =
            center.y -
            pinchLayoutCenterY -
            pinchContentY *
              newScale;


          zoomScale =
            newScale;


          /*
            1倍以下になった場合
          */

          if (
            zoomScale <= 1
          ) {

            zoomScale = 1;

            panX = 0;

            panY = 0;

          }


          /*
            移動範囲制限
          */

          limitPan();


          /*
            即時反映
          */

          applyZoomTransform();


          return;

        }


        /* =====================================
           1本指
        ===================================== */

        if (
          e.pointerId !==
          singlePointerId
        ) {

          return;

        }


        const moveX =
          e.clientX -
          lastPointerX;


        const moveY =
          e.clientY -
          lastPointerY;


        const totalX =
          e.clientX -
          swipeStartX;


        const totalY =
          e.clientY -
          swipeStartY;


        /* =====================================
           拡大中
           
           → 完全に画像移動
        ===================================== */

        if (
          zoomScale > 1
        ) {

          e.preventDefault();


          /*
            少しでも動いたらドラッグ開始
          */

          if (
            Math.abs(totalX) >
              DRAG_THRESHOLD ||
            Math.abs(totalY) >
              DRAG_THRESHOLD
          ) {

            isDragging = true;

          }


          if (
            isDragging
          ) {

            panX += moveX;

            panY += moveY;


            /*
              移動範囲制限
            */

            limitPan();


            /*
              即時反映
            */

            applyZoomTransform();

          }


          lastPointerX =
            e.clientX;

          lastPointerY =
            e.clientY;


          return;

        }


        /* =====================================
           等倍時
           
           横 → ページスワイプ
           縦 → ブラウザスクロール
        ===================================== */

        const absX =
          Math.abs(totalX);

        const absY =
          Math.abs(totalY);


        /*
          まだ方向が決まっていない
        */

        if (
          !isHorizontalGesture &&
          absX > DIRECTION_THRESHOLD &&
          absX > absY
        ) {

          /*
            横方向ジェスチャー確定
          */

          isHorizontalGesture = true;

          isDragging = true;

        }


        /*
          横スワイプ中
        */

        if (
          isHorizontalGesture
        ) {

          /*
            ブラウザの横スクロール等を防止
          */

          e.preventDefault();


          const sliderWidth =
            slider.clientWidth;


          if (
            sliderWidth <= 0
          ) {

            return;

          }


          /*
            スワイプ移動量
          */

          let dragX =
            totalX;


          /*
            最大移動量を制限
          */

          const MAX_DRAG =
            sliderWidth * 0.35;


          dragX =
            Math.max(
              -MAX_DRAG,
              Math.min(
                MAX_DRAG,
                dragX
              )
            );


          const basePercent =
            currentPage * -100;


          const dragPercent =
            (
              dragX /
              sliderWidth
            ) *
            100;


          slides.style.transition =
            "none";


          slides.style.transform =
            `translate3d(calc(${basePercent}% + ${dragPercent}%), 0, 0)`;

        }


        lastPointerX =
          e.clientX;

        lastPointerY =
          e.clientY;

      },
      {
        passive: false
      }
    );


    /* =========================================
       ピンチ終了後の
       1本指操作への移行
    ========================================= */

    function continueSingleFingerAfterPinch() {

      if (
        activePointers.size !== 1
      ) {

        return;

      }


      const remaining =
        Array.from(
          activePointers.entries()
        )[0];


      if (!remaining) {
        return;
      }


      singlePointerId =
        remaining[0];


      lastPointerX =
        remaining[1].x;

      lastPointerY =
        remaining[1].y;


      swipeStartX =
        remaining[1].x;

      swipeStartY =
        remaining[1].y;


      /*
        ピンチ終了直後の
        スワイプ判定をリセット

        これにより
        2本指→1本指になった瞬間に
        ページが勝手に切り替わらない
      */

      isDragging = false;

      isHorizontalGesture =
        false;

    }


    /* =========================================
       pointerup
    ========================================= */

    slider.addEventListener(
      "pointerup",
      (e) => {

        /*
          ポインター削除
        */

        activePointers.delete(
          e.pointerId
        );


        /* =====================================
           ピンチ中
        ===================================== */

        if (
          isPinching
        ) {

          /*
            まだ2本以上残っている
            → ピンチ継続
          */

          if (
            activePointers.size >= 2
          ) {

            return;

          }


          /*
            ピンチ終了
          */

          isPinching = false;


          /*
            1本残っている場合は
            その指で続けてドラッグできるようにする
          */

          if (
            activePointers.size === 1
          ) {

            continueSingleFingerAfterPinch();

          }

          else {

            singlePointerId = null;

          }


          return;

        }


        /* =====================================
           1本指以外
        ===================================== */

        if (
          e.pointerId !==
          singlePointerId
        ) {

          return;

        }


        const deltaX =
          e.clientX -
          swipeStartX;


        const deltaY =
          e.clientY -
          swipeStartY;


        /*
          拡大中
        */

        if (
          zoomScale > 1
        ) {

          isDragging = false;

          isHorizontalGesture = false;

          singlePointerId = null;

          return;

        }


        /* =====================================
           等倍時
        ===================================== */

        if (
          isHorizontalGesture
        ) {

          /*
            横スワイプ判定
          */

          const isSwipe =
            Math.abs(deltaX) >=
              SWIPE_DISTANCE &&
            Math.abs(deltaX) >
              Math.abs(deltaY);


          if (
            isSwipe
          ) {

            if (
              deltaX < 0
            ) {

              /*
                左へ
                → 次ページ
              */

              nextPage();

            }

            else {

              /*
                右へ
                → 前ページ
              */

              previousPage();

            }

          }

          else {

            /*
              スワイプ量不足
              → 元の位置へ
            */

            updateSlider(true);

          }

        }


        /*
          状態リセット
        */

        isDragging = false;

        isHorizontalGesture = false;

        singlePointerId = null;

      }
    );


    /* =========================================
       pointercancel
    ========================================= */

    slider.addEventListener(
      "pointercancel",
      (e) => {

        activePointers.delete(
          e.pointerId
        );


        if (
          activePointers.size === 0
        ) {

          isPinching = false;

          isDragging = false;

          isHorizontalGesture = false;

          singlePointerId = null;


          /*
            キャンセル時は
            現在ページへ戻す
          */

          updateSlider(true);

        }

        else if (
          activePointers.size === 1
        ) {

          isPinching = false;

          continueSingleFingerAfterPinch();

        }

      }
    );


    /* =========================================
       マウスホイール拡大
       
       Ctrl + ホイール
    ========================================= */

    slider.addEventListener(
      "wheel",
      (e) => {

        if (
          !e.ctrlKey
        ) {

          /*
            通常ホイールは
            ブラウザ標準スクロール
          */

          return;

        }


        e.preventDefault();


        const image =
          getCurrentImage();


        if (!image) {
          return;
        }


        /*
          マウス位置を中心に拡大
        */

        const rect =
          image.getBoundingClientRect();


        const mouseX =
          e.clientX;

        const mouseY =
          e.clientY;


        const layoutCenterX =
          rect.left +
          rect.width / 2 -
          panX;


        const layoutCenterY =
          rect.top +
          rect.height / 2 -
          panY;


        /*
          現在の画像上の位置
        */

        const contentX =
          (
            mouseX -
            layoutCenterX -
            panX
          ) /
          Math.max(
            zoomScale,
            0.0001
          );


        const contentY =
          (
            mouseY -
            layoutCenterY -
            panY
          ) /
          Math.max(
            zoomScale,
            0.0001
          );


        /*
          新しい倍率
        */

        const zoomStep =
          e.deltaY < 0
            ? 1.12
            : 0.88;


        const newScale =
          clampZoom(
            zoomScale *
            zoomStep
          );


        /*
          マウス位置を維持
        */

        panX =
          mouseX -
          layoutCenterX -
          contentX *
            newScale;


        panY =
          mouseY -
          layoutCenterY -
          contentY *
            newScale;


        zoomScale =
          newScale;


        if (
          zoomScale <= 1
        ) {

          zoomScale = 1;

          panX = 0;

          panY = 0;

        }


        limitPan();

        applyZoomTransform();

      },
      {
        passive: false
      }
    );


    /* =========================================
       画像ドラッグ防止
    ========================================= */

    images.forEach(
      (img) => {

        img.addEventListener(
          "dragstart",
          (e) => {

            e.preventDefault();

          }
        );


        img.addEventListener(
          "contextmenu",
          (e) => {

            /*
              長押しメニュー等による
              操作中断を防止
            */

            if (
              zoomScale > 1
            ) {

              e.preventDefault();

            }

          }
        );

      }
    );


    /* =========================================
       キーボード操作
    ========================================= */

    document.addEventListener(
      "keydown",
      (e) => {

        /*
          左
        */

        if (
          e.key === "ArrowLeft"
        ) {

          e.preventDefault();

          previousPage();

        }


        /*
          右
        */

        if (
          e.key === "ArrowRight"
        ) {

          e.preventDefault();

          nextPage();

        }


        /*
          Escape
          → 拡大解除
        */

        if (
          e.key === "Escape"
        ) {

          if (
            zoomScale > 1
          ) {

            resetZoomPosition();

          }

        }

      }
    );


    /* =========================================
       画面サイズ変更時
       
       拡大位置が画面外へ
       はみ出さないよう補正
    ========================================= */

    window.addEventListener(
      "resize",
      () => {

        if (
          zoomScale > 1
        ) {

          limitPan();

          applyZoomTransform();

        }

      }
    );


    /* =========================================
       初期表示
    ========================================= */

    resetZoomPosition();

    updateSlider(false);

  </script>


</body>
</html>
