<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>文化祭（一般公開時）来校上のお願い | 長高祭</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>

    /* =========================================
       visitorページ
    ========================================= */

    * {
      box-sizing: border-box;
    }


    /* =========================================
       ページ全体
    ========================================= */

    body {
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }


    /* =========================================
       visitorコンテンツ
    ========================================= */

    .visitor-container {
      position: relative;

      z-index: 2;

      width: 100%;
      max-width: none;

      margin-top: var(--header-height, 80px);

      padding: 30px 0 40px;

      text-align: center;
    }


    /* =========================================
       タイトル
    ========================================= */

    .visitor-title {
      position: relative;

      z-index: 2;

      margin: 0 20px 25px;

      color: #d96b8a;

      font-size: clamp(1.3rem, 4vw, 3rem);

      font-weight: 700;

      line-height: 1.3;

      text-align: center;
    }


    /* =========================================
       スライダー
    ========================================= */

    .slider-wrapper {
      position: relative;

      width: 100%;

      max-width: none;

      margin: 0 auto;

      overflow: hidden;
    }


    /* 画像を横一列に並べる */

    .slider-track {
      display: flex;

      width: 100%;

      transition: transform 0.5s ease;

      will-change: transform;
    }


    /* =========================================
       1枚分
    ========================================= */

    .slide {
      flex: 0 0 100%;

      width: 100%;

      min-width: 100%;

      display: flex;

      justify-content: center;

      align-items: flex-start;

      padding: 0;

      margin: 0;
    }


    /* =========================================
       ★ JPEG画像
       1枚を画面幅いっぱいにする
    ========================================= */

    .slide img {
      display: block;

      width: 100%;

      max-width: none;

      height: auto;

      max-height: none;

      object-fit: contain;

      margin: 0;

      padding: 0;

      border: none;

      border-radius: 0;

      box-shadow: none;

      user-select: none;

      -webkit-user-drag: none;
    }


    /* =========================================
       左右ボタン
    ========================================= */

    .slider-btn {
      position: absolute;

      top: 50%;

      transform: translateY(-50%);

      z-index: 10;

      width: 64px;

      height: 64px;

      border: none;

      border-radius: 50%;

      background: rgba(255, 255, 255, 0.9);

      color: #d96b8a;

      font-size: 32px;

      font-weight: bold;

      display: flex;

      align-items: center;

      justify-content: center;

      cursor: pointer;

      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);

      transition: 0.2s;
    }


    .slider-btn:hover {
      transform: translateY(-50%) scale(1.05);
    }


    .slider-btn:active {
      transform: translateY(-50%) scale(0.95);
    }


    /* 左ボタン */

    .slider-btn.prev {
      left: 20px;
    }


    /* 右ボタン */

    .slider-btn.next {
      right: 20px;
    }


    /* =========================================
       ページ番号
    ========================================= */

    .page-number {
      position: relative;

      z-index: 2;

      margin-top: 20px;

      color: #d96b8a;

      font-size: 28px;

      font-weight: bold;

      letter-spacing: 2px;

      text-align: center;
    }


    /* =========================================
       スマホ
    ========================================= */

    @media (max-width: 768px) {

      .visitor-container {
        margin-top: var(--header-height, 70px);

        padding: 20px 0 30px;
      }


      .visitor-title {
        margin: 0 15px 20px;

        font-size: clamp(1.1rem, 5vw, 1.8rem);
      }


      .slide {
        flex: 0 0 100%;

        width: 100%;

        min-width: 100%;

        padding: 0;
      }


      .slide img {
        width: 100%;

        max-width: none;

        height: auto;

        max-height: none;
      }


      .slider-btn {
        width: 52px;

        height: 52px;

        font-size: 26px;
      }


      .slider-btn.prev {
        left: 10px;
      }


      .slider-btn.next {
        right: 10px;
      }


      .page-number {
        margin-top: 15px;

        font-size: 24px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================================
       共通ヘッダー
  ========================================= -->

  <div id="header"></div>


  <script>

    fetch("header.html")
      .then(res => res.text())
      .then(data => {

        document.getElementById("header").innerHTML = data;

        const btn = document.querySelector(".menu-btn");
        const nav = document.querySelector(".nav");


        /* ハンバーガーメニュー */

        if (btn && nav) {

          btn.addEventListener("click", (e) => {

            e.stopPropagation();

            nav.classList.toggle("active");

          });


          document.addEventListener("click", (e) => {

            if (
              !nav.contains(e.target) &&
              !btn.contains(e.target)
            ) {

              nav.classList.remove("active");

            }

          });

        }


        /* ヘッダーの高さを取得 */

        const headerElement = document.querySelector("#header header");

        if (headerElement) {

          const headerHeight = headerElement.offsetHeight;

          document.documentElement.style.setProperty(
            "--header-height",
            headerHeight + "px"
          );

        }

      });

  </script>



  <!-- =========================================
       背景図形
  ========================================= -->

  <div class="bg-shapes">

    <div class="shape s1"></div>

    <div class="shape s2"></div>

    <div class="shape s3"></div>

    <div class="shape s4"></div>

    <div class="shape s5"></div>

    <div class="shape s6"></div>

    <div class="shape s7"></div>

    <div class="shape s8"></div>

  </div>



  <!-- =========================================
       visitorページ
  ========================================= -->

  <main class="visitor-container">


    <!-- タイトル -->

    <h1 class="visitor-title">
      文化祭（一般公開時）来校上のお願い
    </h1>



    <!-- =========================================
         スライダー
    ========================================= -->

    <div class="slider-wrapper">


      <!-- 画像 -->

      <div class="slider-track" id="sliderTrack">


        <!-- 1枚目 -->

        <div class="slide">

          <img
            src="images/visitor1.jpeg"
            alt="文化祭のお知らせ 1ページ目"
          >

        </div>


        <!-- 2枚目 -->

        <div class="slide">

          <img
            src="images/visitor2.jpeg"
            alt="文化祭のお知らせ 2ページ目"
          >

        </div>


        <!-- 3枚目 -->

        <div class="slide">

          <img
            src="images/visitor3.jpeg"
            alt="文化祭のお知らせ 3ページ目"
          >

        </div>


        <!-- 4枚目 -->

        <div class="slide">

          <img
            src="images/visitor4.jpeg"
            alt="文化祭のお知らせ 4ページ目"
          >

        </div>


        <!-- 5枚目 -->

        <div class="slide">

          <img
            src="images/visitor5.jpeg"
            alt="文化祭のお知らせ 5ページ目"
          >

        </div>


        <!-- 6枚目 -->

        <div class="slide">

          <img
            src="images/visitor6.jpeg"
            alt="文化祭のお知らせ 6ページ目"
          >

        </div>


      </div>



      <!-- =========================================
           左ボタン
      ========================================= -->

      <button
        class="slider-btn prev"
        id="prevBtn"
        type="button"
        aria-label="前のページ"
      >
        ‹
      </button>



      <!-- =========================================
           右ボタン
      ========================================= -->

      <button
        class="slider-btn next"
        id="nextBtn"
        type="button"
        aria-label="次のページ"
      >
        ›
      </button>


    </div>



    <!-- =========================================
         ページ番号
    ========================================= -->

    <div
      class="page-number"
      id="pageNumber"
    >
      1 / 6
    </div>


  </main>



  <!-- =========================================
       スライダーJavaScript
  ========================================= -->

  <script>

    const sliderTrack =
      document.getElementById("sliderTrack");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const pageNumber =
      document.getElementById("pageNumber");


    /* 全6枚 */

    const totalSlides = 6;


    /* 現在のページ */

    let currentSlide = 0;


    /* =========================================
       スライドを移動
    ========================================= */

    function updateSlider() {

      /*
        1枚につき100%なので、
        1ページ進むごとに100%移動する
      */

      sliderTrack.style.transform =
        `translateX(-${currentSlide * 100}%)`;


      /* ページ番号 */

      pageNumber.textContent =
        `${currentSlide + 1} / ${totalSlides}`;

    }


    /* =========================================
       次へ
    ========================================= */

    nextBtn.addEventListener("click", () => {

      currentSlide++;

      if (currentSlide >= totalSlides) {

        currentSlide = 0;

      }

      updateSlider();

    });


    /* =========================================
       前へ
    ========================================= */

    prevBtn.addEventListener("click", () => {

      currentSlide--;

      if (currentSlide < 0) {

        currentSlide = totalSlides - 1;

      }

      updateSlider();

    });



    /* =========================================
       スワイプ操作
    ========================================= */

    let startX = 0;

    let endX = 0;


    sliderTrack.addEventListener(
      "touchstart",
      (e) => {

        startX = e.touches[0].clientX;

      },
      { passive: true }
    );


    sliderTrack.addEventListener(
      "touchend",
      (e) => {

        endX = e.changedTouches[0].clientX;

        const difference = startX - endX;


        /*
          50px以上スワイプしたら移動
        */

        if (Math.abs(difference) < 50) {

          return;

        }


        /* 左へスワイプ */

        if (difference > 0) {

          currentSlide++;

          if (currentSlide >= totalSlides) {

            currentSlide = 0;

          }

        }


        /* 右へスワイプ */

        else {

          currentSlide--;

          if (currentSlide < 0) {

            currentSlide = totalSlides - 1;

          }

        }


        updateSlider();

      },
      { passive: true }
    );


    /* 初期表示 */

    updateSlider();

  </script>


</body>
</html>
