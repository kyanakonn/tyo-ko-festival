<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>文化祭（一般公開時）来校上のお願い | 長高祭</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="css/style.css">


  <style>

    /* =========================================
       基本設定
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    :root {
      --main-color: #d96b8a;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      overflow: hidden;

      overscroll-behavior: none;
    }


    body {

      background: #ffffff;

      font-family:
        "Yu Gothic",
        "Hiragino Sans",
        sans-serif;

      touch-action: none;
    }


    /* =========================================
       ヘッダー
    ========================================= */

    #header {

      position: relative;

      z-index: 10000;

      width: 100%;
    }


    /* =========================================
       背景図形
    ========================================= */

    .bg-shapes {

      position: fixed;

      inset: 0;

      z-index: 0;

      pointer-events: none;

      overflow: hidden;

      opacity: 0.85;
    }


    .shape {
      position: absolute;
    }


    /* =========================================
       三角形
    ========================================= */

    .s1 {

      top: 5%;
      left: -50px;

      width: 0;
      height: 0;

      border-left: 90px solid transparent;
      border-right: 90px solid transparent;
      border-bottom: 170px solid #c85c72;

      transform: rotate(-25deg);
    }


    .s2 {

      top: 25%;
      left: -35px;

      width: 0;
      height: 0;

      border-left: 70px solid transparent;
      border-right: 70px solid transparent;
      border-bottom: 130px solid #8060a8;

      transform: rotate(20deg);
    }


    .s3 {

      bottom: 5%;
      left: -30px;

      width: 0;
      height: 0;

      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-bottom: 180px solid #d1a92f;

      transform: rotate(12deg);
    }


    .s4 {

      bottom: 28%;
      left: 20px;

      width: 0;
      height: 0;

      border-left: 60px solid transparent;
      border-right: 60px solid transparent;
      border-bottom: 120px solid #3f9da9;

      transform: rotate(-15deg);
    }


    .s5 {

      top: 12%;
      right: -80px;

      width: 0;
      height: 0;

      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-bottom: 260px solid #4f9fa5;

      transform: rotate(30deg);
    }


    .s6 {

      bottom: -40px;
      right: -30px;

      width: 0;
      height: 0;

      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-bottom: 190px solid #c85c72;

      transform: rotate(-15deg);
    }


    .s7 {

      top: 8%;
      right: 40px;

      width: 0;
      height: 0;

      border-left: 55px solid transparent;
      border-right: 55px solid transparent;
      border-bottom: 100px solid #8060a8;

      transform: rotate(35deg);
    }


    .s8 {

      bottom: 20%;
      right: 40px;

      width: 0;
      height: 0;

      border-left: 70px solid transparent;
      border-right: 70px solid transparent;
      border-bottom: 130px solid #d1a92f;

      transform: rotate(-20deg);
    }


    /* =========================================
       メイン
    ========================================= */

    .visitor-container {

      position: relative;

      z-index: 1;

      width: 100%;

      /*
        ヘッダー直下から開始。
        上側の余白を画面サイズによって
        増やさないようにする。
      */
      height: calc(100vh - var(--header-height, 70px));

      min-height: 0;

      padding: 0;

      margin-top: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      overflow: hidden;
    }


    /* =========================================
       スライダー全体
    ========================================= */

    .slider-wrapper {

      position: relative;

      width: 100%;

      height: 100%;

      min-height: 0;

      max-width: 1400px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: flex-start;

      overflow: hidden;
    }


    /* =========================================
       画像エリア
    ========================================= */

    .slider {

      position: relative;

      width: 100%;

      height: 100%;

      flex: 1 1 auto;

      min-height: 0;

      overflow: hidden;

      touch-action: none;

      contain: layout paint;
    }


    /* =========================================
       スライド全体
    ========================================= */

    .slides {

      display: flex;

      width: 100%;

      height: 100%;

      flex-shrink: 0;

      transition:
        transform 0.3s ease-out;

      will-change: transform;

      touch-action: none;
    }


    /* =========================================
       各ページ
    ========================================= */

    .slide {

      position: relative;

      flex: 0 0 100%;

      width: 100%;

      height: 100%;

      display: flex;

      justify-content: center;

      /*
        上側の余白が大きくならないよう、
        画像を上端基準にする。
      */
      align-items: flex-start;

      padding: 0;

      overflow: hidden;

      touch-action: none;
    }


    /* =========================================
       画像

       左右の余白なし
       画像全体を表示
    ========================================= */

    .slide img {

      display: block;

      width: 100%;

      height: 100%;

      max-width: none;

      max-height: none;

      object-fit: contain;

      object-position: center top;

      border-radius: 0;

      background: transparent;

      cursor: zoom-in;

      user-select: none;

      -webkit-user-select: none;

      -webkit-user-drag: none;

      touch-action: none;

      transform:
        translate3d(0, 0, 0)
        scale(1);

      transform-origin: center center;

      will-change: transform;

      transition:
        transform 0.2s ease-out;
    }


    /* =========================================
       拡大モード
    ========================================= */

    .slider.zoom-mode .slide img {

      cursor: grab;

      transform:
        translate3d(
          var(--pan-x, 0px),
          var(--pan-y, 0px),
          0
        )
        scale(
          var(--zoom-scale, 1.4)
        );

      transition: none;
    }


    .slider.zoom-mode .slide img:active {

      cursor: grabbing;
    }


    /* =========================================
       左右ボタン

       白い円なし
       背景なし
       画像の上に直接配置
    ========================================= */

    .slider-controls {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0;

      pointer-events: none;

      z-index: 100;
    }


    /* =========================================
       ボタン本体
    ========================================= */

    .slider-btn {

      width: auto;

      height: auto;

      min-width: 52px;

      min-height: 90px;

      padding: 0 6px;

      margin: 0;

      border: none;

      border-radius: 0;

      background: transparent;

      color: var(--main-color);

      font-size: 76px;

      font-family:
        Arial,
        "Helvetica Neue",
        sans-serif;

      font-weight: 300;

      line-height: 1;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-shrink: 0;

      pointer-events: auto;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;

      box-shadow: none;

      outline: none;

      text-shadow:
        0 2px 6px rgba(255, 255, 255, 0.85);

      transition:
        transform 0.12s ease,
        opacity 0.12s ease;
    }


    .slider-btn:hover {

      background: transparent;

      box-shadow: none;

      transform: scale(1.08);
    }


    .slider-btn:active {

      background: transparent;

      box-shadow: none;

      transform: scale(0.9);
    }


    .slider-btn:focus {

      outline: none;

      background: transparent;

    }


    /* =========================================
       拡大モード表示

       ★上部に表示する領域だけ確保
       ★ページ番号は削除
    ========================================= */

    .zoom-indicator {

      position: absolute;

      top: 14px;

      left: 50%;

      transform: translateX(-50%);

      z-index: 200;

      padding: 5px 12px;

      border-radius: 15px;

      background: rgba(255, 255, 255, 0.82);

      color: var(--main-color);

      font-size: 13px;

      font-weight: bold;

      line-height: 1.3;

      pointer-events: none;

      opacity: 0;

      transition:
        opacity 0.2s ease;
    }


    .slider.zoom-mode .zoom-indicator {

      opacity: 1;
    }


    /* =========================================
       スマホ
    ========================================= */

    @media (max-width: 768px) {

      .visitor-container {

        height: calc(100vh - var(--header-height, 60px));

        padding: 0;

        overflow: hidden;
      }


      .slider-wrapper {

        width: 100%;

        height: 100%;

        overflow: hidden;
      }


      .slider {

        width: 100%;

        height: 100%;

        flex: 1 1 auto;

        min-height: 0;

        overflow: hidden;
      }


      .slides {

        width: 100%;

        height: 100%;

        transition:
          transform 0.3s ease-out;
      }


      .slide {

        width: 100%;

        height: 100%;

        align-items: flex-start;

        justify-content: center;

        padding: 0;
      }


      /* -----------------------------------------
         スマホ画像
      ----------------------------------------- */

      .slide img {

        width: 100%;

        height: 100%;

        max-width: none;

        max-height: none;

        object-fit: contain;

        object-position: center top;
      }


      /* -----------------------------------------
         スマホ左右ボタン
      ----------------------------------------- */

      .slider-controls {

        width: 100%;

        height: 100%;

        padding: 0;
      }


      .slider-btn {

        min-width: 44px;

        min-height: 76px;

        padding: 0 3px;

        font-size: 62px;

        font-weight: 300;

        text-shadow:
          0 2px 5px rgba(255, 255, 255, 0.9);
      }


      /* -----------------------------------------
         スマホ拡大表示
      ----------------------------------------- */

      .zoom-indicator {

        top: 8px;

        padding: 3px 9px;

        font-size: 12px;
      }

    }


    /* =========================================
       横向きスマホ
    ========================================= */

    @media (max-width: 768px) and (orientation: landscape) {

      .visitor-container {

        height: calc(100vh - var(--header-height, 55px));
      }


      .slider {

        height: 100%;

        flex: 1 1 auto;
      }


      .slider-btn {

        min-width: 38px;

        min-height: 58px;

        font-size: 48px;

        padding: 0 2px;
      }


      .zoom-indicator {

        top: 6px;

        font-size: 11px;
      }

    }


    /* =========================================
       非常に小さい画面
    ========================================= */

    @media (max-height: 650px) {

      .slider-btn {

        min-width: 40px;

        min-height: 62px;

        font-size: 52px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================================
       共通ヘッダー
  ========================================= -->

  <div id="header"></div>


  <script>

    fetch("header.html")
      .then(res => res.text())
      .then(data => {

        document.getElementById("header").innerHTML = data;

        const btn =
          document.querySelector(".menu-btn");

        const nav =
          document.querySelector(".nav");


        /*
          実際のヘッダー高さを取得して
          visitorページ側に反映する。
        */

        const headerElement =
          document.querySelector(
            "#header header"
          );

        if (headerElement) {

          const headerHeight =
            headerElement.getBoundingClientRect().height;

          document.documentElement.style.setProperty(
            "--header-height",
            `${headerHeight}px`
          );

        }


        if (btn && nav) {

          btn.addEventListener(
            "click",
            (e) => {

              e.stopPropagation();

              nav.classList.toggle("active");

            }
          );


          document.addEventListener(
            "click",
            (e) => {

              if (
                !nav.contains(e.target) &&
                !btn.contains(e.target)
              ) {

                nav.classList.remove("active");

              }

            }
          );

        }

      });

  </script>


  <!-- =========================================
       背景図形
  ========================================= -->

  <div class="bg-shapes">

    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="shape s4"></div>
    <div class="shape s5"></div>
    <div class="shape s6"></div>
    <div class="shape s7"></div>
    <div class="shape s8"></div>

  </div>


  <!-- =========================================
       メイン
  ========================================= -->

  <main class="visitor-container">

    <div class="slider-wrapper">


      <!-- =====================================
           画像スライダー
      ====================================== -->

      <div
        class="slider"
        id="slider"
      >


        <div
          class="slides"
          id="slides"
        >


          <!-- ================================
               1ページ目
          ================================= -->

          <div class="slide">

            <img
              src="images/visitor1.jpeg"
              alt="来校案内 1ページ目"
              draggable="false"
            >

          </div>


          <!-- ================================
               2ページ目
          ================================= -->

          <div class="slide">

            <img
              src="images/visitor2.jpeg"
              alt="来校案内 2ページ目"
              draggable="false"
            >

          </div>


          <!-- ================================
               3ページ目
          ================================= -->

          <div class="slide">

            <img
              src="images/visitor3.jpeg"
              alt="来校案内 3ページ目"
              draggable="false"
            >

          </div>


          <!-- ================================
               4ページ目
          ================================= -->

          <div class="slide">

            <img
              src="images/visitor4.jpeg"
              alt="来校案内 4ページ目"
              draggable="false"
            >

          </div>


          <!-- ================================
               5ページ目
          ================================= -->

          <div class="slide">

            <img
              src="images/visitor5.jpeg"
              alt="来校案内 5ページ目"
              draggable="false"
            >

          </div>


          <!-- ================================
               6ページ目
          ================================= -->

          <div class="slide">

            <img
              src="images/visitor6.jpeg"
              alt="来校案内 6ページ目"
              draggable="false"
            >

          </div>


        </div>


        <!-- =====================================
             左右ボタン

             ★画像の上に直接配置
             ★白い円なし
        ====================================== -->

        <div class="slider-controls">


          <button
            type="button"
            class="slider-btn"
            id="prevBtn"
            aria-label="前のページ"
          >
            ‹
          </button>


          <button
            type="button"
            class="slider-btn"
            id="nextBtn"
            aria-label="次のページ"
          >
            ›
          </button>


        </div>


        <!-- =====================================
             拡大モード表示
        ====================================== -->

        <div
          class="zoom-indicator"
          id="zoomIndicator"
        >
          拡大モード
        </div>


      </div>

    </div>

  </main>


  <!-- =========================================
       JavaScript
  ========================================= -->

  <script>

    /* =========================================
       要素取得
    ========================================= */

    const slider =
      document.getElementById("slider");


    const slides =
      document.getElementById("slides");


    const prevBtn =
      document.getElementById("prevBtn");


    const nextBtn =
      document.getElementById("nextBtn");


    /* =========================================
       ページ数
    ========================================= */

    const totalPages = 6;


    /* =========================================
       現在のページ
    ========================================= */

    let currentPage = 0;


    /* =========================================
       拡大設定
    ========================================= */

    const INITIAL_ZOOM = 1.4;

    const MAX_ZOOM = 4;

    const MIN_ZOOM = 1;


    let zoomScale = 1;

    let panX = 0;

    let panY = 0;


    /* =========================================
       ポインター情報
    ========================================= */

    const activePointers =
      new Map();


    let pointerStartX = 0;

    let pointerStartY = 0;

    let pointerCurrentX = 0;

    let pointerCurrentY = 0;


    let isPointerDown = false;

    let isDragging = false;

    let isPinching = false;

    let tapCandidate = false;


    const SWIPE_DISTANCE = 35;

    const DRAG_DISTANCE = 8;


    let pinchStartDistance = 0;

    let pinchStartScale = 1;


    /* =========================================
       現在の画像を取得
    ========================================= */

    function getCurrentImage() {

      const images =
        document.querySelectorAll(
          ".slide img"
        );

      return images[currentPage];

    }


    /* =========================================
       拡大変形を反映
    ========================================= */

    function applyZoomTransform() {

      const image =
        getCurrentImage();


      if (!image) {
        return;
      }


      image.style.setProperty(
        "--zoom-scale",
        zoomScale
      );


      image.style.setProperty(
        "--pan-x",
        `${panX}px`
      );


      image.style.setProperty(
        "--pan-y",
        `${panY}px`
      );

    }


    /* =========================================
       拡大位置リセット
    ========================================= */

    function resetZoomPosition() {

      zoomScale =
        INITIAL_ZOOM;

      panX = 0;

      panY = 0;

      applyZoomTransform();

    }


    /* =========================================
       拡大モードON
    ========================================= */

    function enableZoomMode() {

      slider.classList.add(
        "zoom-mode"
      );


      resetZoomPosition();

    }


    /* =========================================
       拡大モードOFF
    ========================================= */

    function disableZoomMode() {

      slider.classList.remove(
        "zoom-mode"
      );


      zoomScale = 1;

      panX = 0;

      panY = 0;


      const images =
        document.querySelectorAll(
          ".slide img"
        );


      images.forEach(
        (image) => {

          image.style.removeProperty(
            "--zoom-scale"
          );

          image.style.removeProperty(
            "--pan-x"
          );

          image.style.removeProperty(
            "--pan-y"
          );

        }
      );

    }


    /* =========================================
       拡大モード切り替え
    ========================================= */

    function toggleZoomMode() {

      if (
        slider.classList.contains(
          "zoom-mode"
        )
      ) {

        disableZoomMode();

      }

      else {

        enableZoomMode();

      }

    }


    /* =========================================
       スライダー更新
    ========================================= */

    function updateSlider() {

      slides.style.transition =
        "transform 0.3s ease-out";


      slides.style.transform =
        `translate3d(-${currentPage * 100}%, 0, 0)`;


      /*
        拡大モード中にページを
        切り替えた場合は
        新しいページを中央に戻す
      */

      if (
        slider.classList.contains(
          "zoom-mode"
        )
      ) {

        resetZoomPosition();

      }

    }


    /* =========================================
       次のページ
    ========================================= */

    function nextPage() {

      if (
        currentPage <
        totalPages - 1
      ) {

        currentPage++;

      }

      else {

        currentPage = 0;

      }


      updateSlider();

    }


    /* =========================================
       前のページ
    ========================================= */

    function previousPage() {

      if (
        currentPage > 0
      ) {

        currentPage--;

      }

      else {

        currentPage =
          totalPages - 1;

      }


      updateSlider();

    }


    /* =========================================
       矢印ボタン

       ★ここは重複登録しない
       ★左 → previousPage
       ★右 → nextPage
    ========================================= */

    prevBtn.addEventListener(
      "click",
      (e) => {

        e.preventDefault();

        e.stopPropagation();

        previousPage();

      }
    );


    nextBtn.addEventListener(
      "click",
      (e) => {

        e.preventDefault();

        e.stopPropagation();

        nextPage();

      }
    );


    /*
      ボタン上でのpointerdownを
      スライダーの操作として扱わない
    */

    prevBtn.addEventListener(
      "pointerdown",
      (e) => {

        e.stopPropagation();

      }
    );


    nextBtn.addEventListener(
      "pointerdown",
      (e) => {

        e.stopPropagation();

      }
    );


    /* =========================================
       2本指間の距離
    ========================================= */

    function getPointerDistance() {

      const points =
        Array.from(
          activePointers.values()
        );


      if (
        points.length < 2
      ) {

        return 0;

      }


      const dx =
        points[0].x -
        points[1].x;


      const dy =
        points[0].y -
        points[1].y;


      return Math.sqrt(
        dx * dx +
        dy * dy
      );

    }


    /* =========================================
       拡大率を制限
    ========================================= */

    function clampZoom(value) {

      return Math.max(
        MIN_ZOOM,
        Math.min(
          MAX_ZOOM,
          value
        )
      );

    }


    /* =========================================
       画像移動範囲を制限
    ========================================= */

    function limitPan() {

      const baseSize =
        Math.min(
          slider.clientWidth,
          slider.clientHeight
        );


      const maxPan =
        Math.max(
          0,
          (zoomScale - 1) *
          baseSize *
          0.75
        );


      panX =
        Math.max(
          -maxPan,
          Math.min(
            maxPan,
            panX
          )
        );


      panY =
        Math.max(
          -maxPan,
          Math.min(
            maxPan,
            panY
          )
        );

    }


    /* =========================================
       pointerdown
    ========================================= */

    slider.addEventListener(
      "pointerdown",
      (e) => {

        /*
          ボタンなら無視
        */

        if (
          e.target.closest(
            ".slider-btn"
          )
        ) {

          return;

        }


        /*
          PCの場合は左クリックのみ
        */

        if (
          e.pointerType === "mouse" &&
          e.button !== 0
        ) {

          return;

        }


        activePointers.set(
          e.pointerId,
          {
            x: e.clientX,
            y: e.clientY
          }
        );


        try {

          slider.setPointerCapture(
            e.pointerId
          );

        }

        catch (error) {

          // 無視

        }


        /*
          2本指になった場合
          → ピンチ操作
        */

        if (
          activePointers.size >= 2 &&
          slider.classList.contains(
            "zoom-mode"
          )
        ) {

          isPinching = true;

          isDragging = false;

          tapCandidate = false;


          pinchStartDistance =
            getPointerDistance();


          pinchStartScale =
            zoomScale;


          return;

        }


        /*
          1本指
        */

        isPointerDown = true;

        isDragging = false;

        tapCandidate = true;


        pointerStartX =
          e.clientX;

        pointerStartY =
          e.clientY;

        pointerCurrentX =
          e.clientX;

        pointerCurrentY =
          e.clientY;

      }
    );


    /* =========================================
       pointermove
    ========================================= */

    slider.addEventListener(
      "pointermove",
      (e) => {

        /*
          ポインター位置更新
        */

        if (
          activePointers.has(
            e.pointerId
          )
        ) {

          activePointers.set(
            e.pointerId,
            {
              x: e.clientX,
              y: e.clientY
            }
          );

        }


        /* -------------------------------------
           ピンチ操作
        ------------------------------------- */

        if (
          isPinching &&
          activePointers.size >= 2
        ) {

          const distance =
            getPointerDistance();


          if (
            pinchStartDistance > 0
          ) {

            const ratio =
              distance /
              pinchStartDistance;


            zoomScale =
              clampZoom(
                pinchStartScale *
                ratio
              );


            limitPan();

            applyZoomTransform();

          }


          return;

        }


        /*
          1本指操作
        */

        if (
          !isPointerDown
        ) {

          return;

        }


        pointerCurrentX =
          e.clientX;

        pointerCurrentY =
          e.clientY;


        const deltaX =
          pointerCurrentX -
          pointerStartX;


        const deltaY =
          pointerCurrentY -
          pointerStartY;


        /* -------------------------------------
           拡大モード

           → 画像をドラッグ
        ------------------------------------- */

        if (
          slider.classList.contains(
            "zoom-mode"
          )
        ) {

          if (
            Math.abs(deltaX) >
              DRAG_DISTANCE ||
            Math.abs(deltaY) >
              DRAG_DISTANCE
          ) {

            isDragging = true;

            tapCandidate = false;

          }


          if (
            isDragging
          ) {

            panX += deltaX;

            panY += deltaY;


            pointerStartX =
              pointerCurrentX;

            pointerStartY =
              pointerCurrentY;


            limitPan();

            applyZoomTransform();

          }


          return;

        }


        /* -------------------------------------
           通常モード

           → 横スワイプ
        ------------------------------------- */

        if (
          Math.abs(deltaX) > 8 &&
          Math.abs(deltaX) >
            Math.abs(deltaY)
        ) {

          isDragging = true;

          tapCandidate = false;

        }


        if (
          isDragging
        ) {

          const sliderWidth =
            slider.clientWidth;


          if (
            sliderWidth <= 0
          ) {

            return;

          }


          let dragX =
            deltaX;


          const MAX_DRAG = 120;


          if (
            dragX > MAX_DRAG
          ) {

            dragX =
              MAX_DRAG;

          }


          if (
            dragX < -MAX_DRAG
          ) {

            dragX =
              -MAX_DRAG;

          }


          const basePercent =
            currentPage * -100;


          const dragPercent =
            (
              dragX /
              sliderWidth
            ) *
            100;


          slides.style.transition =
            "none";


          slides.style.transform =
            `translate3d(calc(${basePercent}% + ${dragPercent}%), 0, 0)`;

        }

      }
    );


    /* =========================================
       pointerup
    ========================================= */

    slider.addEventListener(
      "pointerup",
      (e) => {

        /*
          ポインターを削除
        */

        activePointers.delete(
          e.pointerId
        );


        /*
          ピンチ終了
        */

        if (
          isPinching
        ) {

          if (
            activePointers.size < 2
          ) {

            isPinching = false;

          }


          return;

        }


        if (
          !isPointerDown
        ) {

          return;

        }


        const deltaX =
          pointerCurrentX -
          pointerStartX;


        const deltaY =
          pointerCurrentY -
          pointerStartY;


        isPointerDown = false;


        /* -------------------------------------
           拡大モード
        ------------------------------------- */

        if (
          slider.classList.contains(
            "zoom-mode"
          )
        ) {

          /*
            指をほとんど動かしていなければ
            → 通常モードへ戻す
          */

          if (
            tapCandidate &&
            !isDragging &&
            Math.abs(deltaX) < 15 &&
            Math.abs(deltaY) < 15
          ) {

            disableZoomMode();

          }


          isDragging = false;

          tapCandidate = false;

          return;

        }


        /* -------------------------------------
           通常モード
        ------------------------------------- */

        const isHorizontalSwipe =
          Math.abs(deltaX) >=
            SWIPE_DISTANCE &&
          Math.abs(deltaX) >
            Math.abs(deltaY);


        if (
          isHorizontalSwipe
        ) {

          /*
            左へスワイプ
            → 次ページ
          */

          if (
            deltaX < 0
          ) {

            nextPage();

          }

          /*
            右へスワイプ
            → 前ページ
          */

          else {

            previousPage();

          }

        }

        else {

          /*
            タップ
            → 拡大モード
          */

          if (
            tapCandidate &&
            !isDragging
          ) {

            enableZoomMode();

          }


          updateSlider();

        }


        isDragging = false;

        tapCandidate = false;

      }
    );


    /* =========================================
       pointercancel
    ========================================= */

    slider.addEventListener(
      "pointercancel",
      (e) => {

        activePointers.delete(
          e.pointerId
        );


        isPointerDown = false;

        isDragging = false;

        isPinching = false;

        tapCandidate = false;


        updateSlider();

      }
    );


    /* =========================================
       画像のドラッグ防止
    ========================================= */

    document
      .querySelectorAll(
        ".slide img"
      )
      .forEach(
        (img) => {

          img.addEventListener(
            "dragstart",
            (e) => {

              e.preventDefault();

            }
          );

        }
      );


    /* =========================================
       キーボード操作
    ========================================= */

    document.addEventListener(
      "keydown",
      (e) => {

        /*
          左キー
          → 前ページ
        */

        if (
          e.key === "ArrowLeft"
        ) {

          e.preventDefault();

          previousPage();

        }


        /*
          右キー
          → 次ページ
        */

        if (
          e.key === "ArrowRight"
        ) {

          e.preventDefault();

          nextPage();

        }


        /*
          スペース
          → 拡大/通常切り替え
        */

        if (
          e.key === " "
        ) {

          e.preventDefault();

          toggleZoomMode();

        }

      }
    );


    /* =========================================
       初期表示

       ★通常モード
       ★拡大モードにはしない
    ========================================= */

    slider.classList.remove(
      "zoom-mode"
    );


    zoomScale = 1;

    panX = 0;

    panY = 0;


    updateSlider();

  </script>


</body>
</html>
