<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>文化祭（一般公開時）来校上のお願い | 長高祭</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>

    /* =========================================
       基本設定
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --main-color: #d96b8a;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;

      /* visitorページのみ上下左右スクロール禁止 */
      overflow: hidden;
    }

    body {
      background: #ffffff;
      font-family: "Yu Gothic", "Hiragino Sans", sans-serif;
    }


    /* =========================================
       ヘッダー
    ========================================= */

    #header {
      position: relative;
      z-index: 10000;
    }


    /* =========================================
       背景図形
    ========================================= */

    .bg-shapes {
      position: fixed;
      inset: 0;

      z-index: 0;

      pointer-events: none;

      overflow: hidden;

      opacity: 0.85;
    }

    .shape {
      position: absolute;
    }


    /* =========================================
       三角形
    ========================================= */

    .s1 {
      top: 5%;
      left: -50px;

      width: 0;
      height: 0;

      border-left: 90px solid transparent;
      border-right: 90px solid transparent;
      border-bottom: 170px solid #c85c72;

      transform: rotate(-25deg);
    }

    .s2 {
      top: 25%;
      left: -35px;

      width: 0;
      height: 0;

      border-left: 70px solid transparent;
      border-right: 70px solid transparent;
      border-bottom: 130px solid #8060a8;

      transform: rotate(20deg);
    }

    .s3 {
      bottom: 5%;
      left: -30px;

      width: 0;
      height: 0;

      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-bottom: 180px solid #d1a92f;

      transform: rotate(12deg);
    }

    .s4 {
      bottom: 28%;
      left: 20px;

      width: 0;
      height: 0;

      border-left: 60px solid transparent;
      border-right: 60px solid transparent;
      border-bottom: 120px solid #3f9da9;

      transform: rotate(-15deg);
    }

    .s5 {
      top: 12%;
      right: -80px;

      width: 0;
      height: 0;

      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-bottom: 260px solid #4f9fa5;

      transform: rotate(30deg);
    }

    .s6 {
      bottom: -40px;
      right: -30px;

      width: 0;
      height: 0;

      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-bottom: 190px solid #c85c72;

      transform: rotate(-15deg);
    }

    .s7 {
      top: 8%;
      right: 40px;

      width: 0;
      height: 0;

      border-left: 55px solid transparent;
      border-right: 55px solid transparent;
      border-bottom: 100px solid #8060a8;

      transform: rotate(35deg);
    }

    .s8 {
      bottom: 20%;
      right: 40px;

      width: 0;
      height: 0;

      border-left: 70px solid transparent;
      border-right: 70px solid transparent;
      border-bottom: 130px solid #d1a92f;

      transform: rotate(-20deg);
    }


    /* =========================================
       メイン
    ========================================= */

    .visitor-container {
      position: relative;

      z-index: 1;

      width: 100%;

      /*
        ヘッダーを除いた画面全体
      */
      height: calc(100vh - 70px);

      padding: 5px 0 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      overflow: hidden;
    }


    /* =========================================
       スライダー全体
    ========================================= */

    .slider-wrapper {
      width: 100%;
      height: 100%;

      max-width: 1400px;

      display: flex;

      flex-direction: column;

      align-items: center;

      overflow: hidden;
    }


    /* =========================================
       画像表示部分
    ========================================= */

    .slider {
      width: 100%;

      /*
        ボタンとページ番号を置くスペースを
        確保した上で残りを画像に使用
      */
      flex: 1;

      min-height: 0;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;
    }

    .slides {
      display: flex;

      width: 100%;
      height: 100%;

      transition: transform 0.45s ease;

      will-change: transform;
    }

    .slide {
      flex: 0 0 100%;

      width: 100%;
      height: 100%;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 0;
    }

    .slide img {
      display: block;

      /*
        画像を可能な限り大きく表示
      */
      width: 100%;
      height: 100%;

      max-width: 100%;
      max-height: 100%;

      /*
        元画像の比率を維持
        → 画像を切り抜かない
      */
      object-fit: contain;

      border-radius: 0;

      background: transparent;

      /*
        タップで拡大できることを示す
      */
      cursor: zoom-in;

      user-select: none;

      -webkit-user-select: none;

      -webkit-user-drag: none;
    }


    /* =========================================
       左右ボタン
       画像のすぐ下
    ========================================= */

    .slider-controls {
      width: 100%;

      flex-shrink: 0;

      height: 60px;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 30px;

      margin: 3px 0 2px;
    }

    .slider-btn {
      width: 52px;
      height: 52px;

      border: none;

      border-radius: 50%;

      background: #ffffff;

      color: var(--main-color);

      font-size: 30px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.15);

      display: flex;

      align-items: center;

      justify-content: center;

      transition: 0.2s;

      flex-shrink: 0;

      padding: 0;
    }

    .slider-btn:hover {
      transform: scale(1.08);
    }

    .slider-btn:active {
      transform: scale(0.95);
    }


    /* =========================================
       ページ番号
    ========================================= */

    .page-number {
      flex-shrink: 0;

      height: 32px;

      display: flex;

      align-items: center;

      justify-content: center;

      margin: 0 0 2px;

      color: var(--main-color);

      font-size: 24px;

      font-weight: bold;

      letter-spacing: 2px;
    }


    /* =========================================
       拡大表示
    ========================================= */

    .image-modal {
      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      background: rgba(0, 0, 0, 0.9);

      z-index: 99999;

      display: none;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      cursor: zoom-out;
    }

    .image-modal.active {
      display: flex;
    }

    .image-modal img {
      display: block;

      width: auto;
      height: auto;

      max-width: 100vw;
      max-height: 100vh;

      object-fit: contain;

      cursor: zoom-out;

      user-select: none;

      -webkit-user-select: none;

      -webkit-user-drag: none;
    }


    /* =========================================
       スマホ
    ========================================= */

    @media (max-width: 768px) {

      .visitor-container {
        height: calc(100vh - 60px);

        padding: 0;

        overflow: hidden;
      }

      .slider-wrapper {
        height: 100%;

        overflow: hidden;
      }

      .slider {
        flex: 1;

        min-height: 0;

        width: 100%;

        overflow: hidden;
      }

      .slide {
        width: 100%;
        height: 100%;

        padding: 0;
      }

      .slide img {
        width: 100%;
        height: 100%;

        max-width: 100%;
        max-height: 100%;

        object-fit: contain;
      }


      /* 画像のすぐ下にボタン */

      .slider-controls {
        height: 54px;

        gap: 20px;

        margin: 2px 0 0;
      }

      .slider-btn {
        width: 48px;
        height: 48px;

        font-size: 27px;
      }


      /* ページ番号 */

      .page-number {
        height: 27px;

        font-size: 21px;

        margin: 0;
      }

    }


    /* =========================================
       横向きスマホ
    ========================================= */

    @media (max-width: 768px) and (orientation: landscape) {

      .visitor-container {
        height: calc(100vh - 55px);
      }

      .slider-controls {
        height: 44px;

        margin: 1px 0 0;
      }

      .slider-btn {
        width: 40px;
        height: 40px;

        font-size: 23px;
      }

      .page-number {
        height: 22px;

        font-size: 17px;
      }

    }

  </style>
</head>


<body>

  <!-- =========================================
       共通ヘッダー
  ========================================= -->

  <div id="header"></div>


  <script>

    fetch("header.html")
      .then(res => res.text())
      .then(data => {

        document.getElementById("header").innerHTML = data;

        const btn =
          document.querySelector(".menu-btn");

        const nav =
          document.querySelector(".nav");


        if (btn && nav) {

          btn.addEventListener("click", (e) => {

            e.stopPropagation();

            nav.classList.toggle("active");

          });


          document.addEventListener("click", (e) => {

            if (
              !nav.contains(e.target) &&
              !btn.contains(e.target)
            ) {

              nav.classList.remove("active");

            }

          });

        }

      });

  </script>


  <!-- =========================================
       背景図形
  ========================================= -->

  <div class="bg-shapes">

    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="shape s4"></div>
    <div class="shape s5"></div>
    <div class="shape s6"></div>
    <div class="shape s7"></div>
    <div class="shape s8"></div>

  </div>


  <!-- =========================================
       メイン
  ========================================= -->

  <main class="visitor-container">

    <div class="slider-wrapper">


      <!-- =====================================
           画像
      ====================================== -->

      <div class="slider">

        <div
          class="slides"
          id="slides"
        >

          <!-- 1枚目 -->

          <div class="slide">

            <img
              src="images/visitor1.jpeg"
              alt="来校案内 1ページ目"
            >

          </div>


          <!-- 2枚目 -->

          <div class="slide">

            <img
              src="images/visitor2.jpeg"
              alt="来校案内 2ページ目"
            >

          </div>


          <!-- 3枚目 -->

          <div class="slide">

            <img
              src="images/visitor3.jpeg"
              alt="来校案内 3ページ目"
            >

          </div>


          <!-- 4枚目 -->

          <div class="slide">

            <img
              src="images/visitor4.jpeg"
              alt="来校案内 4ページ目"
            >

          </div>


          <!-- 5枚目 -->

          <div class="slide">

            <img
              src="images/visitor5.jpeg"
              alt="来校案内 5ページ目"
            >

          </div>


          <!-- 6枚目 -->

          <div class="slide">

            <img
              src="images/visitor6.jpeg"
              alt="来校案内 6ページ目"
            >

          </div>

        </div>

      </div>


      <!-- =====================================
           左右ボタン
      ====================================== -->

      <div class="slider-controls">

        <button
          class="slider-btn"
          id="prevBtn"
          aria-label="前のページ"
        >
          ‹
        </button>


        <button
          class="slider-btn"
          id="nextBtn"
          aria-label="次のページ"
        >
          ›
        </button>

      </div>


      <!-- =====================================
           ページ番号
      ====================================== -->

      <div
        class="page-number"
        id="pageNumber"
      >
        1 / 6
      </div>


    </div>

  </main>


  <!-- =========================================
       拡大表示用
  ========================================= -->

  <div
    class="image-modal"
    id="imageModal"
  >

    <img
      id="modalImage"
      src=""
      alt="拡大表示"
    >

  </div>


  <!-- =========================================
       JavaScript
  ========================================= -->

  <script>

    /* =========================================
       要素取得
    ========================================= */

    const slides =
      document.getElementById("slides");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const pageNumber =
      document.getElementById("pageNumber");

    const imageModal =
      document.getElementById("imageModal");

    const modalImage =
      document.getElementById("modalImage");


    /* =========================================
       ページ数
    ========================================= */

    const totalPages = 6;


    /* =========================================
       現在のページ
    ========================================= */

    let currentPage = 0;


    /* =========================================
       スライダー更新
    ========================================= */

    function updateSlider() {

      /*
        1ページ = 100%
      */

      slides.style.transform =
        `translateX(-${currentPage * 100}%)`;


      /*
        ページ番号
      */

      pageNumber.textContent =
        `${currentPage + 1} / ${totalPages}`;

    }


    /* =========================================
       次のページ
    ========================================= */

    nextBtn.addEventListener("click", () => {

      if (currentPage < totalPages - 1) {

        currentPage++;

      } else {

        currentPage = 0;

      }

      updateSlider();

    });


    /* =========================================
       前のページ
    ========================================= */

    prevBtn.addEventListener("click", () => {

      if (currentPage > 0) {

        currentPage--;

      } else {

        currentPage = totalPages - 1;

      }

      updateSlider();

    });


    /* =========================================
       スワイプ
    ========================================= */

    let touchStartX = 0;

    let touchEndX = 0;


    slides.addEventListener(
      "touchstart",
      (e) => {

        touchStartX =
          e.changedTouches[0].screenX;

      },
      {
        passive: true
      }
    );


    slides.addEventListener(
      "touchend",
      (e) => {

        touchEndX =
          e.changedTouches[0].screenX;


        const difference =
          touchStartX - touchEndX;


        /* 左スワイプ */

        if (difference > 50) {

          if (currentPage < totalPages - 1) {

            currentPage++;

          } else {

            currentPage = 0;

          }

          updateSlider();

        }


        /* 右スワイプ */

        else if (difference < -50) {

          if (currentPage > 0) {

            currentPage--;

          } else {

            currentPage = totalPages - 1;

          }

          updateSlider();

        }

      },
      {
        passive: true
      }
    );


    /* =========================================
       画像タップ → 拡大
    ========================================= */

    document
      .querySelectorAll(".slide img")
      .forEach(img => {

        img.addEventListener("click", () => {

          modalImage.src = img.src;

          imageModal.classList.add("active");

        });

      });


    /* =========================================
       拡大画像タップ → 閉じる
    ========================================= */

    imageModal.addEventListener(
      "click",
      () => {

        imageModal.classList.remove("active");

        modalImage.src = "";

      }
    );


    /* =========================================
       ESCキー → 閉じる
    ========================================= */

    document.addEventListener(
      "keydown",
      (e) => {

        if (
          e.key === "Escape" &&
          imageModal.classList.contains("active")
        ) {

          imageModal.classList.remove("active");

          modalImage.src = "";

        }

      }
    );


    /* =========================================
       初期表示
    ========================================= */

    updateSlider();

  </script>

</body>
</html>
