<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>文化祭（一般公開時）来校上のお願い | 長高祭</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="css/style.css">

  <style>

    /* =========================================
       基本設定
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --main-color: #d96b8a;
    }

    html,
    body {
      width: 100%;
      height: 100%;

      margin: 0;
      padding: 0;

      /*
        visitorページでは
        縦・横スクロールを完全に禁止
      */
      overflow: hidden;

      overscroll-behavior: none;
    }

    body {
      background: #ffffff;

      font-family:
        "Yu Gothic",
        "Hiragino Sans",
        sans-serif;

      /*
        iPhone等での
        不要なスクロール操作を防止
      */
      touch-action: none;
    }


    /* =========================================
       ヘッダー
    ========================================= */

    #header {
      position: relative;

      z-index: 10000;

      width: 100%;
    }


    /* =========================================
       背景図形
    ========================================= */

    .bg-shapes {

      position: fixed;

      inset: 0;

      z-index: 0;

      pointer-events: none;

      overflow: hidden;

      opacity: 0.85;
    }

    .shape {
      position: absolute;
    }


    /* =========================================
       三角形
    ========================================= */

    .s1 {
      top: 5%;
      left: -50px;

      width: 0;
      height: 0;

      border-left: 90px solid transparent;
      border-right: 90px solid transparent;
      border-bottom: 170px solid #c85c72;

      transform: rotate(-25deg);
    }

    .s2 {
      top: 25%;
      left: -35px;

      width: 0;
      height: 0;

      border-left: 70px solid transparent;
      border-right: 70px solid transparent;
      border-bottom: 130px solid #8060a8;

      transform: rotate(20deg);
    }

    .s3 {
      bottom: 5%;
      left: -30px;

      width: 0;
      height: 0;

      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-bottom: 180px solid #d1a92f;

      transform: rotate(12deg);
    }

    .s4 {
      bottom: 28%;
      left: 20px;

      width: 0;
      height: 0;

      border-left: 60px solid transparent;
      border-right: 60px solid transparent;
      border-bottom: 120px solid #3f9da9;

      transform: rotate(-15deg);
    }

    .s5 {
      top: 12%;
      right: -80px;

      width: 0;
      height: 0;

      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-bottom: 260px solid #4f9fa5;

      transform: rotate(30deg);
    }

    .s6 {
      bottom: -40px;
      right: -30px;

      width: 0;
      height: 0;

      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-bottom: 190px solid #c85c72;

      transform: rotate(-15deg);
    }

    .s7 {
      top: 8%;
      right: 40px;

      width: 0;
      height: 0;

      border-left: 55px solid transparent;
      border-right: 55px solid transparent;
      border-bottom: 100px solid #8060a8;

      transform: rotate(35deg);
    }

    .s8 {
      bottom: 20%;
      right: 40px;

      width: 0;
      height: 0;

      border-left: 70px solid transparent;
      border-right: 70px solid transparent;
      border-bottom: 130px solid #d1a92f;

      transform: rotate(-20deg);
    }


    /* =========================================
       メイン
    ========================================= */

    .visitor-container {

      position: relative;

      z-index: 1;

      width: 100%;

      /*
        ヘッダー以外の部分を
        画面いっぱいに使用
      */
      height: calc(100vh - 70px);

      min-height: 0;

      padding: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: flex-start;

      overflow: hidden;
    }


    /* =========================================
       スライダー全体
    ========================================= */

    .slider-wrapper {

      width: 100%;

      height: 100%;

      min-height: 0;

      max-width: 1400px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: flex-start;

      overflow: hidden;
    }


    /* =========================================
       画像表示部分
    ========================================= */

    .slider {

      /*
        画像エリアだけが
        残った高さを使う
      */

      width: 100%;

      flex: 1 1 auto;

      min-height: 0;

      display: flex;

      justify-content: center;

      align-items: flex-start;

      overflow: hidden;

      /*
        横スワイプを優先
      */
      touch-action: none;
    }


    /* =========================================
       スライド本体
    ========================================= */

    .slides {

      display: flex;

      width: 100%;

      height: 100%;

      flex-shrink: 0;

      transition:
        transform 0.35s ease-out;

      will-change: transform;

      touch-action: none;
    }


    /* =========================================
       各ページ
    ========================================= */

    .slide {

      flex: 0 0 100%;

      width: 100%;

      height: 100%;

      display: flex;

      justify-content: center;

      align-items: flex-start;

      padding: 0;

      touch-action: none;
    }


    /* =========================================
       画像
    ========================================= */

    .slide img {

      display: block;

      /*
        横幅を最大限使用
      */
      width: 100%;

      /*
        高さは画像の比率を維持
      */
      height: auto;

      /*
        画面に収まらない場合のみ
        高さを制限
      */
      max-width: 100%;

      max-height: 100%;

      object-fit: contain;

      border-radius: 0;

      background: transparent;

      /*
        タップで拡大できる
      */
      cursor: zoom-in;

      user-select: none;

      -webkit-user-select: none;

      -webkit-user-drag: none;

      /*
        スワイプを優先
      */
      touch-action: none;
    }


    /* =========================================
       左右ボタン
       画像のすぐ下
    ========================================= */

    .slider-controls {

      /*
        絶対に画像エリアの中へ
        入らない
      */
      flex-shrink: 0;

      width: 100%;

      height: 62px;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 30px;

      margin: 0;

      padding: 4px 0;

      position: relative;

      z-index: 10;
    }


    /* =========================================
       ボタン
    ========================================= */

    .slider-btn {

      width: 54px;

      height: 54px;

      padding: 0;

      border: none;

      border-radius: 50%;

      background: #ffffff;

      color: var(--main-color);

      font-size: 32px;

      font-weight: bold;

      line-height: 1;

      cursor: pointer;

      box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.18);

      display: flex;

      align-items: center;

      justify-content: center;

      flex-shrink: 0;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;

      transition:
        transform 0.15s ease;
    }

    .slider-btn:hover {
      transform: scale(1.08);
    }

    .slider-btn:active {
      transform: scale(0.92);
    }


    /* =========================================
       ページ番号
    ========================================= */

    .page-number {

      flex-shrink: 0;

      height: 36px;

      display: flex;

      align-items: center;

      justify-content: center;

      margin: 0;

      padding: 0;

      color: var(--main-color);

      font-size: 24px;

      font-weight: bold;

      letter-spacing: 2px;

      line-height: 1;

      position: relative;

      z-index: 10;
    }


    /* =========================================
       拡大表示
    ========================================= */

    .image-modal {

      position: fixed;

      inset: 0;

      width: 100vw;

      height: 100vh;

      background: rgba(0, 0, 0, 0.92);

      z-index: 99999;

      display: none;

      align-items: center;

      justify-content: center;

      overflow: hidden;

      cursor: zoom-out;

      touch-action: none;
    }


    .image-modal.active {
      display: flex;
    }


    .image-modal img {

      display: block;

      width: auto;

      height: auto;

      max-width: 100vw;

      max-height: 100vh;

      object-fit: contain;

      cursor: zoom-out;

      user-select: none;

      -webkit-user-select: none;

      -webkit-user-drag: none;

      touch-action: none;
    }


    /* =========================================
       スマホ
    ========================================= */

    @media (max-width: 768px) {

      .visitor-container {

        /*
          ヘッダーの高さだけ除外
        */
        height: calc(100vh - 60px);

        padding: 0;

        overflow: hidden;
      }


      .slider-wrapper {

        width: 100%;

        height: 100%;

        overflow: hidden;
      }


      .slider {

        width: 100%;

        flex: 1 1 auto;

        min-height: 0;

        overflow: hidden;

        align-items: flex-start;
      }


      .slides {

        height: 100%;

        transition:
          transform 0.3s ease-out;
      }


      .slide {

        width: 100%;

        height: 100%;

        align-items: flex-start;

        padding: 0;
      }


      .slide img {

        width: 100%;

        height: auto;

        max-width: 100%;

        max-height: 100%;

        object-fit: contain;
      }


      /* -----------------------------------------
         スマホのボタン
      ----------------------------------------- */

      .slider-controls {

        height: 58px;

        gap: 22px;

        margin: 0;

        padding: 3px 0;
      }


      .slider-btn {

        width: 50px;

        height: 50px;

        font-size: 28px;
      }


      /* -----------------------------------------
         ページ番号
      ----------------------------------------- */

      .page-number {

        height: 32px;

        font-size: 21px;

        margin: 0;
      }

    }


    /* =========================================
       横向きスマホ
    ========================================= */

    @media (max-width: 768px) and (orientation: landscape) {

      .visitor-container {

        height: calc(100vh - 55px);
      }


      .slider-controls {

        height: 46px;

        gap: 18px;
      }


      .slider-btn {

        width: 40px;

        height: 40px;

        font-size: 23px;
      }


      .page-number {

        height: 24px;

        font-size: 17px;
      }

    }


    /* =========================================
       非常に小さい画面
    ========================================= */

    @media (max-height: 650px) {

      .slider-controls {

        height: 50px;
      }

      .slider-btn {

        width: 44px;

        height: 44px;

        font-size: 25px;
      }

      .page-number {

        height: 28px;

        font-size: 19px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================================
       共通ヘッダー
  ========================================= -->

  <div id="header"></div>


  <script>

    fetch("header.html")
      .then(res => res.text())
      .then(data => {

        document.getElementById("header").innerHTML = data;

        const btn =
          document.querySelector(".menu-btn");

        const nav =
          document.querySelector(".nav");


        if (btn && nav) {

          btn.addEventListener("click", (e) => {

            e.stopPropagation();

            nav.classList.toggle("active");

          });


          document.addEventListener("click", (e) => {

            if (
              !nav.contains(e.target) &&
              !btn.contains(e.target)
            ) {

              nav.classList.remove("active");

            }

          });

        }

      });

  </script>


  <!-- =========================================
       背景図形
  ========================================= -->

  <div class="bg-shapes">

    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="shape s4"></div>
    <div class="shape s5"></div>
    <div class="shape s6"></div>
    <div class="shape s7"></div>
    <div class="shape s8"></div>

  </div>


  <!-- =========================================
       メイン
  ========================================= -->

  <main class="visitor-container">

    <div class="slider-wrapper">


      <!-- =====================================
           画像
      ====================================== -->

      <div
        class="slider"
        id="slider"
      >

        <div
          class="slides"
          id="slides"
        >


          <!-- ================================
               1ページ目
          ================================= -->

          <div class="slide">

            <img
              src="images/visitor1.jpeg"
              alt="来校案内 1ページ目"
              draggable="false"
            >

          </div>


          <!-- ================================
               2ページ目
          ================================= -->

          <div class="slide">

            <img
              src="images/visitor2.jpeg"
              alt="来校案内 2ページ目"
              draggable="false"
            >

          </div>


          <!-- ================================
               3ページ目
          ================================= -->

          <div class="slide">

            <img
              src="images/visitor3.jpeg"
              alt="来校案内 3ページ目"
              draggable="false"
            >

          </div>


          <!-- ================================
               4ページ目
          ================================= -->

          <div class="slide">

            <img
              src="images/visitor4.jpeg"
              alt="来校案内 4ページ目"
              draggable="false"
            >

          </div>


          <!-- ================================
               5ページ目
          ================================= -->

          <div class="slide">

            <img
              src="images/visitor5.jpeg"
              alt="来校案内 5ページ目"
              draggable="false"
            >

          </div>


          <!-- ================================
               6ページ目
          ================================= -->

          <div class="slide">

            <img
              src="images/visitor6.jpeg"
              alt="来校案内 6ページ目"
              draggable="false"
            >

          </div>


        </div>

      </div>


      <!-- =====================================
           左右ボタン
           ※画像の直下
      ====================================== -->

      <div class="slider-controls">

        <button
          type="button"
          class="slider-btn"
          id="prevBtn"
          aria-label="前のページ"
        >
          ‹
        </button>


        <button
          type="button"
          class="slider-btn"
          id="nextBtn"
          aria-label="次のページ"
        >
          ›
        </button>

      </div>


      <!-- =====================================
           ページ番号
      ====================================== -->

      <div
        class="page-number"
        id="pageNumber"
      >
        1 / 6
      </div>


    </div>

  </main>


  <!-- =========================================
       拡大表示
  ========================================= -->

  <div
    class="image-modal"
    id="imageModal"
  >

    <img
      id="modalImage"
      src=""
      alt="拡大表示"
      draggable="false"
    >

  </div>


  <!-- =========================================
       JavaScript
  ========================================= -->

  <script>

    /* =========================================
       要素取得
    ========================================= */

    const slider =
      document.getElementById("slider");

    const slides =
      document.getElementById("slides");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const pageNumber =
      document.getElementById("pageNumber");

    const imageModal =
      document.getElementById("imageModal");

    const modalImage =
      document.getElementById("modalImage");


    /* =========================================
       ページ数
    ========================================= */

    const totalPages = 6;


    /* =========================================
       現在のページ
    ========================================= */

    let currentPage = 0;


    /* =========================================
       スライダー更新
    ========================================= */

    function updateSlider() {

      slides.style.transform =
        `translate3d(-${currentPage * 100}%, 0, 0)`;


      pageNumber.textContent =
        `${currentPage + 1} / ${totalPages}`;

    }


    /* =========================================
       次のページ
    ========================================= */

    function nextPage() {

      if (currentPage < totalPages - 1) {

        currentPage++;

      } else {

        currentPage = 0;

      }

      updateSlider();

    }


    /* =========================================
       前のページ
    ========================================= */

    function previousPage() {

      if (currentPage > 0) {

        currentPage--;

      } else {

        currentPage = totalPages - 1;

      }

      updateSlider();

    }


    /* =========================================
       ボタン
    ========================================= */

    nextBtn.addEventListener(
      "click",
      (e) => {

        e.preventDefault();

        e.stopPropagation();

        nextPage();

      }
    );


    prevBtn.addEventListener(
      "click",
      (e) => {

        e.preventDefault();

        e.stopPropagation();

        previousPage();

      }
    );


    /* =========================================
       スワイプ
       
       Pointer Eventsを使用して
       iPhone / Android / PCに対応
    ========================================= */

    let pointerStartX = 0;

    let pointerStartY = 0;

    let pointerCurrentX = 0;

    let pointerCurrentY = 0;

    let isPointerDown = false;

    let isDragging = false;

    let swipeHandled = false;


    /*
      スワイプ判定距離

      以前の50pxより小さくして
      反応を良くする
    */

    const SWIPE_DISTANCE = 35;


    /*
      スワイプ中に
      現在位置を少し追従させるための値
    */

    const MAX_DRAG = 120;


    /* =========================================
       pointerdown
    ========================================= */

    slider.addEventListener(
      "pointerdown",
      (e) => {

        /*
          左クリック以外を無視
        */

        if (
          e.pointerType === "mouse" &&
          e.button !== 0
        ) {
          return;
        }


        isPointerDown = true;

        isDragging = false;

        swipeHandled = false;


        pointerStartX = e.clientX;

        pointerStartY = e.clientY;

        pointerCurrentX = e.clientX;

        pointerCurrentY = e.clientY;


        /*
          指を離しても
          sliderがイベントを受け取れるようにする
        */

        try {
          slider.setPointerCapture(e.pointerId);
        } catch (error) {
          // 必要ない場合は無視
        }


        /*
          アニメーションを一時停止
        */

        slides.style.transition = "none";

      }
    );


    /* =========================================
       pointermove
    ========================================= */

    slider.addEventListener(
      "pointermove",
      (e) => {

        if (!isPointerDown) {
          return;
        }


        pointerCurrentX = e.clientX;

        pointerCurrentY = e.clientY;


        const deltaX =
          pointerCurrentX - pointerStartX;

        const deltaY =
          pointerCurrentY - pointerStartY;


        /*
          横方向への移動が
          縦方向より大きい場合
          → スワイプ開始
        */

        if (
          Math.abs(deltaX) > 8 &&
          Math.abs(deltaX) > Math.abs(deltaY)
        ) {

          isDragging = true;

        }


        /*
          スワイプ中なら
          少しだけ画像を指についてこさせる
        */

        if (isDragging) {

          let dragX = deltaX;


          /*
            引っ張りすぎ防止
          */

          if (dragX > MAX_DRAG) {
            dragX = MAX_DRAG;
          }

          if (dragX < -MAX_DRAG) {
            dragX = -MAX_DRAG;
          }


          const basePercent =
            currentPage * -100;


          /*
            現在のページ位置
            ＋ 指の移動量
          */

          const sliderWidth =
            slider.clientWidth;


          if (sliderWidth > 0) {

            const dragPercent =
              (dragX / sliderWidth) * 100;


            slides.style.transform =
              `translate3d(calc(${basePercent}% + ${dragPercent}%), 0, 0)`;

          }

        }

      }
    );


    /* =========================================
       pointerup
    ========================================= */

    slider.addEventListener(
      "pointerup",
      (e) => {

        if (!isPointerDown) {
          return;
        }


        const deltaX =
          pointerCurrentX - pointerStartX;

        const deltaY =
          pointerCurrentY - pointerStartY;


        isPointerDown = false;


        /*
          アニメーションを戻す
        */

        slides.style.transition =
          "transform 0.3s ease-out";


        /*
          横方向のスワイプか判定
        */

        const isHorizontalSwipe =
          Math.abs(deltaX) >= SWIPE_DISTANCE &&
          Math.abs(deltaX) > Math.abs(deltaY);


        if (isHorizontalSwipe) {

          /*
            左へスワイプ
            → 次のページ
          */

          if (deltaX < 0) {

            nextPage();

          }


          /*
            右へスワイプ
            → 前のページ
          */

          else {

            previousPage();

          }


          /*
            画像タップによる
            拡大を防止
          */

          swipeHandled = true;

          isDragging = false;


          /*
            念のため
            正しい位置へ戻す
          */

          updateSlider();

        }


        else {

          /*
            スワイプではなかった
            → 元の位置へ戻す
          */

          isDragging = false;

          updateSlider();

        }

      }
    );


    /* =========================================
       pointercancel
    ========================================= */

    slider.addEventListener(
      "pointercancel",
      () => {

        isPointerDown = false;

        isDragging = false;

        slides.style.transition =
          "transform 0.3s ease-out";

        updateSlider();

      }
    );


    /* =========================================
       画像タップ → 拡大
       
       スワイプした場合は
       拡大しない
    ========================================= */

    document
      .querySelectorAll(".slide img")
      .forEach((img) => {

        img.addEventListener(
          "click",
          (e) => {

            /*
              スワイプ直後の
              誤クリックを防止
            */

            if (swipeHandled) {

              swipeHandled = false;

              e.preventDefault();

              return;

            }


            /*
              画像をモーダルへ
            */

            modalImage.src =
              img.src;

            imageModal.classList.add(
              "active"
            );

          }
        );

      });


    /* =========================================
       拡大表示を閉じる
    ========================================= */

    imageModal.addEventListener(
      "click",
      () => {

        imageModal.classList.remove(
          "active"
        );

        modalImage.src = "";

      }
    );


    /* =========================================
       ESCキー
    ========================================= */

    document.addEventListener(
      "keydown",
      (e) => {

        if (
          e.key === "Escape" &&
          imageModal.classList.contains("active")
        ) {

          imageModal.classList.remove(
            "active"
          );

          modalImage.src = "";

        }

      }
    );


    /* =========================================
       初期表示
    ========================================= */

    updateSlider();

  </script>

</body>
</html>
