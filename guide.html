<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>文化祭（一般公開時）来校上のお願い | 長高祭</title>

  <!-- 共通CSS -->
  <link rel="stylesheet" href="css/style.css">


  <style>

    /* =========================================
       基本設定
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    :root {
      --main-color: #d96b8a;
    }


    html,
    body {

      width: 100%;

      min-height: 100%;

      margin: 0;
      padding: 0;

      overflow-x: hidden;
      overflow-y: auto;

      overscroll-behavior-x: none;

    }


    body {

      background: #ffffff;

      font-family:
        "Yu Gothic",
        "Hiragino Sans",
        sans-serif;

      /*
        重要：

        ブラウザにタッチ操作を勝手に
        スクロール・ズーム処理させず、
        このページではJS側で操作を管理する。
      */
      touch-action: none;

      -webkit-user-select: none;
      user-select: none;

    }


    /* =========================================
       ヘッダー
    ========================================= */

    #header {

      position: relative;

      z-index: 10000;

      width: 100%;

      /*
        ヘッダー自体は通常操作可能
      */
      touch-action: manipulation;

      -webkit-user-select: none;
      user-select: none;

    }


    /* =========================================
       背景図形
    ========================================= */

    .bg-shapes {

      position: fixed;

      inset: 0;

      z-index: 0;

      pointer-events: none;

      overflow: hidden;

      opacity: 0.85;

    }


    .shape {
      position: absolute;
    }


    /* =========================================
       三角形
    ========================================= */

    .s1 {

      top: 5%;
      left: -50px;

      width: 0;
      height: 0;

      border-left: 90px solid transparent;
      border-right: 90px solid transparent;
      border-bottom: 170px solid #c85c72;

      transform: rotate(-25deg);

    }


    .s2 {

      top: 25%;
      left: -35px;

      width: 0;
      height: 0;

      border-left: 70px solid transparent;
      border-right: 70px solid transparent;
      border-bottom: 130px solid #8060a8;

      transform: rotate(20deg);

    }


    .s3 {

      bottom: 5%;
      left: -30px;

      width: 0;
      height: 0;

      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-bottom: 180px solid #d1a92f;

      transform: rotate(12deg);

    }


    .s4 {

      bottom: 28%;
      left: 20px;

      width: 0;
      height: 0;

      border-left: 60px solid transparent;
      border-right: 60px solid transparent;
      border-bottom: 120px solid #3f9da9;

      transform: rotate(-15deg);

    }


    .s5 {

      top: 12%;
      right: -80px;

      width: 0;
      height: 0;

      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-bottom: 260px solid #4f9fa5;

      transform: rotate(30deg);

    }


    .s6 {

      bottom: -40px;
      right: -30px;

      width: 0;
      height: 0;

      border-left: 100px solid transparent;
      border-right: 100px solid transparent;
      border-bottom: 190px solid #c85c72;

      transform: rotate(-15deg);

    }


    .s7 {

      top: 8%;
      right: 40px;

      width: 0;
      height: 0;

      border-left: 55px solid transparent;
      border-right: 55px solid transparent;
      border-bottom: 100px solid #8060a8;

      transform: rotate(35deg);

    }


    .s8 {

      bottom: 20%;
      right: 40px;

      width: 0;
      height: 0;

      border-left: 70px solid transparent;
      border-right: 70px solid transparent;
      border-bottom: 130px solid #d1a92f;

      transform: rotate(-20deg);

    }


    /* =========================================
       メイン
    ========================================= */

    .visitor-container {

      position: relative;

      z-index: 1;

      width: 100%;

      height: auto;

      min-height: 0;

      padding: 0;

      margin-top: 0;

      display: flex;

      flex-direction: column;

      align-items: center;

      overflow: visible;

    }


    /* =========================================
       スライダー全体
    ========================================= */

    .slider-wrapper {

      position: relative;

      width: 100%;

      height: auto;

      min-height: 0;

      max-width: 1400px;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: flex-start;

      overflow: visible;

    }


    /* =========================================
       画像エリア
    ========================================= */

    .slider {

      position: relative;

      width: 100%;

      height: auto;

      flex: none;

      min-height: 0;

      overflow: visible;

      /*
        ★重要

        touch-action:none にすることで、
        ピンチ中にSafariが勝手に
        gesture / pointercancel を発生させる
        ことを防ぐ。

        縦スクロールはJSで処理する。
      */
      touch-action: none;

      -webkit-user-select: none;
      user-select: none;

      -webkit-touch-callout: none;

      overscroll-behavior: none;

    }


    /* =========================================
       スライド全体
    ========================================= */

    .slides {

      display: flex;

      width: 100%;

      height: auto;

      flex-shrink: 0;

      transition:
        transform 0.3s ease-out;

      will-change: transform;

      /*
        slides自身もブラウザの
        タッチ操作を受けない
      */
      touch-action: none;

    }


    /* =========================================
       各ページ
    ========================================= */

    .slide {

      position: relative;

      flex: 0 0 100%;

      width: 100%;

      min-height: calc(
        100vh - var(--header-height, 70px)
      );

      height: auto;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 0;

      overflow: visible;

      touch-action: none;

    }


    /* =========================================
       画像
    ========================================= */

    .slide img {

      display: block;

      width: 100%;

      height: auto;

      max-width: none;

      max-height: none;

      object-fit: contain;

      object-position: center center;

      border-radius: 0;

      background: transparent;

      cursor: default;

      user-select: none;

      -webkit-user-select: none;

      -webkit-user-drag: none;

      -webkit-touch-callout: none;

      /*
        ★重要
        画像自身もブラウザへ
        タッチ操作を渡さない
      */
      touch-action: none;

      transform:
        translate3d(0, 0, 0)
        scale(1);

      transform-origin: center center;

      will-change: transform;

      transition: none;

    }


    /* =========================================
       左右ボタン
    ========================================= */

    .slider-controls {

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;

      height: 100%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0;

      pointer-events: none;

      z-index: 100;

    }


    /* =========================================
       ボタン本体
    ========================================= */

    .slider-btn {

      width: auto;

      height: auto;

      min-width: 52px;

      min-height: 90px;

      padding: 0 6px;

      margin: 0;

      border: none;

      border-radius: 0;

      background: transparent;

      color: var(--main-color);

      font-size: 76px;

      font-family:
        Arial,
        "Helvetica Neue",
        sans-serif;

      font-weight: 300;

      line-height: 1;

      cursor: pointer;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-shrink: 0;

      pointer-events: auto;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;

      box-shadow: none;

      outline: none;

      text-shadow:
        0 2px 6px rgba(255, 255, 255, 0.85);

      transition:
        transform 0.12s ease,
        opacity 0.12s ease;

    }


    .slider-btn:hover {

      background: transparent;

      box-shadow: none;

      transform: scale(1.08);

    }


    .slider-btn:active {

      background: transparent;

      box-shadow: none;

      transform: scale(0.9);

    }


    .slider-btn:focus {

      outline: none;

      background: transparent;

    }


    /* =========================================
       スマホ
    ========================================= */

    @media (max-width: 768px) {

      .visitor-container {

        height: auto;

        min-height: 0;

        padding: 0;

        overflow: visible;

      }


      .slider-wrapper {

        width: 100%;

        height: auto;

        min-height: 0;

        overflow: visible;

      }


      .slider {

        width: 100%;

        height: auto;

        flex: none;

        min-height: 0;

        overflow: visible;

        touch-action: none;

      }


      .slides {

        width: 100%;

        height: auto;

        transition:
          transform 0.3s ease-out;

        touch-action: none;

      }


      .slide {

        width: 100%;

        min-height: calc(
          100vh - var(--header-height, 60px)
        );

        height: auto;

        align-items: center;

        justify-content: center;

        padding: 0;

        overflow: visible;

        touch-action: none;

      }


      .slide img {

        width: 100%;

        height: auto;

        max-width: none;

        max-height: none;

        object-fit: contain;

        object-position: center center;

        touch-action: none;

        transition: none;

      }


      .slider-controls {

        width: 100%;

        height: 100%;

        padding: 0;

      }


      .slider-btn {

        min-width: 44px;

        min-height: 76px;

        padding: 0 3px;

        font-size: 62px;

        font-weight: 300;

        text-shadow:
          0 2px 5px rgba(255, 255, 255, 0.9);

      }

    }


    /* =========================================
       横向きスマホ
    ========================================= */

    @media (max-width: 768px) and (orientation: landscape) {

      .visitor-container {

        height: auto;

        min-height: 0;

      }


      .slider {

        height: auto;

        flex: none;

      }


      .slide {

        min-height: calc(
          100vh - var(--header-height, 55px)
        );

      }


      .slider-btn {

        min-width: 38px;

        min-height: 58px;

        font-size: 48px;

        padding: 0 2px;

      }

    }


    /* =========================================
       非常に小さい画面
    ========================================= */

    @media (max-height: 650px) {

      .slider-btn {

        min-width: 40px;

        min-height: 62px;

        font-size: 52px;

      }

    }

  </style>
</head>


<body>


  <!-- =========================================
       共通ヘッダー
  ========================================= -->

  <div id="header"></div>


  <script>

    fetch("header.html")
      .then(res => res.text())
      .then(data => {

        document.getElementById("header").innerHTML = data;

        const btn =
          document.querySelector(".menu-btn");

        const nav =
          document.querySelector(".nav");


        /*
          実際のヘッダー高さを取得
        */

        const headerElement =
          document.querySelector(
            "#header header"
          );


        if (headerElement) {

          const headerHeight =
            headerElement.getBoundingClientRect().height;


          document.documentElement.style.setProperty(
            "--header-height",
            `${headerHeight}px`
          );

        }


        if (btn && nav) {

          btn.addEventListener(
            "click",
            (e) => {

              e.stopPropagation();

              nav.classList.toggle("active");

            }
          );


          document.addEventListener(
            "click",
            (e) => {

              if (
                !nav.contains(e.target) &&
                !btn.contains(e.target)
              ) {

                nav.classList.remove("active");

              }

            }
          );

        }

      });

  </script>


  <!-- =========================================
       背景図形
  ========================================= -->

  <div class="bg-shapes">

    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="shape s4"></div>
    <div class="shape s5"></div>
    <div class="shape s6"></div>
    <div class="shape s7"></div>
    <div class="shape s8"></div>

  </div>


  <!-- =========================================
       メイン
  ========================================= -->

  <main class="visitor-container">

    <div class="slider-wrapper">

      <!-- =====================================
           画像スライダー
      ====================================== -->

      <div
        class="slider"
        id="slider"
      >

        <div
          class="slides"
          id="slides"
        >

          <!-- 1ページ目 -->

          <div class="slide">

            <img
              src="images/visitor1.jpeg"
              alt="来校案内 1ページ目"
              draggable="false"
            >

          </div>


          <!-- 2ページ目 -->

          <div class="slide">

            <img
              src="images/visitor2.jpeg"
              alt="来校案内 2ページ目"
              draggable="false"
            >

          </div>


          <!-- 3ページ目 -->

          <div class="slide">

            <img
              src="images/visitor3.jpeg"
              alt="来校案内 3ページ目"
              draggable="false"
            >

          </div>


          <!-- 4ページ目 -->

          <div class="slide">

            <img
              src="images/visitor4.jpeg"
              alt="来校案内 4ページ目"
              draggable="false"
            >

          </div>


          <!-- 5ページ目 -->

          <div class="slide">

            <img
              src="images/visitor5.jpeg"
              alt="来校案内 5ページ目"
              draggable="false"
            >

          </div>


          <!-- 6ページ目 -->

          <div class="slide">

            <img
              src="images/visitor6.jpeg"
              alt="来校案内 6ページ目"

            >

          </div>

        </div>


        <!-- =====================================

        ====================================== -->

        <div class="slider-controls">

          <button
            type="button"
            class="slider-btn"
            id="prevBtn"
            aria-label="前のページ"
          >
            ‹
          </button>


          <button
            type="button"

            id="nextBtn"
            aria-label="次のページ"
          >
            ›
          </button>

        </div>

      </div>

    </div>

  </main>


  <!-- =========================================
       JavaScript
  ========================================= -->

  <script>

    /* =========================================
       要素取得
    ========================================= */

    const slider =
      document.getElementById("slider");


    const slides =
      document.getElementById("slides");


    const prevBtn =
      document.getElementById("prevBtn");


    const nextBtn =
      document.getElementById("nextBtn");


    const images =
      Array.from(
        document.querySelectorAll(
          ".slide img"
        )
      );


    /* =========================================
       ページ数
    ========================================= */

    const totalPages =
      images.length;


    /* =========================================
       現在のページ
    ========================================= */

    let currentPage = 0;


    /* =========================================
       拡大設定
    ========================================= */

    const MAX_ZOOM = 4;

    const MIN_ZOOM = 1;


    let zoomScale = 1;

    let panX = 0;

    let panY = 0;


    /* =========================================
       ポインター情報
    ========================================= */

    const activePointers =
      new Map();


    /* =========================================
       1本指操作
    ========================================= */

    let singlePointerId = null;

    let lastPointerX = 0;

    let lastPointerY = 0;

    let swipeStartX = 0;

    let swipeStartY = 0;


    /*
      縦スクロール判定
    */

    let isVerticalGesture = false;


    /*
      横スワイプ判定
    */

    let isHorizontalGesture = false;


    /*
      画像ドラッグ
    */

    let isDragging = false;


    /*
      ピンチ中
    */

    let isPinching = false;


    /*
      ピンチ終了直後
    */

    let pinchJustEnded = false;


    /* =========================================
       ピンチ開始情報
    ========================================= */

    let pinchStartDistance = 0;

    let pinchStartScale = 1;

    let pinchStartCenterX = 0;

    let pinchStartCenterY = 0;

    let pinchStartPanX = 0;

    let pinchStartPanY = 0;

    let pinchContentX = 0;

    let pinchContentY = 0;

    let pinchLayoutCenterX = 0;

    let pinchLayoutCenterY = 0;


    /* =========================================
       縦スクロール用
    ========================================= */

    let lastScrollY = 0;


    /* =========================================
       しきい値
    ========================================= */

    const SWIPE_DISTANCE = 45;

    const DIRECTION_THRESHOLD = 8;

    const DRAG_THRESHOLD = 4;


    /* =========================================
       現在の画像
    ========================================= */

    function getCurrentImage() {

      return images[currentPage];

    }


    /* =========================================
       拡大率制限
    ========================================= */

    function clampZoom(value) {

      return Math.max(
        MIN_ZOOM,
        Math.min(
          MAX_ZOOM,
          value
        )
      );

    }


    /* =========================================
       ポインター距離
    ========================================= */

    function getPointerDistance() {

      const points =
        Array.from(
          activePointers.values()
        );


      if (
        points.length < 2
      ) {

        return 0;

      }


      const dx =
        points[0].x -
        points[1].x;


      const dy =
        points[0].y -
        points[1].y;


      return Math.hypot(
        dx,
        dy
      );

    }


    /* =========================================
       2本指中心
    ========================================= */

    function getPointerCenter() {

      const points =
        Array.from(
          activePointers.values()
        );


      if (
        points.length < 2
      ) {

        return {
          x: 0,
          y: 0
        };

      }


      return {

        x:
          (
            points[0].x +
            points[1].x
          ) / 2,

        y:
          (
            points[0].y +
            points[1].y
          ) / 2

      };

    }


    /* =========================================
       画像のレイアウト上の中心
       
       transformの影響を除いた中心
    ========================================= */

    function getImageLayoutCenter() {

      const image =
        getCurrentImage();


      if (!image) {

        return {

          x:
            window.innerWidth / 2,

          y:
            window.innerHeight / 2

        };

      }


      const rect =
        image.getBoundingClientRect();


      /*
        現在のtranslate分を
        rectから除く
      */

      return {

        x:
          rect.left +
          rect.width / 2 -
          panX,

        y:
          rect.top +
          rect.height / 2 -
          panY

      };

    }


    /* =========================================
       画像の移動範囲
    ========================================= */

    function limitPan() {

      const image =
        getCurrentImage();


      if (!image) {
        return;
      }


      if (
        zoomScale <= 1
      ) {

        panX = 0;

        panY = 0;

        return;

      }


      /*
        現在のrectは
        scale後のサイズなので、
        そこから元サイズを算出。
      */

      const transformedRect =
        image.getBoundingClientRect();


      const baseWidth =
        transformedRect.width /
        Math.max(
          zoomScale,
          0.0001
        );


      const baseHeight =
        transformedRect.height /
        Math.max(
          zoomScale,
          0.0001
        );


      const scaledWidth =
        baseWidth *
        zoomScale;


      const scaledHeight =
        baseHeight *
        zoomScale;


      /*
        実際の表示領域
      */

      const viewportWidth =
        slider.clientWidth;


      /*
        画面上の表示領域。
        slider自身の高さが画像高さより
        大きい場合も考慮する。
      */

      const viewportHeight =
        Math.max(
          slider.clientHeight,
          window.innerHeight
        );


      /*
        横方向の移動可能量
      */

      const maxPanX =
        Math.max(
          0,
          (
            scaledWidth -
            viewportWidth
          ) / 2
        );


      /*
        縦方向の移動可能量
      */

      const maxPanY =
        Math.max(
          0,
          (
            scaledHeight -
            viewportHeight
          ) / 2
        );


      panX =
        Math.max(
          -maxPanX,
          Math.min(
            maxPanX,
            panX
          )
        );


      panY =
        Math.max(
          -maxPanY,
          Math.min(
            maxPanY,
            panY
          )
        );

    }


    /* =========================================
       transform適用
    ========================================= */

    function applyZoomTransform() {

      const image =
        getCurrentImage();


      if (!image) {
        return;
      }


      image.style.transform =
        `translate3d(${panX}px, ${panY}px, 0) scale(${zoomScale})`;

    }


    /* =========================================
       拡大状態を完全リセット
    ========================================= */

    function resetZoomPosition() {

      zoomScale = 1;

      panX = 0;

      panY = 0;


      images.forEach(
        (image) => {

          image.style.transform =
            "translate3d(0, 0, 0) scale(1)";

        }
      );

    }


    /* =========================================
       ページ更新
    ========================================= */

    function updateSlider(
      animate = true
    ) {

      if (animate) {

        slides.style.transition =
          "transform 0.3s ease-out";

      }

      else {

        slides.style.transition =
          "none";

      }


      slides.style.transform =
        `translate3d(-${currentPage * 100}%, 0, 0)`;


      /*
        ページ切り替え時のみ
        拡大解除。

        ★以前の問題：
        pointercancel等でも
        updateSlider() が呼ばれ、
        拡大が解除されることがあった。

        今回はpointercancelでは
        安易にupdateSlider()を呼ばない。
      */

      resetZoomPosition();

    }


    /* =========================================
       次ページ
    ========================================= */

    function nextPage() {

      if (
        totalPages <= 0
      ) {
        return;
      }


      if (
        currentPage <
        totalPages - 1
      ) {

        currentPage++;

      }

      else {

        currentPage = 0;

      }


      updateSlider(true);

    }


    /* =========================================
       前ページ
    ========================================= */

    function previousPage() {

      if (
        totalPages <= 0
      ) {
        return;
      }


      if (
        currentPage > 0
      ) {

        currentPage--;

      }

      else {

        currentPage =
          totalPages - 1;

      }


      updateSlider(true);

    }


    /* =========================================
       ボタン
    ========================================= */

    prevBtn.addEventListener(
      "click",
      (e) => {

        e.preventDefault();

        e.stopPropagation();

        previousPage();

      }
    );


    nextBtn.addEventListener(
      "click",
      (e) => {

        e.preventDefault();

        e.stopPropagation();

        nextPage();

      }
    );


    prevBtn.addEventListener(
      "pointerdown",
      (e) => {

        e.stopPropagation();

      }
    );


    nextBtn.addEventListener(
      "pointerdown",
      (e) => {

        e.stopPropagation();

      }
    );


    /* =========================================
       ピンチ開始
    ========================================= */

    function startPinch() {

      if (
        activePointers.size < 2
      ) {

        return;

      }


      const image =
        getCurrentImage();


      if (!image) {
        return;
      }


      /*
        ★ここからピンチ状態
      */

      isPinching = true;

      isDragging = false;

      isHorizontalGesture = false;

      isVerticalGesture = false;


      /*
        現在の距離
      */

      pinchStartDistance =
        getPointerDistance();


      if (
        pinchStartDistance <= 0
      ) {

        return;

      }


      /*
        2本指中心
      */

      const center =
        getPointerCenter();


      pinchStartCenterX =
        center.x;

      pinchStartCenterY =
        center.y;


      /*
        開始時の倍率
      */

      pinchStartScale =
        zoomScale;


      /*
        開始時のpan
      */

      pinchStartPanX =
        panX;

      pinchStartPanY =
        panY;


      /*
        transform前の画像中心
      */

      const rect =
        image.getBoundingClientRect();


      pinchLayoutCenterX =
        rect.left +
        rect.width / 2 -
        panX;


      pinchLayoutCenterY =
        rect.top +
        rect.height / 2 -
        panY;


      /*
        指が画像上のどこを
        掴んでいるかを保存
      */

      pinchContentX =
        (
          pinchStartCenterX -
          pinchLayoutCenterX -
          pinchStartPanX
        ) /
        Math.max(
          pinchStartScale,
          0.0001
        );


      pinchContentY =
        (
          pinchStartCenterY -
          pinchLayoutCenterY -
          pinchStartPanY
        ) /
        Math.max(
          pinchStartScale,
          0.0001
        );

    }


    /* =========================================
       pointerdown
    ========================================= */

    slider.addEventListener(
      "pointerdown",
      (e) => {

        /*
          ボタンは無視
        */

        if (
          e.target.closest(
            ".slider-btn"
          )
        ) {

          return;

        }


        /*
          マウスは左クリックのみ
        */

        if (
          e.pointerType === "mouse" &&
          e.button !== 0
        ) {

          return;

        }


        /*
          ポインター登録
        */

        activePointers.set(
          e.pointerId,
          {

            x: e.clientX,

            y: e.clientY

          }
        );


        /*
          pointer capture

          ★重要
          ピンチ中に指が少し画像の外へ
          出てもイベントを維持する。
        */

        try {

          slider.setPointerCapture(
            e.pointerId
          );

        }

        catch (error) {

          // Safari等では無視

        }


        /* =====================================
           2本目
        ===================================== */

        if (
          activePointers.size >= 2
        ) {

          startPinch();

          return;

        }


        /* =====================================
           1本目
        ===================================== */

        singlePointerId =
          e.pointerId;


        lastPointerX =
          e.clientX;

        lastPointerY =
          e.clientY;


        swipeStartX =
          e.clientX;

        swipeStartY =
          e.clientY;


        lastScrollY =
          window.scrollY;


        isDragging = false;

        isHorizontalGesture = false;

        isVerticalGesture = false;

      }
    );


    /* =========================================
       pointermove
    ========================================= */

    slider.addEventListener(
      "pointermove",
      (e) => {

        /*
          ポインター位置更新
        */

        if (
          activePointers.has(
            e.pointerId
          )
        ) {

          activePointers.set(
            e.pointerId,
            {

              x: e.clientX,

              y: e.clientY

            }
          );

        }


        /* =====================================
           2本指ピンチ
        ===================================== */

        if (
          isPinching &&
          activePointers.size >= 2
        ) {

          /*
            ★絶対にブラウザ側へ渡さない
          */

          e.preventDefault();


          const currentDistance =
            getPointerDistance();


          if (
            pinchStartDistance <= 0
          ) {

            return;

          }


          /*
            距離比
          */

          const ratio =
            currentDistance /
            pinchStartDistance;


          /*
            新倍率
          */

          const newScale =
            clampZoom(
              pinchStartScale *
              ratio
            );


          /*
            現在の2本指中心
          */

          const center =
            getPointerCenter();


          /*
            指の位置を維持したまま
            拡大・縮小
          */

          panX =
            center.x -
            pinchLayoutCenterX -
            pinchContentX *
              newScale;


          panY =
            center.y -
            pinchLayoutCenterY -
            pinchContentY *
              newScale;


          zoomScale =
            newScale;


          /*
            1倍以下にはしない
          */

          if (
            zoomScale <= 1
          ) {

            zoomScale = 1;

            panX = 0;

            panY = 0;

          }


          /*
            移動範囲
          */

          limitPan();


          /*
            即時反映
          */

          applyZoomTransform();


          return;

        }


        /* =====================================
           1本指以外
        ===================================== */

        if (
          e.pointerId !==
          singlePointerId
        ) {

          return;

        }


        const moveX =
          e.clientX -
          lastPointerX;


        const moveY =
          e.clientY -
          lastPointerY;


        const totalX =
          e.clientX -
          swipeStartX;


        const totalY =
          e.clientY -
          swipeStartY;


        /* =====================================
           拡大中
        ===================================== */

        if (
          zoomScale > 1
        ) {

          e.preventDefault();


          if (
            Math.abs(totalX) >
              DRAG_THRESHOLD ||
            Math.abs(totalY) >
              DRAG_THRESHOLD
          ) {

            isDragging = true;

          }


          if (
            isDragging
          ) {

            panX += moveX;

            panY += moveY;


            limitPan();

            applyZoomTransform();

          }


          lastPointerX =
            e.clientX;

          lastPointerY =
            e.clientY;


          return;

        }


        /* =====================================
           等倍時
        ===================================== */

        const absX =
          Math.abs(totalX);


        const absY =
          Math.abs(totalY);


        /*
          方向決定
        */

        if (
          !isHorizontalGesture &&
          !isVerticalGesture &&
          absX > DIRECTION_THRESHOLD &&
          absX > absY
        ) {

          /*
            横方向
          */

          isHorizontalGesture = true;

          isDragging = true;

        }


        else if (
          !isHorizontalGesture &&
          !isVerticalGesture &&
          absY > DIRECTION_THRESHOLD &&
          absY > absX
        ) {

          /*
            縦方向
          */

          isVerticalGesture = true;

        }


        /* =====================================
           横スワイプ
        ===================================== */

        if (
          isHorizontalGesture
        ) {

          e.preventDefault();


          const sliderWidth =
            slider.clientWidth;


          if (
            sliderWidth <= 0
          ) {

            return;

          }


          let dragX =
            totalX;


          const MAX_DRAG =
            sliderWidth * 0.35;


          dragX =
            Math.max(
              -MAX_DRAG,
              Math.min(
                MAX_DRAG,
                dragX
              )
            );


          const basePercent =
            currentPage * -100;


          const dragPercent =
            (
              dragX /
              sliderWidth
            ) *
            100;


          slides.style.transition =
            "none";


          slides.style.transform =
            `translate3d(calc(${basePercent}% + ${dragPercent}%), 0, 0)`;

        }


        /* =====================================
           縦スクロール
           
           touch-action:noneなので
           JSでスクロールさせる
        ===================================== */

        else if (
          isVerticalGesture
        ) {

          e.preventDefault();


          /*
            指が上へ動く
            → ページを下へ

            指が下へ動く
            → ページを上へ
          */

          window.scrollBy(
            0,
            -moveY
          );


          lastScrollY =
            window.scrollY;

        }


        lastPointerX =
          e.clientX;

        lastPointerY =
          e.clientY;

      },
      {
        passive: false
      }
    );


    /* =========================================
       ピンチ終了後
       1本指へ移行
    ========================================= */

    function continueSingleFingerAfterPinch() {

      if (
        activePointers.size !== 1
      ) {

        return;

      }


      const remaining =
        Array.from(
          activePointers.entries()
        )[0];


      if (!remaining) {
        return;
      }


      singlePointerId =
        remaining[0];


      lastPointerX =
        remaining[1].x;

      lastPointerY =
        remaining[1].y;


      swipeStartX =
        remaining[1].x;

      swipeStartY =
        remaining[1].y;


      /*
        ピンチ終了直後に
        ページ切り替えを起こさない
      */

      isDragging = false;

      isHorizontalGesture = false;

      isVerticalGesture = false;


      /*
        重要：
        拡大率・panX・panYは
        ここでは一切変更しない。
      */

    }


    /* =========================================
       pointerup
    ========================================= */

    slider.addEventListener(
      "pointerup",
      (e) => {

        /*
          ポインター削除
        */

        activePointers.delete(
          e.pointerId
        );


        /* =====================================
           ピンチ中
        ===================================== */

        if (
          isPinching
        ) {

          /*
            まだ2本以上なら継続
          */

          if (
            activePointers.size >= 2
          ) {

            return;

          }


          /*
            ピンチ終了
          */

          isPinching = false;

          pinchJustEnded = true;


          /*
            1本残った場合
          */

          if (
            activePointers.size === 1
          ) {

            continueSingleFingerAfterPinch();

          }

          else {

            singlePointerId =
              null;

          }


          /*
            ★ここで
            resetZoomPosition() を
            絶対に呼ばない。

            これが今回の重要ポイント。
          */

          return;

        }


        /* =====================================
           1本指以外
        ===================================== */

        if (
          e.pointerId !==
          singlePointerId
        ) {

          return;

        }


        /*
          ピンチ直後なら
          何もしない
        */

        if (
          pinchJustEnded
        ) {

          pinchJustEnded = false;

          isDragging = false;

          isHorizontalGesture = false;

          isVerticalGesture = false;

          singlePointerId = null;

          return;

        }


        const deltaX =
          e.clientX -
          swipeStartX;


        const deltaY =
          e.clientY -
          swipeStartY;


        /* =====================================
           拡大中
        ===================================== */

        if (
          zoomScale > 1
        ) {

          /*
            拡大状態を維持
          */

          isDragging = false;

          isHorizontalGesture = false;

          isVerticalGesture = false;

          singlePointerId = null;

          return;

        }


        /* =====================================
           縦スクロール
        ===================================== */

        if (
          isVerticalGesture
        ) {

          isVerticalGesture = false;

          isHorizontalGesture = false;

          isDragging = false;

          singlePointerId = null;

          return;

        }


        /* =====================================
           横スワイプ
        ===================================== */

        if (
          isHorizontalGesture
        ) {

          const isSwipe =
            Math.abs(deltaX) >=
              SWIPE_DISTANCE &&
            Math.abs(deltaX) >
              Math.abs(deltaY);


          if (
            isSwipe
          ) {

            if (
              deltaX < 0
            ) {

              /*
                左
                → 次ページ
              */

              nextPage();

            }

            else {

              /*
                右
                → 前ページ
              */

              previousPage();

            }

          }

          else {

            /*
              スワイプ不足
              → 現在ページへ戻す
            */

            slides.style.transition =
              "transform 0.3s ease-out";


            slides.style.transform =
              `translate3d(-${currentPage * 100}%, 0, 0)`;

          }

        }


        /*
          状態リセット
        */

        isDragging = false;

        isHorizontalGesture = false;

        isVerticalGesture = false;

        singlePointerId = null;

      }
    );


    /* =========================================
       pointercancel
       
       ★重要
       ここで拡大解除しない
    ========================================= */

    slider.addEventListener(
      "pointercancel",
      (e) => {

        activePointers.delete(
          e.pointerId
        );


        /*
          ピンチ中にSafari等が
          cancelしてしまった場合でも、
          拡大状態を維持する。
        */

        if (
          isPinching
        ) {

          if (
            activePointers.size >= 2
          ) {

            return;

          }


          isPinching = false;

          pinchJustEnded = true;


          if (
            activePointers.size === 1
          ) {

            continueSingleFingerAfterPinch();

          }

          else {

            singlePointerId =
              null;

          }


          /*
            ★ここでは
            updateSlider()
            resetZoomPosition()
            を呼ばない
          */

          return;

        }


        /*
          通常の1本指操作の
          cancelでもページを
          リセットしない。

          特にSafariでは、
          ジェスチャー途中の
          cancelが発生することがあるため。
        */

        if (
          activePointers.size === 0
        ) {

          isDragging = false;

          isHorizontalGesture = false;

          isVerticalGesture = false;

          singlePointerId = null;

          /*
            拡大状態はそのまま維持
          */

          if (
            zoomScale > 1
          ) {

            limitPan();

            applyZoomTransform();

          }

          else {

            slides.style.transition =
              "transform 0.3s ease-out";

            slides.style.transform =
              `translate3d(-${currentPage * 100}%, 0, 0)`;

          }

        }

        else if (
          activePointers.size === 1
        ) {

          continueSingleFingerAfterPinch();

        }

      },
      {
        passive: false
      }
    );


    /* =========================================
       pointerout / pointerleave
       
       pointer capture中は基本不要だが、
       念のため何もしない。
    ========================================= */

    slider.addEventListener(
      "pointerleave",
      (e) => {

        /*
          何もしない。

          指が外に出ても
          pointer captureを維持する。
        */

      }
    );


    /* =========================================
       マウスホイール拡大
       
       Ctrl + ホイール
    ========================================= */

    slider.addEventListener(
      "wheel",
      (e) => {

        if (
          !e.ctrlKey
        ) {

          /*
            通常ホイールは
            ブラウザ標準スクロール
          */

          return;

        }


        e.preventDefault();


        const image =
          getCurrentImage();


        if (!image) {
          return;
        }


        const rect =
          image.getBoundingClientRect();


        const mouseX =
          e.clientX;


        const mouseY =
          e.clientY;


        const layoutCenterX =
          rect.left +
          rect.width / 2 -
          panX;


        const layoutCenterY =
          rect.top +
          rect.height / 2 -
          panY;


        const contentX =
          (
            mouseX -
            layoutCenterX -
            panX
          ) /
          Math.max(
            zoomScale,
            0.0001
          );


        const contentY =
          (
            mouseY -
            layoutCenterY -
            panY
          ) /
          Math.max(
            zoomScale,
            0.0001
          );


        const zoomStep =
          e.deltaY < 0
            ? 1.12
            : 0.88;


        const newScale =
          clampZoom(
            zoomScale *
            zoomStep
          );


        panX =
          mouseX -
          layoutCenterX -
          contentX *
            newScale;


        panY =
          mouseY -
          layoutCenterY -
          contentY *
            newScale;


        zoomScale =
          newScale;


        if (
          zoomScale <= 1
        ) {

          zoomScale = 1;

          panX = 0;

          panY = 0;

        }


        limitPan();

        applyZoomTransform();

      },
      {
        passive: false
      }
    );


    /* =========================================
       画像ドラッグ防止
    ========================================= */

    images.forEach(
      (img) => {

        img.addEventListener(
          "dragstart",
          (e) => {

            e.preventDefault();

          }
        );


        img.addEventListener(
          "contextmenu",
          (e) => {

            if (
              zoomScale > 1
            ) {

              e.preventDefault();

            }

          }
        );

      }
    );


    /* =========================================
       キーボード操作
    ========================================= */

    document.addEventListener(
      "keydown",
      (e) => {

        /*
          左
        */

        if (
          e.key === "ArrowLeft"
        ) {

          e.preventDefault();

          previousPage();

        }


        /*
          右
        */

        if (
          e.key === "ArrowRight"
        ) {

          e.preventDefault();

          nextPage();

        }


        /*
          Escape
          → 拡大解除
        */

        if (
          e.key === "Escape"
        ) {

          if (
            zoomScale > 1
          ) {

            resetZoomPosition();

          }

        }

      }
    );


    /* =========================================
       画面サイズ変更
    ========================================= */

    window.addEventListener(
      "resize",
      () => {

        if (
          zoomScale > 1
        ) {

          /*
            少し待ってから
            レイアウト確定後に補正
          */

          requestAnimationFrame(
            () => {

              limitPan();

              applyZoomTransform();

            }
          );

        }

      }
    );


    /* =========================================
       orientationchange
    ========================================= */

    window.addEventListener(
      "orientationchange",
      () => {

        if (
          zoomScale > 1
        ) {

          setTimeout(
            () => {

              limitPan();

              applyZoomTransform();

            },
            150
          );

        }

      }
    );


    /* =========================================
       初期表示
    ========================================= */

    resetZoomPosition();

    updateSlider(false);

  </script>


</body>
</html>
