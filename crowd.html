<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  混雑情報｜長高祭2026
</title>

<meta
  name="description"
  content="長高祭2026の各企画・教室の混雑情報を確認・共有できます。"
>

<link
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap"
  rel="stylesheet"
>

<link
  rel="stylesheet"
  href="css/style.css"
>

<style>

/* =========================================
   基本設定
========================================= */

:root{
  --header-height:48px;
  --pink:#ff4d6d;
  --pink-deep:#e2022e;
  --purple:#8870a8;
  --gold:#cfb25a;
  --teal:#65a6ae;
  --bg:#f1f1ef;
  --text:#24242a;
  --sub:#66636b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  background:var(--bg)!important;
  font-family:'Noto Sans JP',sans-serif;
  color:var(--text);
  touch-action:pan-y;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
}


/* =========================================
   背景のローポリ風図形
========================================= */

.bg-shapes{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  opacity:.24;
  filter:blur(1px);
}

.bg-shapes .shape{
  position:absolute;
}

.bg-shapes .s1{
  top:5%;
  left:-50px;
  width:0;
  height:0;
  border-left:90px solid transparent;
  border-right:90px solid transparent;
  border-bottom:170px solid #c96d80;
  transform:rotate(-25deg);
}

.bg-shapes .s2{
  top:25%;
  left:-35px;
  width:0;
  height:0;
  border-left:70px solid transparent;
  border-right:70px solid transparent;
  border-bottom:130px solid #8870a8;
  transform:rotate(20deg);
}

.bg-shapes .s3{
  bottom:5%;
  left:-30px;
  width:0;
  height:0;
  border-left:100px solid transparent;
  border-right:100px solid transparent;
  border-bottom:180px solid #cfb25a;
  transform:rotate(12deg);
}

.bg-shapes .s4{
  bottom:28%;
  left:20px;
  width:0;
  height:0;
  border-left:60px solid transparent;
  border-right:60px solid transparent;
  border-bottom:120px solid #65a6ae;
  transform:rotate(-15deg);
}

.bg-shapes .s5{
  top:12%;
  right:-80px;
  width:0;
  height:0;
  border-left:150px solid transparent;
  border-right:150px solid transparent;
  border-bottom:260px solid #6aa8ad;
  transform:rotate(30deg);
}

.bg-shapes::before,
.bg-shapes::after{
  content:"";
  position:absolute;
  display:block;
}

.bg-shapes::before{
  width:85px;
  height:150px;
  left:7%;
  top:45%;
  background:#a57999;
  transform:rotate(28deg);
}

.bg-shapes::after{
  width:110px;
  height:70px;
  right:4%;
  top:55%;
  background:#65a0a8;
  transform:rotate(-20deg);
}


/* =========================================
   ヘッダー
========================================= */

#header{
  position:fixed!important;
  top:0;
  left:0;
  width:100%;
  z-index:10000!important;
}


/* =========================================
   メイン
========================================= */

main{
  position:relative;
  z-index:1;
  width:100%;
  padding:
    calc(var(--header-height) + 10px)
    20px
    100px;
}


/* =========================================
   ページタイトル
========================================= */

.page-heading{
  position:relative;
  width:100%;
  max-width:1050px;
  margin:0 auto 28px;
  text-align:center;
}

.page-heading h1{
  display:inline-block;
  margin:0;
  padding:10px 0;
  font-size:clamp(30px,6vw,48px);
  font-weight:900;
  letter-spacing:.05em;
  color:var(--pink);
  background:none!important;
  box-shadow:none!important;
  border-radius:0!important;
  border:none!important;
}

.page-heading p{
  margin:18px auto 0;
  max-width:680px;
  font-size:clamp(13px,2vw,16px);
  line-height:1.9;
  font-weight:500;
  color:var(--sub);
}


/* =========================================
   混雑情報共有 停止表示
========================================= */

.sharing-disabled-box{
  position:relative;
  width:100%;
  max-width:850px;
  margin:0 auto 24px;
  padding:26px 24px;
  background:rgba(255,255,255,.92);
  border:3px solid #24242a;
  border-left:8px solid var(--pink);
  box-shadow:9px 9px 0 rgba(36,36,42,.12);
  text-align:center;
  overflow:hidden;
}

.sharing-disabled-box::before{
  content:"";
  position:absolute;
  top:-35px;
  right:-25px;
  width:100px;
  height:100px;
  background:rgba(136,112,168,.18);
  transform:rotate(25deg);
  clip-path:polygon(0 0,100% 0,100% 100%);
}

.sharing-disabled-box::after{
  content:"";
  position:absolute;
  bottom:-35px;
  left:-25px;
  width:90px;
  height:90px;
  background:rgba(207,178,90,.20);
  transform:rotate(25deg);
  clip-path:polygon(0 0,100% 100%,0 100%);
}

.sharing-disabled-box .disabled-mark{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  margin-bottom:8px;
  color:var(--pink-deep);
  font-size:clamp(18px,3vw,25px);
  font-weight:900;
  letter-spacing:.04em;
}

.sharing-disabled-box .disabled-mark span{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  border:3px solid var(--pink);
  color:var(--pink);
  font-size:16px;
  font-weight:900;
}

.sharing-disabled-box p{
  position:relative;
  z-index:1;
  color:var(--sub);
  font-size:12px;
  line-height:1.8;
  font-weight:500;
}

.sharing-disabled-box[hidden]{
  display:none;
}

.share-btn.sharing-disabled{
  cursor:not-allowed;
  background:#777;
  border-color:#777;
  color:#eee;
  box-shadow:4px 4px 0 #aaa;
  transform:none!important;
}

.share-btn.sharing-disabled:hover,
.share-btn.sharing-disabled:active{
  transform:none!important;
  box-shadow:4px 4px 0 #aaa;
}

@media(max-width:600px){
  .sharing-disabled-box{
    padding:22px 16px;
    border-left-width:6px;
    box-shadow:7px 7px 0 rgba(36,36,42,.12);
  }

  .sharing-disabled-box .disabled-mark{
    font-size:17px;
  }

  .sharing-disabled-box .disabled-mark span{
    width:25px;
    height:25px;
    font-size:14px;
  }
}


/* =========================================
   お知らせ
========================================= */

.notice-box{
  position:relative;
  width:100%;
  max-width:850px;
  margin:0 auto 32px;
  padding:20px 24px;
  background:rgba(255,255,255,.86);
  border-left:6px solid var(--pink);
  border-right:6px solid var(--purple);
  box-shadow:8px 8px 0 rgba(0,0,0,.08);
  text-align:center;
}

.notice-box::before{
  content:"";
  position:absolute;
  top:-1px;
  right:0;
  width:52px;
  height:52px;
  background:rgba(207,178,90,.35);
  clip-path:polygon(100% 0,100% 100%,0 0);
}

.notice-box strong{
  display:block;
  margin-bottom:6px;
  color:var(--pink-deep);
  font-size:15px;
}

.notice-box span{
  font-size:12px;
  line-height:1.8;
  color:var(--sub);
}


/* =========================================
   フィルター
========================================= */

.filter-area{
  width:100%;
  max-width:1050px;
  margin:0 auto 30px;
  padding:24px;
  background:rgba(255,255,255,.82);
  border:1px solid rgba(0,0,0,.06);
  box-shadow:8px 8px 0 rgba(0,0,0,.07);
}

.filter-group{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
}

.filter-group + .filter-group{
  margin-top:20px;
}

.filter-title{
  width:100%;
  margin-bottom:2px;
  font-size:14px;
  font-weight:900;
  color:var(--pink-deep);
}


/* =========================================
   キーワード検索
========================================= */

.keyword-search{
  width:100%;
  padding:12px 15px;
  border:2px solid rgba(36,36,42,.12);
  border-radius:0;
  outline:none;
  background:#fff;
  color:var(--text);
  font-family:inherit;
  font-size:14px;
  box-shadow:4px 4px 0 rgba(0,0,0,.07);
}

.keyword-search:focus{
  border-color:var(--pink);
}

.keyword-search::placeholder{
  color:#999;
}


/* =========================================
   フィルターボタン
========================================= */

.filter-btn{
  appearance:none;
  border:2px solid rgba(36,36,42,.12);
  cursor:pointer;
  padding:9px 16px;
  border-radius:0;
  background:#fff;
  color:#555;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  box-shadow:4px 4px 0 rgba(0,0,0,.09);
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease,
    color .18s ease;
}

.filter-btn:hover{
  transform:translate(-1px,-1px);
  box-shadow:6px 6px 0 rgba(0,0,0,.09);
}

.filter-btn:active{
  transform:translate(2px,2px);
  box-shadow:2px 2px 0 rgba(0,0,0,.09);
}

.filter-btn.active{
  color:#fff;
  border-color:var(--pink);
  background:var(--pink);
}

#categoryFilters .filter-btn:not([data-category="all"]){
  color:var(--genre-filter-text,#555);
  border-color:var(--genre-filter-border,rgba(36,36,42,.12));
  background:var(--genre-filter-bg,#fff);
}

#categoryFilters .filter-btn:not([data-category="all"]).active{
  color:#fff;
  border-color:var(--genre-filter-text,#555);
  background:var(--genre-filter-text,#555);
}


/* =========================================
   件数
========================================= */

.result-info{
  width:100%;
  max-width:1050px;
  margin:0 auto 16px;
  padding:0 2px;
  font-size:13px;
  font-weight:700;
  color:var(--sub);
}

.result-info strong{
  color:var(--pink-deep);
}


/* =========================================
   カード一覧
========================================= */

.crowd-grid{
  position:relative;
  z-index:1;
  width:100%;
  max-width:1050px;
  margin:0 auto;
  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));
  gap:20px;
}


/* =========================================
   混雑情報カード
========================================= */

.crowd-card{
  position:relative;
  display:flex;
  flex-direction:column;
  min-height:430px;
  padding:22px;
  overflow:hidden;
  background:#fff;
  border:2px solid rgba(36,36,42,.12);
  border-radius:0!important;
  box-shadow:8px 8px 0 rgba(0,0,0,.08);

  transition:
    transform .22s ease,
    box-shadow .22s ease;
}

.crowd-card::before{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  width:82px;
  height:82px;
  background:var(--genre-shape-left,rgba(201,109,128,.17));
  clip-path:
    polygon(
      0 100%,
      0 0,
      100% 100%
    );
  pointer-events:none;
}

.crowd-card::after{
  content:"";
  position:absolute;
  right:-18px;
  top:-18px;
  width:74px;
  height:74px;
  background:var(--genre-shape-right,rgba(136,112,168,.16));
  transform:rotate(25deg);
  pointer-events:none;
}

.crowd-card:hover{
  transform:translate(-3px,-3px);
  box-shadow:12px 12px 0 rgba(0,0,0,.09);
}


/* =========================================
   カテゴリ
========================================= */

.category-badge{
  position:absolute;
  top:17px;
  right:17px;
  z-index:2;
  padding:6px 11px;
  background:var(--genre-badge-bg,#f2edf8);
  border:1px solid var(--genre-badge-border,rgba(136,112,168,.28));
  color:var(--genre-badge-text,#66547d);
  font-size:11px;
  font-weight:700;
}


/* =========================================
   カードタイトル
========================================= */

.crowd-card-title{
  position:relative;
  z-index:1;
  display:block!important;
  margin:34px 0 20px!important;
  padding:0 10px 0 0!important;
  font-size:20px;
  line-height:1.55;
  font-weight:900;
  color:var(--text);
  word-break:break-word;

  background:none!important;
  background-color:transparent!important;
  border:none!important;
  border-radius:0!important;
  box-shadow:none!important;
}

.crowd-card-title::before,
.crowd-card-title::after{
  content:none!important;
  display:none!important;
}

.crowd-card-title *{
  background:none!important;
  background-color:transparent!important;
  border:none!important;
  border-radius:0!important;
  box-shadow:none!important;
}


/* =========================================
   企画情報
========================================= */

.place-info{
  position:relative;
  z-index:1;
  margin-bottom:18px;
  padding-bottom:18px;
  border-bottom:2px solid rgba(36,36,42,.08);
}

.info-row{
  display:grid;
  grid-template-columns:90px 1fr;
  gap:8px;
  margin-top:8px;
  font-size:13px;
}

.info-label{
  color:var(--pink-deep);
  font-weight:700;
}

.info-value{
  color:var(--sub);
  font-weight:500;
  word-break:break-word;
}


/* =========================================
   混雑状況
========================================= */

.status-area{
  position:relative;
  z-index:1;
  margin-top:auto;
}

.status-label{
  margin-bottom:8px;
  font-size:12px;
  font-weight:700;
  color:var(--sub);
}

.status-display{
  position:relative;
  z-index:1;
  padding:14px 15px 13px;
  background:#f6f5f2;
  border-left:5px solid var(--teal);
}

.status-main{
  display:flex;
  align-items:center;
  gap:10px;
}

.status-dot{
  width:13px;
  height:13px;
  flex-shrink:0;
  border-radius:50%;
}

.status-dot.empty{
  background:#55c78a;
  box-shadow:0 0 10px rgba(85,199,138,.45);
}

.status-dot.normal{
  background:#f3b83e;
  box-shadow:0 0 10px rgba(243,184,62,.4);
}

.status-dot.crowded{
  background:#f05a68;
  box-shadow:0 0 10px rgba(240,90,104,.4);
}

.status-dot.unknown{
  background:#a8afbc;
}

.status-text{
  min-width:0;
  font-size:14px;
  font-weight:900;
  color:#555;
  line-height:1.5;
  overflow-wrap:anywhere;
}

.score-section{
  margin-top:13px;
}

.score-header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  margin-bottom:5px;
}

.score-label{
  font-size:10px;
  font-weight:700;
  color:#7b7b80;
}

.score-value{
  font-size:15px;
  font-weight:900;
  color:var(--text);
}

.score-value small{
  font-size:9px;
  font-weight:700;
  color:#85858b;
}

.score-track{
  position:relative;
  width:100%;
  height:7px;
  overflow:hidden;
  background:#e3e1dc;
}

.score-fill{
  width:0;
  height:100%;
  background:var(--pink);
  transition:width .5s ease;
}

.score-fill.empty{
  background:#55c78a;
}

.score-fill.normal{
  background:#f3b83e;
}

.score-fill.crowded{
  background:#f05a68;
}

.score-fill.unknown{
  background:#a8afbc;
}

.confidence-section{
  margin-top:11px;
}

.confidence-header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:10px;
  margin-bottom:5px;
}

.confidence-label{
  font-size:10px;
  font-weight:700;
  color:#7b7b80;
}

.confidence-value{
  font-size:13px;
  font-weight:900;
  color:var(--purple);
}

.confidence-track{
  position:relative;
  width:100%;
  height:5px;
  overflow:hidden;
  background:#e3e1dc;
}

.confidence-fill{
  width:0;
  height:100%;
  background:var(--purple);
  transition:width .5s ease;
}

.vote-info{
  display:flex;
  justify-content:space-between;
  gap:8px;
  margin-top:8px;
  font-size:9px;
  line-height:1.5;
  color:#92929a;
}

.status-time{
  display:block;
  width:100%;
  min-height:16px;
  margin-top:8px;
  text-align:right;
  white-space:nowrap;
  font-family:'Noto Sans JP',sans-serif;
  font-size:10px;
  line-height:1.4;
  font-weight:500;
  color:#8c95a5;
  background:transparent;
  border:0;
  box-shadow:none;
  overflow:visible;
}


/* =========================================
   共有ボタン
========================================= */

.share-btn{
  position:relative;
  z-index:1;
  width:100%;
  margin-top:16px;
  padding:13px 15px;
  border:2px solid #1e1e2f;
  border-radius:0;
  cursor:pointer;
  background:#1e1e2f;
  color:#fff;
  font-family:inherit;
  font-size:13px;
  font-weight:900;
  box-shadow:5px 5px 0 var(--pink);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease;
}

.share-btn:hover{
  transform:translate(-2px,-2px);
  box-shadow:7px 7px 0 var(--pink);
}

.share-btn:active{
  transform:translate(3px,3px);
  box-shadow:2px 2px 0 var(--pink);
}

.share-btn:disabled{
  cursor:not-allowed;
  background:#777;
  border-color:#777;
  color:#eee;
  box-shadow:4px 4px 0 #aaa;
  transform:none;
}


/* =========================================
   ローディング・エラー
========================================= */

.loading{
  width:100%;
  grid-column:1 / -1;
  padding:70px 20px;
  text-align:center;
  color:var(--sub);
}

.loading-spinner{
  width:38px;
  height:38px;
  margin:0 auto 15px;
  border-radius:50%;
  border:4px solid rgba(136,112,168,.18);
  border-top-color:var(--pink);
  animation:
    loadingRotate
    .8s
    linear
    infinite;
}

@keyframes loadingRotate{
  to{
    transform:rotate(360deg);
  }
}

.error-message{
  width:100%;
  grid-column:1 / -1;
  padding:50px 20px;
  background:#fff;
  border-left:6px solid var(--pink);
  box-shadow:6px 6px 0 rgba(0,0,0,.07);
  text-align:center;
  color:var(--sub);
}

.error-message strong{
  display:block;
  margin-bottom:8px;
  color:var(--pink-deep);
}


/* =========================================
   モーダル
========================================= */

.modal-overlay{
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(25,20,40,.48);
}

.modal-overlay.active{
  display:flex;
}

.share-modal{
  position:relative;
  width:min(100%,520px);
  max-height:calc(100vh - 40px);
  overflow-y:auto;
  padding:30px;
  background:#f1f1ef;
  border:3px solid #24242a;
  box-shadow:12px 12px 0 var(--pink);
  animation:modalIn .22s ease;
}

.share-modal h1,
.share-modal h2,
.share-modal h3,
.share-modal h4,
.share-modal p,
.share-modal div,
.share-modal span{
  background-image:none!important;
}

.share-modal .modal-title{
  display:block!important;
  position:relative!important;
  margin:0 0 8px!important;
  padding:0!important;
  width:auto!important;
  min-width:0!important;
  height:auto!important;
  font-size:22px!important;
  line-height:1.5!important;
  font-weight:900!important;
  color:var(--pink-deep)!important;
  background:transparent!important;
  background-color:transparent!important;
  background-image:none!important;
  border:0!important;
  border-width:0!important;
  border-style:none!important;
  border-color:transparent!important;
  border-radius:0!important;
  box-shadow:none!important;
  text-align:left!important;
}

.share-modal .modal-title::before,
.share-modal .modal-title::after{
  content:none!important;
  display:none!important;
  width:0!important;
  height:0!important;
  margin:0!important;
  padding:0!important;
  background:none!important;
  background-color:transparent!important;
  background-image:none!important;
  border:0!important;
  border-radius:0!important;
  box-shadow:none!important;
}

.share-modal h1,
.share-modal h2,
.share-modal h3,
.share-modal h4{
  background:transparent!important;
  background-color:transparent!important;
  background-image:none!important;
  border-radius:0!important;
  border:0!important;
  box-shadow:none!important;
}

.share-modal .modal-place{
  margin-bottom:22px!important;
  padding:0!important;
  font-size:14px;
  line-height:1.6;
  font-weight:700;
  color:#555;
  background:transparent!important;
  background-color:transparent!important;

    const header =
      headerContainer.querySelector("header");

    const btn =
      headerContainer.querySelector(".menu-btn");

    const nav =
      headerContainer.querySelector(".nav");


    function updateHeaderHeight(){

      if(!header){
        return;
      }

      const height =
        header.getBoundingClientRect().height;

      document.documentElement.style.setProperty(
        "--header-height",
        height + "px"
      );

    }

    updateHeaderHeight();

    window.addEventListener(
      "resize",
      updateHeaderHeight
    );


    if(btn && nav){

      btn.addEventListener(
        "click",
        e => {

          e.stopPropagation();

          nav.classList.toggle("active");

        }
      );


      document.addEventListener(
        "click",
        e => {

          if(
            !nav.contains(e.target) &&
            !btn.contains(e.target)
          ){

            nav.classList.remove("active");

          }

        }

function isMissingClassName(value){

  const normalized =
    safeValue(value, "")

  return (
    !normalized ||
    normalized === "-" ||
    normalized === "－" ||
    normalized === "−" ||
    normalized === "―" ||
    normalized === "—"
  );

}

/* =========================================
   安全な文字列
========================================= */

function safeValue(
  value,
  fallback = ""
){

  if(
    value === undefined ||
    value === null
  ){
    return fallback;
  }

  const stringValue =
    String(value).trim();

  if(
    stringValue === "" ||
    stringValue === "undefined" ||
    stringValue === "null"
  ){
    return fallback;
  }

  return stringValue;

}


/* =========================================
   日時を安全に取得
========================================= */

function safeDateValue(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){
    return null;
  }

  if(value instanceof Date){

    return Number.isNaN(value.getTime())
      ? null
      : value.toISOString();

  }

  if(
    typeof value === "number" ||
    /^\d+(\.\d+)?$/.test(
      String(value).trim()
    )
  ){

    let timestamp =
      Number(value);

    if(!Number.isFinite(timestamp)){
      return null;
    }

    if(timestamp < 100000000000){
      timestamp *= 1000;
    }

    const timestampDate =
      new Date(timestamp);

    return Number.isNaN(
      timestampDate.getTime()
    )
      ? null
      : timestampDate.toISOString();

  }

  const safe =
    String(value).trim();

  if(!safe){
    return null;
  }

  const date =
    new Date(safe);

  if(Number.isNaN(date.getTime())){
    return null;
  }

  return date.toISOString();

}


/* =========================================
   ステータス
========================================= */

function safeStatus(value){

  const allowedStatuses = [
    "empty",
    "normal",
    "crowded"
  ];

  if(
    allowedStatuses.includes(value)
  ){
    return value;
  }

  return "unknown";

}

/* =========================================
   同じカードの共有間隔
========================================= */

function loadSameCardShareHistory(){
  try{
    const raw = localStorage.getItem(SAME_CARD_SHARE_HISTORY_KEY);
    if(!raw) return {};
    const data = JSON.parse(raw);
    return data && typeof data === "object" ? data : {};
  }catch(error){
    console.warn("カード別共有履歴の読み込みに失敗しました", error);
    return {};
  }
}

function saveSameCardShareHistory(history){
  try{
    localStorage.setItem(SAME_CARD_SHARE_HISTORY_KEY, JSON.stringify(history));
  }catch(error){
    console.warn("カード別共有履歴の保存に失敗しました", error);
  }
}

function getSameCardShareRemainingTime(event){
  if(!event) return 0;
  const targetId = getEventPostId(event);
  if(!targetId) return 0;
  const history = loadSameCardShareHistory();
  const timestamp = Number(history[targetId]);
  if(!Number.isFinite(timestamp)) return 0;
  const remaining = timestamp + SAME_CARD_SHARE_COOLDOWN_MS - Date.now();
  if(remaining <= 0){
    delete history[targetId];
    saveSameCardShareHistory(history);
    return 0;
  }
  return remaining;
}

function markSameCardShared(event, timestamp = Date.now()){
  if(!event) return;
  const targetId = getEventPostId(event);
  if(!targetId) return;
  const history = loadSameCardShareHistory();
  history[targetId] = Number(timestamp);
  saveSameCardShareHistory(history);
}

function formatSameCardShareRemainingTime(ms){
  return formatRemainingTime(ms);
}


/* =========================================
   全体共有制限
========================================= */

function getGlobalShareRemainingTime(){

  if (globalShareRemaining > 0) {
    return 0;
  }

  const elapsed =
    Date.now() - globalShareLimitUpdatedAt;

  return Math.max(
    0,
    globalShareRetryAfterMs - elapsed
  );
}


function setGlobalShareLimitState(data){

  if (!data || typeof data !== "object") {
    return;
  }

  const remaining =
    Number(data.remaining);

  const retryAfterMs =
    Number(data.retryAfterMs);

  globalShareRemaining =
    Number.isFinite(remaining)
      ? Math.max(0, Math.round(remaining))
      : globalShareRemaining;

  globalShareRetryAfterMs =
    Number.isFinite(retryAfterMs)
      ? Math.max(0, retryAfterMs)
      : 0;

  globalShareLimitUpdatedAt =
    Date.now();
}


async function loadGlobalShareLimit(){

  if(!API_URL){
    return;
  }

  try{

    const response =
      await fetch(
        API_URL + "/api/crowd/limit",
        { cache:"no-store" }
      );

    if(!response.ok){
      throw new Error(
        "共有制限情報の取得に失敗しました"
      );
    }

    const data =
      await response.json();

    setGlobalShareLimitState(data);

  }
  catch(error){

    console.warn(
      "全体共有制限情報の取得に失敗しました",
      error
    );

  }
}


function getEventPostId(event){

  if(!event){
    return "";
  }

  return safeValue(
    event.id,
    ""
  );

}

function formatRemainingTime(ms){

  const totalSeconds =
    Math.ceil(
      ms / 1000
    );

  const minutes =
    Math.floor(
      totalSeconds / 60
    );

  const seconds =
    totalSeconds % 60;

  if(minutes > 0){

    return (
      minutes +
      "分" +
      String(seconds).padStart(2,"0") +
      "秒"
    );

  }

  return seconds + "秒";

}


/* =========================================
   更新日時
========================================= */

function getUpdatedAtValue(record){

  if(
    !record ||
    typeof record !== "object"
  ){
    return null;
  }

  const directKeys = [

    "updatedAt",
    "updated_at",
    "updated_time",
    "updatedTime",
    "timestamp",
    "time",
    "createdAt",
    "created_at"

  ];

  for(const key of directKeys){

    if(
      record[key] !== undefined &&
      record[key] !== null &&
      record[key] !== ""
    ){

      return record[key];

    }

  }

  const nestedKeys = [
    "data",
    "event",
    "crowd",
    "result"
  ];

  for(const key of nestedKeys){

    if(
      record[key] &&
      typeof record[key] === "object"
    ){

      const nestedValue =
        getUpdatedAtValue(
          record[key]
        );

      if(nestedValue){
        return nestedValue;
      }

    }

  }

  return null;

}

/* =========================================
   混雑情報を取得
========================================= */

async function loadCrowdStatus(){

  if(!API_URL){
    return;
  }

  try{

    const response =
      await fetch(
        API_URL + "/api/crowd",
        {
          cache:"no-store"
        }
      );

    if(!response.ok){

      throw new Error(
        "混雑情報の取得に失敗しました"
      );

    }


    const crowdData =
      await response.json();


    console.log(
      "取得した混雑情報:",
      crowdData
    );


    if(
      !crowdData ||
      typeof crowdData !== "object"
    ){
      return;
    }


    eventsData.forEach(
      event => {

        const targetId =
          safeValue(
            event.id,
            ""
          );

        if(!targetId){

          event.status =
            "unknown";

          event.score =
            null;

          event.confidence =
            null;

          event.voteCount =
            0;

          event.effectiveVotes =
            0;

          event.updatedAt =
            null;

          return;

        }


        let saved =
          null;


        const containers = [

          crowdData,

          crowdData.data,

          crowdData.events,

          crowdData.crowd,

          crowdData.results

        ];


        for(
          const container of containers
        ){

          if(!container){
            continue;
          }


          if(
            Array.isArray(container)
          ){

            saved =
              container.find(
                item =>
                  item &&
                  safeValue(
                    item.id,
                    ""
                  ) === targetId
              );

          }
          else if(
            typeof container === "object" &&
            container[targetId]
          ){

            saved =
              container[targetId];

          }


          if(
            saved &&
            typeof saved === "object"
          ){

            break;

          }

        }


        if(
          !saved ||
          typeof saved !== "object"
        ){

          event.status =
            "unknown";

          event.score =
            null;

          event.confidence =
            null;

          event.voteCount =
            0;

          event.effectiveVotes =
            0;

          event.updatedAt =
            null;

          return;

        }


        event.status =
          safeStatus(
            saved.status ||
            saved.crowdStatus ||
            saved.crowd_status
          );


        const score =
          Number(
            saved.score
          );

        event.score =
          Number.isFinite(score)
            ? Math.max(
                0,
                Math.min(
                  100,
                  Math.round(score)
                )
              )
            : null;


        const confidence =
          Number(
            saved.confidence
          );

        event.confidence =
          Number.isFinite(confidence)
            ? Math.max(
                0,
                Math.min(
                  100,
                  Math.round(confidence)
                )
              )
            : null;


        const voteCount =
          Number(
            saved.voteCount
          );

        event.voteCount =
          Number.isFinite(voteCount)
            ? Math.max(
                0,
                Math.round(voteCount)
              )
            : 0;


        const effectiveVotes =
          Number(
            saved.effectiveVotes
          );

        event.effectiveVotes =
          Number.isFinite(effectiveVotes)
            ? Math.max(
                0,
                effectiveVotes
              )
            : 0;


        event.updatedAt =
          safeDateValue(
            getUpdatedAtValue(saved)
          );


        console.log(
          "企画の混雑情報:",
          {
            id:event.id,
            status:event.status,
            score:event.score,
            confidence:event.confidence,
            voteCount:event.voteCount,
            effectiveVotes:event.effectiveVotes,
            updatedAt:event.updatedAt
          }
        );

      }
    );

  }
  catch(error){

    console.error(
      "混雑情報の取得に失敗しました",
      error
    );

  }

}

        <div class="status-area">

          <div class="status-label">
            現在の混雑状況
          </div>


          <div class="status-display">

            <div class="status-main">

              <span
                class="
                  status-dot

                "
              ></span>

              <span class="status-text">

                ${escapeHtml(
                  safeValue(
                    status.text,

                  )
                )}

              </span>

            </div>


            <div class="score-section">

              ${scoreHtml}

            </div>


            <div class="confidence-section">

              ${confidenceHtml}

            </div>


            <div class="vote-info">

              <span>
                投票 ${voteCount}件
              </span>

              <span>
                ${
                  confidence === null
                    ? "情報なし"
                    : "正確さを保証するものではありません"
                }
              </span>

            </div>


            <div
              class="status-time"
              aria-live="polite"
            >
              ${escapeHtml(timeText)}
            </div>

          </div>


          <button
            class="share-btn ${
              !crowdSharingEnabled
                ? "sharing-disabled"
                : ""
            }"
            type="button"
            ${
              globalRemainingTime > 0 ||
              sameCardRemainingTime > 0 ||
              !crowdSharingEnabled
                ? "disabled"
                : ""
            }
          >

            ${escapeHtml(
              !crowdSharingEnabled
                ? "長高祭開始まで共有できません"
                : buttonText
            )}

          </button>

        </div>

      `;


      const shareButton =
        card.querySelector(
          ".share-btn"
        );


      if(shareButton){

        shareButton.addEventListener(
          "click",
          () => {

            if(!crowdSharingEnabled){

              showToast(
                "長高祭開始まで混雑情報の共有はご利用いただけません"
              );

              return;

            }

            const globalRemaining =
              getGlobalShareRemainingTime();

            if(globalRemaining > 0){

              showToast(
                "全体の共有上限に達しています。あと " +
                formatRemainingTime(
                  globalRemaining
                ) +
                " お待ちください"
              );

              return;

            }


            const sameCardRemaining =
              getSameCardShareRemainingTime(event);

            if(sameCardRemaining > 0){

              showToast(
                "このカードは前回の共有から5分間は再共有できません。あと " +
                formatSameCardShareRemainingTime(
                  sameCardRemaining
                ) +
                " お待ちください"
              );

              return;

            }


            openShareModal(
              event
            );

          }
        );

      }


      crowdGrid.appendChild(
        card
      );

    }
  );


  resultCount.textContent =
    visibleCount;


  if(visibleCount === 0){

    crowdGrid.innerHTML = `

      <div class="error-message">

        <strong>
          条件に一致する企画がありません
        </strong>

        <span>
          別のキーワードや条件で検索してください。
        </span>

      </div>

    `;

  }

}


/* =========================================
   最終更新時間
========================================= */

function getTimeText(updatedAt){

  const safeUpdatedAt =
    safeDateValue(
      updatedAt
    );


  if(!safeUpdatedAt){

    return "最終更新: 情報なし";

  }


  const date =
    new Date(
      safeUpdatedAt
    );


  if(Number.isNaN(date.getTime())){

    return "最終更新: 情報なし";

  }


  const now =
    new Date();


  const diffMs =
    Math.max(
      0,
      now.getTime() -
      date.getTime()
    );


  const diffMinutes =
    Math.floor(
      diffMs /
      1000 /
      60
    );


  if(diffMinutes < 1){

    return "最終更新: たった今";

  }


  if(diffMinutes < 60){

    return (
      "最終更新: " +
      diffMinutes +
      "分前"
    );

  }


  const diffHours =
    Math.floor(
      diffMinutes / 60
    );


  if(diffHours < 24){

    return (
      "最終更新: " +
      diffHours +
      "時間前"
    );

  }


  const year =
    date.getFullYear();

  const month =
    date.getMonth() + 1;

  const day =
    date.getDate();

  const hour =
    String(
      date.getHours()
    ).padStart(2,"0");

  const minute =
    String(
      date.getMinutes()
    ).padStart(2,"0");


  return (
    "最終更新: " +
    year +
    "/" +
    month +
    "/" +
    day +
    " " +
    hour +
    ":" +
    minute
  );

}


/* =========================================
   HTMLエスケープ
========================================= */

function escapeHtml(value){

  const safe =
    safeValue(
      value,
      ""
    );

  return safe

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

  const globalRemaining =

  if(sameCardRemaining > 0){

/* =========================================
   混雑情報を共有
========================================= */

submitBtn.addEventListener(
  "click",
  async () => {

    if(!crowdSharingEnabled){

      closeShareModal();

      showToast(
        "長高祭開始まで混雑情報の共有はご利用いただけません"
      );

      return;

    }

    if(
      !selectedEvent ||
      !selectedStatus
    ){

      return;

    }


    const event =
      selectedEvent;


    const globalRemaining =
      getGlobalShareRemainingTime();


    if(globalRemaining > 0){

      showToast(
        "全体の共有上限に達しています。あと " +
        formatRemainingTime(
          globalRemaining
        ) +
        " お待ちください"
      );

      closeShareModal();

      renderEvents();

      return;

    }


    const sameCardRemaining =
      getSameCardShareRemainingTime(event);

    if(sameCardRemaining > 0){

      showToast(
        "このカードは前回の共有から5分間は再共有できません。あと " +
        formatSameCardShareRemainingTime(
          sameCardRemaining
        ) +
        " お待ちください"
      );

      closeShareModal();

      renderEvents();

      return;

    }


    submitBtn.disabled =
      true;

    submitBtn.textContent =
      "共有中...";


    try{

      /*
        体育館も含め、常に1つのIDへ投稿する。
        体育館は gymnasium-performance で
        1つの全体情報として集計する。
      */

      const targetId =
        getEventPostId(
          event
        );


      if(!targetId){

        throw new Error(
          "企画IDが取得できませんでした"
        );

      }


      const response =
        await fetch(
          API_URL +
          "/api/crowd",
          {

            method:
              "POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                id:
                  targetId,

                status:
                  selectedStatus,

                voterId:
                  getVoterId()

              })

          }
        );


      if(!response.ok){

        let errorMessage =
          "情報の共有に失敗しました";


        try{

          const errorData =
            await response.json();

          if(errorData){

            if(
              errorData.reason ===
              "same-card-cooldown"
            ){
              const retryAfterMs =
                Number(errorData.retryAfterMs);

              if(Number.isFinite(retryAfterMs)){
                markSameCardShared(
                  event,
                  Date.now() -
                  SAME_CARD_SHARE_COOLDOWN_MS +
                  retryAfterMs
                );
              }
            }

            if(Number.isFinite(Number(errorData.remaining))){
              setGlobalShareLimitState(errorData);
            }

            if(errorData.error){
              errorMessage = errorData.error;
            }
          }

        }
        catch(error){

          /* JSONでない場合は標準メッセージ */

        }


        throw new Error(
          errorMessage
        );

      }


      const result =
        await response.json();


      markSameCardShared(
        event,
        Date.now()
      );


      event.status =
        safeStatus(
          result.status ||
          result.crowdStatus ||
          result.crowd_status ||
          selectedStatus
        );


      const score =
        Number(
          result.score
        );


      event.score =
        Number.isFinite(score)
          ? score
          : null;


      const confidence =
        Number(
          result.confidence
        );


      event.confidence =
        Number.isFinite(confidence)
          ? confidence
          : null;


      const voteCount =
        Number(
          result.voteCount
        );


      event.voteCount =
        Number.isFinite(voteCount)
          ? voteCount
          : 0;


      const effectiveVotes =
        Number(
          result.effectiveVotes
        );


      event.effectiveVotes =
        Number.isFinite(
          effectiveVotes
        )
          ? effectiveVotes
          : 0;


      event.updatedAt =
        safeDateValue(
          getUpdatedAtValue(
            result
          )
        ) ||
        new Date().toISOString();


      setGlobalShareLimitState({
        remaining: result.remaining,
        retryAfterMs: result.retryAfterMs
      });


      closeShareModal();

      renderEvents();


      showToast(
        "Thank you!"
      );


      setTimeout(
        async () => {

          await loadCrowdStatus();

          renderEvents();

        },
        700
      );

    }
    catch(error){

      console.error(
        error
      );


      showToast(
        error.message ||
        "共有に失敗しました。もう一度お試しください。"
      );

    }
    finally{

      submitBtn.disabled =
        !crowdSharingEnabled ||
        getGlobalShareRemainingTime() > 0;

      submitBtn.textContent =
        "共有する";

    }

  }
);


/* =========================================
   トースト
========================================= */

let toastTimer;


function showToast(message){

  toast.textContent =
    safeValue(
      message,
      ""
    );


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      3000
    );

}

 15000
