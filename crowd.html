<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
  混雑情報｜長高祭2026
</title>

<meta
  name="description"
  content="長高祭2026の各企画・教室の混雑情報を確認・共有できます。"
>


<link
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap"
  rel="stylesheet"
>


<link
  rel="stylesheet"
  href="css/style.css"
>


<style>

/* =========================================
   基本設定
========================================= */

:root{
  --header-height:48px;
  --pink:#ff4d6d;
  --pink-deep:#e2022e;
  --purple:#8870a8;
  --gold:#cfb25a;
  --teal:#65a6ae;
  --bg:#f1f1ef;
  --text:#24242a;
  --sub:#66636b;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  background:var(--bg)!important;
  font-family:'Noto Sans JP',sans-serif;
  color:var(--text);
  touch-action:pan-y;
  -webkit-overflow-scrolling:touch;
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
}


/* =========================================
   背景のローポリ風図形
========================================= */

.bg-shapes{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  overflow:hidden;
  opacity:.24;
  filter:blur(1px);
}

.bg-shapes .shape{
  position:absolute;
}

.bg-shapes .s1{
  top:5%;
  left:-50px;
  width:0;
  height:0;
  border-left:90px solid transparent;
  border-right:90px solid transparent;
  border-bottom:170px solid #c96d80;
  transform:rotate(-25deg);
}

.bg-shapes .s2{
  top:25%;
  left:-35px;
  width:0;
  height:0;
  border-left:70px solid transparent;
  border-right:70px solid transparent;
  border-bottom:130px solid #8870a8;
  transform:rotate(20deg);
}

.bg-shapes .s3{
  bottom:5%;
  left:-30px;
  width:0;
  height:0;
  border-left:100px solid transparent;
  border-right:100px solid transparent;
  border-bottom:180px solid #cfb25a;
  transform:rotate(12deg);
}

.bg-shapes .s4{
  bottom:28%;
  left:20px;
  width:0;
  height:0;
  border-left:60px solid transparent;
  border-right:60px solid transparent;
  border-bottom:120px solid #65a6ae;
  transform:rotate(-15deg);
}

.bg-shapes .s5{
  top:12%;
  right:-80px;
  width:0;
  height:0;
  border-left:150px solid transparent;
  border-right:150px solid transparent;
  border-bottom:260px solid #6aa8ad;
  transform:rotate(30deg);
}

.bg-shapes::before,
.bg-shapes::after{
  content:"";
  position:absolute;
  display:block;
}

.bg-shapes::before{
  width:85px;
  height:150px;
  left:7%;
  top:45%;
  background:#a57999;
  transform:rotate(28deg);
}

.bg-shapes::after{
  width:110px;
  height:70px;
  right:4%;
  top:55%;
  background:#65a0a8;
  transform:rotate(-20deg);
}


/* =========================================
   ヘッダー
========================================= */

#header{
  position:fixed!important;
  top:0;
  left:0;
  width:100%;
  z-index:10000!important;
}


/* =========================================
   メイン
========================================= */

main{
  position:relative;
  z-index:1;
  width:100%;
  padding:
    calc(var(--header-height) + 42px)
    20px
    100px;
}


/* =========================================
   ページタイトル
========================================= */

.page-heading{
  position:relative;
  width:100%;
  max-width:1050px;
  margin:0 auto 28px;
  text-align:center;
}

.page-heading h1{
  display:inline-block;
  margin:0;
  padding:10px 0;
  font-size:clamp(30px,6vw,48px);
  font-weight:900;
  letter-spacing:.05em;
  color:var(--pink);
  background:none!important;
  box-shadow:none!important;
  border-radius:0!important;
  border:none!important;
}

.page-heading p{
  margin:18px auto 0;
  max-width:680px;
  font-size:clamp(13px,2vw,16px);
  line-height:1.9;
  font-weight:500;
  color:var(--sub);
}


/* =========================================
   お知らせ
========================================= */

.notice-box{
  position:relative;
  width:100%;
  max-width:850px;
  margin:0 auto 32px;
  padding:20px 24px;
  background:rgba(255,255,255,.86);
  border-left:6px solid var(--pink);
  border-right:6px solid var(--purple);
  box-shadow:8px 8px 0 rgba(0,0,0,.08);
  text-align:center;
}

.notice-box::before{
  content:"";
  position:absolute;
  top:-1px;
  right:0;
  width:52px;
  height:52px;
  background:rgba(207,178,90,.35);
  clip-path:polygon(100% 0,100% 100%,0 0);
}

.notice-box strong{
  display:block;
  margin-bottom:6px;
  color:var(--pink-deep);
  font-size:15px;
}

.notice-box span{
  font-size:12px;
  line-height:1.8;
  color:var(--sub);
}


/* =========================================
   フィルター
========================================= */

.filter-area{
  width:100%;
  max-width:1050px;
  margin:0 auto 30px;
  padding:24px;
  background:rgba(255,255,255,.82);
  border:1px solid rgba(0,0,0,.06);
  box-shadow:8px 8px 0 rgba(0,0,0,.07);
}

.filter-group{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:10px;
}

.filter-group + .filter-group{
  margin-top:20px;
}

.filter-title{
  width:100%;
  margin-bottom:2px;
  font-size:14px;
  font-weight:900;
  color:var(--pink-deep);
}


/* =========================================
   キーワード検索
========================================= */

.keyword-search{
  width:100%;
  padding:12px 15px;
  border:2px solid rgba(36,36,42,.12);
  border-radius:0;
  outline:none;
  background:#fff;
  color:var(--text);
  font-family:inherit;
  font-size:14px;
  box-shadow:4px 4px 0 rgba(0,0,0,.07);
}

.keyword-search:focus{
  border-color:var(--pink);
}

.keyword-search::placeholder{
  color:#999;
}


/* =========================================
   フィルターボタン
========================================= */

.filter-btn{
  appearance:none;
  border:2px solid rgba(36,36,42,.12);
  cursor:pointer;
  padding:9px 16px;
  border-radius:0;
  background:#fff;
  color:#555;
  font-family:inherit;
  font-size:13px;
  font-weight:700;
  box-shadow:4px 4px 0 rgba(0,0,0,.09);
  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease,
    color .18s ease;
}

.filter-btn:hover{
  transform:translate(-1px,-1px);
  box-shadow:6px 6px 0 rgba(0,0,0,.09);
}

.filter-btn:active{
  transform:translate(2px,2px);
  box-shadow:2px 2px 0 rgba(0,0,0,.09);
}

.filter-btn.active{
  color:#fff;
  border-color:var(--pink);
  background:var(--pink);
}


/* =========================================
   件数
========================================= */

.result-info{
  width:100%;
  max-width:1050px;
  margin:0 auto 16px;
  padding:0 2px;
  font-size:13px;
  font-weight:700;
  color:var(--sub);
}

.result-info strong{
  color:var(--pink-deep);
}


/* =========================================
   カード一覧
========================================= */

.crowd-grid{
  position:relative;
  z-index:1;
  width:100%;
  max-width:1050px;
  margin:0 auto;

  display:grid;
  grid-template-columns:
    repeat(3,minmax(0,1fr));

  gap:20px;
}


/* =========================================
   混雑情報カード
========================================= */

.crowd-card{
  position:relative;
  display:flex;
  flex-direction:column;
  min-height:390px;
  padding:22px;
  overflow:hidden;
  background:#fff;
  border:2px solid rgba(36,36,42,.12);
  border-radius:0!important;
  box-shadow:8px 8px 0 rgba(0,0,0,.08);

  transition:
    transform .22s ease,
    box-shadow .22s ease;
}

.crowd-card::before{
  content:"";
  position:absolute;
  left:0;
  bottom:0;
  width:82px;
  height:82px;
  background:rgba(201,109,128,.17);
  clip-path:
    polygon(
      0 100%,
      0 0,
      100% 100%
    );
  pointer-events:none;
}

.crowd-card::after{
  content:"";
  position:absolute;
  right:-18px;
  top:-18px;
  width:74px;
  height:74px;
  background:rgba(136,112,168,.16);
  transform:rotate(25deg);
  pointer-events:none;
}

.crowd-card:hover{
  transform:translate(-3px,-3px);
  box-shadow:12px 12px 0 rgba(0,0,0,.09);
}


/* =========================================
   カテゴリ
========================================= */

.category-badge{
  position:absolute;
  top:17px;
  right:17px;
  z-index:2;
  padding:6px 11px;
  background:#f2edf8;
  border:1px solid rgba(136,112,168,.28);
  color:#66547d;
  font-size:11px;
  font-weight:700;
}


/* =========================================
   カードタイトル
   白い角丸背景を完全に削除
========================================= */

.crowd-card-title{
  position:relative;
  z-index:1;
  display:block!important;
  margin:34px 0 20px!important;
  padding:0 10px 0 0!important;
  font-size:20px;
  line-height:1.55;
  font-weight:900;
  color:var(--text);
  word-break:break-word;

  background:none!important;
  background-color:transparent!important;
  border:none!important;
  border-radius:0!important;
  box-shadow:none!important;
}

.crowd-card-title::before,
.crowd-card-title::after{
  content:none!important;
  display:none!important;
}

.crowd-card-title *{
  background:none!important;
  background-color:transparent!important;
  border:none!important;
  border-radius:0!important;
  box-shadow:none!important;
}


/* =========================================
   企画情報
========================================= */

.place-info{
  position:relative;
  z-index:1;
  margin-bottom:18px;
  padding-bottom:18px;
  border-bottom:2px solid rgba(36,36,42,.08);
}

.info-row{
  display:grid;
  grid-template-columns:90px 1fr;
  gap:8px;
  margin-top:8px;
  font-size:13px;
}

.info-label{
  color:var(--pink-deep);
  font-weight:700;
}

.info-value{
  color:var(--sub);
  font-weight:500;
  word-break:break-word;
}


/* =========================================
   混雑状況
========================================= */

.status-area{
  position:relative;
  z-index:1;
  margin-top:auto;
}

.status-label{
  margin-bottom:8px;
  font-size:12px;
  font-weight:700;
  color:var(--sub);
}

.status-display{
  display:flex;
  align-items:center;
  gap:10px;
  padding:14px 15px;
  background:#f6f5f2;
  border-left:5px solid var(--teal);
}

.status-dot{
  width:13px;
  height:13px;
  flex-shrink:0;
  border-radius:50%;
}

.status-dot.empty{
  background:#55c78a;
  box-shadow:0 0 10px rgba(85,199,138,.45);
}

.status-dot.normal{
  background:#f3b83e;
  box-shadow:0 0 10px rgba(243,184,62,.4);
}

.status-dot.crowded{
  background:#f05a68;
  box-shadow:0 0 10px rgba(240,90,104,.4);
}

.status-dot.unknown{
  background:#a8afbc;
}

.status-text{
  flex:1;
  font-size:14px;
  font-weight:900;
  color:#555;
}

.status-time{
  display:block;
  min-height:18px;
  margin-top:8px;
  text-align:right;
  font-size:10px;
  color:#8c95a5;
}


/* =========================================
   共有ボタン
========================================= */

.share-btn{
  position:relative;
  z-index:1;
  width:100%;
  margin-top:16px;
  padding:13px 15px;
  border:2px solid #1e1e2f;
  border-radius:0;
  cursor:pointer;
  background:#1e1e2f;
  color:#fff;
  font-family:inherit;
  font-size:13px;
  font-weight:900;
  box-shadow:5px 5px 0 var(--pink);

  transition:
    transform .18s ease,
    box-shadow .18s ease,
    background .18s ease;
}

.share-btn:hover{
  transform:translate(-2px,-2px);
  box-shadow:7px 7px 0 var(--pink);
}

.share-btn:active{
  transform:translate(3px,3px);
  box-shadow:2px 2px 0 var(--pink);
}

.share-btn:disabled{
  cursor:not-allowed;
  background:#777;
  border-color:#777;
  color:#eee;
  box-shadow:4px 4px 0 #aaa;
  transform:none;
}


/* =========================================
   ローディング・エラー
========================================= */

.loading{
  width:100%;
  grid-column:1 / -1;
  padding:70px 20px;
  text-align:center;
  color:var(--sub);
}

.loading-spinner{
  width:38px;
  height:38px;
  margin:0 auto 15px;
  border-radius:50%;
  border:4px solid rgba(136,112,168,.18);
  border-top-color:var(--pink);
  animation:
    loadingRotate
    .8s
    linear
    infinite;
}

@keyframes loadingRotate{

  to{
    transform:rotate(360deg);
  }

}

.error-message{
  width:100%;
  grid-column:1 / -1;
  padding:50px 20px;
  background:#fff;
  border-left:6px solid var(--pink);
  box-shadow:6px 6px 0 rgba(0,0,0,.07);
  text-align:center;
  color:var(--sub);
}

.error-message strong{
  display:block;
  margin-bottom:8px;
  color:var(--pink-deep);
}


/* =========================================
   モーダル
========================================= */

.modal-overlay{
  position:fixed;
  inset:0;
  z-index:5000;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(25,20,40,.48);
}

.modal-overlay.active{
  display:flex;
}

.share-modal{
  position:relative;
  width:min(100%,520px);
  max-height:calc(100vh - 40px);
  overflow-y:auto;
  padding:30px;
  background:#f1f1ef;
  border:3px solid #24242a;
  box-shadow:12px 12px 0 var(--pink);
  animation:
    modalIn
    .22s
    ease;
}

@keyframes modalIn{

  from{
    opacity:0;
    transform:
      translateY(18px)
      scale(.98);
  }

  to{
    opacity:1;
    transform:
      translateY(0)
      scale(1);
  }

}

.modal-title{
  margin:0 0 8px;
  font-size:22px;
  font-weight:900;
  color:var(--pink-deep);
}

.modal-place{
  margin-bottom:22px;
  font-size:14px;
  font-weight:700;
  color:#555;
}

.status-options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:22px;
}

.status-option{
  min-height:76px;
  padding:12px;
  border:2px solid rgba(36,36,42,.13);
  background:#fff;
  cursor:pointer;
  font-family:inherit;
  text-align:left;

  transition:
    transform .18s ease,
    border-color .18s ease,
    box-shadow .18s ease;
}

.status-option:hover{
  transform:translate(-2px,-2px);
  box-shadow:4px 4px 0 rgba(0,0,0,.08);
}

.status-option.selected{
  border-color:var(--pink);
  box-shadow:
    4px 4px 0
    rgba(255,77,109,.28);
}

.option-circle{
  display:inline-block;
  width:12px;
  height:12px;
  margin-right:8px;
  border-radius:50%;
}

.option-circle.empty{
  background:#55c78a;
}

.option-circle.normal{
  background:#f3b83e;
}

.option-circle.crowded{
  background:#f05a68;
}

.option-text{
  font-size:13px;
  font-weight:700;
  color:var(--text);
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

.modal-btn{
  border:2px solid #24242a;
  padding:11px 18px;
  border-radius:0;
  cursor:pointer;
  font-family:inherit;
  font-size:13px;
  font-weight:900;
}

.modal-btn.cancel{
  background:#fff;
  color:var(--text);
}

.modal-btn.submit{
  background:var(--pink);
  color:#fff;
  box-shadow:4px 4px 0 #24242a;
}

.modal-btn.submit:disabled{
  opacity:.45;
  cursor:not-allowed;
  box-shadow:none;
}


/* =========================================
   トースト
========================================= */

.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  z-index:7000;
  max-width:calc(100% - 40px);
  padding:13px 20px;
  background:#24242a;
  color:#fff;
  border-left:5px solid var(--pink);
  box-shadow:6px 6px 0 rgba(0,0,0,.15);
  text-align:center;
  font-size:13px;
  font-weight:700;

  transform:
    translateX(-50%)
    translateY(100px);

  opacity:0;
  pointer-events:none;

  transition:
    transform .35s ease,
    opacity .35s ease;
}

.toast.show{
  transform:
    translateX(-50%)
    translateY(0);

  opacity:1;
}


/* =========================================
   ページ最上部へ戻るボタン
========================================= */

#backToTop{
  position:fixed;
  right:20px;
  bottom:20px;
  z-index:9000;

  width:46px;
  height:46px;

  display:flex;
  align-items:center;
  justify-content:center;

  border:none;
  border-radius:50%;

  background:#1e1e2f;
  color:#fff;

  font-family:'Noto Sans JP',sans-serif;
  font-size:24px;
  font-weight:700;
  line-height:1;

  cursor:pointer;

  box-shadow:
    3px 3px 0
    rgba(255,77,109,.45);

  opacity:0;
  visibility:hidden;

  transform:
    translateY(15px);

  transition:
    opacity .25s ease,
    visibility .25s ease,
    transform .25s ease,
    box-shadow .2s ease;
}

#backToTop.show{
  opacity:.92;
  visibility:visible;
  transform:translateY(0);
}

#backToTop:hover{
  opacity:1;
  transform:
    translateY(-2px);
}

#backToTop:active{
  transform:
    translateY(1px);
  box-shadow:
    1px 1px 0
    rgba(255,77,109,.45);
}


/* =========================================
   タブレット
========================================= */

@media(max-width:900px){

  .crowd-grid{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

}


/* =========================================
   スマートフォン
========================================= */

@media(max-width:600px){

  .bg-shapes{
    opacity:.18;
  }

  main{
    padding:
      calc(var(--header-height) + 28px)
      12px
      90px;
  }

  .page-heading{
    margin-bottom:24px;
  }

  .page-heading h1{
    font-size:
      clamp(27px,8vw,40px);

    padding:8px 0;
  }

  .page-heading p{
    margin-top:14px;
    line-height:1.75;
  }

  .notice-box{
    padding:17px 18px;
    border-left-width:5px;
    border-right-width:5px;
  }

  .notice-box strong{
    font-size:13px;
  }

  .notice-box span{
    font-size:11px;
  }

  .filter-area{
    padding:20px 15px;
  }

  .filter-group{
    gap:7px;
  }

  .filter-btn{
    padding:8px 12px;
    font-size:11px;
  }

  .keyword-search{
    font-size:13px;
    padding:11px 12px;
  }

  .crowd-grid{
    grid-template-columns:1fr;
    gap:15px;
  }

  .crowd-card{
    min-height:auto;
    padding:20px;
  }

  .crowd-card:hover{
    transform:none;
    box-shadow:
      8px 8px 0
      rgba(0,0,0,.08);
  }

  .crowd-card-title{
    margin:32px 0 17px!important;
    font-size:18px;
  }

  .status-options{
    grid-template-columns:1fr;
  }

  .share-modal{
    padding:23px 18px;
    box-shadow:
      8px 8px 0
      var(--pink);
  }

  .modal-title{
    font-size:18px;
  }

  .modal-actions{
    flex-direction:column-reverse;
  }

  .modal-btn{
    width:100%;
  }

  #backToTop{
    right:14px;
    bottom:16px;
    width:43px;
    height:43px;
    font-size:22px;
  }

}

</style>

</head>


<body>


<div class="bg-shapes">

  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>
  <div class="shape s4"></div>
  <div class="shape s5"></div>

</div>


<div id="header"></div>


<main>


  <section class="page-heading">

    <h1>
      ＼ 混雑情報 ／
    </h1>

    <p>
      各企画・教室の現在の混雑状況を確認できます。<br>
      現在の状況を知っている場合は、ぜひ情報共有にご協力ください。
    </p>

  </section>


  <div class="notice-box">

    <strong>
      みんなで最新の情報を共有しよう！
    </strong>

    <span>
      混雑情報は利用者から共有された情報をもとに表示します。<br>

<script>


/* =========================================
   ヘッダー読み込み
========================================= */

fetch("header.html")

  .then(
    res => res.text()
  )

  .then(
    data => {


      const headerContainer =
        document.getElementById(
          "header"
        );


      headerContainer.innerHTML =
        data;


      const header =
        headerContainer.querySelector(
          "header"
        );


      const btn =
        headerContainer.querySelector(
          ".menu-btn"
        );


      const nav =
        headerContainer.querySelector(
          ".nav"
        );


      function updateHeaderHeight(){

        if(!header){

          return;

        }


        const height =
          header
            .getBoundingClientRect()
            .height;


        document.documentElement.style.setProperty(
          "--header-height",
          height + "px"
        );

      }


      updateHeaderHeight();


      window.addEventListener(
        "resize",
        updateHeaderHeight
      );


      if(
        btn &&
        nav
      ){

        btn.addEventListener(
          "click",
          e => {

            e.stopPropagation();

            nav.classList.toggle(
              "active"
            );

          }
        );


        document.addEventListener(
          "click",
          e => {

            if(
              !nav.contains(
                e.target
              ) &&
              !btn.contains(
                e.target
              )
            ){

              nav.classList.remove(
                "active"
              );

            }

          }
        );

      }

    }
  )

  .catch(
    error => {

      console.error(
        "ヘッダーの読み込みに失敗しました",
        error
      );

    }
  );


/* =========================================
   API設定
========================================= */

const API_URL =
  "https://chosei-fes.onrender.com";


/* =========================================
   投稿インターバル設定
========================================= */

const POST_INTERVAL_MS =
  5 * 60 * 1000;


const LAST_POST_KEY =
  "chosei_fes_crowd_last_post_at";


/* =========================================
   DOM
========================================= */

const crowdGrid =
  document.getElementById(
    "crowdGrid"
  );


const resultCount =
  document.getElementById(
    "resultCount"
  );


const modalOverlay =
  document.getElementById(
    "modalOverlay"
  );


const modalPlace =
  document.getElementById(
    "modalPlace"
  );


const submitBtn =
  document.getElementById(
    "submitBtn"
  );


const cancelBtn =
  document.getElementById(
    "cancelBtn"
  );


const toast =
  document.getElementById(
    "toast"
  );


const keywordSearch =
  document.getElementById(
    "keywordSearch"
  );


const backToTop =
  document.getElementById(
    "backToTop"
  );


/* =========================================
   状態
========================================= */

let eventsData =
  [];


let selectedEvent =
  null;


let selectedStatus =
  null;


let categoryFilter =
  "all";


let floorFilter =
  "all";


let keywordFilter =
  "";


/* =========================================
   状態表示
========================================= */

const statusData = {

  empty:{
    text:
      "比較的空いています"
  },

  normal:{
    text:
      "やや混雑しています"
  },

  crowded:{
    text:
      "混雑しています"
  },

  unknown:{
    text:
      "まだ情報がありません"
  }

};


/* =========================================
   最後の投稿時刻取得
========================================= */

function getLastPostTime(){

  const value =
    localStorage.getItem(
      LAST_POST_KEY
    );


  if(!value){

    return null;

  }


  const time =
    Number(value);


  if(
    !Number.isFinite(
      time
    )
  ){

    return null;

  }


  return time;

}


/* =========================================
   残り投稿制限時間
========================================= */

function getRemainingPostTime(){

  const lastPostTime =
    getLastPostTime();


  if(!lastPostTime){

    return 0;

  }


  const elapsed =
    Date.now() -
    lastPostTime;


  const remaining =
    POST_INTERVAL_MS -
    elapsed;


  if(
    remaining <= 0
  ){

    localStorage.removeItem(
      LAST_POST_KEY
    );

    return 0;

  }


  return remaining;

}


/* =========================================
   残り時間を文字列化
========================================= */

function formatRemainingTime(ms){

  const totalSeconds =
    Math.ceil(
      ms / 1000
    );


  const minutes =
    Math.floor(
      totalSeconds / 60
    );


  const seconds =
    totalSeconds % 60;


  if(
    minutes > 0
  ){

    return (
      minutes +
      "分" +
      String(
        seconds
      ).padStart(
        2,
        "0"
      ) +
      "秒"
    );

  }


  return (
    seconds +
    "秒"
  );

}


/* =========================================
   events.htmlから企画を取得
========================================= */

async function loadEvents(){

  try{


    const response =
      await fetch(
        "events.html"
      );


    if(
      !response.ok
    ){

      throw new Error(
        "events.htmlを読み込めませんでした"
      );

    }


    const html =
      await response.text();


    const parser =
      new DOMParser();


    const documentData =
      parser.parseFromString(
        html,
        "text/html"
      );


    const groups =
      documentData.querySelectorAll(
        ".group"
      );


    const eventList =
      [];


    groups.forEach(
      group => {


        const groupTitleElement =
          group.querySelector(
            ".group-title"
          );


        if(
          !groupTitleElement
        ){

          return;

        }


        const groupTitle =
          groupTitleElement
            .textContent
            .trim();


        let category =
          "その他";


        if(
          groupTitle.includes(
            "1学年"
          )
        ){

          category =
            "1学年";

        }

        else if(
          groupTitle.includes(
            "2学年"
          )
        ){

          category =
            "2学年";

        }

        else if(
          groupTitle.includes(
            "3学年"
          )
        ){

          category =
            "3学年";

        }

        else if(
          groupTitle.includes(
            "部活動"
          ) ||
          groupTitle.includes(
            "同好会"
          )
        ){

          category =
            "部活動";

        }


        const cards =
          group.querySelectorAll(
            ".card"
          );


        cards.forEach(
          card => {


            const id =
              card.dataset.modalId;


            const titleElement =
              card.querySelector(
                ".card-title"
              );


            if(
              !id ||
              !titleElement
            ){

              return;

            }


            const title =
              titleElement
                .textContent
                .trim();


            const badge =
              card.dataset.placeBadge ||
              "";


            const floor =
              card.dataset.floor ||
              "";


            const labels =
              card.querySelectorAll(
                ".card-label"
              );


            let className =
              "";


            let location =
              "";


            labels.forEach(
              label => {


                const value =
                  label.nextElementSibling;


                if(
                  !value
                ){

                  return;

                }


                const labelText =
                  label.textContent
                    .trim();


                const valueText =
                  value.textContent
                    .trim();


                if(
                  labelText ===
                    "クラス" ||
                  labelText ===
                    "クラス・団体"
                ){

                  className =
                    valueText;

                }


                if(
                  labelText ===
                  "開催場所"
                ){

                  location =
                    valueText;

                }

              }
            );


            eventList.push({

              id:
                id,

              title:
                title,

              category:
                category,

              badge:
                badge,

              floor:
                floor,

              className:
                className,

              location:
                location,

              status:
                "unknown",

              updatedAt:
                null

            });

          }
        );

      }
    );


    eventsData =
      eventList;


    await loadCrowdStatus();


    renderEvents();

  }

  catch(error){


    console.error(
      error
    );


    crowdGrid.innerHTML = `

      <div class="error-message">

        <strong>
          企画情報を読み込めませんでした
        </strong>

        <span>
          ページを再読み込みしてください。
        </span>

      </div>

    `;

  }

}


/* =========================================
   Renderから混雑情報を取得
========================================= */

async function loadCrowdStatus(){

  if(
    !API_URL
  ){

    return;

  }


  try{


    const response =
      await fetch(
        API_URL +
        "/api/crowd",
        {
          cache:"no-store"
        }
      );


    if(
      !response.ok
    ){

      return;

    }


    const crowdData =
      await response.json();


    eventsData.forEach(
      event => {


        const saved =
          crowdData[event.id];


        if(
          !saved
        ){

          event.status =
            "unknown";

          event.updatedAt =
            null;

          return;

        }


        event.status =
          saved.status ||
          "unknown";


        event.updatedAt =
          saved.updatedAt ||
          null;

      }
    );

  }

  catch(error){


    console.error(
      "混雑情報の取得に失敗しました",
      error
    );

  }

}


/* =========================================
   カード表示
========================================= */

function renderEvents(){

  crowdGrid.innerHTML =
    "";


  let visibleCount =
    0;


  const remainingPostTime =
    getRemainingPostTime();


  eventsData.forEach(
    event => {


      const categoryMatch =
        categoryFilter ===
        "all" ||

        event.category ===
        categoryFilter;


      const floorMatch =
        floorFilter ===
        "all" ||

        String(
          event.floor
        ) ===
        String(
          floorFilter
        );


      const searchTarget =
        (
          event.title +
          " " +
          event.className +
          " " +
          event.location
        )
        .toLowerCase();


      const keywordMatch =
        !keywordFilter ||

        searchTarget.includes(
          keywordFilter.toLowerCase()
        );


      if(
        !categoryMatch ||
        !floorMatch ||
        !keywordMatch
      ){

        return;

      }


      visibleCount++;


      const card =
        document.createElement(
          "article"
        );


      card.className =
        "crowd-card";


      card.dataset.eventId =
        event.id;


      const status =
        statusData[
          event.status
        ] ||
        statusData.unknown;


      const timeText =
        getTimeText(
          event.updatedAt
        );


      const buttonText =
        remainingPostTime > 0
          ? "次の共有まで " +
            formatRemainingTime(
              remainingPostTime
            )
          : "混雑状況を共有する";


      card.innerHTML = `

        <div class="category-badge">

          ${escapeHtml(
            event.category
          )}

        </div>


        <h2 class="crowd-card-title">

          ${escapeHtml(
            event.title
          )}

        </h2>


        <div class="place-info">


          <div class="info-row">

            <div class="info-label">
              クラス・団体
            </div>

            <div class="info-value">

              ${
                escapeHtml(
                  event.className
                ) ||
                "－"
              }

            </div>

          </div>


          <div class="info-row">

            <div class="info-label">
              開催場所
            </div>

            <div class="info-value">

              ${
                escapeHtml(
                  event.location
                ) ||
                "－"
              }

            </div>

          </div>


        </div>


        <div class="status-area">


          <div class="status-label">
            現在の混雑状況
          </div>


          <div class="status-display">

            <span
              class="
                status-dot
                ${event.status}
              "
            ></span>


            <span class="status-text">

              ${status.text}

            </span>

          </div>


          <div class="status-time">

            ${timeText}

          </div>


          <button
            class="share-btn"
            type="button"
            ${
              remainingPostTime > 0
                ? "disabled"
                : ""
            }
          >

            ${buttonText}

          </button>


        </div>

      `;


      const shareButton =
        card.querySelector(
          ".share-btn"
        );


      shareButton.addEventListener(
        "click",
        () => {

          if(
            getRemainingPostTime() > 0
          ){

            return;

          }


          openShareModal(
            event
          );

        }
      );


      crowdGrid.appendChild(
        card
      );

    }
  );


  resultCount.textContent =
    visibleCount;


  if(
    visibleCount === 0
  ){

    crowdGrid.innerHTML = `

      <div class="error-message">

        <strong>
          条件に一致する企画がありません
        </strong>

        <span>
          別のキーワードや条件で検索してください。
        </span>

      </div>

    `;

  }

}


/* =========================================
   時間表示
========================================= */

function getTimeText(updatedAt){

  if(
    !updatedAt
  ){

    return
      "更新情報なし";

  }


  const date =
    new Date(
      updatedAt
    );


  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return
      "更新情報なし";

  }


  const now =
    new Date();


  const diffMs =
    Math.max(
      0,
      now.getTime() -
      date.getTime()
    );


  const diffMinutes =
    Math.floor(
      diffMs /
      1000 /
      60
    );


  if(
    diffMinutes < 1
  ){

    return
      "最終更新: たった今";

  }


  if(
    diffMinutes < 60
  ){

    return
      `最終更新: ${diffMinutes}分前`;

  }


  const diffHours =
    Math.floor(
      diffMinutes / 60
    );


  if(
    diffHours < 24
  ){

    return
      `最終更新: ${diffHours}時間前`;

  }


  const month =
    date.getMonth() +
    1;


  const day =
    date.getDate();


  const hour =
    String(
      date.getHours()
    ).padStart(
      2,
      "0"
    );


  const minute =
    String(
      date.getMinutes()
    ).padStart(
      2,
      "0"
    );


  return
    `最終更新: ${month}/${day} ${hour}:${minute}`;

}


/* =========================================
   HTMLエスケープ
========================================= */

function escapeHtml(value){

  if(
    value ===
    null ||

    value ===
    undefined
  ){

    return "";

  }


  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================
   キーワード検索
========================================= */

keywordSearch.addEventListener(
  "input",
  () => {

    keywordFilter =
      keywordSearch.value
        .trim();


    renderEvents();

  }
);


/* =========================================
   カテゴリフィルター
========================================= */

document
  .querySelectorAll(
    "[data-category]"
  )
  .forEach(
    button => {


      button.addEventListener(
        "click",
        () => {


          categoryFilter =
            button.dataset.category;


          document
            .querySelectorAll(
              "[data-category]"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "active"
                );

              }
            );


          button.classList.add(
            "active"
          );


          renderEvents();

        }
      );

    }
  );


/* =========================================
   階数フィルター
========================================= */

document
  .querySelectorAll(
    "[data-floor-filter]"
  )
  .forEach(
    button => {


      button.addEventListener(
        "click",
        () => {


          floorFilter =
            button.dataset.floorFilter;


          document
            .querySelectorAll(
              "[data-floor-filter]"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "active"
                );

              }
            );


          button.classList.add(
            "active"
          );


          renderEvents();

        }
      );

    }
  );


/* =========================================
   モーダルを開く
========================================= */

function openShareModal(event){

  const remaining =
    getRemainingPostTime();


  if(
    remaining > 0
  ){

    showToast(
      "次の共有まで " +
      formatRemainingTime(
        remaining
      ) +
      " お待ちください"
    );

    return;

  }


  selectedEvent =
    event;


  selectedStatus =
    null;


  submitBtn.disabled =
    true;


  document
    .querySelectorAll(
      ".status-option"
    )
    .forEach(
      option => {

        option.classList.remove(
          "selected"
        );

      }
    );


  modalPlace.textContent =
    event.title;


  modalOverlay.classList.add(
    "active"
  );


  document.body.style.overflow =
    "hidden";

}


/* =========================================
   モーダルを閉じる
========================================= */

function closeShareModal(){

  modalOverlay.classList.remove(
    "active"
  );


  document.body.style.overflow =
    "";


  selectedEvent =
    null;


  selectedStatus =
    null;

}


/* =========================================
   状況選択
========================================= */

document
  .querySelectorAll(
    ".status-option"
  )
  .forEach(
    option => {


      option.addEventListener(
        "click",
        () => {


          selectedStatus =
            option.dataset.status;


          document
            .querySelectorAll(
              ".status-option"
            )
            .forEach(
              item => {

                item.classList.remove(
                  "selected"
                );

              }
            );


          option.classList.add(
            "selected"
          );


          submitBtn.disabled =
            false;

        }
      );

    }
  );


/* =========================================
   キャンセル
========================================= */

cancelBtn.addEventListener(
  "click",
  closeShareModal
);


/* =========================================
   モーダル外クリック
========================================= */

modalOverlay.addEventListener(
  "click",
  event => {


    if(
      event.target ===
      modalOverlay
    ){

      closeShareModal();

    }

  }
);


/* =========================================
   混雑情報を共有
========================================= */

submitBtn.addEventListener(
  "click",
  async () => {


    if(
      !selectedEvent ||
      !selectedStatus
    ){

      return;

    }


    const remaining =
      getRemainingPostTime();


    if(
      remaining > 0
    ){

      showToast(
        "次の共有まで " +
        formatRemainingTime(
          remaining
        ) +
        " お待ちください"
      );

      closeShareModal();

      renderEvents();

      return;

    }


    submitBtn.disabled =
      true;


    submitBtn.textContent =
      "共有中...";


    try{


      const response =
        await fetch(
          API_URL +
          "/api/crowd",
          {

            method:
              "POST",

            headers:{
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify({

                id:
                  selectedEvent.id,

                status:
                  selectedStatus

              })

          }
        );


      if(
        !response.ok
      ){

        throw new Error(
          "情報の共有に失敗しました"
        );

      }


      const result =
        await response.json();


      localStorage.setItem(
        LAST_POST_KEY,
        String(
          Date.now()
        )
      );


      selectedEvent.status =
        result.status ||
        selectedStatus;


      selectedEvent.updatedAt =
        result.updatedAt ||
        new Date().toISOString();


      closeShareModal();


      renderEvents();


      showToast(
        "混雑状況を共有しました。次の共有は5分後から可能です。"
      );


    }

    catch(error){


      console.error(
        error
      );


      showToast(
        "共有に失敗しました。もう一度お試しください。"
      );


    }

    finally{


      submitBtn.disabled =
        false;


      submitBtn.textContent =
        "共有する";

    }

  }
);


/* =========================================
   トースト
========================================= */

let toastTimer;


function showToast(message){

  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      () => {

        toast.classList.remove(
          "show"
        );

      },
      3000
    );

}


/* =========================================
   投稿制限ボタンの定期更新
========================================= */

setInterval(
  () => {

    const remaining =
      getRemainingPostTime();


    if(
      remaining > 0
    ){

      renderEvents();

    }

    else{

      const buttons =
        document.querySelectorAll(
          ".share-btn:disabled"
        );


      if(
        buttons.length > 0
      ){

        renderEvents();

      }

    }

  },
  1000
);


/* =========================================
   最上部へ戻るボタン
========================================= */

function updateBackToTopButton(){

  if(
    window.scrollY > 300
  ){

    backToTop.classList.add(
      "show"
    );

  }

  else{

    backToTop.classList.remove(
      "show"
    );

  }

}


window.addEventListener(
  "scroll",
  updateBackToTopButton,
  {
    passive:true
  }
);


backToTop.addEventListener(
  "click",
  () => {

    window.scrollTo(
      {
        top:0,
        behavior:"smooth"
      }
    );

  }
);


/* =========================================
   初期読み込み
========================================= */

loadEvents();


updateBackToTopButton();


/* =========================================
   定期的に混雑情報を更新
========================================= */

setInterval(
  async () => {


    if(
      !API_URL
    ){

      return;

    }


    await loadCrowdStatus();


    renderEvents();

  },
  60000
);


</script>

</html>
