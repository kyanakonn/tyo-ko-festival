<style>

/* ==================================================
   基本
   ※背景・全体デザインは元コードのまま
================================================== */

body{
  font-family:'Noto Sans JP', sans-serif;
  margin:0;
  background:#F3F3F1;
}


/* ==================================================
   タブ
   ※変更なし
================================================== */

.tabs{
  display:flex;
  overflow-x:auto;
  border-bottom:2px solid #2a9d8f;
}

.tab{
  flex:0 0 auto;
  padding:12px 18px;
  border:2px solid #2a9d8f;
  border-bottom:none;
  cursor:pointer;
  font-weight:bold;
  color:#2a9d8f;
  background:#fff;
}

.tab.active{
  background:#2a9d8f;
  color:#fff;
}


/* ==================================================
   コンテンツ
   ※変更なし
================================================== */

.content{
  padding:20px;
}


/* ==================================================
   グループ
   ※変更なし
================================================== */

.group{
  width:100%;
  margin-bottom:40px;
}


/* ==================================================
   見出し
   ※変更なし
================================================== */

.group-title{
  display:inline-block;
  margin:20px 0 15px;
  font-size:20px;
  border-left:5px solid #2a9d8f;
  padding:6px 14px;
  background:#fff;
  border-radius:6px;
}


/* ==================================================
   グリッド
   ※カードを画像のような横長カードに調整
================================================== */

.grid{
  display:grid;

  /*
   * PCでは画像のように4列を基本にする
   */
  grid-template-columns:repeat(4, minmax(0, 1fr));

  gap:16px;

  width:100%;
}


/* ==================================================
   カード
   ※ここが今回の主な変更部分
================================================== */

.card{
  position:relative;

  /*
   * 背景
   */
  background:#fff;

  /*
   * 画像のような淡い青色の枠
   */
  border:1.5px solid #d7e4ff;

  /*
   * 角丸
   */
  border-radius:10px;

  /*
   * はみ出し防止
   */
  overflow:hidden;

  /*
   * 画像のように薄い影
   */
  box-shadow:
    0 4px 12px rgba(82,110,170,0.06);

  /*
   * カード内部
   */
  min-height:190px;

  padding:22px 22px 20px;

  box-sizing:border-box;

  cursor:pointer;

  /*
   * 既存のフェードイン機能を維持
   */
  opacity:0;

  transform:translateY(30px);

  transition:
    opacity 0.6s ease,
    transform 0.6s ease,
    box-shadow 0.25s ease,
    border-color 0.25s ease;
}


/* ==================================================
   表示状態
================================================== */

.card.show{
  opacity:1;
  transform:translateY(0);
}


/* ==================================================
   カード ホバー
================================================== */

.card:hover{
  border-color:#c9dcff;

  box-shadow:
    0 8px 22px rgba(82,110,170,0.12);

  transform:translateY(-3px);
}


/*
 * フェードイン表示後にホバーしたときの位置調整
 */
.card.show:hover{
  transform:translateY(-3px);
}


/* ==================================================
   カード左上
   「クラス企画」
================================================== */

.card::before{
  content:"クラス企画";

  position:absolute;

  top:22px;
  left:22px;

  font-size:15px;
  font-weight:700;

  color:#2864ff;

  line-height:1.4;

  pointer-events:none;
}


/* ==================================================
   カード右上
   「教室」バッジ
================================================== */

.card::after{
  content:"教室";

  position:absolute;

  top:18px;
  right:18px;

  display:flex;
  align-items:center;
  justify-content:center;

  min-width:50px;
  height:34px;

  padding:0 11px;

  box-sizing:border-box;

  border-radius:20px;

  background:#f1f6fd;

  color:#5d6d86;

  font-size:14px;
  font-weight:700;

  white-space:nowrap;

  pointer-events:none;
}


/* ==================================================
   カード画像
   ==================================================

   元コードの画像要素・画像ファイル自体は残したまま、
   画像のような「文字中心カード」にするため非表示。
================================================== */

.card img{
  display:none;
}


/* ==================================================
   カードタイトル
================================================== */

.card p{
  /*
   * 左上の「クラス企画」と
   * 右上の「教室」バッジの下に配置
   */
  margin:65px 0 0;

  padding:0;

  text-align:left;

  color:#17213a;

  font-size:20px;

  line-height:1.55;

  font-weight:700;

  letter-spacing:0.01em;

  word-break:break-word;
}


/* ==================================================
   カードクリック時
================================================== */

.card:active{
  transform:translateY(-1px);
}

.card.show:active{
  transform:translateY(-1px);
}


/* ==================================================
   非表示
   ※変更なし
================================================== */

.hidden{
  display:none;
}


/* ==================================================
   ヘッダー
   ※変更なし
================================================== */

.header-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.top-nav a{
  margin:0 10px;
  text-decoration:none;
}


/* ==================================================
   タブレット
================================================== */

@media (max-width:1100px){

  .grid{
    grid-template-columns:repeat(3, minmax(0, 1fr));
  }

}


/* ==================================================
   スマートフォン
================================================== */

@media (max-width:700px){

  .content{
    padding:15px;
  }

  .grid{
    grid-template-columns:repeat(2, minmax(0, 1fr));
    gap:12px;
  }

  .card{
    min-height:170px;

    padding:
      18px
      16px
      17px;
  }

  .card::before{
    top:18px;
    left:16px;

    font-size:13px;
  }

  .card::after{
    top:15px;
    right:14px;

    min-width:44px;
    height:29px;

    padding:0 8px;

    font-size:12px;
  }

  .card p{
    margin-top:56px;

    font-size:16px;

    line-height:1.5;
  }

}

================================================== */

  }

  .card p{

  }

}

<script>

/* ==================================================
   共通モーダル読み込み
================================================== */

let modalReady = false;


/*
 * modal.htmlを読み込む
 */

fetch("modal.html")

  .then(res => {

    if(!res.ok){

      throw new Error(
        "modal.htmlを読み込めませんでした"
      );

    }

    return res.text();

  })

  .then(data => {

    document
      .getElementById("modal-container")
      .innerHTML = data;

    modalReady = true;

    setupModal();


    /*
     * URLに ?modal=1a などがある場合
     * 自動的にモーダルを開く
     */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const modalId =
      params.get("modal");


    if(modalId){

      openModal(modalId);

    }

  })

  .catch(error => {

    console.error(
      "共通モーダルの読み込みエラー:",
      error
    );

  });


/* ==================================================
   モーダル変数
================================================== */

let modal = null;
let modalImg = null;
let modalTitle = null;
let modalPlace = null;
let modalDesc = null;
let modalLink = null;
let closeBtn = null;


/* ==================================================
   モーダル初期設定
================================================== */

function setupModal(){

  modal =
    document.getElementById("modal");

  modalImg =
    document.getElementById("modal-img");

  modalTitle =
    document.getElementById("modal-title");

  modalPlace =
    document.getElementById("modal-place");

  modalDesc =
    document.getElementById("modal-desc");

  modalLink =
    document.getElementById("modal-link");

  closeBtn =
    document.getElementById("modal-close");


  /*
   * 閉じるボタン
   */

  closeBtn.addEventListener(
    "click",
    closeModal
  );


  /*
   * モーダル外クリック
   */

  modal.addEventListener(
    "click",
    (e) => {

      if(e.target === modal){

        closeModal();

      }

    }
  );

}


/* ==================================================
   モーダルを開く
================================================== */

function openModal(id){

  if(!modalReady){

    return;

  }


  const data =
    document.getElementById(
      "modal-data-" + id
    );


  if(!data){

    console.warn(
      "モーダルデータが見つかりません:",
      id
    );

    return;

  }


  /*
   * 画像
   */

  modalImg.src =
    data.dataset.img;


  /*
   * タイトル
   */

  modalTitle.innerText =
    data.dataset.title;


  /*
   * 場所
   */

  modalPlace.innerText =
    data.dataset.place;


  /*
   * 説明
   */

  modalDesc.innerText =
    data.dataset.desc;


  /*
   * フロアマップリンク
   */

  modalLink.href =
    data.dataset.link;


  /*
   * 表示
   */

  modal.style.display = "flex";

}


/* ==================================================
   モーダルを閉じる
================================================== */

function closeModal(){

  if(!modal){

    return;

  }

  modal.style.display = "none";

}


/* ==================================================
   カードクリック
================================================== */

function setupCardModal(){

  document
    .querySelectorAll(
      ".card[data-modal-id]"
    )
    .forEach(card => {

      card.addEventListener(
        "click",
        () => {

          openModal(
            card.dataset.modalId
          );

        }
      );

    });

}


setupCardModal();


/* ==================================================
   タブ切り替え
================================================== */

const tabs =
  document.querySelectorAll(".tab");

const groups =
  document.querySelectorAll(".group");


tabs.forEach(tab => {

  tab.addEventListener(
    "click",
    () => {

      tabs.forEach(t => {

        t.classList.remove("active");

      });


      tab.classList.add("active");


      const cat =
        tab.dataset.cat;


      groups.forEach(group => {

        if(cat === "all"){

          group.style.display =
            "block";

        }else{

          group.style.display =
            group.dataset.cat === cat
              ? "block"
              : "none";

        }


        /*
         * フェードインをリセット
         */

        const cards =
          group.querySelectorAll(".card");


        cards.forEach(card => {

          card.classList.remove("show");

        });

      });


      setupScrollAnimation();

    }
  );

});


/* ==================================================
   初期ロード
================================================== */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const cat =
      params.get("cat");


    if(cat){

      tabs.forEach(t => {

        t.classList.remove("active");


        if(t.dataset.cat === cat){

          t.classList.add("active");

        }

      });


      groups.forEach(group => {

        group.style.display =
          group.dataset.cat === cat
            ? "block"
            : "none";


        const cards =
          group.querySelectorAll(".card");


        cards.forEach(card => {

          card.classList.remove("show");

        });

      });

    }


    setupScrollAnimation();

  }
);


/* ==================================================
   スクロールアニメーション
================================================== */

function setupScrollAnimation(){

  const cards =
    document.querySelectorAll(".card");


  const observer =
    new IntersectionObserver(
      (entries) => {

        entries.forEach(entry => {

          if(entry.isIntersecting){

            const card =
              entry.target;


            if(
              card.classList.contains("show")
            ){

              return;

            }


            const group =
              card.closest(".group");


            if(!group){

              return;

            }


            const cardsInGroup =
              Array.from(
                group.querySelectorAll(".card")
              );


            const index =
              cardsInGroup.indexOf(card);


            setTimeout(
              () => {

                card.classList.add("show");

              },
              index * 80
            );


            observer.unobserve(card);

          }

        });

      },
      {
        threshold:0.1
      }
    );


  cards.forEach(card => {

    observer.observe(card);

  });


  /*
   * 初期表示対策
   */

  setTimeout(
    () => {

      let delay = 0;


      cards.forEach(card => {

        const rect =
          card.getBoundingClientRect();


        if(
          rect.top <
          window.innerHeight
        ){

          setTimeout(
            () => {

              card.classList.add("show");

            },
            delay
          );


          delay += 80;

        }

      });

    },
    100
  );

}

</script>
