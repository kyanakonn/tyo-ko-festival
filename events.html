<style>

body{
  font-family:'Noto Sans JP', sans-serif;
  margin:0;
  background:#F3F3F1;
}


/* ===== タブ ===== */

.tabs{
  display:flex;
  overflow-x:auto;
  border-bottom:2px solid #2a9d8f;
}

.tab{
  flex:0 0 auto;
  padding:12px 18px;
  border:2px solid #2a9d8f;
  border-bottom:none;
  cursor:pointer;
  font-weight:bold;
  color:#2a9d8f;
  background:#fff;
}

.tab.active{
  background:#2a9d8f;
  color:#fff;
}


/* ===== コンテンツ ===== */

.content{
  padding:20px;
}


/* ===== グループ ===== */

.group{
  width:100%;
  margin-bottom:40px;
}


/* ===== 見出し ===== */

.group-title{
  display:inline-block;
  margin:20px 0 15px;
  font-size:20px;
  border-left:5px solid #2a9d8f;
  padding:6px 14px;
  background:#fff;
  border-radius:6px;
}


/* ===== グリッド ===== */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(140px, 1fr));
  gap:15px;
  width:100%;
}


/* ===== カード ===== */

.card{
  background:#fff;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.card img{
  width:100%;
  height:120px;
  object-fit:cover;
}

.card p{
  padding:8px;
  text-align:center;
  font-weight:bold;
}


/* ===== 非表示 ===== */

.hidden{
  display:none;
}


/* ===== ヘッダー ===== */

.header-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.top-nav a{
  margin:0 10px;
  text-decoration:none;
}


/* ===== フェードイン初期状態 ===== */

.card{
  opacity:0;
  transform:translateY(30px);
  transition:
    opacity 0.6s ease,
    transform 0.6s ease;
}


/* ===== 表示状態 ===== */

.card.show{
  opacity:1;
  transform:translateY(0);
}

</style>

   ================================================== */

fetch("header.html")

  .then(res => res.text())

  .then(data => {

    document.getElementById("header").innerHTML = data;

    const btn =
      document.querySelector(".menu-btn");

    const nav =
      document.querySelector(".nav");


    // 開閉

    btn.addEventListener("click", (e) => {

      e.stopPropagation();

      nav.classList.toggle("active");

    });


    document.addEventListener("click", (e) => {

      if(
        !nav.contains(e.target) &&
        !btn.contains(e.target)
      ){

        nav.classList.remove("active");

      }

    });

  });

<script>

/* ==================================================
   共通モーダル読み込み
   ================================================== */

let modalReady = false;


/*
 * modal.htmlを読み込む
 */

fetch("modal.html")

  .then(res => {

    if(!res.ok){

      throw new Error(
        "modal.htmlを読み込めませんでした"
      );

    }

    return res.text();

  })

  .then(data => {

    document
      .getElementById("modal-container")
      .innerHTML = data;

    modalReady = true;

    setupModal();


    /*
     * URLに ?modal=1a などがある場合
     * 自動的にモーダルを開く
     */

    const params =
      new URLSearchParams(
        window.location.search
      );

    const modalId =
      params.get("modal");


    if(modalId){

      openModal(modalId);

    }

  })

  .catch(error => {

    console.error(
      "共通モーダルの読み込みエラー:",
      error
    );

  });


/* ==================================================
   モーダル変数
   ================================================== */

let modal = null;
let modalImg = null;
let modalTitle = null;
let modalPlace = null;
let modalDesc = null;
let modalLink = null;
let closeBtn = null;


/* ==================================================
   モーダル初期設定
   ================================================== */

function setupModal(){

  modal =
    document.getElementById("modal");

  modalImg =
    document.getElementById("modal-img");

  modalTitle =
    document.getElementById("modal-title");

  modalPlace =
    document.getElementById("modal-place");

  modalDesc =
    document.getElementById("modal-desc");

  modalLink =
    document.getElementById("modal-link");

  closeBtn =
    document.getElementById("modal-close");


  /*
   * 閉じるボタン
   */

  closeBtn.addEventListener(
    "click",
    closeModal
  );


  /*
   * モーダル外クリック
   */

  modal.addEventListener(
    "click",
    (e) => {

      if(e.target === modal){

        closeModal();

      }

    }
  );

}


/* ==================================================
   モーダルを開く
   ================================================== */

function openModal(id){

  if(!modalReady){

    return;

  }


  const data =
    document.getElementById(
      "modal-data-" + id
    );


  if(!data){

    console.warn(
      "モーダルデータが見つかりません:",
      id
    );

    return;

  }


  /*
   * 画像
   */

  modalImg.src =
    data.dataset.img;


  /*
   * タイトル
   */

  modalTitle.innerText =
    data.dataset.title;


  /*
   * 場所
   */

  modalPlace.innerText =
    data.dataset.place;


  /*
   * 説明
   */

  modalDesc.innerText =
    data.dataset.desc;


  /*
   * フロアマップリンク
   */

  modalLink.href =
    data.dataset.link;


  /*
   * 表示
   */

  modal.style.display = "flex";

}


/* ==================================================
   モーダルを閉じる
   ================================================== */

function closeModal(){

  if(!modal){

    return;

  }

  modal.style.display = "none";

}


/* ==================================================
   カードクリック
   ================================================== */

function setupCardModal(){

  document
    .querySelectorAll(
      ".card[data-modal-id]"
    )
    .forEach(card => {

      card.addEventListener(
        "click",
        () => {

          openModal(
            card.dataset.modalId
          );

        }
      );

    });

}


setupCardModal();


/* ==================================================
   タブ切り替え
   ================================================== */

const tabs =
  document.querySelectorAll(".tab");

const groups =
  document.querySelectorAll(".group");


tabs.forEach(tab => {

  tab.addEventListener(
    "click",
    () => {

      tabs.forEach(t => {

        t.classList.remove("active");

      });


      tab.classList.add("active");


      const cat =
        tab.dataset.cat;


      groups.forEach(group => {

        if(cat === "all"){

          group.style.display =
            "block";

        }else{

          group.style.display =
            group.dataset.cat === cat
              ? "block"
              : "none";

        }


        /*
         * フェードインをリセット
         */

        const cards =
          group.querySelectorAll(".card");


        cards.forEach(card => {

          card.classList.remove("show");

        });

      });


      setupScrollAnimation();

    }
  );

});


/* ==================================================
   初期ロード
   ================================================== */

window.addEventListener(
  "DOMContentLoaded",
  () => {

    const params =
      new URLSearchParams(
        window.location.search
      );


    const cat =
      params.get("cat");


    if(cat){

      tabs.forEach(t => {

        t.classList.remove("active");


        if(t.dataset.cat === cat){

          t.classList.add("active");

        }

      });


      groups.forEach(group => {

        group.style.display =
          group.dataset.cat === cat
            ? "block"
            : "none";


        const cards =
          group.querySelectorAll(".card");


        cards.forEach(card => {

          card.classList.remove("show");

        });

      });

    }


    setupScrollAnimation();

  }
);


/* ==================================================
   スクロールアニメーション
   ================================================== */

function setupScrollAnimation(){

  const cards =
    document.querySelectorAll(".card");


  const observer =
    new IntersectionObserver(
      (entries) => {

        entries.forEach(entry => {

          if(entry.isIntersecting){

            const card =
              entry.target;


            if(
              card.classList.contains("show")
            ){

              return;

            }


            const group =
              card.closest(".group");


            if(!group){

              return;

            }


            const cardsInGroup =
              Array.from(
                group.querySelectorAll(".card")
              );


            const index =
              cardsInGroup.indexOf(card);


            setTimeout(
              () => {

                card.classList.add("show");

              },
              index * 80
            );


            observer.unobserve(card);

          }

        });

      },
      {
        threshold:0.1
      }
    );


  cards.forEach(card => {

    observer.observe(card);

  });


  /*
   * 初期表示対策
   */

  setTimeout(
    () => {

      let delay = 0;


      cards.forEach(card => {

        const rect =
          card.getBoundingClientRect();


        if(
          rect.top <
          window.innerHeight
        ){

          setTimeout(
            () => {

              card.classList.add("show");

            },
            delay
          );


          delay += 80;

        }

      });

    },
    100
  );

}

</script>
