<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, user-scalable=no"
>

<title>場所の詳細</title>

<style>

/* =========================================
   modal3.html
   2棟フロアマップ用 場所詳細モーダル
   modal2.html と同じデザイン
========================================= */

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
  font-family: sans-serif;
}

* {
  box-sizing: border-box;
}


/* =========================================
   モーダル全体
========================================= */

.modal-page {
  position: fixed;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: transparent;
}


/* =========================================
   モーダルカード
========================================= */

.modal-card {
  position: relative;

  width: min(480px, 92vw);

  max-height: 82vh;

  overflow-y: auto;

  padding: 28px 22px 22px;

  background: #eeedeb;

  border-radius: 20px;

  border-top: 7px solid #06254f;

  box-shadow:
    0 18px 50px rgba(0, 0, 0, 0.30);
}


/* =========================================
   装飾図形
========================================= */

.modal-card::before,
.modal-card::after {
  content: "";

  position: absolute;

  pointer-events: none;
}


.modal-card::before {
  top: 0;
  right: 0;

  width: 62px;
  height: 62px;

  background: #8f5bd0;

  clip-path:
    polygon(
      100% 0,
      100% 100%,
      30% 0
    );

  opacity: 0.82;

  border-top-right-radius: 14px;
}


.modal-card::after {
  bottom: 0;
  left: 0;

  width: 48px;
  height: 48px;

  background: #15929e;

  clip-path:
    polygon(
      0 100%,
      100% 100%,
      0 25%
    );

  opacity: 0.82;

  border-bottom-left-radius: 14px;
}


/* =========================================
   閉じるボタン
========================================= */

.modal-close {
  position: absolute;

  top: 13px;
  right: 14px;

  z-index: 2;

  width: 36px;
  height: 36px;

  padding: 0;

  border: none;

  border-radius: 50%;

  background: #d92a21;

  color: #fff;

  font-size: 21px;

  line-height: 1;

  font-weight: 700;

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}


.modal-close:active {
  opacity: 0.65;
}


/* =========================================
   ラベル
========================================= */

.modal-label {
  display: inline-block;

  margin: 0 0 8px;

  padding: 4px 10px;

  border-radius: 999px;

  background: #8f5bd0;

  color: #fff;

  font-size: 12px;

  font-weight: 800;

  letter-spacing: 0.08em;
}


/* =========================================
   タイトル
========================================= */

.modal-title {
  margin: 0 48px 5px 0;

  color: #06254f;

  font-size: 25px;

  line-height: 1.35;

  font-weight: 900;

  letter-spacing: 0.04em;
}


/* =========================================
   サブタイトル
========================================= */

.modal-subtitle {
  margin: 0 0 18px;

  color: #555;

  font-size: 13px;

  font-weight: 700;
}


/* =========================================
   本文
========================================= */

.modal-body {
  position: relative;

  z-index: 1;

  padding: 16px 15px;

  background: #fff;

  border-radius: 12px;

  border-left: 5px solid #15929e;

  color: #222;

  font-size: 14px;

  line-height: 1.75;

  font-weight: 600;
}


/* =========================================
   注意書き
========================================= */

.modal-note {
  margin: 14px 2px 0;

  color: #666;

  font-size: 11px;

  line-height: 1.6;

  font-weight: 600;
}


/* =========================================
   マップに戻るボタン
========================================= */

.modal-map-button {
  width: 100%;

  margin-top: 18px;

  padding: 12px 14px;

  border: none;

  border-radius: 10px;

  background: #06254f;

  color: #fff;

  font-size: 15px;

  font-weight: 800;

  letter-spacing: 0.04em;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}


.modal-map-button:active {
  opacity: 0.65;
}


/* =========================================
   スマホ
========================================= */

@media (max-width: 600px) {

  .modal-page {
    padding: 14px;
  }


  .modal-card {
    width: 94vw;

    max-height: 84vh;

    padding: 24px 16px 17px;

    border-radius: 17px;

    border-top-width: 6px;
  }


  .modal-card::before {
    width: 48px;
    height: 48px;
  }


  .modal-card::after {
    width: 38px;
    height: 38px;
  }


  .modal-close {
    top: 10px;
    right: 11px;

    width: 33px;
    height: 33px;

    font-size: 19px;
  }


  .modal-label {
    margin-bottom: 7px;

    font-size: 11px;
  }


  .modal-title {
    font-size: 21px;

    margin-right: 42px;
  }


  .modal-subtitle {
    margin-bottom: 14px;

    font-size: 12px;
  }


  .modal-body {
    padding: 13px 12px;

    font-size: 13px;

    border-left-width: 4px;
  }


  .modal-map-button {
    margin-top: 14px;

    padding: 11px;

    font-size: 14px;
  }

}

</style>
</head>


<body>


<div
  class="modal-page"
  id="modalPage"
>


  <section
    class="modal-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
  >


    <!-- =====================================
         閉じる
    ====================================== -->

    <button
      class="modal-close"
      id="modalClose"
      type="button"
      aria-label="閉じる"
    >
      ×
    </button>


    <!-- =====================================
         ラベル
    ====================================== -->

    <div class="modal-label">
      2棟 FLOOR MAP
    </div>


    <!-- =====================================
         タイトル
    ====================================== -->

    <h1
      class="modal-title"
      id="modalTitle"
    >
      場所の詳細
    </h1>


    <!-- =====================================
         サブタイトル
    ====================================== -->

    <p
      class="modal-subtitle"
      id="modalSubtitle"
    >
      フロアマップ上の場所
    </p>


    <!-- =====================================
         本文
    ====================================== -->

    <div
      class="modal-body"
      id="modalBody"
    ></div>


    <!-- =====================================
         注意書き
    ====================================== -->

    <p
      class="modal-note"
      id="modalNote"
    >
      フロアマップ上の紫色のエリアをタップすると、この詳細画面を表示できます。
    </p>


    <!-- =====================================
         マップに戻る
    ====================================== -->

    <button
      class="modal-map-button"
      id="modalMapButton"
      type="button"
    >
      マップに戻る
    </button>


  </section>


</div>


<script>


/* =========================================
   2棟 モーダルデータ
========================================= */

const modalData = {


  /* =========================================
     2棟 1階
  ========================================= */


  "cha": {

    title: "茶道部",

    subtitle: "2棟 1階・茶道部",

    body:
      "茶道部の企画・体験エリアです。2棟1階のフロアマップ上に表示されています。"
  },


  "science-kagaku": {

    title: "サイエンス部 科学班",

    subtitle: "2棟 1階・サイエンス部 科学班",

    body:
      "サイエンス部 科学班の企画・展示エリアです。2棟1階のフロアマップ上に表示されています。"
  },


  /* =========================================
     2棟 2階
  ========================================= */


  "art": {

    title: "美術部",

    subtitle: "2棟 2階・美術部",

    body:
      "美術部の作品展示・企画エリアです。2棟2階のフロアマップ上に表示されています。"
  },


  "science-butsuri": {

    title: "サイエンス部 物理班",

    subtitle: "2棟 2階・サイエンス部 物理班",

    body:
      "サイエンス部 物理班の企画・展示エリアです。2棟2階のフロアマップ上に表示されています。"
  },


  "shogi": {

    title: "将棋部",

    subtitle: "2棟 2階・将棋部",

    body:
      "将棋部の企画・体験エリアです。2棟2階のフロアマップ上に表示されています。"
  },


  /* =========================================
     2棟 3階
  ========================================= */


  "science-seibutsu": {

    title: "サイエンス部 生物班",

    subtitle: "2棟 3階・サイエンス部 生物班",

    body:
      "サイエンス部 生物班の企画・展示エリアです。2棟3階のフロアマップ上に表示されています。"
  },


  /* =========================================
     2棟 4階
  ========================================= */


  "science-chigaku": {

    title: "サイエンス部 地学班",

    subtitle: "2棟 4階・サイエンス部 地学班",

    body:
      "サイエンス部 地学班の企画・展示エリアです。2棟4階のフロアマップ上に表示されています。"
  }


};


/* =========================================
   URLパラメータ取得
========================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const type =
  params.get("type") || "cha";


/* =========================================
   データ取得
========================================= */

const data =
  modalData[type] || modalData.cha;


/* =========================================
   モーダルへ反映
========================================= */

document
  .getElementById("modalTitle")
  .textContent = data.title;


document
  .getElementById("modalSubtitle")
  .textContent = data.subtitle;


document
  .getElementById("modalBody")
  .textContent = data.body;


/* =========================================
   モーダルを閉じる
========================================= */

function closeModal() {


  /*
    親ページからモーダルを表示している場合
  */

  if (
    window.parent &&
    window.parent !== window
  ) {

    window.parent.postMessage(
      {
        type: "close-map-modal"
      },
      "*"
    );

  }


  /*
    単独ページとして開いた場合
  */

  else {

    window.history.back();

  }

}


/* =========================================
   ×ボタン
========================================= */

document
  .getElementById("modalClose")
  .addEventListener(
    "click",
    closeModal
  );


/* =========================================
   マップに戻る
========================================= */

document
  .getElementById("modalMapButton")
  .addEventListener(
    "click",
    closeModal
  );


/* =========================================
   背景タップで閉じる
========================================= */

document
  .getElementById("modalPage")
  .addEventListener(
    "click",
    (e) => {

      if (
        e.target.id === "modalPage"
      ) {

        closeModal();

      }

    }
  );


/* =========================================
   ESCキー
========================================= */

document.addEventListener(
  "keydown",
  (e) => {

    if (e.key === "Escape") {

      closeModal();

    }

  }
);


</script>

</body>
</html>
