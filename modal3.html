<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, user-scalable=no"
>

<title>場所の詳細</title>

<style>

/* =========================================
   modal3.html
   2棟フロアマップ用 場所詳細モーダル

   modal2.html と同じデザイン
========================================= */

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: transparent;
  font-family: sans-serif;
}

* {
  box-sizing: border-box;
}


/* =========================================
   モーダル全体
========================================= */

.modal-page {
  position: fixed;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 20px;

  background: transparent;
}


/* =========================================
   モーダルカード
========================================= */

.modal-card {
  position: relative;

  width: min(480px, 92vw);

  max-height: 82vh;

  overflow-y: auto;

  padding: 28px 22px 22px;

  background: #eeedeb;

  border-radius: 20px;

  border-top: 7px solid #06254f;

  box-shadow:
    0 18px 50px rgba(0, 0, 0, 0.30);
}


/* =========================================
   装飾図形
========================================= */

.modal-card::before,
.modal-card::after {
  content: "";

  position: absolute;

  pointer-events: none;
}


.modal-card::before {
  top: 0;
  right: 0;

  width: 62px;
  height: 62px;

  background: #8f5bd0;

  clip-path:
    polygon(
      100% 0,
      100% 100%,
      30% 0
    );

  opacity: 0.82;

  border-top-right-radius: 14px;
}


.modal-card::after {
  bottom: 0;
  left: 0;

  width: 48px;
  height: 48px;

  background: #15929e;

  clip-path:
    polygon(
      0 100%,
      100% 100%,
      0 25%
    );

  opacity: 0.82;

  border-bottom-left-radius: 14px;
}


/* =========================================
   閉じるボタン
========================================= */

.modal-close {
  position: absolute;

  top: 13px;
  right: 14px;

  z-index: 2;

  width: 36px;
  height: 36px;

  padding: 0;

  border: none;

  border-radius: 50%;

  background: #d92a21;

  color: #fff;

  font-size: 21px;

  line-height: 1;

  font-weight: 700;

  display: flex;

  align-items: center;
  justify-content: center;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}


.modal-close:active {
  opacity: 0.65;
}


/* =========================================
   上部ラベル
========================================= */

.modal-label {
  display: inline-block;

  margin: 0 0 8px;

  padding: 4px 10px;

  border-radius: 999px;

  background: #8f5bd0;

  color: #fff;

  font-size: 12px;

  font-weight: 800;

  letter-spacing: 0.08em;
}


/* =========================================
   タイトル
========================================= */

.modal-title {
  margin: 0 48px 5px 0;

  color: #06254f;

  font-size: 25px;

  line-height: 1.35;

  font-weight: 900;

  letter-spacing: 0.04em;
}


/* =========================================
   サブタイトル
========================================= */

.modal-subtitle {
  margin: 0 0 18px;

  color: #555;

  font-size: 13px;

  font-weight: 700;
}


/* =========================================
   情報エリア
========================================= */

.modal-info {
  position: relative;

  z-index: 1;

  overflow: hidden;

  background: #fff;

  border-radius: 12px;

  border-left: 5px solid #15929e;
}


/* =========================================
   情報1項目
========================================= */

.info-row {
  display: flex;

  align-items: stretch;

  border-bottom: 1px solid #e5e5e5;
}


.info-row:last-child {
  border-bottom: none;
}


/* =========================================
   項目ラベル
========================================= */

.info-label {
  flex: 0 0 92px;

  padding: 12px 10px;

  background: #f1f1f1;

  color: #06254f;

  font-size: 12px;

  line-height: 1.5;

  font-weight: 800;
}


/* =========================================
   項目内容
========================================= */

.info-value {
  flex: 1;

  padding: 12px 13px;

  color: #222;

  font-size: 14px;

  line-height: 1.6;

  font-weight: 600;
}


/* =========================================
   説明
========================================= */

.modal-description {
  position: relative;

  z-index: 1;

  margin-top: 12px;

  padding: 14px 15px;

  background: #fff;

  border-radius: 12px;

  border-left: 5px solid #15929e;

  color: #222;

  font-size: 14px;

  line-height: 1.75;

  font-weight: 600;
}


/* =========================================
   注意書き
========================================= */

.modal-note {
  margin: 14px 2px 0;

  color: #666;

  font-size: 11px;

  line-height: 1.6;

  font-weight: 600;
}


/* =========================================
   マップに戻るボタン
========================================= */

.modal-map-button {
  width: 100%;

  margin-top: 18px;

  padding: 12px 14px;

  border: none;

  border-radius: 10px;

  background: #06254f;

  color: #fff;

  font-size: 15px;

  font-weight: 800;

  letter-spacing: 0.04em;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}


.modal-map-button:active {
  opacity: 0.65;
}


/* =========================================
   スマートフォン
========================================= */

@media (max-width: 600px) {

  .modal-page {
    padding: 14px;
  }


  .modal-card {
    width: 94vw;

    max-height: 84vh;

    padding: 24px 16px 17px;

    border-radius: 17px;

    border-top-width: 6px;
  }


  .modal-card::before {
    width: 48px;
    height: 48px;
  }


  .modal-card::after {
    width: 38px;
    height: 38px;
  }


  .modal-close {
    top: 10px;
    right: 11px;

    width: 33px;
    height: 33px;

    font-size: 19px;
  }


  .modal-label {
    margin-bottom: 7px;

    font-size: 11px;
  }


  .modal-title {
    font-size: 21px;

    margin-right: 42px;
  }


  .modal-subtitle {
    margin-bottom: 14px;

    font-size: 12px;
  }


  .info-label {
    flex: 0 0 76px;

    padding: 10px 8px;

    font-size: 11px;
  }


  .info-value {
    padding: 10px 10px;

    font-size: 13px;
  }


  .modal-description {
    padding: 13px 12px;

    font-size: 13px;

    border-left-width: 4px;
  }


  .modal-map-button {
    margin-top: 14px;

    padding: 11px;

    font-size: 14px;
  }

}

</style>
</head>


<body>


<div
  class="modal-page"
  id="modalPage"
>


  <section
    class="modal-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="modalTitle"
  >


    <!-- =====================================
         閉じる
    ====================================== -->

    <button
      class="modal-close"
      id="modalClose"
      type="button"
      aria-label="閉じる"
    >
      ×
    </button>


    <!-- =====================================
         階数
    ====================================== -->

    <div
      class="modal-label"
      id="modalLabel"
    >
      2棟 FLOOR MAP
    </div>


    <!-- =====================================
         タイトル
    ====================================== -->

    <h1
      class="modal-title"
      id="modalTitle"
    >
      場所の詳細
    </h1>


    <!-- =====================================
         サブタイトル
    ====================================== -->

    <p
      class="modal-subtitle"
      id="modalSubtitle"
    >
      フロアマップ上の場所
    </p>


    <!-- =====================================
         基本情報
    ====================================== -->

    <div
      class="modal-info"
      id="modalInfo"
    >

      <div class="info-row">

        <div class="info-label">
          クラス・団体
        </div>

        <div
          class="info-value"
          id="modalClass"
        >
          -
        </div>

      </div>


      <div class="info-row">

        <div class="info-label">
          開催場所
        </div>

        <div
          class="info-value"
          id="modalPlace"
        >
          -
        </div>

      </div>


      <div class="info-row">

        <div class="info-label">
          企画
        </div>

        <div
          class="info-value"
          id="modalEvent"
        >
          -
        </div>

      </div>

    </div>


    <!-- =====================================
         説明
    ====================================== -->

    <div
      class="modal-description"
      id="modalDescription"
    >
    </div>


    <!-- =====================================
         注意書き
    ====================================== -->

    <p
      class="modal-note"
      id="modalNote"
    >
      フロアマップ上の紫色のエリアをタップすると、
      この詳細画面を表示できます。
    </p>


    <!-- =====================================
         マップに戻る
    ====================================== -->

    <button
      class="modal-map-button"
      id="modalMapButton"
      type="button"
    >
      マップに戻る
    </button>


  </section>


</div>


<script>

/* ==================================================
   2棟フロアマップ モーダルデータ
================================================== */

const modalData = {


  /* =========================================
     2棟1階
  ========================================= */

  "cha": {

    floor: "2棟 1階 FLOOR MAP",

    title: "茶道部",

    subtitle: "2棟 1階・茶道部",

    className: "茶道部",

    place: "2棟 1階・茶道室",

    event: "企画・体験",

    description:
      "茶道部の企画・体験エリアです。2棟1階のフロアマップ上に表示されています。"

  },


  "science-kagaku": {

    floor: "2棟 1階 FLOOR MAP",

    title: "サイエンス部 科学班",

    subtitle: "2棟 1階・サイエンス部 科学班",

    className: "サイエンス部 科学班",

    place: "2棟 1階・科学班",

    event: "企画・展示",

    description:
      "サイエンス部 科学班の企画・展示エリアです。2棟1階のフロアマップ上に表示されています。"

  },


  /* =========================================
     2棟2階
  ========================================= */

  "art": {

    floor: "2棟 2階 FLOOR MAP",

    title: "美術部",

    subtitle: "2棟 2階・美術部",

    className: "美術部",

    place: "2棟 2階・美術室",

    event: "作品展示・企画",

    description:
      "美術部の作品展示・企画エリアです。2棟2階のフロアマップ上に表示されています。"

  },


  "science-butsuri": {

    floor: "2棟 2階 FLOOR MAP",

    title: "サイエンス部 物理班",

    subtitle: "2棟 2階・サイエンス部 物理班",

    className: "サイエンス部 物理班",

    place: "2棟 2階・物理班",

    event: "企画・展示",

    description:
      "サイエンス部 物理班の企画・展示エリアです。2棟2階のフロアマップ上に表示されています。"

  },


  "shogi": {

    floor: "2棟 2階 FLOOR MAP",

    title: "将棋部",

    subtitle: "2棟 2階・将棋部",

    className: "将棋部",

    place: "2棟 2階・将棋部",

    event: "企画・体験",

    description:
      "将棋部の企画・体験エリアです。2棟2階のフロアマップ上に表示されています。"

  },


  /* =========================================
     2棟3階
  ========================================= */

  "science-seibutsu": {

    floor: "2棟 3階 FLOOR MAP",

    title: "サイエンス部 生物班",

    subtitle: "2棟 3階・サイエンス部 生物班",

    className: "サイエンス部 生物班",

    place: "2棟 3階・生物班",

    event: "企画・展示",

    description:
      "サイエンス部 生物班の企画・展示エリアです。2棟3階のフロアマップ上に表示されています。"

  },


  /* =========================================
     2棟4階
  ========================================= */

  "science-chigaku": {

    floor: "2棟 4階 FLOOR MAP",

    title: "サイエンス部 地学班",

    subtitle: "2棟 4階・サイエンス部 地学班",

    className: "サイエンス部 地学班",

    place: "2棟 4階・地学班",

    event: "企画・展示",

    description:
      "サイエンス部 地学班の企画・展示エリアです。2棟4階のフロアマップ上に表示されています。"

  }


};


/* ==================================================
   URLからtypeを取得
================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const type =
  params.get("type") || "cha";


/* ==================================================
   データ取得
================================================== */

const data =
  modalData[type] || modalData.cha;


/* ==================================================
   データを表示
================================================== */

document
  .getElementById("modalLabel")
  .textContent =
  data.floor;


document
  .getElementById("modalTitle")
  .textContent =
  data.title;


document
  .getElementById("modalSubtitle")
  .textContent =
  data.subtitle;


document
  .getElementById("modalClass")
  .textContent =
  data.className;


document
  .getElementById("modalPlace")
  .textContent =
  data.place;


document
  .getElementById("modalEvent")
  .textContent =
  data.event;


document
  .getElementById("modalDescription")
  .textContent =
  data.description;


/* ==================================================
   モーダルを閉じる
================================================== */

function closeModal() {

  /*
    親ページからモーダルを表示している場合
  */

  if (
    window.parent &&
    window.parent !== window
  ) {

    window.parent.postMessage(
      {
        type: "close-map-modal"
      },
      "*"
    );

  }


  /*
    単独ページとして開いた場合
  */

  else {

    window.history.back();

  }

}


/* ==================================================
   ×ボタン
================================================== */

document
  .getElementById("modalClose")
  .addEventListener(
    "click",
    closeModal
  );


/* ==================================================
   マップに戻る
================================================== */

document
  .getElementById("modalMapButton")
  .addEventListener(
    "click",
    closeModal
  );


/* ==================================================
   背景クリック
================================================== */

document
  .getElementById("modalPage")
  .addEventListener(
    "click",
    (e) => {

      if (
        e.target.id === "modalPage"
      ) {

        closeModal();

      }

    }
  );


/* ==================================================
   Escキー
================================================== */

document.addEventListener(
  "keydown",
  (e) => {

    if (e.key === "Escape") {

      closeModal();

    }

  }
);

</script>

</body>
</html>
