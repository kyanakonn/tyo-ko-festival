<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>長生高校文化祭2026｜長高祭【公式】サイト</title>

<meta
  name="description"
  content="長高祭2026 公式サイト オープニング"
/>

<link
  href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap"
  rel="stylesheet"
>

<style>

/* =========================================
   基本設定
========================================= */

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  width: 100%;
  min-height: 100%;
  background: #EEEEEC;
  scroll-behavior: smooth;
}

body {
  width: 100%;
  min-height: 100%;
  margin: 0;
  padding: 0;

  font-family: 'Noto Sans JP', sans-serif;

  background: #EEEEEC;

  color: #333;

  overflow-x: hidden;
}


/* =========================================
   オープニング全体
========================================= */

.intro-page {
  position: relative;

  width: 100%;
  min-height: 200vh;

  overflow: hidden;

  background: #EEEEEC;
}


/* =========================================
   ローポリ背景
========================================= */

.intro-shapes {
  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  pointer-events: none;

  z-index: 1;
}


.intro-shape {
  position: absolute;

  opacity: 0.9;
}


.intro-s1 {
  top: 8%;
  left: -50px;

  width: 0;
  height: 0;

  border-left: 85px solid transparent;
  border-right: 85px solid transparent;
  border-bottom: 150px solid #c85c72;

  transform: rotate(-25deg);
}


.intro-s2 {
  top: 30%;
  left: -65px;

  width: 0;
  height: 0;

  border-left: 75px solid transparent;
  border-right: 75px solid transparent;
  border-bottom: 135px solid #8060a8;

  transform: rotate(20deg);
}


.intro-s3 {
  bottom: 2%;
  left: -70px;

  width: 0;
  height: 0;

  border-left: 115px solid transparent;
  border-right: 115px solid transparent;
  border-bottom: 205px solid #d1a92f;

  transform: rotate(12deg);
}


.intro-s4 {
  top: 5%;
  right: -90px;

  width: 0;
  height: 0;

  border-left: 150px solid transparent;
  border-right: 150px solid transparent;
  border-bottom: 260px solid #4f9fa5;

  transform: rotate(30deg);
}


.intro-s5 {
  top: 40%;
  right: -50px;

  width: 0;
  height: 0;

  border-left: 90px solid transparent;
  border-right: 90px solid transparent;
  border-bottom: 165px solid #3f9da9;

  transform: rotate(-18deg);
}


.intro-s6 {
  bottom: -50px;
  right: -60px;

  width: 0;
  height: 0;

  border-left: 110px solid transparent;
  border-right: 110px solid transparent;
  border-bottom: 200px solid #c85c72;

  transform: rotate(-15deg);
}


.intro-s7 {
  top: 20%;
  left: 9%;

  width: 80px;
  height: 130px;

  background: #9b668f;

  transform: rotate(28deg);
}


.intro-s8 {
  top: 55%;
  right: 8%;

  width: 110px;
  height: 70px;

  background: #4b8f9b;

  transform: rotate(-20deg);
}


.intro-s9 {
  bottom: 17%;
  left: 16%;

  width: 70px;
  height: 105px;

  background: #66558f;

  transform: rotate(25deg);
}


.intro-s10 {
  top: 30%;
  right: 16%;

  width: 75px;
  height: 75px;

  background: #c49b35;

  transform: rotate(18deg);
}


.intro-s11 {
  top: 20%;
  left: 30%;

  width: 0;
  height: 0;

  border-left: 30px solid transparent;
  border-right: 30px solid transparent;
  border-bottom: 55px solid #f0a12b;

  transform: rotate(15deg);
}


.intro-s12 {
  bottom: 22%;
  right: 28%;

  width: 0;
  height: 0;

  border-left: 25px solid transparent;
  border-right: 25px solid transparent;
  border-bottom: 45px solid #ff4d6d;

  transform: rotate(-20deg);
}


/* =========================================
   1画面目
========================================= */

.intro-first {
  position: relative;

  width: 100%;
  height: 100vh;
  min-height: 600px;

  display: flex;

  align-items: center;
  justify-content: center;

  z-index: 5;
}


.intro-first-content {
  position: relative;

  z-index: 10;

  width: 90%;
  max-width: 650px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: flex-start;

  text-align: center;

  /*
    余計な上部余白を削除
  */
  padding-top: 0;

  /*
    画面中央より少し上へ移動
    タイトル上の大きな空白を削減
  */
  transform: translateY(-8vh);
}


/* =========================================
   画像の上の文字
========================================= */

.intro-heading {
  width: 100%;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  margin-bottom: 18px;

  opacity: 0;

  transform:
    translateY(25px);

  transition:
    opacity 1s ease,
    transform 1s ease;
}


.intro-heading-main {
  color: #000;

  font-size: clamp(
    34px,
    7vw,
    58px
  );

  font-weight: 900;

  line-height: 1.15;

  letter-spacing: 3px;

  margin-bottom: 8px;
}


.intro-heading-sub {
  color: #000;

  font-size: clamp(
    22px,
    4.5vw,
    36px
  );

  font-weight: 700;

  line-height: 1.3;

  letter-spacing: 2px;

  white-space: nowrap;
}


.intro-heading.is-visible {
  opacity: 1;

  transform:
    translateY(0);
}


/* =========================================
   ロゴ
========================================= */

.intro-logo-wrap {
  position: relative;

  display: block;

  width: min(72vw, 520px);

  overflow: hidden;

  opacity: 0;

  transform:
    translateY(30px);

  transition:
    opacity 1s ease,
    transform 1s ease;
}


.intro-logo {
  display: block;

  width: 100%;
  height: auto;

  object-fit: contain;

  filter:
    drop-shadow(
      0 10px 15px
      rgba(0, 0, 0, 0.12)
    );
}


.intro-logo-wrap::before {
  content: "";

  position: absolute;

  top: 0;
  left: 0;

  width: 30%;
  height: 18%;

  background: #FFFFFF;

  z-index: 2;

  pointer-events: none;
}


.intro-logo-wrap.is-visible {
  opacity: 1;

  transform:
    translateY(0);
}


/* =========================================
   日付
========================================= */

.intro-date {
  margin-top: 25px;

  color: #d94b67;

  font-size: clamp(
    32px,
    6vw,
    58px
  );

  font-weight: 700;

  letter-spacing: 2px;

  line-height: 1;

  text-shadow:
    0 4px 10px
    rgba(0, 0, 0, 0.08);

  opacity: 0;

  transform:
    translateY(25px);

  transition:
    opacity 1s ease,
    transform 1s ease;
}


.intro-date span {
  font-size: 0.55em;

  margin-left: 6px;

  letter-spacing: 1px;
}


/* =========================================
   時間
========================================= */

.intro-time {
  margin-top: 12px;

  color: #d94b67;

  font-size: clamp(
    14px,
    2.8vw,
    20px
  );

  font-weight: 700;

  letter-spacing: 1px;

  line-height: 1.4;

  white-space: nowrap;
}


.intro-date.is-visible {
  opacity: 1;

  transform:
    translateY(0);
}


/* =========================================
   SCROLL表示
========================================= */

.intro-scroll {
  position: absolute;

  bottom: 35px;
  left: 50%;

  transform: translateX(-50%);

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 8px;

  color: #d94b67;

  font-size: 13px;

  font-weight: 700;

  letter-spacing: 2px;

  z-index: 20;

  opacity: 0;

  transition:
    opacity 1s ease;
}


.intro-scroll.is-visible {
  opacity: 1;
}


.intro-scroll-arrow {
  width: 18px;
  height: 18px;

  border-right: 2px solid #d94b67;
  border-bottom: 2px solid #d94b67;

  transform: rotate(45deg);

  animation:
    scrollArrow
    1.5s
    ease-in-out
    infinite;
}


@keyframes scrollArrow {

  0%,
  100% {
    transform:
      rotate(45deg)
      translate(0, 0);
  }

  50% {
    transform:
      rotate(45deg)
      translate(5px, 5px);
  }

}


/* =========================================
   2画面目
========================================= */

.intro-second {
  position: relative;

  width: 100%;
  height: 100vh;
  min-height: 600px;

  display: flex;

  align-items: center;
  justify-content: center;

  z-index: 5;
}


.intro-panel {
  position: relative;

  z-index: 10;

  width: min(88%, 700px);

  min-height: 430px;

  padding: 55px 35px;

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  text-align: center;

  background: rgba(255, 255, 255, 0.9);

  clip-path: polygon(
    5% 0%,
    95% 4%,
    100% 18%,
    96% 88%,
    87% 100%,
    11% 96%,
    0% 82%,
    4% 15%
  );

  box-shadow:
    0 20px 50px
    rgba(0, 0, 0, 0.12);
}


/* =========================================
   2画面目フェードイン用
========================================= */

.intro-panel {
  opacity: 0;

  transform:
    translateY(60px)
    scale(0.95);

  transition:
    opacity 1s ease,
    transform 1s ease;
}


.intro-panel.is-visible {
  opacity: 1;

  transform:
    translateY(0)
    scale(1);
}


/* =========================================
   WELCOME / 2026
========================================= */

.intro-welcome {

  width: 100%;

  max-width: 100%;

  padding: 0 5px;

  overflow: hidden;

  color: #000;

  /*
    「長高祭」と同じくらいの大きさに変更
  */
  font-size: clamp(
    50px,
    10vw,
    90px
  );

  font-weight: 900;

  letter-spacing: 3px;

  line-height: 1.15;

  white-space: nowrap;

  text-overflow: clip;

  margin-bottom: 18px;

  opacity: 0;

  transform:
    translateY(25px);

  transition:
    opacity 0.8s ease,
    transform 0.8s ease;
}


.intro-welcome.is-visible {

  opacity: 1;

  transform:
    translateY(0);
}


/* =========================================
   長高祭
========================================= */

.intro-festival {

  color: #d94b67;

  font-size: clamp(
    50px,
    10vw,
    90px
  );

  font-weight: 900;

  letter-spacing: 3px;

  line-height: 1.15;

  text-shadow:
    0 6px 12px
    rgba(0, 0, 0, 0.12);

  margin-bottom: 35px;

  opacity: 0;

  transform:
    translateY(30px);

  transition:
    opacity 0.9s ease,
    transform 0.9s ease;
}


.intro-festival.is-visible {

  opacity: 1;

  transform:
    translateY(0);
}


/* =========================================
   STARTボタン
========================================= */

.intro-start {

  position: relative;

  display: flex;

  align-items: center;

  justify-content: center;

  width: min(75vw, 360px);

  min-height: 70px;

  padding: 15px 30px;

  background: #d94b67;

  color: #fff;

  text-decoration: none;

  font-size: clamp(
    22px,
    4vw,
    30px
  );

  font-weight: 900;

  letter-spacing: 4px;

  clip-path: polygon(
    7% 0%,
    93% 0%,
    100% 50%,
    93% 100%,
    7% 100%,
    0% 50%
  );

  box-shadow:
    0 8px 0
    #a9344e;

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    background 0.2s ease;

  cursor: pointer;

  opacity: 0;

  transform:
    translateY(30px);
}


.intro-start.is-visible {

  opacity: 1;

  transform:
    translateY(0);

  transition:
    opacity 0.9s ease,
    transform 0.9s ease,
    background 0.2s ease,
    box-shadow 0.2s ease;
}


.intro-start:hover {

  background: #e55a73;

  transform:
    translateY(3px);

  box-shadow:
    0 5px 0
    #a9344e;
}


.intro-start:active {

  transform:
    translateY(8px);

  box-shadow:
    0 0 0
    #a9344e;
}


/* =========================================
   スマホ
========================================= */

@media (max-width: 768px) {

  .intro-first,
  .intro-second {

    min-height: 100svh;

    height: 100svh;

  }


  .intro-page {

    min-height: 200svh;

  }


  .intro-first-content {

    /*
      スマホでも余計な上部余白を作らない
    */
    padding-top: 0;

    /*
      スマホでは少しだけ上へ
    */
    transform: translateY(-6vh);

  }


  .intro-heading {

    margin-bottom: 30px;

  }


  .intro-heading-main {

    font-size: 38px;

    letter-spacing: 2px;

    margin-bottom: 6px;

  }


  .intro-heading-sub {

    font-size: 22px;

    letter-spacing: 1px;

  }


  .intro-logo-wrap {

    width: min(78vw, 480px);

  }


  .intro-logo {

    width: 100%;

  }


  .intro-date {

    margin-top: 20px;

    font-size: 42px;

  }


  .intro-time {

    margin-top: 10px;

    font-size: 15px;

    letter-spacing: 0.5px;

  }


  .intro-scroll {

    bottom: 28px;

    font-size: 11px;

  }


  .intro-panel {

    width: 90%;

    min-height: 400px;

    padding:
      45px
      20px;

  }


  .intro-welcome {

    /*
      「長高祭」と同じくらいの大きさ
    */
    width: 100%;

    max-width: 100%;

    padding: 0 3px;

    font-size: 52px;

    letter-spacing: 3px;

    white-space: nowrap;

    margin-bottom: 20px;

  }


  .intro-festival {

    font-size: 52px;

    margin-bottom: 30px;

  }


  .intro-start {

    width: 75vw;

    min-height: 64px;

    font-size: 23px;

  }


  .intro-s1 {

    left: -75px;

  }


  .intro-s2 {

    left: -80px;

  }


  .intro-s3 {

    left: -100px;

  }


  .intro-s4 {

    right: -120px;

  }


  .intro-s5 {

    right: -80px;

  }


  .intro-s6 {

    right: -100px;

  }


  .intro-s7 {

    left: 3%;

  }


  .intro-s8 {

    right: 2%;

  }


  .intro-s9 {

    left: 8%;

  }


  .intro-s10 {

    right: 8%;

  }

}


/* =========================================
   非常に小さい画面
========================================= */

@media (max-width: 380px) {

  .intro-heading-main {

    font-size: 34px;

  }


  .intro-heading-sub {

    font-size: 19px;

  }


  .intro-date {

    font-size: 36px;

  }


  .intro-time {

    font-size: 14px;

  }


  .intro-welcome {

    /*
      小さい画面でも「長高祭」と
      同じくらいのサイズを維持
    */
    font-size: 45px;

    letter-spacing: 2px;

    padding: 0;

    margin-bottom: 20px;

  }


  .intro-festival {

    font-size: 45px;

  }


  .intro-panel {

    min-height: 370px;

  }


  .intro-start {

    width: 80vw;

  }

}

</style>

</head>


<body>


<div class="intro-page">


  <div class="intro-shapes">

    <div class="intro-shape intro-s1"></div>
    <div class="intro-shape intro-s2"></div>
    <div class="intro-shape intro-s3"></div>
    <div class="intro-shape intro-s4"></div>
    <div class="intro-shape intro-s5"></div>
    <div class="intro-shape intro-s6"></div>

    <div class="intro-shape intro-s7"></div>
    <div class="intro-shape intro-s8"></div>
    <div class="intro-shape intro-s9"></div>
    <div class="intro-shape intro-s10"></div>

    <div class="intro-shape intro-s11"></div>
    <div class="intro-shape intro-s12"></div>

  </div>


  <section class="intro-first">

    <div class="intro-first-content">


      <div class="intro-heading">

        <div class="intro-heading-main">
          第65回
        </div>

        <div class="intro-heading-sub">
          ちょう、せい春してみました。
        </div>

      </div>


      <div class="intro-logo-wrap">

        <img
          src="images/logo.png"
          alt="長高祭"
          class="intro-logo"
        >

      </div>


      <div class="intro-date">

        9.12
        <span>Sat</span>

        <div class="intro-time">
          ９：３０から１３：００（最終入場１２：３０）
        </div>

      </div>

    </div>


    <div class="intro-scroll">

      <div class="intro-scroll-arrow"></div>

      <span>SCROLL</span>

    </div>

  </section>


  <section class="intro-second">

    <div class="intro-panel">

      <div class="intro-welcome">
        2026年度
      </div>

      <div class="intro-festival">
        長高祭
      </div>


      <a
        href="index.html"
        class="intro-start"
        id="startButton"
      >
        START
      </a>

    </div>

  </section>


</div>


<script>

/* =========================================
   初回表示アニメーション
========================================= */

window.addEventListener(
  "load",
  () => {

    const heading =
      document.querySelector(".intro-heading");

    const logo =
      document.querySelector(".intro-logo-wrap");

    const date =
      document.querySelector(".intro-date");

    const scroll =
      document.querySelector(".intro-scroll");


    setTimeout(
      () => {

        heading.classList.add(
          "is-visible"
        );

      },
      100
    );


    setTimeout(
      () => {

        logo.classList.add(
          "is-visible"
        );

      },
      350
    );


    setTimeout(
      () => {

        date.classList.add(
          "is-visible"
        );

      },
      650
    );


    setTimeout(
      () => {

        scroll.classList.add(
          "is-visible"
        );

      },
      900
    );

  }
);


/* =========================================
   STARTボタン
========================================= */

const startButton =
  document.getElementById("startButton");


startButton.addEventListener(
  "click",
  function(e) {

    e.preventDefault();


    /*
      =========================================
      サイトバージョン

      index.htmlと同じ番号にしてください。
      =========================================
    */

    const SITE_VERSION =
      "2026.08.28.06";


    /*
      このバージョンのイントロを
      見終わったことを記録
    */

    localStorage.setItem(
      "choko_festival_intro_version",
      SITE_VERSION
    );


    /*
      既存のスプラッシュも
      START後には表示しない
    */

    localStorage.setItem(
      "choko_splash_shown",
      "true"
    );


    /*
      TOPページへ移動
    */

    window.location.href =
      "index.html";

  }
);


/* =========================================
   スクロールアニメーション
========================================= */

const introSecond =
  document.querySelector(
    ".intro-second"
  );


const introPanel =
  document.querySelector(
    ".intro-panel"
  );


const introWelcome =
  document.querySelector(
    ".intro-welcome"
  );


const introFestival =
  document.querySelector(
    ".intro-festival"
  );


const observer =
  new IntersectionObserver(
    (entries) => {

      entries.forEach(entry => {

        if(entry.isIntersecting) {


          introPanel.classList.add(
            "is-visible"
          );


          setTimeout(
            () => {

              introWelcome.classList.add(
                "is-visible"
              );

            },
            250
          );


          setTimeout(
            () => {

              introFestival.classList.add(
                "is-visible"
              );

            },
            500
          );


          setTimeout(
            () => {

              startButton.classList.add(
                "is-visible"
              );

            },
            750
          );


          observer.unobserve(
            introSecond
          );

        }

      });

    },
    {
      threshold: 0.25
    }
  );


observer.observe(
  introSecond
);

</script>


</body>

</html>
