<!--
  ============================================================
  長高祭2026 共通モーダル
  ============================================================

  企画ID
  1a / 1b / 1c / 1d / 1e / 1f / 1g
  2a / 2b / 2c / 2d / 2e / 2f / 2g
  3a / 3b / 3c / 3d / 3e / 3f / 3g

  対応するカード記述例：

  onclick="openFestivalModal('1a')"

  data-modal="1a"

  data-modal-id="1a"

  data-event-id="1a"

  URL：
  event.html?modal=1a
-->


<style>

/* ============================================================
   モーダル背景
   ============================================================ */

.modal{
  display:none;

  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  padding:12px;

  box-sizing:border-box;

  background:rgba(0,0,0,0.58);

  justify-content:center;
  align-items:center;

  z-index:9999;

  backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);
}


/* ============================================================
   モーダル本体
   ============================================================ */

.modal-box{
  width:100%;
  max-width:440px;

  max-height:80vh;

  overflow-y:auto;

  position:relative;

  box-sizing:border-box;

  background:#ffffff;

  border:3px solid #202020;

  border-radius:18px;

  padding:8px 12px 11px;

  text-align:center;

  box-shadow:
    7px 7px 0 #202020;

  animation:modalFadeIn 0.25s ease-out;
}


/* ============================================================
   上部アクセント
   ============================================================ */

.modal-box::before{
  content:"";

  display:block;

  position:absolute;

  top:0;
  left:0;

  width:100%;
  height:7px;

  background:#2a9d8f;

  border-radius:15px 15px 0 0;

  pointer-events:none;
}


/* ============================================================
   企画画像
   ============================================================ */

.modal-box img{
  display:block;

  width:100%;

  aspect-ratio:16 / 7.5;

  object-fit:cover;

  border-radius:12px;

  margin:3px 0 10px;

  background:#f2f2f2;

  border:2px solid #202020;
}


/* ============================================================
   閉じるボタン
   ============================================================ */

#modal-close{
  position:absolute;

  top:17px;
  right:17px;

  width:34px;
  height:34px;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:0;

  border:2px solid #202020;

  border-radius:50%;

  background:#ffffff;

  color:#202020;

  font-family:Arial,sans-serif;

  font-size:21px;

  font-weight:bold;

  line-height:1;

  cursor:pointer;

  z-index:10;

  box-shadow:3px 3px 0 #202020;

  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease;
}


#modal-close:hover{
  transform:translate(2px,2px);

  box-shadow:1px 1px 0 #202020;
}


#modal-close:active{
  transform:translate(3px,3px);

  box-shadow:0 0 0 #202020;
}


/* ============================================================
   キャッチコピー
   ============================================================ */

#modal-catchcopy{
  display:block !important;

  width:100%;

  box-sizing:border-box;

  margin:8px 0 0;

  padding:0 12px;

  color:#202020;

  font-size:clamp(20px,5vw,24px);

  font-weight:900;

  line-height:1.4;

  letter-spacing:0.02em;

  text-align:center;

  visibility:visible !important;

  opacity:1 !important;
}


/* ============================================================
   装飾ライン
   ============================================================ */

.modal-divider{
  position:relative;

  width:52px;

  height:4px;

  margin:9px auto 9px;

  background:#2a9d8f;

  transform:skewX(-25deg);
}


/* ============================================================
   開催場所
   ============================================================ */

#modal-place{
  margin:0 8px;

  color:#2a9d8f;

  font-size:16px;

  font-weight:900;

  line-height:1.4;
}


/* ============================================================
   フロアマップボタン
   ============================================================ */

.map-btn{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:8px;

  width:calc(100% - 16px);

  min-height:42px;

  box-sizing:border-box;

  margin:11px 8px 0;

  padding:8px 16px;

  background:#2a9d8f;

  color:#ffffff;

  text-decoration:none;

  border:2px solid #202020;

  border-radius:9px;

  font-size:14px;

  font-weight:900;

  letter-spacing:0.04em;

  box-shadow:4px 4px 0 #202020;

  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease,
    background 0.15s ease;
}


.map-btn:hover{
  background:#238b7e;

  transform:translate(2px,2px);

  box-shadow:2px 2px 0 #202020;
}


.map-btn:active{
  transform:translate(4px,4px);

  box-shadow:0 0 0 #202020;
}


/* ============================================================
   矢印
   ============================================================ */

.map-arrow{
  font-size:17px;

  line-height:1;
}


/* ============================================================
   非表示の企画データ
   ============================================================ */

.modal-data{
  display:none !important;
}


/* ============================================================
   表示アニメーション
   ============================================================ */

@keyframes modalFadeIn{

  from{
    opacity:0;

    transform:
      translateY(8px)
      scale(0.97);
  }

  to{
    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }

}


/* ============================================================
   スマートフォン
   ============================================================ */

@media (max-width:600px){

  .modal{
    padding:10px;
  }


  .modal-box{
    max-width:430px;

    max-height:82vh;

    border-radius:16px;

    padding:7px 10px 10px;

    box-shadow:
      5px 5px 0 #202020;
  }


  .modal-box::before{
    height:6px;

    border-radius:13px 13px 0 0;
  }


  .modal-box img{
    aspect-ratio:16 / 7.5;

    border-radius:10px;

    margin-bottom:9px;
  }


  #modal-close{
    top:14px;
    right:14px;

    width:32px;
    height:32px;

    font-size:20px;

    box-shadow:
      2px 2px 0 #202020;
  }


  #modal-catchcopy{
    display:block !important;

    width:100%;

    margin-top:7px;

    padding:0 10px;

    font-size:20px;

    line-height:1.4;

    visibility:visible !important;

    opacity:1 !important;
  }


  .modal-divider{
    width:46px;

    height:4px;

    margin-top:8px;
    margin-bottom:8px;
  }


  #modal-place{
    font-size:15px;

    line-height:1.35;
  }


  .map-btn{
    min-height:41px;

    margin-top:10px;

    padding:8px 14px;

    font-size:13px;

    box-shadow:
      3px 3px 0 #202020;
  }

}


/* ============================================================
   小さいスマートフォン
   ============================================================ */

@media (max-width:380px){

  .modal-box{
    max-height:85vh;

    padding:6px 9px 9px;
  }


  .modal-box img{
    margin-bottom:8px;

    aspect-ratio:16 / 7.5;
  }


  #modal-catchcopy{
    display:block !important;

    width:100%;

    margin-top:6px;

    padding:0 8px;

    font-size:18px;

    line-height:1.35;

    visibility:visible !important;

    opacity:1 !important;
  }


  .modal-divider{
    margin-top:7px;
    margin-bottom:7px;
  }


  #modal-place{
    font-size:14px;
  }


  .map-btn{
    min-height:39px;

    margin-top:9px;

    font-size:12px;
  }

}


/* ============================================================
   アニメーションを減らす設定
   ============================================================ */

@media (prefers-reduced-motion:reduce){

  .modal-box{
    animation:none;
  }


  #modal-close,
  .map-btn{
    transition:none;
  }

}

</style>

<!-- ============================================================

<script>

(function(){

  "use strict";


  /* ==========================================================
     モーダルを開く処理
     
     DOMContentLoadedより前でも後でも使えるように、
     関数そのものを最初からwindowへ公開する。
     ========================================================== */

  function openFestivalModal(id){

    id = String(id || "")
      .trim()
      .toLowerCase();


    if(!id){

      console.warn(
        "モーダルIDが指定されていません。"
      );

      return;

    }


    const modal =
      document.getElementById("modal");


    const modalBox =
      document.querySelector(".modal-box");


    const modalImg =
      document.getElementById("modal-img");


    const modalCatchcopy =
      document.getElementById(
        "modal-catchcopy"
      );


    const modalPlace =
      document.getElementById(
        "modal-place"
      );


    const modalLink =
      document.getElementById(
        "modal-link"
      );


    const data =
      document.getElementById(
        "modal-data-" + id
      );


    /* ========================================================
       必要な要素が存在するか確認
       ======================================================== */

    if(!modal){

      console.warn(
        "#modal が見つかりません。"
      );

      return;

    }


    if(!data){

      console.warn(
        "モーダルデータが見つかりません:",
        id
      );

      return;

    }


    /* ========================================================
       画像
       ======================================================== */

    if(modalImg){

      modalImg.src =
        data.dataset.img || "";


      /*
        タイトル自体は表示しない。
        画像のaltにのみ使用。
      */

      modalImg.alt =
        data.dataset.title ||
        "企画画像";

    }


    /* ========================================================
       キャッチコピー
       ======================================================== */

    if(modalCatchcopy){

      const catchcopy =
        data.dataset.catchcopy || "";


      modalCatchcopy.textContent =
        catchcopy;


      /*
        外部CSSなどによって
        非表示にならないようにする。
      */

      modalCatchcopy.style.setProperty(
        "display",
        "block",
        "important"
      );


      modalCatchcopy.style.setProperty(
        "visibility",
        "visible",
        "important"
      );


      modalCatchcopy.style.setProperty(
        "opacity",
        "1",
        "important"
      );

    }


    /* ========================================================
       開催場所
       ======================================================== */

    if(modalPlace){

      modalPlace.textContent =
        data.dataset.place || "";

    }


    /* ========================================================
       フロアマップリンク
       ======================================================== */

    if(modalLink){

      modalLink.href =
        data.dataset.link ||
        "map.html";

    }


    /* ========================================================
       モーダル表示
       ======================================================== */

    modal.style.display =
      "flex";


    modal.setAttribute(
      "aria-hidden",
      "false"
    );


    document.body.style.overflow =
      "hidden";


    /* ========================================================
       モーダルを先頭へ
       ======================================================== */

    if(modalBox){

      modalBox.scrollTop = 0;

    }

  }



  /* ==========================================================
     グローバルへ公開

     これにより、

     onclick="openFestivalModal('1a')"

     が確実に動作する。
     ========================================================== */

  window.openFestivalModal =
    openFestivalModal;



  /* ==========================================================
     モーダルを閉じる
     ========================================================== */

  function closeFestivalModal(){

    const modal =
      document.getElementById("modal");


    if(!modal){

      return;

    }


    modal.style.display =
      "none";


    modal.setAttribute(
      "aria-hidden",
      "true"
    );


    document.body.style.overflow =
      "";

  }


  /* グローバルへ公開 */

  window.closeFestivalModal =
    closeFestivalModal;



  /* ==========================================================
     初期化
     ========================================================== */

  function initializeModal(){

    const modal =
      document.getElementById("modal");


    const modalClose =
      document.getElementById(
        "modal-close"
      );


    if(!modal){

      /*
        HTMLが後から挿入される場合でも
        openFestivalModal自体はすでに使用可能。
      */

      return;

    }


    /* ========================================================
       閉じるボタン
       ======================================================== */

    if(
      modalClose &&
      !modalClose.dataset.modalInitialized
    ){

      modalClose.dataset.modalInitialized =
        "true";


      modalClose.addEventListener(
        "click",
        function(event){

          event.preventDefault();

          event.stopPropagation();

          closeFestivalModal();

        }
      );

    }


    /* ========================================================
       背景クリック
       ======================================================== */

    if(
      !modal.dataset.modalInitialized
    ){

      modal.dataset.modalInitialized =
        "true";


      modal.addEventListener(
        "click",
        function(event){

          if(
            event.target === modal
          ){

            closeFestivalModal();

          }

        }
      );

    }


    /* ========================================================
       URLパラメータ
       
       event.html?modal=1a
       ======================================================== */

    const params =
      new URLSearchParams(
        window.location.search
      );


    const modalId =
      params.get("modal");


    if(modalId){

      openFestivalModal(
        modalId
      );

    }

  }



  /* ==========================================================
     企画カードクリック対応
     ========================================================== */

  function initializeCardClick(){

    /*
      同じイベントリスナーを
      複数回登録しない。
    */

    if(
      document.documentElement.dataset
        .festivalModalCardInitialized === "true"
    ){

      return;

    }


    document.documentElement.dataset
      .festivalModalCardInitialized =
        "true";


    document.addEventListener(
      "click",
      function(event){

        /*
          モーダル内部をクリックした場合は
          カードクリック処理をしない。
        */

        if(
          event.target.closest(
            "#modal"
          )
        ){

          return;

        }


        /*
          以下のいずれかを持つ要素を探す。

          data-modal
          data-modal-id
          data-event-id
          data-event
          */

        const target =
          event.target.closest(
            "[data-modal]," +
            "[data-modal-id]," +
            "[data-event-id]," +
            "[data-event]"
          );


        if(target){

          const id =
            target.dataset.modal ||
            target.dataset.modalId ||
            target.dataset.eventId ||
            target.dataset.event;


          if(id){

            event.preventDefault();

            openFestivalModal(id);

            return;

          }

        }


        /*
          onclick属性に
          openFestivalModal('1a')
          が設定されているカードにも対応。

          既存のカードHTMLを
          書き換える必要がないようにする。
        */

        const clickable =
          event.target.closest(
            "[onclick]"
          );


        if(clickable){

          const onclick =
            clickable.getAttribute(
              "onclick"
            ) || "";


          const match =
            onclick.match(
              /openFestivalModal\s*\(\s*['"]([^'"]+)['"]\s*\)/
            );


          if(match){

            event.preventDefault();

            openFestivalModal(
              match[1]
            );

          }

        }

      },
      true
    );

  }



  /* ==========================================================
     ESCキー
     ========================================================== */

  function initializeKeyboard(){

    if(
      document.documentElement.dataset
        .festivalModalKeyboardInitialized === "true"
    ){

      return;

    }


    document.documentElement.dataset
      .festivalModalKeyboardInitialized =
        "true";


    document.addEventListener(
      "keydown",
      function(event){

        if(
          event.key === "Escape"
        ){

          const modal =
            document.getElementById(
              "modal"
            );


          if(
            modal &&
            modal.style.display === "flex"
          ){

            closeFestivalModal();

          }

        }

      }
    );

  }



  /* ==========================================================
     初期化実行
     ========================================================== */

  function init(){

    initializeModal();

    initializeCardClick();

    initializeKeyboard();

  }


  /*
    DOMContentLoaded前なら待つ。
    すでに読み込み済みなら即実行。
  */

  if(
    document.readyState === "loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      init,
      {
        once:true
      }
    );

  }else{

    init();

  }


})();

</script>
