<style>

/* ============================================================
   モーダル背景
   ============================================================ */

.modal{
  display:none;

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  padding:12px;

  box-sizing:border-box;

  background:
    rgba(32,32,32,0.62);

  justify-content:center;

  align-items:center;

  z-index:999999;

  backdrop-filter:blur(5px);

  -webkit-backdrop-filter:blur(5px);
}


/* ============================================================
   モーダル本体
   ============================================================ */

.modal-box{
  width:100%;

  max-width:440px;

  max-height:80vh;

  overflow-y:auto;

  position:relative;

  box-sizing:border-box;

  background:
    linear-gradient(
      145deg,
      #ffffff 0%,
      #fffdf9 55%,
      #f8f3fb 100%
    );

  border:3px solid #202020;

  border-radius:20px;

  padding:12px 14px 16px;

  text-align:center;

  box-shadow:
    8px 8px 0 #202020;

  animation:
    modalFadeIn 0.25s ease-out;

  isolation:isolate;
}


/* ============================================================
   モーダル幾何学アクセント
   ============================================================ */

.modal-box::before{

  content:"";

  display:block;

  position:absolute;

  top:0;

  left:0;

  width:100%;

  height:8px;

  background:
    linear-gradient(
      90deg,
      #d94b67 0%,
      #d94b67 25%,
      #8060a8 25%,
      #8060a8 50%,
      #4f9fa5 50%,
      #4f9fa5 75%,
      #d1a92f 75%,
      #d1a92f 100%
    );

  border-radius:
    17px 17px 0 0;

  pointer-events:none;

  z-index:2;
}


/* ============================================================
   左下の幾何学装飾
   ============================================================ */

.modal-box::after{

  content:"";

  position:absolute;

  left:-25px;

  bottom:25px;

  width:80px;

  height:80px;

  background:
    #d94b67;

  opacity:0.10;

  transform:
    rotate(25deg);

  pointer-events:none;

  z-index:-1;
}


/* ============================================================
   企画画像
   ============================================================ */

.modal-box img{

  display:block;

  width:100%;

  aspect-ratio:16 / 7.5;

  object-fit:cover;

  border-radius:13px;

  margin:4px 0 11px;

  background:#f2f2f2;

  border:2px solid #202020;

  box-shadow:
    4px 4px 0 rgba(32,32,32,0.12);
}


/* ============================================================
   閉じるボタン
   ============================================================ */

#modal-close{

  position:absolute;

  top:18px;

  right:18px;

  width:35px;

  height:35px;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:0;

  border:2px solid #202020;

  border-radius:50%;

  background:#ffffff;

  color:#202020;

  font-family:Arial,sans-serif;

  font-size:21px;

  font-weight:bold;

  line-height:1;

  cursor:pointer;

  z-index:10;

  box-shadow:
    3px 3px 0 #202020;

  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease,
    background 0.15s ease;

}


#modal-close:hover{

  background:#f7d9e1;

  transform:
    translate(2px,2px);

  box-shadow:
    1px 1px 0 #202020;

}


#modal-close:active{

  transform:
    translate(3px,3px);

  box-shadow:
    0 0 0 #202020;

}


/* ============================================================
   キャッチコピー
   ============================================================ */

#modal-catchcopy{

  display:block !important;

  visibility:visible !important;

  opacity:1 !important;

  width:100%;

  box-sizing:border-box;

  margin:8px 0 0;

  padding:0 12px;

  color:#202020;

  font-size:clamp(20px,5vw,24px);

  font-weight:900;

  line-height:1.4;

  letter-spacing:0.02em;

  text-align:center;

  min-height:1.4em;

}


/* ============================================================
   装飾ライン
   ============================================================ */

.modal-divider{

  position:relative;

  width:58px;

  height:5px;

  margin:10px auto 10px;

  background:
    linear-gradient(
      90deg,
      #d94b67 0%,
      #8060a8 50%,
      #4f9fa5 100%
    );

  transform:skewX(-25deg);

}


/* ============================================================
   開催場所
   ============================================================ */

#modal-place{

  margin:0 8px;

  color:#8060a8;

  font-size:17px;

  font-weight:900;

  line-height:1.5;

}


/* ============================================================
   フロアマップボタン
   ============================================================ */

.map-btn{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:9px;

  width:calc(100% - 16px);

  min-height:46px;

  box-sizing:border-box;

  margin:14px auto 0;

  padding:10px 18px;

  background:#e2768a;

  color:#ffffff;

  text-decoration:none;

  border:2px solid #202020;

  border-radius:10px;

  font-size:15px;

  font-weight:900;

  letter-spacing:0.04em;

  box-shadow:
    4px 4px 0 #202020;

  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease,
    filter 0.15s ease;

}


.map-btn:hover{

  filter:
    brightness(1.08)
    saturate(1.08);

  transform:
    translate(2px,2px);

  box-shadow:
    2px 2px 0 #202020;

}


.map-btn:active{

  transform:
    translate(4px,4px);

  box-shadow:
    0 0 0 #202020;

}


/* ============================================================
   矢印
   ============================================================ */

.map-arrow{

  font-size:18px;

  line-height:1;

}


/* ============================================================
   非表示の企画データ
   ============================================================ */

.modal-data{

  display:none !important;

}


/* ============================================================
   表示アニメーション
   ============================================================ */

@keyframes modalFadeIn{

  from{

    opacity:0;

    transform:
      translateY(8px)
      scale(0.97);

  }

  to{

    opacity:1;

    transform:
      translateY(0)
      scale(1);

  }

}


/* ============================================================
   スマートフォン
   ============================================================ */

@media (max-width:600px){

  .modal{

    padding:10px;

  }


  .modal-box{

    max-width:430px;

    border-radius:18px;

  }


  #modal-close{

  }


  #modal-catchcopy{

  }

/* ============================================================

@media (max-width:380px){

/* ============================================================
   アニメーションを減らす設定
   ============================================================ */

@media (prefers-reduced-motion:reduce){

  .modal-box{

    animation:none;

  }


  #modal-close,
  .map-btn{

    transition:none;

  }

}

<script>

/* ============================================================
   長高祭2026 共通モーダル JavaScript
   ============================================================ */

(function(){

  "use strict";


  /* ==========================================================
     モーダル取得
     ========================================================== */

  function getModal(){

    return document.getElementById("modal");

  }


  function getModalBox(){

    return document.querySelector(".modal-box");

  }



  /* ==========================================================
     ID正規化
     ========================================================== */

  function normalizeId(id){

    if(id === null || id === undefined){

      return "";

    }


    return String(id)
      .trim()
      .toLowerCase()
      .replace(/^modal-data[-_]/,"")
      .replace(/^modal[-_]/,"")
      .replace(/\s+/g,"");

  }



  /* ==========================================================
     有効な企画IDか確認
     ========================================================== */

  function isValidId(id){

  id = normalizeId(id);

  if(
    !/^(?:[123][abcdefg]|club\d+|other\d+)$/.test(id)
  ){

    return false;

  }

  return !!document.getElementById(
    "modal-data-" + id
  );

}



  /* ==========================================================
     文字から企画IDを判定
     ========================================================== */

  function detectIdFromText(text){

    if(!text){

      return "";

    }


    const value =
      String(text)
        .replace(/\u3000/g," ")
        .replace(/\s+/g,"")
        .toLowerCase();


    let match;



    /* --------------------------------------------------------
       1年A組
       1年A
       1年 a組
       -------------------------------------------------------- */

    match =
      value.match(
        /([123])年([abcdefg])(?:組)?/
      );


    if(match){

      const id =
        match[1] + match[2];

      if(isValidId(id)){

        return id;

      }

    }



    /* --------------------------------------------------------
       1A組
       1A
       2B組
       3G
       -------------------------------------------------------- */

    match =
      value.match(
        /(?:^|[^0-9])([123])([abcdefg])(?:組)?(?:$|[^a-z0-9])/
      );


    if(match){

      const id =
        match[1] + match[2];

      if(isValidId(id)){

        return id;

      }

    }



    /* --------------------------------------------------------
       「1-A」「2-B」「3-G」
       -------------------------------------------------------- */

    match =
      value.match(
        /([123])[-_ー－]([abcdefg])/
      );


    if(match){

      const id =
        match[1] + match[2];

      if(isValidId(id)){

        return id;

      }

    }



    return "";

  }



  /* ==========================================================
     onclick属性からID取得
     ========================================================== */

  function getIdFromOnclick(element){

    if(!element){

      return "";

    }


    const onclick =
      element.getAttribute("onclick");


    if(!onclick){

      return "";

    }


    let match =
      onclick.match(
        /openFestivalModal\s*\(\s*['"]([^'"]+)['"]\s*\)/i
      );


    if(match){

      const id =
        normalizeId(match[1]);

      if(isValidId(id)){

        return id;

      }

    }


    match =
      onclick.match(
        /openModal\s*\(\s*['"]([^'"]+)['"]\s*\)/i
      );


    if(match){

      const id =
        normalizeId(match[1]);

      if(isValidId(id)){

        return id;

      }

    }


    return "";

  }



  /* ==========================================================
     要素からIDを取得
     ========================================================== */

  function getElementId(element){

    if(!element){

      return "";

    }



    /* data-modal */

    if(element.dataset){

      if(element.dataset.modal){

        const id =
          normalizeId(
            element.dataset.modal
          );

        if(isValidId(id)){

          return id;

        }

      }


      /* data-modal-id */

      if(element.dataset.modalId){

        const id =
          normalizeId(
            element.dataset.modalId
          );

        if(isValidId(id)){

          return id;

        }

      }


      /* data-event-id */

      if(element.dataset.eventId){

        const id =
          normalizeId(
            element.dataset.eventId
          );

        if(isValidId(id)){

          return id;

        }

      }


      /* data-event */

      if(element.dataset.event){

        const id =
          normalizeId(
            element.dataset.event
          );

        if(isValidId(id)){

          return id;

        }

      }

    }



    /* ID属性 */

    if(element.id){

      const id =
        normalizeId(
          element.id
        );


      if(isValidId(id)){

        return id;

      }

    }



    /* onclick */

    const onclickId =
      getIdFromOnclick(
        element
      );


    if(onclickId){

      return onclickId;

    }



    /* href */

    const href =
      element.getAttribute &&
      element.getAttribute("href");


    if(href){

      try{

        const url =
          new URL(
            href,
            window.location.href
          );


        const modalId =
          url.searchParams.get("modal");


        if(modalId){

          const id =
            normalizeId(modalId);


          if(isValidId(id)){

            return id;

          }

        }

      }catch(error){

        /* 無効なURLは無視 */

      }

    }



    /* 要素内テキスト */

    const text =
      element.textContent || "";


    const textId =
      detectIdFromText(text);


    if(textId){

      return textId;

    }



    return "";

  }



  /* ==========================================================
     クリックされた場所から企画IDを徹底的に探索
     ========================================================== */

  function findFestivalId(target){

    if(!target){

      return "";

    }



    let current =
      target;



    /*
      最大20階層まで上方向に探索。
    */

    for(
      let i = 0;
      i < 20 && current;
      i++
    ){

      /*
        モーダル内部は除外
      */

      if(
        current.id === "modal" ||
        (
          current.closest &&
          current.closest("#modal")
        )
      ){

        return "";

      }



      const id =
        getElementId(current);


      if(id){

        return id;

      }


      current =
        current.parentElement;

    }



    return "";

  }



  /* ==========================================================
     モーダルを開く
     ========================================================== */

  function openModal(id){

    id =
      normalizeId(id);


    if(!id){

      return false;

    }


    const data =
      document.getElementById(
        "modal-data-" + id
      );


    const modal =
      getModal();


    if(!data || !modal){

      console.error(
        "モーダルを開けません:",
        {
          id:id,
          data:!!data,
          modal:!!modal
        }
      );

      return false;

    }



    const modalImg =
      document.getElementById(
        "modal-img"
      );


    const modalCatchcopy =
      document.getElementById(
        "modal-catchcopy"
      );


    const modalPlace =
      document.getElementById(
        "modal-place"
      );


    const modalLink =
      document.getElementById(
        "modal-link"
      );



    /* ========================================================
       キャッチコピー
       ======================================================== */

    if(modalCatchcopy){

      modalCatchcopy.textContent =
        data.dataset.catchcopy || "準備中";

      modalCatchcopy.style.display =
        "block";

      modalCatchcopy.style.visibility =
        "visible";

      modalCatchcopy.style.opacity =
        "1";

    }



    /* ========================================================
       開催場所
       ======================================================== */

    if(modalPlace){

      modalPlace.textContent =
        data.dataset.place || "";

    }



    /* ========================================================
       画像
       ======================================================== */

    if(modalImg){

      const image =
        data.dataset.img || "";


      modalImg.style.visibility =
        "visible";


      modalImg.onerror =
        function(){

          this.style.visibility =
            "hidden";

        };


      modalImg.onload =
        function(){

          this.style.visibility =
            "visible";

        };


      modalImg.src =
        image;


      modalImg.alt =
        data.dataset.catchcopy ||
        "企画画像";

    }



    /* ========================================================
       フロアマップ
       ======================================================== */

    if(modalLink){

      modalLink.href =
        data.dataset.link ||
        "map.html";

    }



    /* ========================================================
       モーダル表示
       ======================================================== */

    modal.style.display =
      "flex";

    modal.setAttribute(
      "aria-hidden",
      "false"
    );

    document.body.classList.add(
      "festival-modal-open"
    );

    document.body.style.overflow =
      "hidden";



    /* ========================================================
       スクロール位置
       ======================================================== */

    const box =
      getModalBox();


    if(box){

      box.scrollTop = 0;

    }


    return true;

  }



  /* ==========================================================
     グローバル公開
     ========================================================== */

  window.openFestivalModal =
    openModal;



  /* ==========================================================
     モーダルを閉じる
     ========================================================== */

  function closeModal(){

    const modal =
      getModal();


    if(!modal){

      return;

    }


    modal.style.display =
      "none";

    modal.setAttribute(
      "aria-hidden",
      "true"
    );


    document.body.classList.remove(
      "festival-modal-open"
    );


    document.body.style.overflow =
      "";

  }



  window.closeFestivalModal =
    closeModal;



  /* ==========================================================
     ★カードクリック
     ==========================================================

     window + capture

     できるだけ早い段階でクリックを取得する。

     他のカード用JavaScriptがあっても、
     モーダル対象なら先に処理する。
     ========================================================== */

  function handleCardClick(event){

    const target =
      event.target;


    if(!target){

      return;

    }



    /* --------------------------------------------------------
       モーダル内部なら何もしない
       -------------------------------------------------------- */

    if(
      target.closest &&
      target.closest("#modal")
    ){

      return;

    }



    /* --------------------------------------------------------
       企画IDを探索
       -------------------------------------------------------- */

    const id =
      findFestivalId(target);


    if(!id){

      return;

    }



    /* --------------------------------------------------------
       モーダルを開く
       -------------------------------------------------------- */

    const opened =
      openModal(id);


    if(!opened){

      return;

    }



    /*
      カードに<a>があっても
      ページ遷移させない。
    */

    event.preventDefault();

    event.stopPropagation();

  }



  /* ==========================================================
     ★クリックをwindowのcaptureで取得
     ========================================================== */

  window.addEventListener(
    "click",
    handleCardClick,
    true
  );



  /* ==========================================================
     ×ボタン
     ========================================================== */

  function initializeCloseButton(){

    const closeButton =
      document.getElementById(
        "modal-close"
      );


    if(!closeButton){

      return;

    }


    closeButton.addEventListener(
      "click",
      function(event){

        event.preventDefault();

        event.stopPropagation();

        closeModal();

      }
    );

  }



  /* ==========================================================
     背景クリック
     ========================================================== */

  function initializeBackgroundClick(){

    const modal =
      getModal();


    if(!modal){

      return;

    }


    modal.addEventListener(
      "click",
      function(event){

        if(
          event.target === modal
        ){

          closeModal();

        }

      }
    );

  }



  /* ==========================================================
     ESCキー
     ========================================================== */

  function initializeKeyboard(){

    document.addEventListener(
      "keydown",
      function(event){

        if(
          event.key !== "Escape"
        ){

          return;

        }


        const modal =
          getModal();


        if(
          modal &&
          modal.style.display === "flex"
        ){

          closeModal();

        }

      }
    );

  }



  /* ==========================================================
     URLからモーダル表示
     ========================================================== */

  function initializeUrlModal(){

    const params =
      new URLSearchParams(
        window.location.search
      );


    const modalId =
      params.get("modal");


    if(modalId){

      /*
        DOMが完成していない場合にも
        少し待ってから実行。
      */

      const execute =
        function(){

          openModal(
            modalId
          );

        };


      if(
        document.getElementById(
          "modal-data-" +
          normalizeId(modalId)
        )
      ){

        execute();

      }else{

        setTimeout(
          execute,
          50
        );

      }

    }

  }



  /* ==========================================================
     初期化
     ========================================================== */

  function initialize(){

    initializeCloseButton();

    initializeBackgroundClick();

    initializeKeyboard();

    initializeUrlModal();

  }



  /* ==========================================================
     DOM読み込み
     ========================================================== */

  if(
    document.readyState === "loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      initialize,
      {
        once:true
      }
    );

  }else{

    initialize();

  }



})();

</script>
