<!--
  ============================================================
  長高祭2026 共通モーダル
  ============================================================

  対応企画ID

  1a / 1b / 1c / 1d / 1e / 1f / 1g
  2a / 2b / 2c / 2d / 2e / 2f / 2g
  3a / 3b / 3c / 3d / 3e / 3f / 3g


  カード側の書き方は以下のどれでも対応

  ①
  <div data-modal="1a">

  ②
  <div data-modal-id="1a">

  ③
  <div data-event-id="1a">

  ④
  <div onclick="openFestivalModal('1a')">

  ⑤
  <div class="event-card">
    <h3>1年A組</h3>
  </div>

  ⑤の場合はカード内の
  「1年A組」「1年B組」などから自動判定。


  URLからも開ける

  event.html?modal=1a

-->


<style>

/* ============================================================
   モーダル背景
   ============================================================ */

.modal{
  display:none;

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  padding:12px;

  box-sizing:border-box;

  background:rgba(0,0,0,0.58);

  justify-content:center;

  align-items:center;

  z-index:9999;

  backdrop-filter:blur(3px);

  -webkit-backdrop-filter:blur(3px);
}


/* ============================================================
   モーダル本体
   ============================================================ */

.modal-box{
  width:100%;

  max-width:440px;

  max-height:80vh;

  overflow-y:auto;

  position:relative;

  box-sizing:border-box;

  background:#ffffff;

  border:3px solid #202020;

  border-radius:18px;

  padding:8px 12px 11px;

  text-align:center;

  box-shadow:
    7px 7px 0 #202020;

  animation:
    modalFadeIn 0.25s ease-out;
}


/* ============================================================
   上部アクセント
   ============================================================ */

.modal-box::before{

  content:"";

  display:block;

  position:absolute;

  top:0;

  left:0;

  width:100%;

  height:7px;

  background:#2a9d8f;

  border-radius:
    15px 15px 0 0;

  pointer-events:none;

}


/* ============================================================
   企画画像
   ============================================================ */

.modal-box img{

  display:block;

  width:100%;

  aspect-ratio:16 / 7.5;

  object-fit:cover;

  border-radius:12px;

  margin:3px 0 10px;

  background:#f2f2f2;

  border:2px solid #202020;

}


/* ============================================================
   閉じるボタン
   ============================================================ */

#modal-close{

  position:absolute;

  top:17px;

  right:17px;

  width:34px;

  height:34px;

  display:flex;

  align-items:center;

  justify-content:center;

  padding:0;

  border:2px solid #202020;

  border-radius:50%;

  background:#ffffff;

  color:#202020;

  font-family:Arial,sans-serif;

  font-size:21px;

  font-weight:bold;

  line-height:1;

  cursor:pointer;

  z-index:10;

  box-shadow:
    3px 3px 0 #202020;

  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease;

}


#modal-close:hover{

  transform:
    translate(2px,2px);

  box-shadow:
    1px 1px 0 #202020;

}


#modal-close:active{

  transform:
    translate(3px,3px);

  box-shadow:
    0 0 0 #202020;

}


/* ============================================================
   キャッチコピー
   ============================================================ */

#modal-catchcopy{

  display:block !important;

  visibility:visible !important;

  opacity:1 !important;

  width:100%;

  box-sizing:border-box;

  margin:8px 0 0;

  padding:0 12px;

  color:#202020;

  font-size:clamp(20px,5vw,24px);

  font-weight:900;

  line-height:1.4;

  letter-spacing:0.02em;

  text-align:center;

  min-height:1.4em;

}


/* ============================================================
   装飾ライン
   ============================================================ */

.modal-divider{

  position:relative;

  width:52px;

  height:4px;

  margin:9px auto 9px;

  background:#2a9d8f;

  transform:skewX(-25deg);

}


/* ============================================================
   開催場所
   ============================================================ */

#modal-place{

  margin:0 8px;

  color:#2a9d8f;

  font-size:16px;

  font-weight:900;

  line-height:1.4;

}


/* ============================================================
   フロアマップボタン
   ============================================================ */

.map-btn{

  display:flex;

  align-items:center;

  justify-content:center;

  gap:8px;

  width:calc(100% - 16px);

  min-height:42px;

  box-sizing:border-box;

  margin:11px 8px 0;

  padding:8px 16px;

  background:#2a9d8f;

  color:#ffffff;

  text-decoration:none;

  border:2px solid #202020;

  border-radius:9px;

  font-size:14px;

  font-weight:900;

  letter-spacing:0.04em;

  box-shadow:
    4px 4px 0 #202020;

  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease,
    background 0.15s ease;

}


.map-btn:hover{

  background:#238b7e;

  transform:
    translate(2px,2px);

  box-shadow:
    2px 2px 0 #202020;

}


.map-btn:active{

  transform:
    translate(4px,4px);

  box-shadow:
    0 0 0 #202020;

}


/* ============================================================
   矢印
   ============================================================ */

.map-arrow{

  font-size:17px;

  line-height:1;

}


/* ============================================================
   非表示の企画データ
   ============================================================ */

.modal-data{

  display:none !important;

}


/* ============================================================
   表示アニメーション
   ============================================================ */

@keyframes modalFadeIn{

  from{

    opacity:0;

    transform:
      translateY(8px)
      scale(0.97);

  }

  to{

    opacity:1;

    transform:
      translateY(0)
      scale(1);

  }

}


/* ============================================================
   スマートフォン
   ============================================================ */

@media (max-width:600px){

    padding:10px;

  }

/* ============================================================
   アニメーションを減らす設定
   ============================================================ */

@media (prefers-reduced-motion:reduce){

  .modal-box{

    animation:none;

  }


  #modal-close,
  .map-btn{

    transition:none;

  }

}

<script>

(function(){

  "use strict";


  /* ==========================================================
     モーダル要素
     ========================================================== */

  function getModal(){

    return document.getElementById("modal");

  }


  function getModalBox(){

    return document.querySelector(
      ".modal-box"
    );

  }


  /* ==========================================================
     IDを正規化
     ========================================================== */

  function normalizeId(id){

    if(!id){

      return "";

    }


    return String(id)
      .trim()
      .toLowerCase()
      .replace(/^modal-data-/, "")
      .replace(/^modal-/, "");

  }


  /* ==========================================================
     モーダルを開く
     ========================================================== */

  function openModal(id){

    id = normalizeId(id);


    if(!id){

      console.warn(
        "モーダルIDが空です。"
      );

      return false;

    }


    const data =
      document.getElementById(
        "modal-data-" + id
      );


    if(!data){

      console.warn(
        "モーダルデータが見つかりません:",
        id
      );

      return false;

    }


    const modal =
      document.getElementById(
        "modal"
      );


    const modalImg =
      document.getElementById(
        "modal-img"
      );


    const modalCatchcopy =
      document.getElementById(
        "modal-catchcopy"
      );


    const modalPlace =
      document.getElementById(
        "modal-place"
      );


    const modalLink =
      document.getElementById(
        "modal-link"
      );


    if(!modal){

      console.error(
        "#modal が見つかりません。"
      );

      return false;

    }


    /* ========================================================
       画像
       ======================================================== */

    if(modalImg){

      const image =
        data.dataset.img || "";


      modalImg.src =
        image;


      modalImg.alt =
        "企画画像";


      /*
        画像が存在しない場合でも
        壊れた画像表示を極力防ぐ。
      */

      modalImg.onerror =
        function(){

          this.style.visibility =
            "hidden";

        };


      modalImg.onload =
        function(){

          this.style.visibility =
            "visible";

        };

    }


    /* ========================================================
       キャッチコピー
       ======================================================== */

    if(modalCatchcopy){

      const catchcopy =
        data.dataset.catchcopy || "";


      modalCatchcopy.textContent =
        catchcopy;


      modalCatchcopy.style.setProperty(
        "display",
        "block",
        "important"
      );


      modalCatchcopy.style.setProperty(
        "visibility",
        "visible",
        "important"
      );


      modalCatchcopy.style.setProperty(
        "opacity",
        "1",
        "important"
      );

    }


    /* ========================================================
       開催場所
       ======================================================== */

    if(modalPlace){

      modalPlace.textContent =
        data.dataset.place || "";

    }


    /* ========================================================
       フロアマップ
       ======================================================== */

    if(modalLink){

      modalLink.href =
        data.dataset.link ||
        "map.html";

    }


    /* ========================================================
       モーダル表示
       ======================================================== */

    modal.style.display =
      "flex";


    modal.setAttribute(
      "aria-hidden",
      "false"
    );


    document.body.style.overflow =
      "hidden";


    /* ========================================================
       モーダルを先頭へ
       ======================================================== */

    const modalBox =
      getModalBox();


    if(modalBox){

      modalBox.scrollTop = 0;

    }


    return true;

  }


  /* ==========================================================
     グローバル公開

     これがあることでカード側から

     onclick="openFestivalModal('1a')"

     と呼び出せる。
     ========================================================== */

  window.openFestivalModal =
    openModal;



  /* ==========================================================
     モーダルを閉じる
     ========================================================== */

  function closeModal(){

    const modal =
      getModal();


    if(!modal){

      return;

    }


    modal.style.display =
      "none";


    modal.setAttribute(
      "aria-hidden",
      "true"
    );


    document.body.style.overflow =
      "";

  }


  window.closeFestivalModal =
    closeModal;



  /* ==========================================================
     文字から企画IDを判定
     ========================================================== */

  function detectIdFromText(text){

    if(!text){

      return "";

    }


    const normalized =
      String(text)
        .replace(/\s+/g,"")
        .toLowerCase();


    /*
      1年A組
      1年A
      1A組
      1a
    */

    let match =
      normalized.match(
        /([123])年?([abcdefg])組?/
      );


    if(match){

      return (
        match[1] +
        match[2]
      );

    }


    /*
      1a のような表記
    */

    match =
      normalized.match(
        /\b([123])([abcdefg])\b/
      );


    if(match){

      return (
        match[1] +
        match[2]
      );

    }


    return "";

  }



  /* ==========================================================
     カードから企画IDを取得
     ========================================================== */

  function getCardId(card){

    if(!card){

      return "";

    }


    /* ========================================================
       ① data-modal
       ======================================================== */

    if(card.dataset.modal){

      return normalizeId(
        card.dataset.modal
      );

    }


    /* ========================================================
       ② data-modal-id
       ======================================================== */

    if(card.dataset.modalId){

      return normalizeId(
        card.dataset.modalId
      );

    }


    /* ========================================================
       ③ data-event-id
       ======================================================== */

    if(card.dataset.eventId){

      return normalizeId(
        card.dataset.eventId
      );

    }


    /* ========================================================
       ④ data-event
       ======================================================== */

    if(card.dataset.event){

      return normalizeId(
        card.dataset.event
      );

    }


    /* ========================================================
       ⑤ id属性
       ======================================================== */

    if(card.id){

      const id =
        normalizeId(
          card.id
        );


      if(
        document.getElementById(
          "modal-data-" + id
        )
      ){

        return id;

      }

    }


    /* ========================================================
       ⑥ onclick属性
       ======================================================== */

    const onclick =
      card.getAttribute(
        "onclick"
      );


    if(onclick){

      const match =
        onclick.match(
          /openFestivalModal\s*\(\s*['"]([^'"]+)['"]\s*\)/
        );


      if(match){

        return normalizeId(
          match[1]
        );

      }


      const match2 =
        onclick.match(
          /openModal\s*\(\s*['"]([^'"]+)['"]\s*\)/
        );


      if(match2){

        return normalizeId(
          match2[1]
        );

      }

    }


    /* ========================================================
       ⑦ hrefの ?modal=1a
       ======================================================== */

    const link =
      card.getAttribute(
        "href"
      );


    if(link){

      try{

        const url =
          new URL(
            link,
            window.location.href
          );


        const modalParam =
          url.searchParams.get(
            "modal"
          );


        if(modalParam){

          return normalizeId(
            modalParam
          );

        }

      }catch(error){

        /* 無効なURLなら無視 */

      }

    }


    /* ========================================================
       ⑧ カード内のテキストから判定
       ======================================================== */

    const text =
      card.textContent || "";


    const textId =
      detectIdFromText(
        text
      );


    if(textId){

      if(
        document.getElementById(
          "modal-data-" + textId
        )
      ){

        return textId;

      }

    }


    return "";

  }



  /* ==========================================================
     イベントカードを自動認識
     ========================================================== */

  function findCardFromTarget(target){

    if(!target){

      return null;

    }


    /*
      よくあるイベントカードのクラスを
      順番に探す。
    */

    const selectors = [

      "[data-modal]",

      "[data-modal-id]",

      "[data-event-id]",

      "[data-event]",

      ".event-card",

      ".event-item",

      ".event-list-item",

      ".event-content",

      ".企画-card",

      ".card"

    ];


    for(
      let i = 0;
      i < selectors.length;
      i++
    ){

      const card =
        target.closest(
          selectors[i]
        );


      if(card){

        const id =
          getCardId(card);


        if(id){

          return {
            card:card,
            id:id
          };

        }

      }

    }


    /*
      最後に親要素を最大10階層まで調査。

      クラス名が独自の場合でも
      「1年A組」などの文字から判定する。
    */

    let current =
      target;


    for(
      let i = 0;
      i < 10 && current;
      i++
    ){

      const id =
        getCardId(current);


      if(id){

        return {
          card:current,
          id:id
        };

      }


      current =
        current.parentElement;

    }


    return null;

  }



  /* ==========================================================
     カードクリック

     CAPTUREフェーズで取得することで、
     他のクリック処理より先にモーダルを開く。
     ========================================================== */

  function initializeCardClick(){

    document.addEventListener(
      "click",
      function(event){

        const modal =
          getModal();


        /*
          モーダル内部のクリックは
          カードクリックとして扱わない。
        */

        if(
          event.target.closest(
            "#modal"
          )
        ){

          return;

        }


        const result =
          findCardFromTarget(
            event.target
          );


        if(!result){

          return;

        }


        /*
          モーダルが開くべきカードなら
          通常のリンク遷移を止める。
        */

        event.preventDefault();

        event.stopPropagation();


        openModal(
          result.id
        );

      },
      true
    );

  }



  /* ==========================================================
     閉じるボタン
     ========================================================== */

  function initializeCloseButton(){

    const closeButton =
      document.getElementById(
        "modal-close"
      );


    if(!closeButton){

      return;

    }


    closeButton.addEventListener(
      "click",
      function(event){

        event.preventDefault();

        event.stopPropagation();

        closeModal();

      }
    );

  }



  /* ==========================================================
     背景クリック
     ========================================================== */

  function initializeBackgroundClick(){

    const modal =
      getModal();


    if(!modal){

      return;

    }


    modal.addEventListener(
      "click",
      function(event){

        if(
          event.target === modal
        ){

          closeModal();

        }

      }
    );

  }



  /* ==========================================================
     ESCキー
     ========================================================== */

  function initializeKeyboard(){

    document.addEventListener(
      "keydown",
      function(event){

        if(
          event.key !== "Escape"
        ){

          return;

        }


        const modal =
          getModal();


        if(
          modal &&
          modal.style.display === "flex"
        ){

          closeModal();

        }

      }
    );

  }



  /* ==========================================================
     URLパラメータ
     
     event.html?modal=1a
     ========================================================== */

  function initializeUrlModal(){

    const params =
      new URLSearchParams(
        window.location.search
      );


    const modalId =
      params.get(
        "modal"
      );


    if(modalId){

      openModal(
        modalId
      );

    }

  }



  /* ==========================================================
     初期化
     ========================================================== */

  function initialize(){

    initializeCardClick();

    initializeCloseButton();

    initializeBackgroundClick();

    initializeKeyboard();

    initializeUrlModal();

  }



  /* ==========================================================
     DOM読み込み後に初期化
     ========================================================== */

  if(
    document.readyState ===
    "loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      initialize,
      {
        once:true
      }
    );

  }else{

    initialize();

  }


})();

</script>
