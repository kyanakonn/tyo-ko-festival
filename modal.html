<style>

/* ===== モーダル ===== */

.modal{
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.6);
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.modal-box{
  background:#fff;
  padding:20px;
  border-radius:15px;
  width:90%;
  max-width:400px;
  text-align:center;
  position:relative;
  animation:fadeIn 0.3s ease;
}

.modal-box img{
  width:100%;
  border-radius:10px;
  margin-bottom:10px;
}

#modal-close{
  position:absolute;
  top:10px;
  right:15px;
  font-size:24px;
  cursor:pointer;
}

@keyframes fadeIn{

  from{
    opacity:0;
    transform:scale(0.9);
  }

  to{
    opacity:1;
    transform:scale(1);
  }

}

.map-btn{
  display:block;
  margin-top:15px;
  padding:12px;
  background:#2a9d8f;
  color:#fff;
  text-decoration:none;
  border-radius:30px;
  font-weight:bold;
}


/* ===== モーダルデータ ===== */

.modal-data{
  display:none;
}

</style>


<!-- ==================================================
     共通モーダル本体
     ================================================== -->

<div id="modal" class="modal">

  <div class="modal-box">

    <span id="modal-close">&times;</span>

    <a

</div>
