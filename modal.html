  ============================================================
  長高祭2026 共通モーダル
  ============================================================

  企画ID
  1a / 1b / 1c / 1d / 1e / 1f / 1g
  2a / 2b / 2c / 2d / 2e / 2f / 2g
  3a / 3b / 3c / 3d / 3e / 3f / 3g

  別ページからは

  event.html?modal=1a

  のように呼び出せます。


  ============================================================
  データの設定
  ============================================================

  data-title
  → 「◯年◯組　タイトル」

  data-catchcopy
  → タイトルの下に表示される太字のキャッチコピー

  data-place
  → 開催場所

  data-desc
  → 説明文

  data-img
  → 企画画像

  data-link
  → フロアマップへのリンク
-->


<style>

/* ============================================================
   モーダル全体
   ============================================================ */

.modal{
  display:none;

  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  padding:20px;

  box-sizing:border-box;

  background:rgba(18,25,35,0.72);

  justify-content:center;
  align-items:center;

  z-index:9999;

  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}


/* ============================================================
   モーダル本体
   ============================================================ */

.modal-box{
  width:100%;
  max-width:460px;

  max-height:90vh;

  overflow-y:auto;

  position:relative;

  box-sizing:border-box;

  background:#ffffff;

  border-radius:24px;

  padding:14px 14px 22px;

  text-align:center;

  box-shadow:
    0 20px 60px rgba(0,0,0,0.22),
    0 4px 15px rgba(0,0,0,0.10);

  animation:modalFadeIn 0.28s ease-out;

  scrollbar-width:thin;
}


/* ============================================================
   モーダル上部画像
   ============================================================ */

.modal-box img{
  display:block;

  width:100%;

  aspect-ratio:16 / 9;

  object-fit:cover;

  border-radius:17px;

  margin:0 0 20px;

  background:#f1f3f5;
}


/* ============================================================
   閉じるボタン
   ============================================================ */

#modal-close{
  position:absolute;

  top:24px;
  right:24px;

  width:38px;
  height:38px;

  display:flex;

  align-items:center;
  justify-content:center;

  padding:0;

  border:none;

  border-radius:50%;

  background:rgba(255,255,255,0.95);

  color:#333;

  font-family:Arial,sans-serif;

  font-size:25px;

  line-height:1;

  cursor:pointer;

  z-index:5;

  box-shadow:
    0 3px 12px rgba(0,0,0,0.16);

  transition:
    transform 0.2s ease,
    background 0.2s ease;
}


#modal-close:hover{
  transform:scale(1.08);

  background:#ffffff;
}


#modal-close:active{
  transform:scale(0.94);
}


/* ============================================================
   タイトル
   ============================================================ */

#modal-title{
  margin:0;

  padding:0 12px;

  color:#222222;

  font-size:clamp(21px,5vw,27px);

  font-weight:800;

  line-height:1.45;

  letter-spacing:0.03em;
}


/* ============================================================
   キャッチコピー
   ============================================================ */

#modal-catchcopy{
  margin:10px 12px 0;

  color:#222222;

  font-size:clamp(16px,4vw,19px);

  font-weight:800;

  line-height:1.65;

  letter-spacing:0.02em;
}


/* ============================================================
   区切り線
   ============================================================ */

.modal-divider{
  width:46px;

  height:4px;

  margin:15px auto 14px;

  border-radius:10px;

  background:#2a9d8f;
}


/* ============================================================
   開催場所
   ============================================================ */

#modal-place{
  margin:0 10px;

  color:#2a9d8f;

  font-size:15px;

  font-weight:800;

  line-height:1.6;
}


/* ============================================================
   説明文
   ============================================================ */

#modal-desc{
  margin:12px 12px 0;

  color:#555555;

  font-size:14px;

  line-height:1.8;
}


/* ============================================================
   フロアマップボタン
   ============================================================ */

.map-btn{
  display:flex;

  align-items:center;
  justify-content:center;

  gap:8px;

  width:calc(100% - 24px);

  min-height:52px;

  box-sizing:border-box;

  margin:22px 12px 0;

  padding:13px 20px;

  background:#2a9d8f;

  color:#ffffff;

  text-decoration:none;

  border-radius:999px;

  font-size:15px;

  font-weight:800;

  letter-spacing:0.03em;

  box-shadow:
    0 6px 15px rgba(42,157,143,0.24);

  transition:
    transform 0.2s ease,
    box-shadow 0.2s ease,
    background 0.2s ease;
}


.map-btn:hover{
  background:#238b7e;

  transform:translateY(-2px);

  box-shadow:
    0 9px 20px rgba(42,157,143,0.30);
}


.map-btn:active{
  transform:translateY(0);
}


/* ============================================================
   フロアマップボタンの矢印
   ============================================================ */

.map-arrow{
  font-size:18px;

  line-height:1;
}


/* ============================================================
   企画データ
   ============================================================ */

.modal-data{
  display:none;
}


/* ============================================================
   モーダル表示アニメーション
   ============================================================ */

@keyframes modalFadeIn{

  from{
    opacity:0;

    transform:
      translateY(12px)
      scale(0.97);
  }

  to{
    opacity:1;

    transform:
      translateY(0)
      scale(1);
  }

}


/* ============================================================
   スマートフォン
   ============================================================ */

@media (max-width:600px){

  .modal{
    padding:14px;
  }


  .modal-box{
    max-height:92vh;

    border-radius:21px;

    padding:10px 10px 18px;
  }


  .modal-box img{
    border-radius:15px;

    margin-bottom:17px;
  }


  #modal-close{
    top:18px;
    right:18px;

    width:35px;
    height:35px;

    font-size:23px;
  }


  #modal-title{
    font-size:21px;
  }


  #modal-catchcopy{
    font-size:16px;
  }


  #modal-place{
    font-size:14px;
  }


  #modal-desc{
    font-size:13px;
  }


  .map-btn{
    width:calc(100% - 16px);

    margin-left:8px;
    margin-right:8px;

    min-height:50px;
  }

}


/* ============================================================
   小さいスマートフォン
   ============================================================ */

@media (max-width:380px){

  .modal-box{
    border-radius:19px;
  }


  #modal-title{
    font-size:19px;
  }


  #modal-catchcopy{
    font-size:15px;
  }

}


/* ============================================================
   動きを減らす設定
   ============================================================ */

@media (prefers-reduced-motion:reduce){

  .modal-box{
    animation:none;
  }


  #modal-close,
  .map-btn{
    transition:none;
  }

}

</style>

<!-- ============================================================

     ============================================================ -->

<script>

document.addEventListener("DOMContentLoaded", function(){


  /* ==========================================================
     要素取得
     ========================================================== */

  const modal =
    document.getElementById("modal");


  const modalBox =
    document.querySelector(".modal-box");


  const modalClose =
    document.getElementById("modal-close");


  const modalImg =
    document.getElementById("modal-img");


  const modalTitle =
    document.getElementById("modal-title");


  const modalCatchcopy =
    document.getElementById("modal-catchcopy");


  const modalPlace =
    document.getElementById("modal-place");


  const modalDesc =
    document.getElementById("modal-desc");


  const modalLink =
    document.getElementById("modal-link");



  /* ==========================================================
     モーダルを開く
     ========================================================== */

  function openModal(id){


    const data =
      document.getElementById(
        "modal-data-" + id
      );


    /* データが存在しない場合 */

    if(!data){

      console.warn(
        "モーダルデータが見つかりません:",
        id
      );

      return;

    }



    /* ========================================================
       画像
       ======================================================== */

    modalImg.src =
      data.dataset.img || "";


    modalImg.alt =
      data.dataset.title ||
      "企画画像";



    /* ========================================================
       タイトル
       ======================================================== */

    modalTitle.textContent =
      data.dataset.title || "";



    /* ========================================================
       キャッチコピー
       ======================================================== */

    modalCatchcopy.textContent =
      data.dataset.catchcopy || "";



    /* ========================================================
       開催場所
       ======================================================== */

    modalPlace.textContent =
      data.dataset.place || "";



    /* ========================================================
       説明
       ======================================================== */

    modalDesc.textContent =
      data.dataset.desc || "";



    /* ========================================================
       フロアマップへのリンク
       ======================================================== */

    modalLink.href =
      data.dataset.link ||
      "map.html";



    /* ========================================================
       モーダルを表示
       ======================================================== */

    modal.style.display = "flex";



    /* ========================================================
       背景のスクロールを停止
       ======================================================== */

    document.body.style.overflow =
      "hidden";



    /* ========================================================
       モーダルのスクロール位置を先頭へ
       ======================================================== */

    if(modalBox){

      modalBox.scrollTop = 0;

    }

  }



  /* ==========================================================
     モーダルを閉じる
     ========================================================== */

  function closeModal(){


    modal.style.display =
      "none";


    document.body.style.overflow =
      "";

  }



  /* ==========================================================
     ×ボタンで閉じる
     ========================================================== */

  modalClose.addEventListener(
    "click",
    function(){

      closeModal();

    }
  );



  /* ==========================================================
     モーダルの外側をクリックして閉じる
     ========================================================== */

  modal.addEventListener(
    "click",
    function(event){

      if(event.target === modal){

        closeModal();

      }

    }
  );



  /* ==========================================================
     ESCキーで閉じる
     ========================================================== */

  document.addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Escape" &&
        modal.style.display === "flex"
      ){

        closeModal();

      }

    }
  );



  /* ==========================================================
     URLの ?modal=1a を取得
     ========================================================== */

  const params =
    new URLSearchParams(
      window.location.search
    );


  const modalId =
    params.get("modal");



  /* ==========================================================
     URLにmodal指定がある場合
     自動的にモーダルを表示
     ========================================================== */

  if(modalId){

    openModal(modalId);

  }



  /* ==========================================================
     外部からモーダルを開けるようにする
     
     例：
     openFestivalModal("1a");
     ========================================================== */

  window.openFestivalModal =
    openModal;


  window.closeFestivalModal =
    closeModal;


});

</script>
