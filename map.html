<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>フロアマップ</title>

<link rel="stylesheet" href="css/style.css">


<style>

/* =========================================
   基本設定
========================================= */

body {
  margin: 0;

  background-color: white;

  color: #111;

  font-family:
    "Noto Sans JP",
    "Yu Gothic",
    "Hiragino Sans",
    sans-serif;

  overflow-x: hidden;
}


/* =========================================
   フロアマップ全体
========================================= */

.map-page {

  position: relative;

  z-index: 2;

  width: 100%;

  padding-top: 100px;

  padding-bottom: 35px;

}


/* =========================================
   タイトル
========================================= */

.map-title {

  width: 100%;

  text-align: center;

  margin: 0 auto 24px;

  position: relative;

  z-index: 3;

}


/* タイトル */

.map-title-main {

  display: flex;

  align-items: center;

  justify-content: center;

  gap: 18px;

  font-size: clamp(34px, 4vw, 56px);

  font-weight: 700;

  line-height: 1.2;

  letter-spacing: 0.02em;

}


/* タイトル左の三角 */

.map-title-main::before {

  content: "";

  display: block;

  width: 0;

  height: 0;

  border-top: 28px solid transparent;

  border-bottom: 28px solid transparent;

  border-left: 48px solid #ef5b7b;

}


/* FLOOR MAP */

.map-title-sub {

  margin-top: 7px;

  color: #ef5b7b;

  font-size: clamp(15px, 1.5vw, 21px);

  font-weight: 500;

  letter-spacing: 0.03em;

}


/* =========================================
   左右コンテンツ
========================================= */

.map-content {

  width: min(1240px, calc(100% - 60px));

  margin: 0 auto;

  display: grid;

  grid-template-columns:
    225px
    minmax(0, 830px);

  align-items: center;

  justify-content: center;

  gap: 24px;

}


/* =========================================
   左側説明ボックス
========================================= */

.map-guide {

  width: 100%;

  background: rgba(255, 255, 255, 0.97);

  border-radius: 6px;

  border-top: 5px solid #ef5b7b;

  box-shadow:
    0 8px 25px rgba(0, 0, 0, 0.10);

  padding: 22px 20px;

  box-sizing: border-box;

}


/* 説明タイトル */

.map-guide-title {

  margin: 0 0 18px;

  color: #ef5b7b;

  font-size: 18px;

  font-weight: 700;

  line-height: 1.7;

}


/* 説明項目 */

.map-guide-item {

  display: flex;

  align-items: flex-start;

  gap: 10px;

  margin-bottom: 18px;

}


.map-guide-item:last-child {

  margin-bottom: 0;

}


/* =========================================
   説明アイコン
========================================= */

.guide-icon {

  flex: 0 0 26px;

  width: 26px;

  height: 26px;

  border-radius: 2px;

  margin-top: 2px;

}


/* 2棟・1棟 */

.guide-icon-building {

  background: #8fd3d0;

}


/* 体育館 */

.guide-icon-gym {

  background: #f09caf;

}


/* 正門・南門 */

.guide-icon-gate {

  background: #405d7b;

}


/* =========================================
   説明文
========================================= */

.guide-text {

  min-width: 0;

}


.guide-text-title {

  margin: 0;

  font-size: 16px;

  font-weight: 700;

  line-height: 1.5;

}


.guide-text-description {

  margin: 5px 0 0;

  font-size: 12px;

  font-weight: 500;

  line-height: 1.65;

}


/* =========================================
   地図
========================================= */

.map-container {

  position: relative;

  width: 100%;

  /*
    元画像
    2000 × 1500px

    比率
    4 : 3
  */

  aspect-ratio: 4 / 3;

  overflow: hidden;

  background: #fff;

  border-radius: 24px;

  box-shadow:
    0 8px 30px rgba(0, 0, 0, 0.08);

}


/* =========================================
   地図画像
========================================= */

.main-map {

  position: absolute;

  top: 0;

  left: 0;

  width: 100%;

  height: 100%;

  display: block;

  object-fit: contain;

  object-position: center;

  user-select: none;

  -webkit-user-drag: none;

}


/* =========================================
   建物リンク共通
========================================= */

.map-link {

  position: absolute;

  z-index: 10;

  display: flex;

  align-items: center;

  justify-content: center;

  /*
    文字とボタンを近づける
  */

  gap: 7px;

  color: #111;

  text-decoration: none;

  /*
    文字サイズを少し調整
    文字＋ボタン全体を
    建物内部に収める
  */

  font-size: 24px;

  font-weight: 700;

  line-height: 1;

  white-space: nowrap;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;

  /*
    この位置を
    文字＋ボタン全体の
    完全な中心点として扱う
  */

  transform: translate(-50%, -50%);

}


/* =========================================
   白い円形ボタン
========================================= */

.map-link-arrow {

  display: flex;

  align-items: center;

  justify-content: center;

  flex: 0 0 34px;

  width: 34px;

  height: 34px;

  box-sizing: border-box;

  border-radius: 50%;

  background: #ffffff;

  color: #222;

  font-family:
    Arial,
    sans-serif;

  font-size: 23px;

  font-weight: 400;

  line-height: 1;

  text-align: center;

  padding: 0;

  margin: 0;

  box-shadow:
    0 2px 7px rgba(0, 0, 0, 0.06);

}


/* =========================================
   2棟
========================================= */

/*
   2棟の図形の
   縦横中央に
   文字＋ボタンの中心を合わせる
*/

.map-link-2tou {

  top: 11%;

  left: 43%;

}


/* =========================================
   1棟
========================================= */

/*
   1棟の図形の
   縦横中央
*/

.map-link-1tou {

  top: 46%;

  left: 46.5%;

}


/* =========================================
   体育館
========================================= */

/*
   体育館の図形の
   縦横中央
*/

.map-link-gym {

  top: 75.5%;

  left: 35.7%;

}


/* =========================================
   ホバー
========================================= */

.map-link:hover .map-link-arrow {

  background: #fafafa;

}


/* =========================================
   下部文章
========================================= */

.map-bottom-text {

  margin: 27px auto 0;

  text-align: center;

  color: #ef5b7b;

  font-size: clamp(15px, 1.5vw, 21px);

  font-weight: 700;

  letter-spacing: 0.02em;

}


.map-bottom-text::before {

  content: "＼";

  margin-right: 14px;

  font-size: 1.2em;

}


.map-bottom-text::after {

  content: "／";

  margin-left: 14px;

  font-size: 1.2em;

}


/* =========================================
   PC
========================================= */

@media (min-width: 1100px) {

  .map-page {

    padding-top: 105px;

  }


  .map-title {

    margin-bottom: 25px;

  }


  .map-content {

    grid-template-columns:
      225px
      minmax(0, 830px);

    gap: 24px;

  }


  /* =======================================
     建物リンク
  ======================================= */

  .map-link {

    font-size: 24px;

    gap: 7px;

  }


  /* =======================================
     円形ボタン
  ======================================= */

  .map-link-arrow {

    flex-basis: 34px;

    width: 34px;

    height: 34px;

    font-size: 23px;

  }


  /* =======================================
     2棟
  ======================================= */

  .map-link-2tou {

    top: 11%;

    left: 43%;

  }


  /* =======================================
     1棟
  ======================================= */

  .map-link-1tou {

    top: 46%;

    left: 46.5%;

  }


  /* =======================================
     体育館
  ======================================= */

  .map-link-gym {

    top: 75.5%;

    left: 35.7%;

  }

}


/* =========================================
   タブレット
========================================= */

@media (max-width: 900px) {

  .map-page {

    padding-top: 95px;

  }


  .map-content {

    width: min(
      700px,
      calc(100% - 40px)
    );

    grid-template-columns:
      190px
      minmax(0, 1fr);

    gap: 18px;

  }


  .map-guide {

    padding: 18px 15px;

  }


  .map-guide-title {

    font-size: 16px;

  }


  .guide-text-title {

    font-size: 14px;

  }


  .guide-text-description {

    font-size: 11px;

  }


  /* =======================================
     地図上の文字
  ======================================= */

  .map-link {

    font-size: 20px;

    gap: 6px;

  }


  /* 円 */

  .map-link-arrow {

    flex-basis: 32px;

    width: 32px;

    height: 32px;

    font-size: 21px;

  }


  /* =======================================
     2棟
  ======================================= */

  .map-link-2tou {

    top: 11%;

    left: 43%;

  }


  /* =======================================
     1棟
  ======================================= */

  .map-link-1tou {

    top: 46%;

    left: 46.5%;

  }


  /* =======================================
     体育館
  ======================================= */

  .map-link-gym {

    top: 75.5%;

    left: 35.7%;

  }

}


/* =========================================
   スマートフォン
========================================= */

@media (max-width: 700px) {

  .map-page {

    padding-top: 85px;

    padding-bottom: 25px;

  }


  /* =======================================
     タイトル
  ======================================= */

  .map-title {

    margin-bottom: 18px;

  }


  .map-title-main {

    gap: 10px;

    font-size: 31px;

  }


  .map-title-main::before {

    border-top-width: 17px;

    border-bottom-width: 17px;

    border-left-width: 30px;

  }


  .map-title-sub {

    margin-top: 4px;

    font-size: 13px;

  }


  /* =======================================
     コンテンツ
  ======================================= */

  .map-content {

    width: calc(100% - 28px);

    display: flex;

    flex-direction: column;

    gap: 15px;

    align-items: stretch;

  }


  /* =======================================
     説明ボックス
  ======================================= */

  .map-guide {

    width: 100%;

    padding: 15px 17px;

    border-radius: 5px;

    display: grid;

    grid-template-columns:
      1fr
      1fr;

    column-gap: 12px;

    row-gap: 12px;

  }


  .map-guide-title {

    grid-column: 1 / -1;

    margin-bottom: 0;

    font-size: 15px;

    line-height: 1.5;

  }


  .map-guide-item {

    margin-bottom: 0;

    gap: 8px;

  }


  .guide-icon {

    flex-basis: 21px;

    width: 21px;

    height: 21px;

  }


  .guide-text-title {

    font-size: 13px;

  }


  .guide-text-description {

    font-size: 10px;

    line-height: 1.5;

  }


  /* =======================================
     地図
  ======================================= */

  .map-container {

    width: 100%;

    /*
      元画像 2000 × 1500
      4 : 3
    */

    aspect-ratio: 4 / 3;

    border-radius: 15px;

  }


  /* =======================================
     地図上の文字
  ======================================= */

  .map-link {

    font-size: 17px;

    gap: 5px;

  }


  /* =======================================
     円形ボタン
  ======================================= */

  .map-link-arrow {

    flex-basis: 29px;

    width: 29px;

    height: 29px;

    font-size: 19px;

  }


  /* =======================================
     2棟
  ======================================= */

  .map-link-2tou {

    top: 11%;

    left: 43%;

  }


  /* =======================================
     1棟
  ======================================= */

  .map-link-1tou {

    top: 46%;

    left: 46.5%;

  }


  /* =======================================
     体育館
  ======================================= */

  .map-link-gym {

    top: 75.5%;

    left: 35.7%;

  }


  /* =======================================
     下部文章
  ======================================= */

  .map-bottom-text {

    margin-top: 17px;

    padding: 0 10px;

    font-size: 13px;

  }


  .map-bottom-text::before {

    margin-right: 7px;

  }


  .map-bottom-text::after {

    margin-left: 7px;

  }

}


/* =========================================
   小さいスマートフォン
========================================= */

@media (max-width: 400px) {

  .map-title-main {

    font-size: 27px;

  }


  .map-title-main::before {

    border-top-width: 14px;

    border-bottom-width: 14px;

    border-left-width: 25px;

  }


  .map-guide {

    padding: 13px;

  }


  .guide-text-title {

    font-size: 12px;

  }


  .guide-text-description {

    font-size: 9px;

  }


  /* =======================================
     地図上
  ======================================= */

  .map-link {

    font-size: 15px;

    gap: 4px;

  }


  .map-link-arrow {

    flex-basis: 26px;

    width: 26px;

    height: 26px;

    font-size: 17px;

  }


  /* =======================================
     2棟
  ======================================= */

  .map-link-2tou {

    top: 11%;

    left: 43%;

  }


  /* =======================================
     1棟
  ======================================= */

  .map-link-1tou {

    top: 46%;

    left: 46.5%;

  }


  /* =======================================
     体育館
  ======================================= */

  .map-link-gym {

    top: 75.5%;

    left: 35.7%;

  }

}

</style>

</head>


<body>


<!-- =========================================
     背景図形
========================================= -->

<div class="bg-shapes">

  <div class="shape s1"></div>

  <div class="shape s2"></div>

  <div class="shape s3"></div>

  <div class="shape s4"></div>

  <div class="shape s5"></div>

  <div class="shape s6"></div>

  <div class="shape s7"></div>

  <div class="shape s8"></div>

</div>


<!-- =========================================
     ヘッダー
========================================= -->

<div id="header"></div>


<script>

fetch("header.html")

  .then(res => res.text())

  .then(data => {

    document.getElementById("header").innerHTML = data;

    const btn =
      document.querySelector(".menu-btn");

    const nav =
      document.querySelector(".nav");


    if (btn && nav) {

      btn.addEventListener("click", (e) => {

        e.stopPropagation();

        nav.classList.toggle("active");

      });


      document.addEventListener("click", (e) => {

        if (
          !nav.contains(e.target) &&
          !btn.contains(e.target)
        ) {

          nav.classList.remove("active");

        }

      });

    }

  })

  .catch(error => {

    console.error(
      "header.htmlの読み込みに失敗しました。",
      error
    );

  });

</script>


<!-- =========================================
     フロアマップ
========================================= -->

<main class="map-page">


  <!-- =======================================
       タイトル
  ======================================== -->

  <section class="map-title">

    <div class="map-title-main">

      <span>
        フロアマップ
      </span>

    </div>


    <div class="map-title-sub">

      FLOOR MAP

    </div>

  </section>


  <!-- =======================================
       左：説明
       右：地図
  ======================================== -->

  <section class="map-content">


    <!-- =====================================
         左側説明
    ====================================== -->

    <aside class="map-guide">


      <h2 class="map-guide-title">

        建物をタップして<br>

        フロアマップを表示

      </h2>


      <!-- ===================================
           2棟・1棟
      ==================================== -->

      <div class="map-guide-item">

        <span
          class="guide-icon guide-icon-building">
        </span>


        <div class="guide-text">

          <p class="guide-text-title">

            2棟・1棟

          </p>


          <p class="guide-text-description">

            各階のフロアマップが<br>

            表示されます

          </p>

        </div>

      </div>


      <!-- ===================================
           体育館
      ==================================== -->

      <div class="map-guide-item">

        <span
          class="guide-icon guide-icon-gym">
        </span>


        <div class="guide-text">

          <p class="guide-text-title">

            体育館

          </p>


          <p class="guide-text-description">

            体育館のフロアマップが<br>

            表示されます

          </p>

        </div>

      </div>


      <!-- ===================================
           正門・南門
      ==================================== -->

      <div class="map-guide-item">

        <span
          class="guide-icon guide-icon-gate">
        </span>


        <div class="guide-text">

          <p class="guide-text-title">

            正門・南門

          </p>


          <p class="guide-text-description">

            出入口の位置です

          </p>

        </div>

      </div>


    </aside>



    <!-- =====================================
         地図
    ====================================== -->

    <div class="map-container">


      <!-- 地図元画像 -->

      <img
        src="images/map_big.jpg"
        class="main-map"
        alt="長高祭 フロアマップ"
        draggable="false"
      >


      <!-- =================================
           2棟
      ================================== -->

      <a
        href="2tou.html"
        class="map-link map-link-2tou"
        aria-label="2棟のフロアマップを見る"
      >

        <span class="map-link-text">

          2棟

        </span>


        <span class="map-link-arrow">

          ›

        </span>

      </a>


      <!-- =================================
           1棟
      ================================== -->

      <a
        href="1tou.html"
        class="map-link map-link-1tou"
        aria-label="1棟のフロアマップを見る"
      >

        <span class="map-link-text">

          1棟

        </span>


        <span class="map-link-arrow">

          ›

        </span>

      </a>


      <!-- =================================
           体育館
      ================================== -->

      <a
        href="gym.html"
        class="map-link map-link-gym"
        aria-label="体育館のフロアマップを見る"
      >

        <span class="map-link-text">

          体育館

        </span>


        <span class="map-link-arrow">

          ›

        </span>

      </a>


    </div>


  </section>



  <!-- =======================================
       下部文章
  ======================================== -->

  <div class="map-bottom-text">

    気になる建物をタップして、各階のフロアマップをチェック！

  </div>


</main>


</body>

</html>
