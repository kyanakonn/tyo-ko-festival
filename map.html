```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フロアマップ</title>
<link rel="stylesheet" href="css/style.css">

<style>
/* 全体 */
body {
  background-color: white;
  color: black;
  font-family: sans-serif;
  margin: 0;
}

/* タイトル */
.title {
  text-align: center;
  margin: 20px 0;
}

/* 戻るボタン */
.back-btn {
  display: inline-block;
  padding: 10px 16px;
  background: black;
  color: white;
  border-radius: 8px;
  text-decoration: none;
}

/* マップ */
.map-container {
  position: relative;
  width: 90%;
  max-width: 500px;
  margin: auto;
}

.main-map {
  width: 100%;
  display: block;
}

/* 階ボタン */
.floor-btn {
  display: none;
  pointer-events: none;
}

/* ボタン位置（あとで調整） */
.f4 { top: 18%; left: 65%; }
.f3 { top: 35%; left: 60%; }
.f2 { top: 52%; left: 55%; }
.f1 { top: 70%; left: 50%; }

/* マップ内リンク */
.map-link {
  position: absolute;
  color: blue;
  font-weight: bold;
  text-decoration: underline;
  z-index: 10;
  white-space: nowrap;
}

/* 2棟 */
.map-link-2tou {
  top: 13.5%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* 1棟 */
.map-link-1tou {
  top: 34.5%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* 体育館 */
.map-link-gym {
  top: 59.5%;
  left: 50%;
  transform: translate(-50%, -50%);
}

</style>

</head>
<body>

  <div class="bg-shapes">
    <div class="shape s1"></div>
    <div class="shape s2"></div>
    <div class="shape s3"></div>
    <div class="shape s4"></div>
    <div class="shape s5"></div>
    <div class="shape s6"></div>
    <div class="shape s7"></div>
    <div class="shape s8"></div>
  </div>
  
  <div id="header"></div>

  <script>
  fetch("header.html")
    .then(res => res.text())
    .then(data => {
      document.getElementById("header").innerHTML = data;

      const btn = document.querySelector(".menu-btn");
      const nav = document.querySelector(".nav");

      // 開閉
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        nav.classList.toggle("active");
      });

      document.addEventListener("click", (e) => {
        if (!nav.contains(e.target) && !btn.contains(e.target)) {
          nav.classList.remove("active");
        }
      });
    });
  </script>

  <div class="map-container">

    <!-- 背景画像 -->
    <img src="images/map_big.jpg" class="main-map">

    <!-- 階ボタン -->
    <a href="floor4.html" class="floor-btn f4">4F</a>
    <a href="floor3.html" class="floor-btn f3">3F</a>
    <a href="floor2.html" class="floor-btn f2">2F</a>
    <a href="floor1.html" class="floor-btn f1">1F</a>

    <!-- マップ内リンク -->
    <a href="2tou.html" class="map-link map-link-2tou">2棟</a>
    <a href="1tou.html" class="map-link map-link-1tou">1棟</a>
    <a href="gym.html" class="map-link map-link-gym">体育館</a>

  </div>

</body>
</html>
