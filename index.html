    const headerContainer = document.getElementById("header");

    headerContainer.innerHTML = data;

    const header = headerContainer.querySelector("header");
    const btn = headerContainer.querySelector(".menu-btn");
    const nav = headerContainer.querySelector(".nav");

    function updateHeaderHeight() {

      if (!header) return;

      const height = header.getBoundingClientRect().height;

      document.documentElement.style.setProperty(
        "--header-height",
        height + "px"
      );
    }

    updateHeaderHeight();

    window.addEventListener("resize", updateHeaderHeight);

    if (btn && nav) {

      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        nav.classList.toggle("active");

        if (
          !nav.contains(e.target) &&
          !btn.contains(e.target)
        ) {
          nav.classList.remove("active");
        }

      });
    }

  });
</script>

<script>

// ローディング
window.addEventListener("load", () => {

  const loader =
    document.getElementById("loader");

  loader.style.opacity = "0";

  setTimeout(() => {

    loader.style.display = "none";

  }, 500);

});


// GSAP
gsap.registerPlugin(ScrollTrigger);


// タイトルアニメ
const text =
  document.getElementById("title");

const chars =
  text.innerText.split("");

text.innerHTML = "";

chars.forEach(c => {

  const span =
    document.createElement("span");

  span.innerText = c;

  span.style.opacity = 0;

  span.style.display =
    "inline-block";

  span.style.transform =
    "translateY(20px)";

  text.appendChild(span);

});

gsap.to("#title span", {
  opacity: 1,
  y: 0,
  stagger: 0.05
});


// スクロールアニメ
gsap.utils.toArray("section").forEach(sec => {

  gsap.from(sec, {

    opacity: 0,

    y: 50,

    duration: 1,

    scrollTrigger: {
      trigger: sec,
      start: "top 80%"
    }

  });

});


// =========================================
// 企画・イベント スライダー
// 完全循環方式
// =========================================

const slides =
  document.getElementById("slides");

const dotsContainer =
  document.getElementById("dots");

const slider =
  document.querySelector(".slider");

let startX = 0;
let currentX = 0;
let velocity = 0;

let isDragging = false;
let autoSlide;

let currentIndex = 0;
let slideWidth = 0;

let isAnimating = false;


const total =
  slides.children.length;


function getSlideWidth(){

  const card =
    slides.children[0];

  if(!card) return 0;

  const style =
    getComputedStyle(card);

  const width =
    card.getBoundingClientRect().width;

  const marginLeft =
    parseFloat(style.marginLeft) || 0;

  const marginRight =
    parseFloat(style.marginRight) || 0;

  return width +
         marginLeft +
         marginRight;

}


function updateSlideWidth(){

  slideWidth =
    getSlideWidth();

}


function setPosition(
  value,
  animate = false
){

  slides.style.transition =
    animate ? "0.5s" : "none";

  slides.style.transform =
    `translateX(${value}px)`;

}


window.addEventListener("load", () => {

  updateSlideWidth();

  setPosition(0, false);

});


for(let i = 0; i < total; i++){

  const dot =
    document.createElement("span");

  if(i === 0){

    dot.classList.add("active");

  }


  dot.addEventListener("click", () => {

    if(isAnimating) return;

    const target =
      i;

    let forward =
      (target - currentIndex + total) % total;

    let backward =
      (currentIndex - target + total) % total;


    if(forward === 0){

      updateDots();

      return;

    }


    if(forward <= backward){

      moveForwardSteps(forward);

    }else{

      moveBackwardSteps(backward);

    }

  });


  dotsContainer.appendChild(dot);

}


function updateDots(){

  const dots =
    dotsContainer.querySelectorAll("span");

  dots.forEach((dot, i) => {

    dot.classList.toggle(
      "active",
      i === currentIndex
    );

  });

}


function moveBackward(){

  if(isAnimating) return;

  isAnimating = true;

  updateSlideWidth();


  const last =
    slides.lastElementChild;

  slides.insertBefore(
    last,
    slides.firstElementChild
  );


  slides.style.transition =
    "none";

  slides.style.transform =
    `translateX(-${slideWidth}px)`;


  requestAnimationFrame(() => {

    requestAnimationFrame(() => {

      slides.style.transition =
        "0.5s";

      slides.style.transform =
        "translateX(0px)";

    });

  });


  currentIndex--;

  if(currentIndex < 0){

    currentIndex =
      total - 1;

  }

  updateDots();


  let finished = false;

  const finish = () => {

    if(finished) return;

    finished = true;

    clearTimeout(fallback);

    slides.removeEventListener(
      "transitionend",
      finish
    );

    isAnimating = false;

  };


  const fallback =
    setTimeout(finish, 700);


  slides.addEventListener(
    "transitionend",
    finish
  );

}


function finishAnimation(){

  isAnimating = false;

}


function moveForward(){

  if(isAnimating) return;

  isAnimating = true;

  updateSlideWidth();


  slides.style.transition =
    "0.5s";

  slides.style.transform =
    `translateX(-${slideWidth}px)`;


  currentIndex++;

  if(currentIndex >= total){

    currentIndex =
      0;

  }

  updateDots();


  let finished = false;


  const finish = () => {

    if(finished) return;

    finished = true;

    clearTimeout(fallback);

    slides.removeEventListener(
      "transitionend",
      finish
    );


    const first =
      slides.firstElementChild;

    slides.appendChild(first);


    slides.style.transition =
      "none";

    slides.style.transform =
      "translateX(0px)";


    requestAnimationFrame(() => {

      isAnimating =
        false;

    });

  };


  slides.addEventListener(
    "transitionend",
    finish
  );


  const fallback =
    setTimeout(finish, 700);

}


function moveForwardSteps(count){

  if(count <= 0){

    isAnimating =
      false;

    return;

  }


  moveForward();

  const check =
    setInterval(() => {

      if(!isAnimating){

        clearInterval(check);

        if(count > 1){

          moveForwardSteps(
            count - 1
          );

        }

      }

    }, 20);

}


function moveBackwardSteps(count){

  if(count <= 0){

    isAnimating =
      false;

    return;

  }


  moveBackward();

  const check =
    setInterval(() => {

      if(!isAnimating){

        clearInterval(check);

        if(count > 1){

          moveBackwardSteps(
            count - 1
          );

        }

      }

    }, 20);

}


function startAuto(){

  stopAuto();


  autoSlide =
    setInterval(() => {

      if(
        !isDragging &&
        !isAnimating
      ){

        moveForward();

      }

    }, 3000);

}


function stopAuto(){

  if(autoSlide){

    clearInterval(autoSlide);

    autoSlide =
      null;

  }

}


startAuto();


// =========================================
// タッチスワイプ
// =========================================

slider.addEventListener(
  "touchstart",
  (e) => {

    if(isAnimating) return;

    startX =
      e.touches[0].clientX;

    currentX =
      startX;

    velocity =
      0;

    isDragging =
      true;

    stopAuto();

    slides.style.transition =
      "none";

  },
  { passive: true }
);


slider.addEventListener(
  "touchmove",
  (e) => {

    if(!isDragging) return;


    const x =
      e.touches[0].clientX;


    velocity =
      x - currentX;

    currentX =
      x;


    const move =
      x - startX;


    slides.style.transform =
      `translateX(${move}px)`;

  },
  { passive: true }
);


slider.addEventListener(
  "touchend",
  () => {

    if(!isDragging) return;

    isDragging =
      false;


    const distance =
      currentX - startX;


    if(distance <= -50){

      moveForward();

    }else if(distance >= 50){

      moveBackward();

    }else{

      slides.style.transition =
        "0.5s";

      slides.style.transform =
        "translateX(0px)";

    }


    startAuto();

  },
  { passive: true }
);


slider.addEventListener(
  "touchcancel",
  () => {

    if(!isDragging) return;


    isDragging =
      false;


    slides.style.transition =
      "0.5s";

    slides.style.transform =
      "translateX(0px)";


    startAuto();

  },
  { passive: true }
);


// =========================================
// PCドラッグ
// =========================================

slider.addEventListener(
  "mousedown",
  (e) => {

    if(isAnimating) return;

    startX =
      e.clientX;

    currentX =
      startX;

    velocity =
      0;

    isDragging =
      true;

    stopAuto();

    slides.style.transition =
      "none";

  }
);


slider.addEventListener(
  "mousemove",
  (e) => {

    if(!isDragging) return;

    const x =
      e.clientX;

    velocity =
      x - currentX;

    currentX =
      x;

    const move =
      x - startX;

    slides.style.transform =
      `translateX(${move}px)`;

  }
);


slider.addEventListener(
  "mouseup",
  () => {

    if(!isDragging) return;

    isDragging =
      false;


    if(velocity > 5){

      moveBackward();

    }else if(velocity < -5){

      moveForward();

    }else{

      slides.style.transition =
        "0.5s";

      slides.style.transform =
        "translateX(0px)";

    }


    startAuto();

  }
);


slider.addEventListener(
  "mouseleave",
  () => {

    if(!isDragging) return;

    isDragging =
      false;


    slides.style.transition =
      "0.5s";

    slides.style.transform =
      "translateX(0px)";


    startAuto();

  }
);


// =========================================
// リサイズ対応
// =========================================

window.addEventListener(
  "resize",
  () => {

    updateSlideWidth();

    slides.style.transition =
      "none";

    slides.style.transform =
      "translateX(0px)";

  }
);


// =========================================
// バナースライダー
// 完全循環方式
// 安定動作用に改善
// =========================================

const track =
  document.getElementById("bannerTrack");

const dots =
  document.getElementById("bannerDots");

const banners =
  track.children;

let bIndex = 0;

let bStartX = 0;
let bCurrentX = 0;
let bVelocity = 0;

let bDragging = false;
let bAnimating = false;

let bAuto = null;

const bTotal =
  banners.length;


// =========================================
// バナー幅取得
// =========================================

function getBannerWidth(){

  const banner =
    track.children[0];

  if(!banner) return 0;

  const style =
    getComputedStyle(banner);

  const marginLeft =
    parseFloat(style.marginLeft) || 0;

  const marginRight =
    parseFloat(style.marginRight) || 0;

  return (
    banner.getBoundingClientRect().width +
    marginLeft +
    marginRight
  );

}


let bWidth =
  getBannerWidth();


// =========================================
// バナー位置設定
// =========================================

function setBannerPosition(
  value,
  animate = false
){

  track.style.transition =
    animate ? "0.5s" : "none";

  track.style.transform =
    `translateX(${value}px)`;

}


// =========================================
// バナーアニメーション強制解除
// =========================================

function forceFinishBannerAnimation(){

  bAnimating = false;

  track.style.transition =
    "none";

  track.style.transform =
    "translateX(0px)";

}


// =========================================
// ドット生成
// =========================================

for(let i = 0; i < bTotal; i++){

  const d =
    document.createElement("span");

  if(i === 0){

    d.classList.add("active");

  }


  d.addEventListener("click", () => {

    if(bAnimating) return;

    moveBannerTo(i);

  });


  dots.appendChild(d);

}


// =========================================
// ドット更新
// =========================================

function updateBannerDots(){

  dots
    .querySelectorAll("span")
    .forEach((d, i) => {

      d.classList.toggle(
        "active",
        i === bIndex
      );

    });

}


// =========================================
// バナー次へ
// =========================================

function moveBannerForward(){

  if(bAnimating) return;

  bAnimating = true;

  bWidth =
    getBannerWidth();


  setBannerPosition(
    -bWidth,
    true
  );


  let finished = false;


  const finish = () => {

    if(finished) return;

    finished = true;

    clearTimeout(fallback);

    track.removeEventListener(
      "transitionend",
      finish
    );


    const first =
      track.firstElementChild;

    if(first){

      track.appendChild(first);

    }


    setBannerPosition(
      0,
      false
    );


    bIndex++;

    if(bIndex >= bTotal){

      bIndex = 0;

    }


    updateBannerDots();


    requestAnimationFrame(() => {

      bAnimating =
        false;

    });

  };


  track.addEventListener(
    "transitionend",
    finish
  );


  // transitionendが発火しない場合の安全装置
  const fallback =
    setTimeout(finish, 700);

}


// =========================================
// バナー前へ
// =========================================

function moveBannerBackward(){

  if(bAnimating) return;

  bAnimating = true;

  bWidth =
    getBannerWidth();


  const last =
    track.lastElementChild;


  if(last){

    track.insertBefore(
      last,
      track.firstElementChild
    );

  }


  setBannerPosition(
    -bWidth,
    false
  );


  requestAnimationFrame(() => {

    requestAnimationFrame(() => {

      setBannerPosition(
        0,
        true
      );

    });

  });


  let finished = false;


  const finish = () => {

    if(finished) return;

    finished = true;

    clearTimeout(fallback);

    track.removeEventListener(
      "transitionend",
      finish
    );


    bIndex--;

    if(bIndex < 0){

      bIndex =
        bTotal - 1;

    }


    updateBannerDots();

    bAnimating =
      false;

  };


  track.addEventListener(
    "transitionend",
    finish
  );


  // transitionendが発火しない場合の安全装置
  const fallback =
    setTimeout(finish, 700);

}


// =========================================
// 指定バナーへ移動
// =========================================

function moveBannerTo(target){

  if(bAnimating) return;

  if(target === bIndex){

    updateBannerDots();

    return;

  }


  const forward =
    (target - bIndex + bTotal) % bTotal;

  const backward =
    (bIndex - target + bTotal) % bTotal;


  if(forward <= backward){

    moveBannerForwardSteps(
      forward
    );

  }else{

    moveBannerBackwardSteps(
      backward
    );

  }

}


// =========================================
// 次へ複数枚
// =========================================

function moveBannerForwardSteps(count){

  if(count <= 0){

    bAnimating =
      false;

    return;

  }


  moveBannerForward();


  const check =
    setInterval(() => {

      if(!bAnimating){

        clearInterval(check);

        if(count > 1){

          moveBannerForwardSteps(
            count - 1
          );

        }

      }

    }, 20);

}


// =========================================
// 前へ複数枚
// =========================================

function moveBannerBackwardSteps(count){

  if(count <= 0){

    bAnimating =
      false;

    return;

  }


  moveBannerBackward();


  const check =
    setInterval(() => {

      if(!bAnimating){

        clearInterval(check);

        if(count > 1){

          moveBannerBackwardSteps(
            count - 1
          );

        }

      }

    }, 20);

}


// =========================================
// 自動スライド
// =========================================

function startBannerAuto(){

  stopBannerAuto();


  bAuto =
    setInterval(() => {

      if(
        !bDragging &&
        !bAnimating
      ){

        moveBannerForward();

      }

    }, 3000);

}


function stopBannerAuto(){

  if(bAuto){

    clearInterval(bAuto);

    bAuto = null;

  }

}


// =========================================
// バナータッチスワイプ
// =========================================

track.addEventListener(
  "touchstart",
  (e) => {

    if(bAnimating) return;

    if(!e.touches || !e.touches.length) return;


    bStartX =
      e.touches[0].clientX;

    bCurrentX =
      bStartX;

    bVelocity =
      0;

    bDragging =
      true;


    stopBannerAuto();


    track.style.transition =
      "none";

  },
  { passive: true }
);


track.addEventListener(
  "touchmove",
  (e) => {

    if(!bDragging) return;

    if(!e.touches || !e.touches.length) return;


    const x =
      e.touches[0].clientX;


    bVelocity =
      x - bCurrentX;

    bCurrentX =
      x;


    const move =
      x - bStartX;


    track.style.transform =
      `translateX(${move}px)`;

  },
  { passive: true }
);


// =========================================
// タッチ終了
// =========================================

function finishBannerTouch(){

  if(!bDragging) return;


  bDragging =
    false;


  const distance =
    bCurrentX - bStartX;


  if(distance <= -50){

    moveBannerForward();

  }

  else if(distance >= 50){

    moveBannerBackward();

  }

  else{

    setBannerPosition(
      0,
      true
    );

  }


  startBannerAuto();

}


// =========================================
// 通常のtouchend
// =========================================

track.addEventListener(
  "touchend",
  finishBannerTouch,
  { passive: true }
);


// =========================================
// スクロール等でtouchcancelになった場合
// =========================================

track.addEventListener(
  "touchcancel",
  () => {

    if(!bDragging) return;


    bDragging =
      false;


    setBannerPosition(
      0,
      true
    );


    startBannerAuto();

  },
  { passive: true }
);


// =========================================
// 指が画面外へ出た場合の安全対策
// =========================================

window.addEventListener(
  "touchend",
  () => {

    if(!bDragging) return;

    finishBannerTouch();

  },
  { passive: true }
);


window.addEventListener(
  "touchcancel",
  () => {

    if(!bDragging) return;


    bDragging =
      false;


    setBannerPosition(
      0,
      true
    );


    startBannerAuto();

  },
  { passive: true }
);


// =========================================
// PCドラッグ
// =========================================

track.addEventListener(
  "mousedown",
  (e) => {

    if(bAnimating) return;

    bStartX =
      e.clientX;

    bCurrentX =
      bStartX;

    bVelocity =
      0;

    bDragging =
      true;


    stopBannerAuto();


    track.style.transition =
      "none";

  }
);


track.addEventListener(
  "mousemove",
  (e) => {

    if(!bDragging) return;


    const x =
      e.clientX;


    bVelocity =
      x - bCurrentX;

    bCurrentX =
      x;


    const move =
      x - bStartX;


    track.style.transform =
      `translateX(${move}px)`;

  }
);


track.addEventListener(
  "mouseup",
  () => {

    if(!bDragging) return;


    bDragging =
      false;


    if(bVelocity > 5){

      moveBannerBackward();

    }

    else if(bVelocity < -5){

      moveBannerForward();

    }

    else{

      setBannerPosition(
        0,
        true
      );

    }


    startBannerAuto();

  }
);


track.addEventListener(
  "mouseleave",
  () => {

    if(!bDragging) return;


    bDragging =
      false;


    setBannerPosition(
      0,
      true
    );


    startBannerAuto();

  }
);


// =========================================
// PCマウスが画面外へ出た場合
// =========================================

window.addEventListener(
  "mouseup",
  () => {

    if(!bDragging) return;


    bDragging =
      false;


    setBannerPosition(
      0,
      true
    );


    startBannerAuto();

  }
);


// =========================================
// リサイズ
// =========================================

window.addEventListener(
  "resize",
  () => {

    bWidth =
      getBannerWidth();

    forceFinishBannerAnimation();

  }
);


// =========================================
// 初期化
// =========================================

window.addEventListener(
  "load",
  () => {

    bWidth =
      getBannerWidth();

    setBannerPosition(
      0,
      false
    );


    updateBannerDots();

    startBannerAuto();

  }
);

</script>
