<script>
fetch("header.html")
  .then(res => res.text())
  .then(data => {

    const headerContainer = document.getElementById("header");

    headerContainer.innerHTML = data;

    const header = headerContainer.querySelector("header");
    const btn = headerContainer.querySelector(".menu-btn");
    const nav = headerContainer.querySelector(".nav");

    /* ヘッダーの実際の高さを取得 */
    function updateHeaderHeight() {

      if (!header) return;

      const height = header.getBoundingClientRect().height;

      document.documentElement.style.setProperty(
        "--header-height",
        height + "px"
      );
    }

    updateHeaderHeight();

    window.addEventListener("resize", updateHeaderHeight);

    /* メニュー */
    if (btn && nav) {

      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        nav.classList.toggle("active");
      });

      document.addEventListener("click", (e) => {

        if (
          !nav.contains(e.target) &&
          !btn.contains(e.target)
        ) {
          nav.classList.remove("active");
        }

      });
    }

  });
</script>

<script>

// ローディング
window.addEventListener("load", () => {
  const loader = document.getElementById("loader");

  loader.style.opacity = "0";

  setTimeout(() => {
    loader.style.display = "none";
  }, 500);
});


// GSAP
gsap.registerPlugin(ScrollTrigger);

// タイトルアニメ
const text=document.getElementById("title");
const chars=text.innerText.split("");
text.innerHTML="";
chars.forEach(c=>{
 const span=document.createElement("span");
 span.innerText=c;
 span.style.opacity=0;
 span.style.display="inline-block";
 span.style.transform="translateY(20px)";
 text.appendChild(span);
});

gsap.to("#title span",{opacity:1,y:0,stagger:0.05});

// スクロールアニメ
gsap.utils.toArray("section").forEach(sec=>{
 gsap.from(sec,{
  opacity:0,
  y:50,
  duration:1,
  scrollTrigger:{trigger:sec,start:"top 80%"}
 });
});


// =========================================
// 企画・イベント スライダー
// 完全循環方式
// =========================================

const slides = document.getElementById("slides");
const dotsContainer = document.getElementById("dots");
const slider = document.querySelector(".slider");

let startX = 0;
let currentX = 0;
let velocity = 0;
let isDragging = false;
let autoSlide;

let currentIndex = 0;
let slideWidth = 0;

let isAnimating = false;


// =========================================
// カード数
// =========================================

const total =
  slides.children.length;


// =========================================
// カード1枚分の正確な幅
// =========================================

function getSlideWidth(){

  const card =
    slides.children[0];

  if(!card) return 0;

  const style =
    getComputedStyle(card);

  const width =
    card.getBoundingClientRect().width;

  const marginLeft =
    parseFloat(style.marginLeft) || 0;

  const marginRight =
    parseFloat(style.marginRight) || 0;

  return width +
         marginLeft +
         marginRight;

}


// =========================================
// 現在位置を取得
// =========================================

function updateSlideWidth(){

  slideWidth =
    getSlideWidth();

}


// =========================================
// スライド位置設定
// =========================================

function setPosition(value, animate = false){

  slides.style.transition =
    animate ? "0.5s" : "none";

  slides.style.transform =
    `translateX(${value}px)`;

}


// =========================================
// 初期位置
// =========================================

window.addEventListener("load", () => {

  updateSlideWidth();

  setPosition(0, false);

});


// =========================================
// ドット
// =========================================

for(let i = 0; i < total; i++){

  const dot =
    document.createElement("span");

  if(i === 0){

    dot.classList.add("active");

  }


  dot.addEventListener("click", () => {

    if(isAnimating) return;

    const target =
      i;

    let forward =
      (target - currentIndex + total) % total;

    let backward =
      (currentIndex - target + total) % total;


    // 同じ位置
    if(forward === 0){

      updateDots();

      return;

    }


    // 近い方向へ移動
    if(forward <= backward){

      moveForwardSteps(forward);

    }else{

      moveBackwardSteps(backward);

    }

  });


  dotsContainer.appendChild(dot);

}


// =========================================
// ドット更新
// =========================================

function updateDots(){

  const dots =
    dotsContainer.querySelectorAll("span");

  dots.forEach((dot, i) => {

    dot.classList.toggle(
      "active",
      i === currentIndex
    );

  });

}


// =========================================
// 前へ1枚
// =========================================

function moveBackward(){

  if(isAnimating) return;

  isAnimating = true;

  updateSlideWidth();


  // 最後のカードを先頭へ移動
  const last =
    slides.lastElementChild;

  slides.insertBefore(
    last,
    slides.firstElementChild
  );


  // 移動前の見た目を維持
  slides.style.transition =
    "none";

  slides.style.transform =
    `translateX(-${slideWidth}px)`;


  // ブラウザに反映させてから
  // 元の位置へアニメーション
  requestAnimationFrame(() => {

    requestAnimationFrame(() => {

      slides.style.transition =
        "0.5s";

      slides.style.transform =
        "translateX(0px)";

    });

  });


  currentIndex--;

  if(currentIndex < 0){

    currentIndex =
      total - 1;

  }

  updateDots();


  slides.addEventListener(
    "transitionend",
    finishAnimation,
    { once: true }
  );

}


// =========================================
// 次へ1枚
// =========================================

function moveForward(){

  if(isAnimating) return;

  isAnimating = true;

  updateSlideWidth();


  // 次のカードへスライド
  slides.style.transition =
    "0.5s";

  slides.style.transform =
    `translateX(-${slideWidth}px)`;


  currentIndex++;

  if(currentIndex >= total){

    currentIndex =
      0;

  }

  updateDots();


  slides.addEventListener(
    "transitionend",
    () => {

      // 先頭カードを末尾へ移動
      // これによりDOM自体が循環する
      const first =
        slides.firstElementChild;

      slides.appendChild(first);


      // 位置を0へ戻す
      // カードの並びそのものを変更済みなので
      // 見た目は全く変わらない
      slides.style.transition =
        "none";

      slides.style.transform =
        "translateX(0px)";


      requestAnimationFrame(() => {

        isAnimating =
          false;

      });

    },
    { once: true }
  );

}


// =========================================
// 連続移動（ドット用）
// =========================================

function moveForwardSteps(count){

  if(count <= 0){

    isAnimating =
      false;

    return;

  }


  moveForward();

  const check =
    setInterval(() => {

      if(!isAnimating){

        clearInterval(check);

        if(count > 1){

          moveForwardSteps(
            count - 1
          );

        }

      }

    }, 20);

}


function moveBackwardSteps(count){

  if(count <= 0){

    isAnimating =
      false;

    return;

  }


  moveBackward();

  const check =
    setInterval(() => {

      if(!isAnimating){

        clearInterval(check);

        if(count > 1){

          moveBackwardSteps(
            count - 1
          );

        }

      }

    }, 20);

}


// =========================================
// 自動スライド
// =========================================

function startAuto(){

  stopAuto();


  autoSlide =
    setInterval(() => {

      if(!isDragging &&
         !isAnimating){

        moveForward();

      }

    }, 3000);

}


function stopAuto(){

  if(autoSlide){

    clearInterval(autoSlide);

    autoSlide =
      null;

  }

}


startAuto();


// =========================================
// タッチスワイプ
// =========================================

slider.addEventListener(
  "touchstart",
  (e) => {

    if(isAnimating) return;

    startX =
      e.touches[0].clientX;

    currentX =
      startX;

    velocity =
      0;

    isDragging =
      true;

    stopAuto();

    slides.style.transition =
      "none";

  }
);


slider.addEventListener(
  "touchmove",
  (e) => {

    if(!isDragging) return;

    const x =
      e.touches[0].clientX;

    velocity =
      x - currentX;

    currentX =
      x;

    const move =
      x - startX;


    slides.style.transform =
      `translateX(${move}px)`;

  }
);


slider.addEventListener(
  "touchend",
  () => {

    if(!isDragging) return;

    isDragging =
      false;


    if(velocity > 5){

      moveBackward();

    }else if(velocity < -5){

      moveForward();

    }else{

      slides.style.transition =
        "0.5s";

      slides.style.transform =
        "translateX(0px)";

    }


    startAuto();

  }
);


// =========================================
// PCドラッグ
// =========================================

slider.addEventListener(
  "mousedown",
  (e) => {

    if(isAnimating) return;

    startX =
      e.clientX;

    currentX =
      startX;

    velocity =
      0;

    isDragging =
      true;

    stopAuto();

    slides.style.transition =
      "none";

  }
);


slider.addEventListener(
  "mousemove",
  (e) => {

    if(!isDragging) return;

    const x =
      e.clientX;

    velocity =
      x - currentX;

    currentX =
      x;

    const move =
      x - startX;


    slides.style.transform =
      `translateX(${move}px)`;

  }
);


slider.addEventListener(
  "mouseup",
  () => {

    if(!isDragging) return;

    isDragging =
      false;


    if(velocity > 5){

      moveBackward();

    }else if(velocity < -5){

      moveForward();

    }else{

      slides.style.transition =
        "0.5s";

      slides.style.transform =
        "translateX(0px)";

    }


    startAuto();

  }
);


slider.addEventListener(
  "mouseleave",
  () => {

    if(!isDragging) return;

    isDragging =
      false;


    slides.style.transition =
      "0.5s";

    slides.style.transform =
      "translateX(0px)";


    startAuto();

  }
);


// =========================================
// リサイズ対応
// =========================================

window.addEventListener(
  "resize",
  () => {

    updateSlideWidth();

    slides.style.transition =
      "none";

    slides.style.transform =
      "translateX(0px)";

  }
);


// =========================================
// バナースライダー
// =========================================

const track =
  document.getElementById("bannerTrack");

const dots =
  document.getElementById("bannerDots");

const banners =
  track.children;

let bIndex = 0;
let bStartX = 0;
let bCurrentX = 0;
let bVelocity = 0;
let bDragging = false;
let bAuto;

const bTotal =
  banners.length;


// =========================================
// ドット生成
// =========================================

for(let i=0;i<bTotal;i++){

 const d =
   document.createElement("span");

 if(i===0)
   d.classList.add("active");


 d.onclick = ()=>{

   bIndex =
     i;

   updateBanner();

 };


 dots.appendChild(d);

}


// =========================================
// 幅取得
// =========================================

function getBannerWidth(){

 return banners[0]
   .getBoundingClientRect()
   .width + 20;

}


let bWidth =
  getBannerWidth();


// =========================================
// 更新
// =========================================

function updateBanner(){

 track.style.transform =
   `translateX(-${bWidth * bIndex}px)`;


 document
   .querySelectorAll(".banner-dots span")
   .forEach((d,i)=>{

     d.classList.toggle(
       "active",
       i===bIndex
     );

   });

}


// =========================================
// 自動
// =========================================

function startBannerAuto(){

 bAuto =
   setInterval(()=>{

     bIndex =
       (bIndex + 1) % bTotal;

     updateBanner();

   },3000);

}


function stopBannerAuto(){

 clearInterval(bAuto);

}


startBannerAuto();


// =========================================
// スワイプ
// =========================================

track.addEventListener(
  "touchstart",
  (e)=>{

    bStartX =
      e.touches[0].clientX;

    bCurrentX =
      bStartX;

    bDragging =
      true;

    stopBannerAuto();

  }
);


track.addEventListener(
  "touchmove",
  (e)=>{

    if(!bDragging) return;

    const x =
      e.touches[0].clientX;

    bVelocity =
      x - bCurrentX;

    bCurrentX =
      x;

    const move =
      x - bStartX;

    track.style.transition =
      "none";

    track.style.transform =
      `translateX(${-(bWidth * bIndex) + move}px)`;

  }
);


track.addEventListener(
  "touchend",
  ()=>{

    bDragging =
      false;


    if(bVelocity > 5)
      bIndex--;

    else if(bVelocity < -5)
      bIndex++;


    if(bIndex < 0)
      bIndex = 0;

    if(bIndex >= bTotal)
      bIndex = bTotal - 1;


    track.style.transition =
      "0.5s";

    updateBanner();

    startBannerAuto();

  }
);


// =========================================
// リサイズ
// =========================================

window.addEventListener(
  "resize",
  ()=>{

    bWidth =
      getBannerWidth();

    updateBanner();

  }
);

</script>
