<!DOCTYPE html>
<html lang="ja">

<title>1棟 フロアマップ</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* =========================================
   全体
========================================= */

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  touch-action:pan-y;
}

body{
  font-family:
    "Noto Sans JP",
    "Yu Gothic",
    "Hiragino Sans",
    sans-serif;
  background:#EEEEEC;
}

/* =========================================
   マップページ
========================================= */

.map-page{
  position:relative;
  width:100%;
  min-height:100vh;
  padding-top:var(--header-height, 0px);
  box-sizing:border-box;
}

/* =========================================
   タイトル
========================================= */

.map-title-area{
  width:100%;
  text-align:center;
  padding:18px 16px 10px;
  box-sizing:border-box;
}

.map-title{
  margin:0;
  font-size:clamp(24px, 5vw, 38px);
  font-weight:800;
  letter-spacing:.08em;
  color:#333;
}

.floor-name{
  margin-top:5px;
  font-size:clamp(15px, 3.5vw, 22px);
  font-weight:700;
  letter-spacing:.08em;
  color:#555;
}

/* =========================================
   フロア切り替え
========================================= */

.floor-control{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  padding:5px 16px 15px;
  box-sizing:border-box;
}

.floor-btn{
  appearance:none;
  border:1px solid rgba(0,0,0,.15);
  background:rgba(255,255,255,.9);
  color:#333;
  border-radius:999px;
  min-width:90px;
  padding:9px 18px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
  transition:
    transform .15s ease,
    background .15s ease;
}

.floor-btn:active{
  transform:scale(.96);
}

.floor-btn:disabled{
  opacity:.35;
  cursor:default;
}

/* =========================================
   マップ表示領域
========================================= */

.map-scroll-area{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  box-sizing:border-box;
  padding:0 12px 30px;
  overflow:visible;
}

.map-viewer{
  position:relative;
  width:min(100%, 1200px);
  margin:0 auto;
  overflow:visible;
  transform-origin:center top;
  will-change:transform;
}

.map-image-wrap{
  position:relative;
  width:100%;
  transform-origin:center top;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

.map-image{
  display:block;
  width:100%;
  height:auto;
  max-width:none;
  user-select:none;
  -webkit-user-drag:none;
  pointer-events:none;
}

/* =========================================
   マップ操作説明
========================================= */

.map-operation{
  width:calc(100% - 24px);
  max-width:900px;
  margin:0 auto 25px;
  padding:12px 16px;
  box-sizing:border-box;
  background:rgba(255,255,255,.82);
  border:1px solid rgba(0,0,0,.08);
  border-radius:14px;
  color:#555;
  font-size:13px;
  line-height:1.7;
  text-align:center;
}

.map-operation strong{
  color:#333;
}

/* =========================================
   全体図ボタン
========================================= */

.map-bottom-controls{
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  padding:0 16px 30px;
  box-sizing:border-box;
}

.map-bottom-btn{
  appearance:none;
  border:1px solid rgba(0,0,0,.12);
  background:rgba(255,255,255,.92);
  color:#333;
  border-radius:999px;
  padding:10px 18px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.08);
}

/* =========================================
   ホットスポット共通
========================================= */

.map-hotspot{
  position:absolute;
  display:block;
  padding:0;
  margin:0;
  border:0;
  background:transparent;
  cursor:pointer;
  z-index:10;
  box-sizing:border-box;
  border-radius:4px;
  transition:
    background .2s ease,
    border-color .2s ease,
    box-shadow .2s ease;
}

.map-hotspot:hover{
  background:rgba(130,90,190,.12);
}

.map-hotspot:focus-visible{
  outline:3px solid rgba(100,70,180,.55);
  outline-offset:2px;
}

.map-hotspot:active{
  background:rgba(130,90,190,.18);
}

/* =========================================
   混雑状況レイヤー
========================================= */

.map-hotspot .crowd-visual-layer{
  position:absolute;
  inset:0;
  z-index:-1;
  pointer-events:none;
  box-sizing:border-box;
  border-radius:inherit;
  opacity:0;
  visibility:hidden;
  transition:
    opacity .25s ease,
    visibility .25s ease,
    background .25s ease,
    border-color .25s ease;
}

/*
  crowd-visible が付いた時だけ表示
*/

.map-hotspot.crowd-visible .crowd-visual-layer{
  opacity:1;
  visibility:visible;
}

/* 空いている */

.map-hotspot.crowd-empty .crowd-visual-layer{
  background:rgba(79,157,105,.38);
  border:1px solid rgba(79,157,105,.68);
}

/* 通常 */

.map-hotspot.crowd-normal .crowd-visual-layer{
  background:rgba(215,168,61,.38);
  border:1px solid rgba(215,168,61,.68);
}

/* 混雑 */

.map-hotspot.crowd-crowded .crowd-visual-layer{
  background:rgba(212,91,88,.38);
  border:1px solid rgba(212,91,88,.68);
}

/* 不明 */

.map-hotspot.crowd-unknown .crowd-visual-layer{
  background:rgba(120,120,120,.30);
  border:1px solid rgba(120,120,120,.48);
}

/* =========================================
   混雑表示ON/OFFボタン
========================================= */

.crowd-control{
  width:100%;
  display:flex;
  justify-content:center;
  padding:0 16px 15px;
  box-sizing:border-box;
}

.crowd-toggle{
  appearance:none;
  border:1px solid rgba(0,0,0,.13);
  background:rgba(255,255,255,.95);
  color:#333;
  border-radius:999px;
  padding:9px 18px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 3px 10px rgba(0,0,0,.07);
}

.crowd-toggle.is-on{

<script>

/* =========================================
   ヘッダー読み込み
========================================= */

async function loadHeader(){

  const container =
    document.getElementById("header-container");

  if(!container) return;

  try{

    const response =
      await fetch("header.html", {
        cache:"no-store"
      });

    if(!response.ok){
      throw new Error(
        "header.html の読み込みに失敗しました"
      );
    }

    container.innerHTML =
      await response.text();

    requestAnimationFrame(updateHeaderHeight);

  }catch(error){

    console.error(error);

  }

}


/* =========================================
   ヘッダー高さ
========================================= */

function updateHeaderHeight(){

  const header =
    document.querySelector(
      "#header-container header, " +
      "#header-container .site-header, " +
      "#header-container > header"
    );

  if(!header) return;

  const height =
    header.getBoundingClientRect().height;

  document.documentElement.style
    .setProperty(
      "--header-height",
      `${height}px`
    );

}


window.addEventListener(
  "resize",
  updateHeaderHeight
);

window.addEventListener(
  "orientationchange",
  updateHeaderHeight
);


/* =========================================
   フロア情報
========================================= */

const floors = [

  {
    name:"1階",
    image:"images/1tou_1f.jpg"
  },

  {
    name:"2階",
    image:"images/1tou_2f.jpg"
  },

  {
    name:"3階",
    image:"images/1tou_3f.jpg"
  },

  {
    name:"4階",
    image:"images/1tou_4f.jpg"
  }

];


let currentFloor = 0;


/* =========================================
   DOM
========================================= */

const floorImage =
  document.getElementById("floor-image");

const floorName =
  document.getElementById("floor-name");

const floorPrev =
  document.getElementById("floor-prev");

const floorNext =
  document.getElementById("floor-next");


/* =========================================
   フロアごとのホットスポット
========================================= */

const floorHotspotClasses = {

  0:[
    "floor-1-hotspot"
  ],

  1:[
    "floor-2-hotspot"
  ],

  2:[
    "floor-3-hotspot"
  ],

  3:[
    "floor-4-hotspot"
  ]

};


/* =========================================
   フロア切り替え
========================================= */

function updateFloor(){

  const floor =
    floors[currentFloor];

  if(!floor) return;

  floorImage.src =
    floor.image;

  floorImage.alt =
    `1棟 ${floor.name}フロアマップ`;

  floorName.textContent =
    floor.name;

  floorPrev.disabled =
    currentFloor <= 0;

  floorNext.disabled =
    currentFloor >= floors.length - 1;


  document
    .querySelectorAll(".map-hotspot")
    .forEach(hotspot => {

      const classes =
        Object.values(floorHotspotClasses)
          .flat();

      const isCurrentFloor =
        floorHotspotClasses[currentFloor] &&
        floorHotspotClasses[currentFloor]
          .some(cls =>
            hotspot.classList.contains(cls)
          );

      hotspot.style.display =
        isCurrentFloor
          ? "block"
          : "none";

    });


  resetZoom();

}


floorPrev.addEventListener(
  "click",
  () => {

    if(currentFloor <= 0) return;

    currentFloor--;

    updateFloor();

  }
);


floorNext.addEventListener(
  "click",
  () => {

    if(
      currentFloor >= floors.length - 1
    ) return;

    currentFloor++;

    updateFloor();

  }
);


/* =========================================
   モーダル
========================================= */

async function openModal(type){

  const container =
    document.getElementById(
      "modal-container"
    );

  if(!container) return;

  try{

    const response =
      await fetch(
        `modal2.html?type=${encodeURIComponent(type)}`,
        {
          cache:"no-store"
        }
      );

    if(!response.ok){
      throw new Error(
        "modal2.html の読み込みに失敗しました"
      );
    }

    const html =
      await response.text();

    container.innerHTML =
      html;

    const modal =
      container.querySelector(
        ".modal, #modal, .modal-overlay"
      );

    if(modal){
      modal.classList.add("show");
    }

    document.body.classList.add(
      "modal-open"
    );

  }catch(error){

    console.error(error);

  }

}


/* =========================================
   ホットスポットクリック
========================================= */

document
  .querySelectorAll(".map-hotspot")
  .forEach(hotspot => {

    hotspot.addEventListener(
      "click",
      event => {

        if(
          event.target.closest(
            ".crowd-visual-layer"
          )
        ){
          return;
        }

        const type =
          hotspot.dataset.modalType;

        if(type){
          openModal(type);
        }

      }
    );

  });


/* =========================================
   ズーム
========================================= */

const mapViewer =
  document.getElementById("map-viewer");

const mapImageWrap =
  document.getElementById(
    "map-image-wrap"
  );

const zoomResetButton =
  document.getElementById(
    "zoom-reset"
  );


const MIN_ZOOM = 1;
const MAX_ZOOM = 4;

let scale = 1;

let panX = 0;
let panY = 0;

let startDistance = 0;
let startScale = 1;

let startPanX = 0;
let startPanY = 0;

let startCenterX = 0;
let startCenterY = 0;

let isPinching = false;
let isDragging = false;

let dragStartX = 0;
let dragStartY = 0;

let pointers =
  new Map();


/* =========================================
   transform
========================================= */

function applyTransform(){

  mapImageWrap.style.transform =
    `translate3d(${panX}px, ${panY}px, 0) scale(${scale})`;

  if(scale > 1){

    zoomResetButton.classList.add(
      "show"
    );

  }else{

    zoomResetButton.classList.remove(
      "show"
    );

  }

}


/* =========================================
   リセット
========================================= */

function resetZoom(){

  scale = 1;

  panX = 0;
  panY = 0;

  isPinching = false;
  isDragging = false;

  pointers.clear();

  applyTransform();

}


zoomResetButton.addEventListener(
  "click",
  resetZoom
);


/* =========================================
   距離
========================================= */

function getDistance(
  p1,
  p2
){

  const dx =
    p1.clientX - p2.clientX;

  const dy =
    p1.clientY - p2.clientY;

  return Math.sqrt(
    dx * dx + dy * dy
  );

}


/* =========================================
   中心
========================================= */

function getCenter(
  p1,
  p2
){

  return {

    x:
      (p1.clientX + p2.clientX) / 2,

    y:
      (p1.clientY + p2.clientY) / 2

  };

}


/* =========================================
   Pointer Down
========================================= */

mapImageWrap.addEventListener(
  "pointerdown",
  event => {

    pointers.set(
      event.pointerId,
      event
    );

    mapImageWrap.setPointerCapture(
      event.pointerId
    );


    if(pointers.size === 2){

      const values =
        Array.from(
          pointers.values()
        );

      startDistance =
        getDistance(
          values[0],
          values[1]
        );

      startScale =
        scale;

      const center =
        getCenter(
          values[0],
          values[1]
        );

      startCenterX =
        center.x;

      startCenterY =
        center.y;

      startPanX =
        panX;

      startPanY =
        panY;

      isPinching = true;
      isDragging = false;

      return;

    }


    if(
      pointers.size === 1 &&
      scale > 1
    ){

      isDragging = true;

      dragStartX =
        event.clientX - panX;

      dragStartY =
        event.clientY - panY;

    }

  },
  {
    passive:false
  }
);


/* =========================================
   Pointer Move
========================================= */

mapImageWrap.addEventListener(
  "pointermove",
  event => {

    if(!pointers.has(event.pointerId)){
      return;
    }

    pointers.set(
      event.pointerId,
      event
    );


    if(
      isPinching &&
      pointers.size >= 2
    ){

      const values =
        Array.from(
          pointers.values()
        );

      const distance =
        getDistance(
          values[0],
          values[1]
        );

      if(startDistance <= 0){
        return;
      }

      let nextScale =
        startScale *
        (distance / startDistance);

      nextScale =
        Math.max(
          MIN_ZOOM,
          Math.min(
            MAX_ZOOM,
            nextScale
          )
        );


      const center =
        getCenter(
          values[0],
          values[1]
        );

      const dx =
        center.x -
        startCenterX;

      const dy =
        center.y -
        startCenterY;


      panX =
        startPanX + dx;

      panY =
        startPanY + dy;

      scale =
        nextScale;

      applyTransform();

      event.preventDefault();

      return;

    }


    if(
      isDragging &&
      scale > 1 &&
      pointers.size === 1
    ){

      panX =
        event.clientX -
        dragStartX;

      panY =
        event.clientY -
        dragStartY;

      applyTransform();

      event.preventDefault();

    }

  },
  {
    passive:false
  }
);


/* =========================================
   Pointer Up
========================================= */

function handlePointerEnd(event){

  pointers.delete(
    event.pointerId
  );


  if(pointers.size < 2){

    isPinching = false;

  }


  if(pointers.size === 0){

    isDragging = false;

  }

}


mapImageWrap.addEventListener(
  "pointerup",
  handlePointerEnd
);

mapImageWrap.addEventListener(
  "pointercancel",
  handlePointerEnd
);

mapImageWrap.addEventListener(
  "pointerleave",
  event => {

    if(
      event.buttons === 0
    ){
      handlePointerEnd(event);
    }

  }
);


/* =========================================
   PC ホイール
========================================= */

mapImageWrap.addEventListener(
  "wheel",
  event => {

    event.preventDefault();

    const rect =
      mapImageWrap.getBoundingClientRect();

    const mouseX =
      event.clientX -
      rect.left;

    const mouseY =
      event.clientY -
      rect.top;


    const oldScale =
      scale;

    const zoomFactor =
      event.deltaY < 0
        ? 1.12
        : 0.89;

    let nextScale =
      oldScale *
      zoomFactor;

    nextScale =
      Math.max(
        MIN_ZOOM,
        Math.min(
          MAX_ZOOM,
          nextScale
        )
      );


    if(
      nextScale !== oldScale
    ){

      const ratio =
        nextScale /
        oldScale;

      panX =
        mouseX -
        (mouseX - panX) *
        ratio;

      panY =
        mouseY -
        (mouseY - panY) *
        ratio;

      scale =
        nextScale;

      applyTransform();

    }

  },
  {
    passive:false
  }
);


/* =========================================
   ダブルクリック
========================================= */

mapImageWrap.addEventListener(
  "dblclick",
  event => {

    event.preventDefault();

    if(scale > 1){

      resetZoom();

      return;

    }


    const rect =
      mapImageWrap.getBoundingClientRect();

    const x =
      event.clientX -
      rect.left;

    const y =
      event.clientY -
      rect.top;

    const nextScale = 2;

    panX =
      x -
      (x - panX) *
      nextScale;

    panY =
      y -
      (y - panY) *
      nextScale;

    scale =
      nextScale;

    applyTransform();

  }
);


/* =========================================
   混雑状況
========================================= */

const CROWD_API_URL =
  "https://chosei-fes.onrender.com";

const CROWD_REFRESH_INTERVAL =
  15000;

let crowdVisible =
  false;

let crowdAbortController =
  null;


/* =========================================
   混雑表示ボタン
========================================= */

const crowdToggle =
  document.getElementById(
    "crowd-toggle"
  );


function setCrowdVisible(
  visible
){

  crowdVisible =
    Boolean(visible);

  localStorage.setItem(
    "choko_crowd_map_visible",
    crowdVisible
      ? "1"
      : "0"
  );


  document
    .querySelectorAll(
      ".map-hotspot"
    )
    .forEach(
      hotspot => {

        hotspot.classList.toggle(
          "crowd-visible",
          crowdVisible
        );

      }
    );


  if(crowdToggle){

    crowdToggle.classList.toggle(
      "is-on",
      crowdVisible
    );

    crowdToggle.setAttribute(
      "aria-pressed",
      crowdVisible
        ? "true"
        : "false"
    );

    crowdToggle.textContent =
      crowdVisible
        ? "混雑状況を非表示"
        : "混雑状況を表示";

  }

}


if(crowdToggle){

  crowdToggle.addEventListener(
    "click",
    () => {

      setCrowdVisible(
        !crowdVisible
      );

    }
  );

}


/* =========================================
   ステータス正規化
========================================= */

function normalizeCrowdStatus(
  value
){

  if(
    value === null ||
    value === undefined
  ){

    return "unknown";

  }


  const status =
    String(value)
      .trim()
      .toLowerCase();


  if(
    [
      "empty",
      "low",
      "free",
      "空いている",
      "空き",
      "比較的空いている"
    ].includes(status)
  ){

    return "empty";

  }


  if(
    [
      "normal",
      "medium",
      "moderate",
      "通常",
      "普通",
      "やや混雑している"
    ].includes(status)
  ){

    return "normal";

  }


  if(
    [
      "crowded",
      "high",
      "busy",
      "混雑",
      "混雑している"
    ].includes(status)
  ){

    return "crowded";

  }


  return "unknown";

}


/* =========================================
   APIレスポンスからイベント配列取得
========================================= */

function extractCrowdEvents(
  payload
){

  if(Array.isArray(payload)){
    return payload;
  }


  if(
    payload &&
    Array.isArray(payload.data)
  ){

    return payload.data;

  }


  if(
    payload &&
    Array.isArray(payload.events)
  ){

    return payload.events;

  }


  if(
    payload &&
    Array.isArray(payload.crowd)
  ){

    return payload.crowd;

  }


  if(
    payload &&
    Array.isArray(payload.results)
  ){

    return payload.results;

  }


  if(
    payload &&
    typeof payload === "object"
  ){

    return Object.entries(
      payload
    ).map(
      ([id, value]) => {

        if(
          value &&
          typeof value === "object"
        ){

          return {
            id,
            ...value
          };

        }

        return {
          id,
          status:value
        };

      }
    );

  }


  return [];

}


/* =========================================
   ID候補取得
========================================= */

function getEventIdCandidates(
  hotspot
){

  const type =
    hotspot.dataset.modalType || "";

  const id =
    hotspot.dataset.eventId || "";

  const candidates = [];


  if(id){
    candidates.push(id);
  }

  if(type){
    candidates.push(type);
  }


  const aliases = {

    "ten-yen-bread":[
      "ten-yen-bread",
      "tenyen-bread",
      "10yen-bread"
    ],

    "room-2d":[
      "room-2d",
      "2d"
    ],

    "room-3a":[
      "room-3a",
      "3a"
    ],

    "room-2a":[
      "room-2a",
      "2a"
    ],

    "room-jrc":[
      "room-jrc",
      "jrc"
    ],

    "room-1a":[
      "room-1a",
      "1a"
    ],

    "room-3g":[
      "room-3g",
      "3g"
    ],

    "room-2e":[
      "room-2e",
      "2e"
    ],

    "room-3d":[
      "room-3d",
      "3d"
    ],

    "room-1e":[
      "room-1e",
      "1e"
    ],

    "room-3f":[
      "room-3f",
      "3f"
    ],

    "room-3e":[
      "room-3e",
      "3e"
    ],

    "room-1f":[
      "room-1f",
      "1f"
    ],

    "room-2f":[
      "room-2f",
      "2f"
    ],

    "room-1e-second":[
      "room-1e-second",
      "1e-second"
    ],

    "room-1e-right":[
      "room-1e-right",
      "1e-right"
    ],

    "room-3b":[
      "room-3b",
      "3b"
    ],

    "room-2c":[
      "room-2c",
      "2c"
    ],

    "room-1b":[
      "room-1b",
      "1b"
    ],

    "room-2b":[
      "room-2b",
      "2b"
    ],

    "room-ess":[
      "room-ess",
      "ess"
    ],

    "room-2g":[
      "room-2g",
      "2g"
    ],

    "room-1g":[
      "room-1g",
      "1g"
    ],

    "room-3c":[
      "room-3c",
      "3c"
    ],

    "room-bungei":[
      "room-bungei",
      "bungei"
    ],

    "room-shodo":[
      "room-shodo",
      "shodo"
    ]

  };


  if(
    aliases[type]
  ){

    candidates.push(
      ...aliases[type]
    );

  }


  return [
    ...new Set(
      candidates
        .filter(Boolean)
        .map(
          value =>
            String(value)
              .trim()
              .toLowerCase()
        )
    )
  ];

}


/* =========================================
   イベントID取得
========================================= */

function getCrowdEventId(
  event
){

  if(!event) return "";

  const keys = [

    "id",
    "eventId",
    "event_id",
    "modalId",
    "modal_id",
    "key",
    "slug",
    "name"

  ];


  for(
    const key of keys
  ){

    if(
      event[key] !== undefined &&
      event[key] !== null
    ){

      return String(
        event[key]
      )
        .trim()
        .toLowerCase();

    }

  }


  return "";

}


/* =========================================
   イベントステータス取得
========================================= */

function getCrowdEventStatus(
  event
){

  if(!event) return "unknown";


  const keys = [

    "status",
    "crowdStatus",
    "crowd_status",
    "state",
    "level",
    "condition"

  ];


  for(
    const key of keys
  ){

    if(
      event[key] !== undefined &&
      event[key] !== null
    ){

      return normalizeCrowdStatus(
        event[key]
      );

    }

  }


  return "unknown";

}


/* =========================================
   混雑レイヤー作成
========================================= */

function ensureCrowdVisualLayer(
  hotspot
){

  let layer =
    hotspot.querySelector(
      ".crowd-visual-layer"
    );

  if(!layer){

    layer =
      document.createElement(
        "span"
      );

    layer.className =
      "crowd-visual-layer";

    layer.setAttribute(
      "aria-hidden",
      "true"
    );

    hotspot.prepend(layer);

  }

  return layer;

}


/* =========================================
   ステータス適用
========================================= */

function applyCrowdStatus(
  hotspot,
  status
){

  const normalized =
    normalizeCrowdStatus(
      status
    );


  hotspot.dataset.crowdStatus =
    normalized;


  hotspot.classList.remove(
    "crowd-empty",
    "crowd-normal",
    "crowd-crowded",
    "crowd-unknown"
  );


  hotspot.classList.add(
    `crowd-${normalized}`
  );


  ensureCrowdVisualLayer(
    hotspot
  );


  hotspot.classList.toggle(
    "crowd-visible",
    crowdVisible
  );

}


/* =========================================
   混雑状況読み込み
========================================= */

async function loadCrowdStatus(){

  /*
    重要：

    crowd.html と同じく

      /api/crowd

    を使用します。

    以前のように

      /api/crowd?map=1tou

    とせず、同じAPIの同じデータを取得することで、
    crowd.html 側で変更された状態を1棟マップにも
    反映します。
  */


  if(
    crowdAbortController
  ){

    crowdAbortController.abort();

  }


  crowdAbortController =
    new AbortController();


  const url =
    `${CROWD_API_URL}/api/crowd?_=${Date.now()}`;


  try{

    const response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store",
          headers:{
            "Accept":
              "application/json",
            "Cache-Control":
              "no-cache"
          },
          signal:
            crowdAbortController.signal
        }
      );


    if(!response.ok){

      throw new Error(
        `Crowd API HTTP ${response.status}`
      );

    }


    const payload =
      await response.json();


    const events =
      extractCrowdEvents(
        payload
      );


    const eventMap =
      new Map();


    events.forEach(
      event => {

        const id =
          getCrowdEventId(
            event
          );

        if(!id) return;

        eventMap.set(
          id,
          getCrowdEventStatus(
            event
          )
        );

      }
    );


    document
      .querySelectorAll(
        ".map-hotspot"
      )
      .forEach(
        hotspot => {

          const candidates =
            getEventIdCandidates(
              hotspot
            );


          let foundStatus =
            null;


          for(
            const candidate
              of candidates
          ){

            if(
              eventMap.has(
                candidate
              )
            ){

              foundStatus =
                eventMap.get(
                  candidate
                );

              break;

            }

          }


          /*
            今回APIに存在しない場合でも、
            一時的な通信エラーと同様に既存状態を
            不要に消さないようにします。
          */

          if(
            foundStatus !== null
          ){

            applyCrowdStatus(
              hotspot,
              foundStatus
            );

          }

        }
      );


    /*
      最新データ取得成功後も表示状態を維持
    */

    setCrowdVisible(
      crowdVisible
    );


  }catch(error){

    if(
      error &&
      error.name === "AbortError"
    ){

      return;

    }


    /*
      APIが一時的に失敗した場合は、
      現在表示している混雑色を消しません。
    */

    console.warn(
      "混雑状況の取得に失敗しました:",
      error
    );

  }

}


/* =========================================
   定期更新
========================================= */

let crowdRefreshTimer =
  null;


function startCrowdRefresh(){

  if(crowdRefreshTimer){

    clearInterval(
      crowdRefreshTimer
    );

  }


  crowdRefreshTimer =
    setInterval(
      () => {

        loadCrowdStatus();

      },
      CROWD_REFRESH_INTERVAL
    );

}


/* =========================================
   タブ復帰時更新
========================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if(
      document.visibilityState ===
      "visible"
    ){

      loadCrowdStatus();

    }

  }
);


/* =========================================
   オンライン復帰時
========================================= */

window.addEventListener(
  "online",
  () => {

    loadCrowdStatus();

  }
);


/* =========================================
   初期化
========================================= */

function initializeCrowd(){

  const saved =
    localStorage.getItem(
      "choko_crowd_map_visible"
    );


  crowdVisible =
    saved === "1";


  document
    .querySelectorAll(
      ".map-hotspot"
    )
    .forEach(
      hotspot => {

        ensureCrowdVisualLayer(
          hotspot
        );

      }
    );


  setCrowdVisible(
    crowdVisible
  );


  loadCrowdStatus();

  startCrowdRefresh();

}


/* =========================================
   DOMContentLoaded
========================================= */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    loadHeader();

    updateFloor();

    initializeCrowd();

  }
);


/* =========================================
   即時初期化
========================================= */

if(
  document.readyState !==
  "loading"
){

  loadHeader();

  updateFloor();

  initializeCrowd();

}
