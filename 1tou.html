<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
>

<title>1棟 フロアマップ</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* =========================================
   全体
========================================= */

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;

  overflow: hidden;

  background-color: #eeedeb !important;
  color: black;

  font-family: sans-serif;

  overscroll-behavior: none;
}


/* =========================================
   背景図形
   参考画像に合わせたデザイン
========================================= */

.bg-shapes {
  position: fixed !important;

  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 0 !important;

  pointer-events: none;

  overflow: hidden;

  opacity: 1 !important;
}


/* 共通 */

.bg-shapes .shape {
  position: absolute;

  display: block;

  opacity: 1;

  border: none;
}


/* =========================================
   大きな紺色の四角形
========================================= */

.bg-shapes .s1 {
  top: 16%;
  left: 6%;

  width: 150px;
  height: 610px;

  background: #06254f;

  clip-path: polygon(
    35% 0,
    100% 16%,
    100% 100%,
    0 94%
  );

  transform: rotate(0deg);
}


/* =========================================
   中央のオレンジ色の四角形
========================================= */

.bg-shapes .s2 {
  top: 30%;
  left: 39%;

  width: 315px;
  height: 470px;

  background: #ff9d1c;

  clip-path: polygon(
    10% 0,
    100% 8%,
    82% 100%,
    0 96%
  );

  transform: rotate(0deg);
}


/* =========================================
   右側の青緑の大きな三角形
========================================= */

.bg-shapes .s3 {
  top: 26%;
  right: 10%;

  width: 330px;
  height: 500px;

  background: #15929e;

  clip-path: polygon(
    55% 0,
    100% 100%,
    0 100%
  );

  transform: rotate(0deg);
}


/* =========================================
   左上の赤い三角形
========================================= */

.bg-shapes .s4 {
  top: 5%;
  left: 3%;

  width: 90px;
  height: 90px;

  background: #f0444d;

  clip-path: polygon(
    42% 0,
    100% 100%,
    0 100%
  );

  transform: rotate(-14deg);
}


/* =========================================
   右上の濃赤三角形
========================================= */

.bg-shapes .s5 {
  top: -1%;
  right: 4%;

  width: 170px;
  height: 170px;

  background: #650006;

  clip-path: polygon(
    100% 0,
    100% 100%,
    0 35%
  );

  transform: rotate(0deg);
}


/* =========================================
   左側の紫三角形
========================================= */

.bg-shapes .s6 {
  top: 36%;
  left: 2%;

  width: 65px;
  height: 65px;

  background: #8f5bd0;

  clip-path: polygon(
    70% 0,
    100% 100%,
    0 70%
  );

  transform: rotate(0deg);
}


/* =========================================
   右側のオレンジ三角形
========================================= */

.bg-shapes .s7 {
  top: 35%;
  right: 10%;

  width: 65px;
  height: 65px;

  background: #ff991d;

  clip-path: polygon(
    15% 0,
    100% 55%,
    0 100%
  );

  transform: rotate(0deg);
}


/* =========================================
   右側の小さな赤・青緑系図形
========================================= */

.bg-shapes .s8 {
  top: 47%;
  right: 4%;

  width: 80px;
  height: 105px;

  background: #087b84;

  clip-path: polygon(
    100% 0,
    100% 100%,
    0 62%
  );

  transform: rotate(0deg);
}


/* =========================================
   style.css由来の四角形を無効化
========================================= */

.bg-shapes::before,
.bg-shapes::after {
  display: none !important;
}


/* =========================================
   ヘッダー
========================================= */

#header {
  position: relative;
  z-index: 100;
}


/* =========================================
   フロアマップ画面
========================================= */

.floor-page {
  position: fixed;

  top: 0;
  left: 0;

  width: 100vw;
  height: 100vh;

  overflow: hidden;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  touch-action: none;

  background: transparent !important;

  z-index: 1;
}


/* =========================================
   マップ表示エリア
========================================= */

.map-view {
  position: relative;

  width: 100%;
  height: calc(100vh - 80px);

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;

  overflow: hidden;

  touch-action: none;

  background: transparent !important;
}


/* =========================================
   マップ画像
========================================= */

.map-image-wrapper {
  position: relative;

  max-width: 90vw;
  max-height: 75vh;

  display: flex;
  align-items: center;
  justify-content: center;

  transform-origin: center center;

  touch-action: none;

  user-select: none;
  -webkit-user-select: none;

  flex-shrink: 1;

  cursor: default;

  will-change: transform;
}

.map-image {
  display: block;

  max-width: 90vw;
  max-height: 75vh;

  width: auto;
  height: auto;

  object-fit: contain;

  user-select: none;
  -webkit-user-drag: none;
  -webkit-user-select: none;

  pointer-events: none;
}


/* =========================================
   全体図に戻るボタン
   サイズは元のまま
========================================= */

.back-to-map {
  position: absolute;

  top: 8px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 50;

  border: none;

  /* 透明な白背景を削除 */
  background: #06254f;

  color: #fff;

  padding: 6px 13px;

  border-radius: 8px;

  font-size: 15px;
  font-weight: 700;

  letter-spacing: 0.04em;

  white-space: nowrap;

  cursor: pointer;

  box-shadow: none;

  -webkit-tap-highlight-color: transparent;
}

.back-to-map:active {
  opacity: 0.65;
}


/* =========================================
   左右ボタン
========================================= */

.floor-arrow {
  position: absolute;

  top: 50%;

  transform: translateY(-50%);

  width: 48px;
  height: 80px;

  border: none;

  /* 透明な白背景を完全に削除 */
  background: transparent;

  font-size: 52px;
  line-height: 1;

  color: #06254f;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  z-index: 30;

  padding: 0;

  text-shadow: none;

  -webkit-tap-highlight-color: transparent;
}

.floor-arrow:active {
  opacity: 0.5;
}

.floor-prev {
  left: 4px;
}

.floor-next {
  right: 4px;

  color: #d92a21;
}


/* =========================================
   棟切り替えボタン
   左右ボタンと同程度のサイズ
   画像の下側へ少し重ねる
========================================= */

.building-switch {
  position: absolute;

  left: 50%;

  /*
    元の bottom:2px より上へ
    画像下端付近に少し重ねる
  */
  bottom: 18px;

  transform: translateX(-50%);

  width: 48px;
  height: 80px;

  border: none;

  /* 透明な白背景を削除 */
  background: transparent;

  color: #15929e;

  font-size: 52px;
  line-height: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  z-index: 40;

  padding: 0;

  border-radius: 0;

  text-shadow: none;

  -webkit-tap-highlight-color: transparent;
}

.building-switch:active {
  opacity: 0.5;
}


/* =========================================
   スマートフォン
========================================= */

@media (max-width: 600px) {

  .map-view {
    height: calc(100vh - 50px);
  }

  .map-image {
    max-width: 82vw;
    max-height: 68vh;
  }

  .map-image-wrapper {
    max-width: 82vw;
    max-height: 68vh;
  }


  /* -------------------------
     左右矢印
  ------------------------- */

  .floor-arrow {
    width: 40px;
    height: 70px;

    font-size: 44px;
  }

  .floor-prev {
    left: 0;
  }

  .floor-next {
    right: 0;
  }


  /* -------------------------
     棟切り替え
     左右と同程度
  ------------------------- */

  .building-switch {
    width: 40px;
    height: 70px;

    font-size: 44px;

    bottom: 16px;
  }


  /* -------------------------
     全体図へ戻る
     サイズは元のまま
  ------------------------- */

  .back-to-map {
    top: 6px;

    font-size: 14px;

    padding: 5px 11px;
  }


  /* -------------------------
     背景図形
  ------------------------- */

  .bg-shapes .s1 {
    left: -15px;
    top: 18%;

    width: 90px;
    height: 390px;
  }

  .bg-shapes .s2 {
    left: 36%;
    top: 33%;

    width: 180px;
    height: 300px;
  }

  .bg-shapes .s3 {
    right: 1%;
    top: 31%;

    width: 170px;
    height: 290px;
  }

  .bg-shapes .s4 {
    top: 6%;
    left: 2%;

    width: 55px;
    height: 55px;
  }

  .bg-shapes .s5 {
    top: 0;
    right: 0;

    width: 95px;
    height: 95px;
  }

  .bg-shapes .s6 {
    top: 37%;
    left: 1%;

    width: 42px;
    height: 42px;
  }

  .bg-shapes .s7 {
    top: 37%;
    right: 4%;

    width: 42px;
    height: 42px;
  }

  .bg-shapes .s8 {
    top: 49%;
    right: 0;

    width: 50px;
    height: 65px;
  }

}

</style>

</head>

<body>

<div class="bg-shapes">
  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>
  <div class="shape s4"></div>
  <div class="shape s5"></div>
  <div class="shape s6"></div>
  <div class="shape s7"></div>
  <div class="shape s8"></div>
</div>


<!-- ヘッダー -->

<div id="header"></div>


<script>

fetch("header.html")
  .then(res => res.text())
  .then(data => {

    document.getElementById("header").innerHTML = data;

    const btn = document.querySelector(".menu-btn");
    const nav = document.querySelector(".nav");

    if (btn && nav) {

      btn.addEventListener("click", (e) => {

        e.stopPropagation();

        nav.classList.toggle("active");

      });

      document.addEventListener("click", (e) => {

        if (
          !nav.contains(e.target) &&
          !btn.contains(e.target)
        ) {

          nav.classList.remove("active");

        }

      });

    }

  });

</script>


<!-- =========================================
     フロアマップ
========================================= -->

<div class="floor-page">

  <div class="map-view">

    <!-- 全体図に戻る -->
    <button
      class="back-to-map"
      id="backToMap"
      type="button"
    >
      全体図に戻る
    </button>


    <!-- 左 -->
    <button
      class="floor-arrow floor-prev"
      id="prevButton"
      aria-label="前の階"
      type="button"
    >
      〈
    </button>


    <!-- 画像 -->
    <div
      class="map-image-wrapper"
      id="imageWrapper"
    >

      <img
        id="floorImage"
        class="map-image"
        src="images/1tou_1f.jpg"
        alt="1棟 1階 フロアマップ"
      >


      <!-- 2棟へ -->
      <button
        class="building-switch"
        id="buildingSwitch"
        aria-label="2棟へ"
        type="button"
      >
        ⌄
      </button>

    </div>


    <!-- 右 -->
    <button
      class="floor-arrow floor-next"
      id="nextButton"
      aria-label="次の階"
      type="button"
    >
      〉
    </button>

  </div>

</div>


<script>

/* =========================================
   1棟 フロア設定
========================================= */

const floors = [

  {
    name: "1棟 1階",
    image: "images/1tou_1f.jpg"
  },

  {
    name: "1棟 2階",
    image: "images/1tou_2f.jpg"
  },

  {
    name: "1棟 3階",
    image: "images/1tou_3f.jpg"
  },

  {
    name: "1棟 4階",
    image: "images/1tou_4f.jpg"
  }

];


let currentFloor = 0;


/* =========================================
   要素
========================================= */

const floorImage =
  document.getElementById("floorImage");

const prevButton =
  document.getElementById("prevButton");

const nextButton =
  document.getElementById("nextButton");

const buildingSwitch =
  document.getElementById("buildingSwitch");

const imageWrapper =
  document.getElementById("imageWrapper");

const backToMap =
  document.getElementById("backToMap");

const mapView =
  document.querySelector(".map-view");


/* =========================================
   ズーム・移動
========================================= */

let scale = 1;

let translateX = 0;
let translateY = 0;

let startDistance = 0;
let startScale = 1;

let startPanX = 0;
let startPanY = 0;

let startTouchX = 0;
let startTouchY = 0;

let isDragging = false;


/* =========================================
   距離
========================================= */

function getDistance(touches) {

  const dx =
    touches[0].clientX -
    touches[1].clientX;

  const dy =
    touches[0].clientY -
    touches[1].clientY;

  return Math.sqrt(
    dx * dx + dy * dy
  );

}


/* =========================================
   中央からの移動範囲を制限
========================================= */

function clampPosition() {

  const wrapperWidth =
    imageWrapper.offsetWidth;

  const wrapperHeight =
    imageWrapper.offsetHeight;

  const viewWidth =
    mapView.clientWidth;

  const viewHeight =
    mapView.clientHeight;

  const maxX =
    Math.max(
      0,
      (wrapperWidth * scale - viewWidth) / 2
    );

  const maxY =
    Math.max(
      0,
      (wrapperHeight * scale - viewHeight) / 2
    );

  translateX =
    Math.min(
      Math.max(translateX, -maxX),
      maxX
    );

  translateY =
    Math.min(
      Math.max(translateY, -maxY),
      maxY
    );

}


/* =========================================
   表示
========================================= */

function updateTransform() {

  clampPosition();

  imageWrapper.style.transform =
    "translate3d(" +
    translateX +
    "px, " +
    translateY +
    "px, 0) scale(" +
    scale +
    ")";

}


/* =========================================
   ズーム
========================================= */

function setZoom(value) {

  scale =
    Math.min(
      Math.max(value, 1),
      5
    );

  updateTransform();

}


/* =========================================
   リセット
========================================= */

function resetZoom() {

  scale = 1;

  translateX = 0;
  translateY = 0;

  imageWrapper.style.transform =
    "translate3d(0, 0, 0) scale(1)";

}


/* =========================================
   フロア変更
========================================= */

function showFloor(index) {

  currentFloor =
    (index + floors.length) % floors.length;

  floorImage.src =
    floors[currentFloor].image;

  floorImage.alt =
    floors[currentFloor].name +
    " フロアマップ";

  resetZoom();

}


/* =========================================
   左右ボタン
========================================= */

prevButton.addEventListener(
  "click",
  () => {

    showFloor(currentFloor - 1);

  }
);


nextButton.addEventListener(
  "click",
  () => {

    showFloor(currentFloor + 1);

  }
);


/* =========================================
   全体図に戻る
========================================= */

backToMap.addEventListener(
  "click",
  () => {

    location.href = "map.html";

  }
);


/* =========================================
   2棟へ移動
========================================= */

buildingSwitch.addEventListener(
  "click",
  (e) => {

    e.stopPropagation();

    location.href = "2tou.html";

  }
);


/* =========================================
   タッチ操作
========================================= */

imageWrapper.addEventListener(
  "touchstart",
  (e) => {

    if (e.touches.length === 2) {

      startDistance =
        getDistance(e.touches);

      startScale =
        scale;

      startPanX =
        translateX;

      startPanY =
        translateY;

      return;

    }


    if (
      e.touches.length === 1 &&
      scale > 1
    ) {

      isDragging = true;

      startTouchX =
        e.touches[0].clientX;

      startTouchY =
        e.touches[0].clientY;

      startPanX =
        translateX;

      startPanY =
        translateY;

    }

  },
  { passive: false }
);


/* =========================================
   タッチ移動
========================================= */

imageWrapper.addEventListener(
  "touchmove",
  (e) => {

    /* -------------------------
       ピンチ＋移動
    ------------------------- */

    if (e.touches.length === 2) {

      e.preventDefault();

      const distance =
        getDistance(e.touches);

      if (startDistance > 0) {

        const ratio =
          distance / startDistance;

        scale =
          Math.min(
            Math.max(
              startScale * ratio,
              1
            ),
            5
          );

      }


      const centerX =
        (
          e.touches[0].clientX +
          e.touches[1].clientX
        ) / 2;

      const centerY =
        (
          e.touches[0].clientY +
          e.touches[1].clientY
        ) / 2;


      const originalCenterX =
        startTouchX ||
        centerX;

      const originalCenterY =
        startTouchY ||
        centerY;


      if (!startTouchX) {

        startTouchX = centerX;
        startTouchY = centerY;

      }


      translateX =
        startPanX +
        (centerX - originalCenterX);

      translateY =
        startPanY +
        (centerY - originalCenterY);

      updateTransform();

      return;

    }


    /* -------------------------
       1本指で移動
    ------------------------- */

    if (
      e.touches.length === 1 &&
      isDragging &&
      scale > 1
    ) {

      e.preventDefault();

      const x =
        e.touches[0].clientX;

      const y =
        e.touches[0].clientY;

      translateX =
        startPanX +
        (x - startTouchX);

      translateY =
        startPanY +
        (y - startTouchY);

      updateTransform();

    }

  },
  { passive: false }
);


/* =========================================
   タッチ終了
========================================= */

imageWrapper.addEventListener(
  "touchend",
  (e) => {

    if (e.touches.length === 0) {

      isDragging = false;

      startDistance = 0;

      startTouchX = 0;
      startTouchY = 0;

    }

  },
  { passive: false }
);


/* =========================================
   マウスドラッグ
========================================= */

imageWrapper.addEventListener(
  "mousedown",
  (e) => {

    if (
      e.button !== 0 ||
      scale <= 1
    ) {
      return;
    }

    isDragging = true;

    startTouchX =
      e.clientX;

    startTouchY =
      e.clientY;

    startPanX =
      translateX;

    startPanY =
      translateY;

    imageWrapper.style.cursor =
      "grabbing";

    e.preventDefault();

  }
);


document.addEventListener(
  "mousemove",
  (e) => {

    if (
      !isDragging ||
      scale <= 1
    ) {
      return;
    }

    translateX =
      startPanX +
      (e.clientX - startTouchX);

    translateY =
      startPanY +
      (e.clientY - startTouchY);

    updateTransform();

  }
);


document.addEventListener(
  "mouseup",
  () => {

    if (isDragging) {

      isDragging = false;

      imageWrapper.style.cursor =
        scale > 1
          ? "grab"
          : "default";

    }

  }
);


/* =========================================
   マウスホイール
========================================= */

imageWrapper.addEventListener(
  "wheel",
  (e) => {

    e.preventDefault();

    const delta =
      e.deltaY > 0
        ? -0.15
        : 0.15;

    setZoom(scale + delta);

    imageWrapper.style.cursor =
      scale > 1
        ? "grab"
        : "default";

  },
  { passive: false }
);


/* =========================================
   初期カーソル
========================================= */

imageWrapper.style.cursor = "default";


/* =========================================
   画面サイズ変更
========================================= */

window.addEventListener(
  "resize",
  () => {

    if (scale > 1) {

      updateTransform();

    }

  }
);

</script>

</body>
</html>
