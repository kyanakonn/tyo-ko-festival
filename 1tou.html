<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
>

<title>1棟 フロアマップ</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* =========================================
   全体
========================================= */

html,
body {
  width: 100%;
  min-width: 0;
  min-height: 100%;

  margin: 0;
  padding: 0;

  overflow-x: hidden;
  overflow-y: auto;

  background-color: #eeedeb !important;
  color: black;

  font-family: sans-serif;

  overscroll-behavior-x: none;
}


/* =========================================
   背景
   TOPページと統一
========================================= */

.bg-shapes {
  position: absolute !important;

  top: 0;
  left: 0;

  width: 100%;

  height: max(100vh, 1100px);

  z-index: 0 !important;

  pointer-events: none;

  overflow: hidden;

  opacity: 1 !important;
}


/*
   背景装飾を表示しない
   白い図形などがstyle.cssから
   出てくる場合も無効化
*/

.bg-shapes .shape {
  display: none !important;
}

.bg-shapes::before,
.bg-shapes::after {
  display: none !important;
}


/* =========================================
   ヘッダー
========================================= */

#header {
  position: relative;
  z-index: 100;
}


/* =========================================
   フロアマップ画面
========================================= */

.floor-page {
  position: relative;

  top: auto;
  left: auto;

  width: 100%;
  max-width: 100%;

  min-height: calc(100vh - 80px);

  overflow: visible;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  touch-action: pan-y;

  background: transparent !important;

  z-index: 1;
}


/* =========================================
   マップ表示エリア
========================================= */

.map-view {
  position: relative;

  width: 100%;
  max-width: 100%;

  min-height: calc(100vh - 80px);

  height: auto;

  padding-top: 70px;
  padding-bottom: 80px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  overflow: visible;

  touch-action: pan-y;

  background: transparent !important;

  box-sizing: border-box;
}


/* =========================================
   マップ画像
========================================= */

.map-image-wrapper {
  position: relative;

  max-width: 90vw;
  max-height: 75vh;

  display: flex;
  align-items: center;
  justify-content: center;

  transform-origin: center center;

  touch-action: pan-y;

  user-select: none;
  -webkit-user-select: none;

  flex-shrink: 0;

  cursor: default;

  will-change: transform;

  margin: 0 auto;
}


.map-image {
  display: block;

  max-width: 90vw;
  max-height: 75vh;

  width: auto;
  height: auto;

  object-fit: contain;

  user-select: none;
  -webkit-user-drag: none;
  -webkit-user-select: none;

  pointer-events: none;
}


/* =========================================
   上部ボタンエリア
========================================= */

.top-controls {
  position: absolute;

  top: 8px;
  left: 50%;

  transform: translateX(-50%);

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 7px;

  z-index: 50;

  white-space: nowrap;
}


/* =========================================
   全体図に戻るボタン
========================================= */

.back-to-map {

  border: none;

  background: #06254f;

  color: #fff;

  padding: 6px 13px;

  border-radius: 8px;

  font-size: 15px;
  font-weight: 700;

  letter-spacing: 0.04em;

  white-space: nowrap;

  cursor: pointer;

  box-shadow: none;

  -webkit-tap-highlight-color: transparent;
}

.back-to-map:active {
  opacity: 0.65;
}


/* =========================================
   操作説明ボタン
========================================= */

.help-button {

  border: none;

  background: #15929e;

  color: #fff;

  padding: 6px 13px;

  border-radius: 8px;

  font-size: 15px;
  font-weight: 700;

  letter-spacing: 0.04em;

  white-space: nowrap;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.help-button:active {
  opacity: 0.65;
}


/* =========================================
   左右ボタン
========================================= */

.floor-arrow {
  position: absolute;

  top: 0;

  transform: translateY(-50%);

  width: 48px;
  height: 80px;

  border: none;

  background: transparent;

  font-size: 52px;
  line-height: 1;

  color: #d92a21;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  z-index: 30;

  padding: 0;

  text-shadow: none;

  -webkit-tap-highlight-color: transparent;
}

.floor-arrow:active {
  opacity: 0.5;
}

.floor-prev {
  left: 4px;
}

.floor-next {
  right: 4px;

  color: #d92a21;
}


/* =========================================
   棟切り替えボタン
========================================= */

.building-switch {
  position: absolute;

  left: 50%;
  top: 100%;

  transform: translateX(-50%);

  width: 48px;
  height: 50px;

  border: none;

  background: transparent;

  color: #15929e;

  font-size: 52px;
  line-height: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  z-index: 40;

  padding: 0;

  border-radius: 0;

  text-shadow: none;

  -webkit-tap-highlight-color: transparent;
}

.building-switch:active {
  opacity: 0.5;
}


/* =========================================
   操作説明モーダル
========================================= */

.help-overlay {

  position: fixed;

  inset: 0;

  z-index: 1000;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(6, 37, 79, 0.55);

  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
}

.help-overlay.active {
  display: flex;
}


/* =========================================
   操作説明本体
========================================= */

.help-modal {

  position: relative;

  width: min(430px, 92vw);

  max-height: 82vh;

  overflow-y: auto;

  background: #eeedeb;

  border-radius: 18px;

  padding: 24px 20px 20px;

  box-shadow: 0 15px 40px rgba(0,0,0,0.25);

  border-top: 7px solid #06254f;

  box-sizing: border-box;
}


/* =========================================
   モーダルタイトル
========================================= */

.help-title {

  margin: 0 35px 5px 0;

  color: #06254f;

  font-size: 23px;

  font-weight: 800;

  letter-spacing: 0.05em;
}


.help-subtitle {

  margin: 0 0 18px;

  color: #555;

  font-size: 13px;

  font-weight: 600;
}


/* =========================================
   操作項目
========================================= */

.help-item {

  display: flex;

  align-items: center;

  gap: 13px;

  margin-bottom: 10px;

  padding: 11px 12px;

  background: #fff;

  border-radius: 10px;

  border-left: 5px solid #15929e;

  box-sizing: border-box;
}


.help-icon {

  width: 34px;
  min-width: 34px;
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 21px;

  border-radius: 8px;

  background: #eeedeb;
}


/* =========================================
   赤い文字タップアイコン
========================================= */

.help-icon.gesture-red-square {

  width: 34px;
  min-width: 34px;
  height: 34px;

  background: #d92a21;

  border-radius: 8px;

  font-size: 0;
}


/* =========================================
   2本指アイコン部分
========================================= */

.help-icon.gesture-square {

  width: 34px;
  min-width: 34px;
  height: 34px;

  background: #ff9d1c;

  border-radius: 8px;

  font-size: 0;
}


/* =========================================
   1本指移動アイコン部分
========================================= */

.help-icon.gesture-pan-square {

  width: 34px;
  min-width: 34px;
  height: 34px;

  background: #15929e;

  border-radius: 8px;

  font-size: 0;
}


/* =========================================
   操作説明テキスト
========================================= */

.help-text {

  color: #222;

  font-size: 13px;

  line-height: 1.55;

  font-weight: 600;
}


.help-text strong {

  color: #06254f;

  font-size: 14px;
}


/* =========================================
   閉じるボタン
========================================= */

.help-close {

  width: 100%;

  margin-top: 8px;

  border: none;

  border-radius: 9px;

  padding: 11px;

  background: #06254f;

  color: #fff;

  font-size: 15px;

  font-weight: 700;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.help-close:active {
  opacity: 0.65;
}


/* =========================================
   モーダル右上閉じる
========================================= */

.help-x {

  position: absolute;

  top: 13px;
  right: 14px;

  width: 32px;
  height: 32px;

  border: none;

  border-radius: 50%;

  background: #d92a21;

  color: #fff;

  font-size: 19px;

  line-height: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.help-x:active {
  opacity: 0.65;
}


/* =========================================
   スマートフォン
========================================= */

@media (max-width: 600px) {

  .floor-page {

    width: 100%;
    max-width: 100%;

    min-height: calc(100vh - 50px);

  }


  .map-view {

    max-width: 100%;

    padding-bottom: 75px;

    justify-content: flex-start;

    overflow: visible;
  }


  .map-image {

    max-width: 82vw;
    max-height: 68vh;
  }


  .map-image-wrapper {

    max-width: 82vw;
    max-height: 68vh;

    position: relative;

    left: auto;
    top: auto;

    transform: none;

    width: auto;
    height: auto;

    margin: 0 auto;
  }


  /* -------------------------
     上部ボタン
  ------------------------- */

  .top-controls {

    top: 58px;

    gap: 5px;
  }


  .back-to-map,

    padding: 5px 10px;

    border-radius: 7px;
  }


  /* -------------------------

  ------------------------- */

    width: 40px;
    height: 70px;

    font-size: 44px;

    top: 0;

    color: #d92a21;
  }

  .floor-prev {
    left: 0;
  }

  .floor-next {
    right: 0;

    color: #d92a21;
  }


  /* -------------------------
     棟切り替え
  ------------------------- */

  .building-switch {

    width: 40px;
    height: 50px;

    font-size: 44px;

    top: 100%;
  }


  /* -------------------------
     操作説明
  ------------------------- */

  .help-overlay {
    padding: 15px;
  }


  .help-modal {

    width: 94vw;

    max-height: 84vh;

    padding: 21px 16px 16px;

    border-radius: 16px;

    border-top-width: 6px;
  }


  .help-title {
    font-size: 20px;
  }


  .help-subtitle {
    font-size: 12px;

    margin-bottom: 14px;
  }


  .help-item {
    gap: 10px;

    margin-bottom: 8px;

    padding: 9px 10px;

    border-left-width: 4px;
  }


  .help-icon {

    width: 31px;
    min-width: 31px;
    height: 31px;

    font-size: 18px;
  }


  .help-icon.gesture-red-square {

    width: 31px;
    min-width: 31px;
    height: 31px;

    background: #d92a21;

    border-radius: 7px;
  }


  .help-icon.gesture-square {

    width: 31px;
    min-width: 31px;
    height: 31px;

    background: #ff9d1c;

    border-radius: 7px;
  }


  .help-icon.gesture-pan-square {

    width: 31px;
    min-width: 31px;
    height: 31px;

    background: #15929e;

    border-radius: 7px;
  }


  .help-text {
    font-size: 12px;
  }


  .help-text strong {
    font-size: 13px;
  }


  /* -------------------------
     背景
  ------------------------- */

  .bg-shapes {

    width: 100%;

    height: max(100vh, 1050px);
  }

}


/* =========================================
   極端に狭い画面への対応
========================================= */

@media (max-width: 360px) {

  .map-view {
    padding-top: 105px;
  }

  .top-controls {
    top: 52px;
  }

  .back-to-map,
  .help-button {
    font-size: 12px;
    padding: 5px 8px;
  }

}


/* =========================================
   横向きスマートフォン
========================================= */

@media screen and (max-width: 900px) and (orientation: landscape) {

  .map-view {

    padding-top: 75px;
    padding-bottom: 60px;

  }


  .top-controls {

    top: 48px;

  }


  .map-image {

    max-width: 80vw;
    max-height: 72vh;

  }


  .map-image-wrapper {

    max-width: 80vw;
    max-height: 72vh;

  }

}

<body>

<div class="bg-shapes">

  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>
  <div class="shape s4"></div>
  <div class="shape s5"></div>
  <div class="shape s6"></div>
  <div class="shape s7"></div>
  <div class="shape s8"></div>

</div>


<!-- =========================================
     ヘッダー
========================================= -->

<div id="header"></div>


<script>

fetch("header.html")
  .then(res => res.text())
  .then(data => {

    document.getElementById("header").innerHTML = data;

    const btn =
      document.querySelector(".menu-btn");

    const nav =
      document.querySelector(".nav");

    if (btn && nav) {

      btn.addEventListener("click", (e) => {

        e.stopPropagation();

        nav.classList.toggle("active");

      });


      document.addEventListener("click", (e) => {

        if (
          !nav.contains(e.target) &&
          !btn.contains(e.target)
        ) {

          nav.classList.remove("active");

        }

      });

    }

  });

</script>


<!-- =========================================
     フロアマップ
========================================= -->

<div class="floor-page">

  <div class="map-view">


    <div class="top-controls">

      <button
        class="back-to-map"
        id="backToMap"
        type="button"
      >
        全体図に戻る
      </button>


      <button
        class="help-button"
        id="helpButton"
        type="button"
      >
        操作説明
      </button>

    </div>


    <button
      class="floor-arrow floor-prev"
      id="prevButton"
      aria-label="前の階"
      type="button"
    >
      〈
    </button>


    <div
      class="map-image-wrapper"
      id="imageWrapper"
    >

      <img
        id="floorImage"
        class="map-image"
        src="images/1tou_1f.jpg"
        alt="1棟 1階 フロアマップ"
      >


      <button
        class="map-hotspot ten-yen-bread floor-1-hotspot"
        data-modal-type="ten-yen-bread"
        type="button"
        aria-label="1D 10円パンの詳細を表示"
        title="1D 10円パン"
      ></button>


      <button class="map-hotspot room-2d floor-2-hotspot" data-modal-type="room-2d" type="button" aria-label="2D 体験型の詳細を表示" title="2D 体験型"></button>
      <button class="map-hotspot room-3a floor-2-hotspot" data-modal-type="room-3a" type="button" aria-label="3A 焼き菓子の詳細を表示" title="3A 焼き菓子"></button>
      <button class="map-hotspot room-2a floor-2-hotspot" data-modal-type="room-2a" type="button" aria-label="2A フォトスポットの詳細を表示" title="2A フォトスポット"></button>
      <button class="map-hotspot room-jrc floor-2-hotspot" data-modal-type="room-jrc" type="button" aria-label="JRC部の詳細を表示" title="JRC部"></button>

      <button class="map-hotspot room-3d floor-2-hotspot" data-modal-type="room-3d" type="button" aria-label="3D お化け屋敷の詳細を表示" title="3D お化け屋敷"></button>


      <button class="map-hotspot room-1e floor-3-hotspot" data-modal-type="room-1e" type="button" aria-label="1E 脱出ゲームの詳細を表示" title="1E 脱出ゲーム"></button>
      <button class="map-hotspot room-3f floor-3-hotspot" data-modal-type="room-3f" type="button" aria-label="3F カジノの詳細を表示" title="3F カジノ"></button>
      <button class="map-hotspot room-3e floor-3-hotspot" data-modal-type="room-3e" type="button" aria-label="3E ポップコーンの詳細を表示" title="3E ポップコーン"></button>

      <button class="map-hotspot room-1f floor-3-hotspot" data-modal-type="room-1f" type="button" aria-label="1F ディッピンドッツの詳細を表示" title="1F ディッピンドッツ"></button>
      <button class="map-hotspot room-2f floor-3-hotspot" data-modal-type="room-2f" type="button" aria-label="2F 体験型の詳細を表示" title="2F 体験型"></button>
      <button class="map-hotspot room-1e-right floor-3-hotspot" data-modal-type="room-1e-right" type="button" aria-label="1E 脱出ゲームの詳細を表示" title="1E 脱出ゲーム"></button>

      <button class="map-hotspot room-3b floor-3-hotspot" data-modal-type="room-3b" type="button" aria-label="3B お化け屋敷の詳細を表示" title="3B お化け屋敷"></button>


      <button class="map-hotspot room-2c floor-4-hotspot" data-modal-type="room-2c" type="button" aria-label="2C 迷路の詳細を表示" title="2C 迷路"></button>
      <button class="map-hotspot room-1b floor-4-hotspot" data-modal-type="room-1b" type="button" aria-label="1B 31アイスの詳細を表示" title="1B 31アイス"></button>
      <button class="map-hotspot room-2b floor-4-hotspot" data-modal-type="room-2b" type="button" aria-label="2B 映画の詳細を表示" title="2B 映画"></button>

      <button class="map-hotspot room-ess floor-4-hotspot" data-modal-type="room-ess" type="button" aria-label="ESS部の詳細を表示" title="ESS部"></button>
      <button class="map-hotspot room-2g floor-4-hotspot" data-modal-type="room-2g" type="button" aria-label="2G 体験型の詳細を表示" title="2G 体験型"></button>
      <button class="map-hotspot room-1g floor-4-hotspot" data-modal-type="room-1g" type="button" aria-label="1G 焼き菓子の詳細を表示" title="1G 焼き菓子"></button>
      <button class="map-hotspot room-3c floor-4-hotspot" data-modal-type="room-3c" type="button" aria-label="3C お化け屋敷の詳細を表示" title="3C お化け屋敷"></button>
      <button class="map-hotspot room-bungei floor-4-hotspot" data-modal-type="room-bungei" type="button" aria-label="文芸部の詳細を表示" title="文芸部"></button>
      <button class="map-hotspot room-shodo floor-4-hotspot" data-modal-type="room-shodo" type="button" aria-label="書道部の詳細を表示" title="書道部"></button>


      <button
        class="building-switch"
        id="buildingSwitch"
        aria-label="2棟へ"
        type="button"
      >
        ⌄
      </button>

    </div>


    <button
      class="floor-arrow floor-next"
      id="nextButton"
      aria-label="次の階"
      type="button"
    >
      〉
    </button>

  </div>

</div>


<!-- =========================================
     場所詳細モーダル
========================================= -->

<div
  id="placeModalOverlay"
  aria-hidden="true"
>
  <iframe
    id="placeModalFrame"
    title="場所の詳細"
    src="about:blank"
  ></iframe>
</div>


<!-- =========================================
     操作説明
========================================= -->

<div
  class="help-overlay"
  id="helpOverlay"
>

  <div
    class="help-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="helpTitle"
  >

    <button
      class="help-x"
      id="helpX"
      type="button"
      aria-label="操作説明を閉じる"
    >
      ×
    </button>


    <h2
      class="help-title"
      id="helpTitle"
    >
      フロアマップの操作方法
    </h2>


    <p class="help-subtitle">
      画像を動かしたり拡大したりできます
    </p>


    <div class="help-item">

      <div class="help-icon gesture-red-square"></div>

      <div class="help-text">
        <strong>赤い文字をタップで詳細表示</strong><br>
        赤い文字をタップすると詳細を表示できます。(制作中)
      </div>

    </div>


    <div class="help-item">

      <div class="help-icon gesture-square"></div>

      <div class="help-text">
        <strong>2本指で拡大・縮小</strong><br>
        画像の上で2本の指を広げたり閉じたりすると、
        マップを拡大・縮小できます。
      </div>

    </div>


    <div class="help-item">

      <div class="help-icon gesture-pan-square"></div>

      <div class="help-text">
        <strong>拡大後は1本指で移動</strong><br>
        拡大した状態で1本指を動かすと、
        マップを見る位置を移動できます。
      </div>

    </div>


    <div class="help-item">

      <div class="help-icon">
        〈〉
      </div>

      <div class="help-text">
        <strong>階を切り替える</strong><br>
        左右の「〈」「〉」ボタンで
        1階・2階・3階・4階を切り替えられます。
      </div>

    </div>


    <div class="help-item">

      <div class="help-icon">
        ⌄
      </div>

      <div class="help-text">
        <strong>棟を切り替える</strong><br>
        画像の下にある「⌄」を押すと、
        2棟のフロアマップへ移動します。
      </div>

    </div>


    <button
      class="help-close"
      id="helpClose"
      type="button"
    >
      マップを見る
    </button>

  </div>

</div>


<script>

/* =========================================
   1棟 フロア設定
========================================= */

const floors = [

  {
    name: "1棟 1階",
    image: "images/1tou_1f.jpg"
  },

  {
    name: "1棟 2階",
    image: "images/1tou_2f.jpg"
  },

  {
    name: "1棟 3階",
    image: "images/1tou_3f.jpg"
  },

  {
    name: "1棟 4階",
    image: "images/1tou_4f.jpg"
  }

];


let currentFloor = 0;


/* =========================================
   要素
========================================= */

const floorImage =
  document.getElementById("floorImage");

const prevButton =
  document.getElementById("prevButton");

const nextButton =
  document.getElementById("nextButton");

const buildingSwitch =
  document.getElementById("buildingSwitch");

const imageWrapper =
  document.getElementById("imageWrapper");

const backToMap =
  document.getElementById("backToMap");

const mapView =
  document.querySelector(".map-view");


/* =========================================
   場所詳細モーダル
========================================= */

const placeModalOverlay =
  document.getElementById("placeModalOverlay");

const placeModalFrame =
  document.getElementById("placeModalFrame");

const mapHotspots =
  document.querySelectorAll(".map-hotspot");


function openPlaceModal(type) {

  if (!placeModalOverlay || !placeModalFrame) {
    return;
  }

  placeModalFrame.src =
    "modal2.html?type=" + encodeURIComponent(type);

  placeModalOverlay.classList.add("active");
  placeModalOverlay.setAttribute("aria-hidden", "false");

  document.body.style.overflow = "hidden";
}


function closePlaceModal() {

  if (!placeModalOverlay || !placeModalFrame) {
    return;
  }

  placeModalOverlay.classList.remove("active");
  placeModalOverlay.setAttribute("aria-hidden", "true");
  placeModalFrame.src = "about:blank";

  document.body.style.overflow = "";
}


mapHotspots.forEach((hotspot) => {

  hotspot.addEventListener("click", (e) => {

    e.preventDefault();
    e.stopPropagation();

    const type = hotspot.dataset.modalType;

    if (type) {
      openPlaceModal(type);
    }

  });

});


window.addEventListener("message", (e) => {

  if (e.source !== placeModalFrame?.contentWindow) {
    return;
  }

  if (e.data && e.data.type === "close-map-modal") {
    closePlaceModal();
  }

});


function updateHotspots() {

  mapHotspots.forEach((hotspot) => {

    const isFloor1Hotspot =
      hotspot.classList.contains("floor-1-hotspot");

    const isFloor2Hotspot =
      hotspot.classList.contains("floor-2-hotspot");

    const isFloor3Hotspot =
      hotspot.classList.contains("floor-3-hotspot");

    const isFloor4Hotspot =
      hotspot.classList.contains("floor-4-hotspot");

    if (isFloor1Hotspot) {
      hotspot.hidden = currentFloor !== 0;
      return;
    }

    if (isFloor2Hotspot) {
      hotspot.hidden = currentFloor !== 1;
      return;
    }

    if (isFloor3Hotspot) {
      hotspot.hidden = currentFloor !== 2;
      return;
    }

    if (isFloor4Hotspot) {
      hotspot.hidden = currentFloor !== 3;
      return;
    }

    hotspot.hidden = true;

  });

}


/* =========================================
   操作説明
========================================= */

const helpButton =
  document.getElementById("helpButton");

const helpOverlay =
  document.getElementById("helpOverlay");

const helpClose =
  document.getElementById("helpClose");

const helpX =
  document.getElementById("helpX");


const HELP_STORAGE_KEY =
  "choko_floor_map_help_shown";


function openHelp() {

  helpOverlay.classList.add("active");

}


function closeHelp() {

  helpOverlay.classList.remove("active");

  localStorage.setItem(
    HELP_STORAGE_KEY,
    "true"
  );

}


helpButton.addEventListener(
  "click",
  () => {

    openHelp();

  }
);


helpClose.addEventListener(
  "click",
  () => {

    closeHelp();

  }
);


helpX.addEventListener(
  "click",
  () => {

    closeHelp();

  }
);


helpOverlay.addEventListener(
  "click",
  (e) => {

    if (e.target === helpOverlay) {

      closeHelp();

    }

  }
);


if (
  localStorage.getItem(
    HELP_STORAGE_KEY
  ) !== "true"
) {

  setTimeout(
    () => {

      openHelp();

    },
    350
  );

}


/* =========================================
   ズーム・移動
========================================= */

let scale = 1;

let translateX = 0;
let translateY = 0;

let startDistance = 0;
let startScale = 1;

let startPanX = 0;
let startPanY = 0;

let startTouchX = 0;
let startTouchY = 0;

let startCenterX = 0;
let startCenterY = 0;

let isDragging = false;


function getDistance(touches) {

  const dx =
    touches[0].clientX -
    touches[1].clientX;

  const dy =
    touches[0].clientY -
    touches[1].clientY;

  return Math.sqrt(
    dx * dx + dy * dy
  );

}


function updateArrowPosition() {

  if (!imageWrapper) {
    return;
  }

  const imageTop =
    imageWrapper.offsetTop;

  const imageHeight =
    imageWrapper.offsetHeight;

  const centerY =
    imageTop + (imageHeight / 2);

  prevButton.style.top =
    centerY + "px";

  nextButton.style.top =
    centerY + "px";

}


function clampPosition() {

  const wrapperWidth =
    imageWrapper.offsetWidth;

  const wrapperHeight =
    imageWrapper.offsetHeight;


  const maxX =
    Math.max(
      0,
      (wrapperWidth * (scale - 1)) / 2
    );

  const maxY =
    Math.max(
      0,
      (wrapperHeight * (scale - 1)) / 2
    );


  translateX =
    Math.min(
      Math.max(translateX, -maxX),
      maxX
    );

  translateY =
    Math.min(
      Math.max(translateY, -maxY),
      maxY
    );

}


function updateTransform() {

  clampPosition();

  imageWrapper.style.transform =
    "translate3d(" +
    translateX +
    "px, " +
    translateY +
    "px, 0) scale(" +
    scale +
    ")";

}


function setZoom(value) {

  scale =
    Math.min(
      Math.max(value, 1),
      5
    );

  updateTransform();

}


function resetZoom() {

  scale = 1;

  translateX = 0;
  translateY = 0;

  imageWrapper.style.transform =
    "translate3d(0, 0, 0) scale(1)";

  updateArrowPosition();

}


function showFloor(index) {

  currentFloor =
    (index + floors.length) % floors.length;

  floorImage.src =
    floors[currentFloor].image;

  floorImage.alt =
    floors[currentFloor].name +
    " フロアマップ";

  resetZoom();
  updateHotspots();

}


floorImage.addEventListener(
  "load",
  () => {

    resetZoom();

    updateArrowPosition();

  }
);


prevButton.addEventListener(
  "click",
  () => {

    showFloor(currentFloor - 1);

  }
);


nextButton.addEventListener(
  "click",
  () => {

    showFloor(currentFloor + 1);

  }
);


backToMap.addEventListener(
  "click",
  () => {

    location.href = "map.html";

  }
);


buildingSwitch.addEventListener(
  "click",
  (e) => {

    e.stopPropagation();

    location.href = "2tou.html";

  }
);


imageWrapper.addEventListener(
  "touchstart",
  (e) => {

    if (e.touches.length === 2) {

      startDistance =
        getDistance(e.touches);

      startScale =
        scale;

      startPanX =
        translateX;

      startPanY =
        translateY;

      startCenterX =
        (
          e.touches[0].clientX +
          e.touches[1].clientX
        ) / 2;

      startCenterY =
        (
          e.touches[0].clientY +
          e.touches[1].clientY
        ) / 2;

      isDragging = false;

      return;

    }


    if (
      e.touches.length === 1 &&
      scale > 1
    ) {

      isDragging = true;

      startTouchX =
        e.touches[0].clientX;

      startTouchY =
        e.touches[0].clientY;

      startPanX =
        translateX;

      startPanY =
        translateY;

    }

  },
  { passive: false }
);


imageWrapper.addEventListener(
  "touchmove",
  (e) => {

    if (e.touches.length === 2) {

      e.preventDefault();

      const distance =
        getDistance(e.touches);

      if (startDistance > 0) {

        const ratio =
          distance / startDistance;

        scale =
          Math.min(
            Math.max(
              startScale * ratio,
              1
            ),
            5
          );

      }


      const centerX =
        (
          e.touches[0].clientX +
          e.touches[1].clientX
        ) / 2;

      const centerY =
        (
          e.touches[0].clientY +
          e.touches[1].clientY
        ) / 2;


      translateX =
        startPanX +
        (centerX - startCenterX);

      translateY =
        startPanY +
        (centerY - startCenterY);

      updateTransform();

      return;

    }


    if (
      e.touches.length === 1 &&
      isDragging &&
      scale > 1
    ) {

      e.preventDefault();

      const x =
        e.touches[0].clientX;

      const y =
        e.touches[0].clientY;

      translateX =
        startPanX +
        (x - startTouchX);

      translateY =
        startPanY +
        (y - startTouchY);

      updateTransform();

    }

  },
  { passive: false }
);


imageWrapper.addEventListener(
  "touchend",
  (e) => {

    if (e.touches.length === 0) {

      isDragging = false;

      startDistance = 0;

      startTouchX = 0;
      startTouchY = 0;

      startCenterX = 0;
      startCenterY = 0;

    }

  },
  { passive: false }
);


imageWrapper.addEventListener(
  "mousedown",
  (e) => {

    if (
      e.button !== 0 ||
      scale <= 1
    ) {
      return;
    }

    isDragging = true;

    startTouchX =
      e.clientX;

    startTouchY =
      e.clientY;

    startPanX =
      translateX;

    startPanY =
      translateY;

    imageWrapper.style.cursor =
      "grabbing";

    e.preventDefault();

  }
);


document.addEventListener(
  "mousemove",
  (e) => {

    if (
      !isDragging ||
      scale <= 1
    ) {
      return;
    }

    translateX =
      startPanX +
      (e.clientX - startTouchX);

    translateY =
      startPanY +
      (e.clientY - startTouchY);

    updateTransform();

  }
);


document.addEventListener(
  "mouseup",
  () => {

    if (isDragging) {

      isDragging = false;

      imageWrapper.style.cursor =
        scale > 1
          ? "grab"
          : "default";

    }

  }
);


imageWrapper.addEventListener(
  "wheel",
  (e) => {

    e.preventDefault();

    const delta =
      e.deltaY > 0
        ? -0.15
        : 0.15;

    setZoom(scale + delta);

    imageWrapper.style.cursor =
      scale > 1
        ? "grab"
        : "default";

  },
  { passive: false }
);


imageWrapper.style.cursor = "default";

updateHotspots();


window.addEventListener(
  "load",
  () => {

    updateArrowPosition();

  }
);


window.addEventListener(
  "resize",
  () => {

    if (scale > 1) {

      updateTransform();

    }

    updateArrowPosition();

  }
);

</script>

</body>
</html>
