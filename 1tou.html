<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover"
>

<title>1棟 フロアマップ</title>

<link rel="stylesheet" href="css/style.css">

<style>

/* =========================================
   全体
========================================= */

html,
body {
  width: 100%;
  min-width: 0;
  min-height: 100%;

  margin: 0;
  padding: 0;

  overflow-x: hidden;
  overflow-y: auto;

  background-color: #eeedeb !important;
  color: black;

  font-family: sans-serif;

  overscroll-behavior-x: none;
}


/* =========================================
   背景
   TOPページと統一
========================================= */

.bg-shapes {
  position: fixed !important;

  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 0 !important;

  pointer-events: none;

  overflow: hidden;

  /* TOPページと同じように透けて表示 */
  opacity: 0.24 !important;

  /* 背景として少し馴染ませる */
  filter: blur(1px);

  transform: translateZ(0);
}


/* 背景図形 */

.bg-shapes .shape {
  display: block !important;

  position: absolute;
}


/* =========================================
   三角形
========================================= */

.s1 {
  top: 5%;
  left: -50px;

  width: 0;
  height: 0;

  border-left: 90px solid transparent;
  border-right: 90px solid transparent;
  border-bottom: 170px solid #c96d80;

  transform: rotate(-25deg);
}

.s2 {
  top: 25%;
  left: -35px;

  width: 0;
  height: 0;

  border-left: 70px solid transparent;
  border-right: 70px solid transparent;
  border-bottom: 130px solid #8870a8;

  transform: rotate(20deg);
}

.s3 {
  bottom: 5%;
  left: -30px;

  width: 0;
  height: 0;

  border-left: 100px solid transparent;
  border-right: 100px solid transparent;
  border-bottom: 180px solid #cfb25a;

  transform: rotate(12deg);
}

.s4 {
  bottom: 28%;
  left: 20px;

  width: 0;
  height: 0;

  border-left: 60px solid transparent;
  border-right: 60px solid transparent;
  border-bottom: 120px solid #65a6ae;

  transform: rotate(-15deg);
}

.s5 {
  top: 12%;
  right: -80px;

  width: 0;
  height: 0;

  border-left: 150px solid transparent;
  border-right: 150px solid transparent;
  border-bottom: 260px solid #6aa8ad;

  transform: rotate(30deg);
}

.s6 {
  bottom: -40px;
  right: -30px;

  width: 0;
  height: 0;

  border-left: 100px solid transparent;
  border-right: 100px solid transparent;
  border-bottom: 190px solid #c96d80;

  transform: rotate(-15deg);
}

.s7 {
  top: 8%;
  right: 40px;

  width: 0;
  height: 0;

  border-left: 55px solid transparent;
  border-right: 55px solid transparent;
  border-bottom: 100px solid #8870a8;

  transform: rotate(35deg);
}

.s8 {
  bottom: 20%;
  right: 40px;

  width: 0;
  height: 0;

  border-left: 70px solid transparent;
  border-right: 70px solid transparent;
  border-bottom: 130px solid #cfb25a;

  transform: rotate(-20deg);
}


/* =========================================
   四角形
========================================= */

.bg-shapes::before,
.bg-shapes::after {
  content: "";

  position: absolute;

  display: block;
}


.bg-shapes::before {
  width: 85px;
  height: 150px;

  left: 7%;
  top: 45%;

  background: #a57999;

  transform: rotate(28deg);
}


.bg-shapes::after {
  width: 110px;
  height: 70px;

  right: 4%;
  top: 55%;

  background: #65a0a8;

  transform: rotate(-20deg);
}


/* =========================================
   追加四角形
========================================= */

.s9 {
  top: 38%;
  left: 12%;

  width: 90px;
  height: 55px;

  background: #c87382;

  transform: rotate(-18deg);
}


.s10 {
  top: 70%;
  left: 18%;

  width: 65px;
  height: 100px;

  background: #766990;

  transform: rotate(25deg);
}


.s11 {
  top: 32%;
  right: 15%;

  width: 75px;
  height: 75px;

  background: #c8a75a;

  transform: rotate(18deg);
}


.s12 {
  bottom: 10%;
  right: 20%;

  width: 100px;
  height: 55px;

  background: #609da4;

  transform: rotate(-30deg);
}


/* =========================================
   ヘッダー
========================================= */

#header {
  position: relative;
  z-index: 100;
}


/* =========================================
   フロアマップ画面
========================================= */

.floor-page {
  position: relative;

  top: auto;
  left: auto;

  width: 100%;
  max-width: 100%;

  min-height: calc(100vh - 80px);

  overflow: visible;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  touch-action: pan-y;

  background: transparent !important;

  z-index: 1;
}


/* =========================================
   マップ表示エリア
========================================= */

.map-view {
  position: relative;

  width: 100%;
  max-width: 100%;

  min-height: calc(100vh - 80px);

  height: auto;

  padding-top: 70px;
  padding-bottom: 80px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  overflow: visible;

  touch-action: pan-y;

  background: transparent !important;

  box-sizing: border-box;
}


/* =========================================
   マップ画像
========================================= */

.map-image-wrapper {
  position: relative;

  max-width: 90vw;
  max-height: 75vh;

  display: flex;
  align-items: center;
  justify-content: center;

  transform-origin: center center;

  touch-action: pan-y;

  user-select: none;
  -webkit-user-select: none;

  flex-shrink: 0;

  cursor: default;

  will-change: transform;

  margin: 0 auto;
}


.map-image {
  display: block;

  max-width: 90vw;
  max-height: 75vh;

  width: auto;
  height: auto;

  object-fit: contain;

  user-select: none;
  -webkit-user-drag: none;
  -webkit-user-select: none;

  pointer-events: none;
}


/* =========================================
   上部ボタンエリア
========================================= */

.top-controls {
  position: absolute;

  top: 8px;
  left: 50%;

  transform: translateX(-50%);

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 7px;

  z-index: 50;

  white-space: nowrap;
}


/* =========================================
   全体図に戻るボタン
========================================= */

.back-to-map {
  border: 1px solid rgba(6,37,79,0.16);
  background: rgba(255,255,255,0.94);
  color: #06254f;
  padding: 7px 13px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.03em;
  white-space: nowrap;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(6,37,79,0.10);
  -webkit-tap-highlight-color: transparent;
  transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
}

.back-to-map::before {
  content: "↩";
  margin-right: 5px;
  font-size: 14px;
}

.back-to-map:hover {
  transform: translateY(-1px);
  background: #fff;
  box-shadow: 0 5px 14px rgba(6,37,79,0.14);
}

.back-to-map:active {
  transform: translateY(0);
  opacity: 0.72;
}


/* =========================================
   操作説明ボタン
========================================= */

.help-button {
  border: 1px solid rgba(21,146,158,0.18);
  background: rgba(21,146,158,0.95);
  color: #fff;
  padding: 7px 13px;
  border-radius: 999px;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.03em;
  white-space: nowrap;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(21,146,158,0.16);
  -webkit-tap-highlight-color: transparent;
  transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
}

.help-button::before {
  content: "?";
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  margin-right: 5px;
  border: 1px solid rgba(255,255,255,0.75);
  border-radius: 50%;
  font-size: 11px;
}

.help-button:hover {
  transform: translateY(-1px);
  background: #12818c;
  box-shadow: 0 5px 14px rgba(21,146,158,0.20);
}

.help-button:active {
  transform: translateY(0);
  opacity: 0.72;
}

/* =========================================
   混雑表示コントロール
========================================= */

.crowd-toggle-button {
  border: 1px solid rgba(6,37,79,0.18);
  background: rgba(255,255,255,0.92);
  color: #06254f;
  padding: 7px 12px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.03em;
  white-space: nowrap;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(6,37,79,0.10);
  -webkit-tap-highlight-color: transparent;
  transition: background .18s ease, color .18s ease, transform .18s ease;
}

.crowd-toggle-button:hover {
  transform: translateY(-1px);
}

.crowd-toggle-button:active {
  transform: translateY(0);
  opacity: 0.75;
}

.crowd-toggle-button.off {
  background: rgba(238,237,235,0.94);
  color: #666;
}

.crowd-toggle-dot {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 6px;
  border-radius: 50%;
  background: #4f9d69;
  vertical-align: 1px;
}

.crowd-toggle-button.off .crowd-toggle-dot {
  background: #aaa;
}

.crowd-legend {
  position: absolute;
  top: calc(100% + 7px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 7px 10px;
  border: 1px solid rgba(6,37,79,0.12);
  border-radius: 12px;
  background: rgba(255,255,255,0.90);
  box-shadow: 0 4px 14px rgba(6,37,79,0.10);
  backdrop-filter: blur(5px);
  -webkit-backdrop-filter: blur(5px);
  z-index: 60;
  pointer-events: none;
  white-space: nowrap;
}

.crowd-legend-item {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  color: #333;
  font-size: 11px;
  font-weight: 700;
}

.crowd-legend-color {
  display: inline-block;
  width: 13px;
  height: 13px;
  border-radius: 4px;
  box-sizing: border-box;
}

.crowd-legend-color.empty {
  background: rgba(79,157,105,.48);
  border: 1px solid rgba(79,157,105,.70);
}

.crowd-legend-color.normal {
  background: rgba(215,168,61,.48);
  border: 1px solid rgba(215,168,61,.70);
}

.crowd-legend-color.crowded {
  background: rgba(212,91,88,.48);
  border: 1px solid rgba(212,91,88,.70);
}

/* 当たり判定の上に重ねる混雑表示。内部レイヤーはクリックを邪魔しない。 */
.map-hotspot .crowd-visual-layer {
  position: absolute;
  inset: 0;
  display: block;
  border-radius: inherit;
  pointer-events: none;
  opacity: 0;
  transition: opacity .18s ease;
}

.map-hotspot.crowd-visible .crowd-visual-layer {
  opacity: 1;
}

.map-hotspot.crowd-empty .crowd-visual-layer {
  background: rgba(79,157,105,.34);
  border: 1px solid rgba(79,157,105,.55);
}

.map-hotspot.crowd-normal .crowd-visual-layer {
  background: rgba(215,168,61,.34);
  border: 1px solid rgba(215,168,61,.55);
}

.map-hotspot.crowd-crowded .crowd-visual-layer {
  background: rgba(212,91,88,.34);
  border: 1px solid rgba(212,91,88,.55);
}

.map-hotspot.crowd-unknown .crowd-visual-layer {
  background: transparent;
  border: 1px solid transparent;
}



/* =========================================
   左右ボタン
========================================= */

.floor-arrow {
  position: absolute;

  top: 0;

  transform: translateY(-50%);

  width: 48px;
  height: 80px;

  border: none;

  background: transparent;

  font-size: 52px;
  line-height: 1;

  color: #d92a21;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  z-index: 30;

  padding: 0;

  text-shadow: none;

  -webkit-tap-highlight-color: transparent;
}

.floor-arrow:active {
  opacity: 0.5;
}

.floor-prev {
  left: 4px;
}

.floor-next {
  right: 4px;

  color: #d92a21;
}


/* =========================================
   棟切り替えボタン
========================================= */

.building-switch {
  position: absolute;

  left: 50%;
  top: 100%;

  transform: translateX(-50%);

  width: 48px;
  height: 50px;

  border: none;

  background: transparent;

  color: #15929e;

  font-size: 52px;
  line-height: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  z-index: 40;

  padding: 0;

  border-radius: 0;

  text-shadow: none;

  -webkit-tap-highlight-color: transparent;
}

.building-switch:active {
  opacity: 0.5;
}


/* =========================================
   操作説明モーダル
========================================= */

.help-overlay {

  position: fixed;

  inset: 0;

  z-index: 1000;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(6, 37, 79, 0.55);

  backdrop-filter: blur(5px);

  -webkit-backdrop-filter: blur(5px);
}

.help-overlay.active {
  display: flex;
}


/* =========================================
   操作説明本体
========================================= */

.help-modal {

  position: relative;

  width: min(430px, 92vw);

  max-height: 82vh;

  overflow-y: auto;

  background: #eeedeb;

  border-radius: 18px;

  padding: 24px 20px 20px;

  box-shadow: 0 15px 40px rgba(0,0,0,0.25);

  border-top: 7px solid #06254f;

  box-sizing: border-box;
}


/* =========================================
   モーダルタイトル
========================================= */

.help-title {

  margin: 0 35px 5px 0;

  color: #06254f;

  font-size: 23px;

  font-weight: 800;

  letter-spacing: 0.05em;
}


.help-subtitle {

  margin: 0 0 18px;

  color: #555;

  font-size: 13px;

  font-weight: 600;
}


/* =========================================
   操作項目
========================================= */

.help-item {

  display: flex;

  align-items: center;

  gap: 13px;

  margin-bottom: 10px;

  padding: 11px 12px;

  background: #fff;

  border-radius: 10px;

  border-left: 5px solid #15929e;

  box-sizing: border-box;
}


.help-icon {

  width: 34px;
  min-width: 34px;
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 21px;

  border-radius: 8px;

  background: #eeedeb;
}


/* =========================================
   赤い文字タップアイコン
========================================= */

.help-icon.gesture-red-square {

  width: 34px;
  min-width: 34px;
  height: 34px;

  background: #d92a21;

  border-radius: 8px;

  font-size: 0;
}


/* =========================================
   2本指アイコン部分
========================================= */

.help-icon.gesture-square {

  width: 34px;
  min-width: 34px;
  height: 34px;

  background: #ff9d1c;

  border-radius: 8px;

  font-size: 0;
}


/* =========================================
   1本指移動アイコン部分
========================================= */

.help-icon.gesture-pan-square {

  width: 34px;
  min-width: 34px;
  height: 34px;

  background: #15929e;

  border-radius: 8px;

  font-size: 0;
}


/* =========================================
   操作説明テキスト
========================================= */

.help-text {

  color: #222;

  font-size: 13px;

  line-height: 1.55;

  font-weight: 600;
}


.help-text strong {

  color: #06254f;

  font-size: 14px;
}


/* =========================================
   閉じるボタン
========================================= */

.help-close {

  width: 100%;

  margin-top: 8px;

  border: none;

  border-radius: 9px;

  padding: 11px;

  background: #06254f;

  color: #fff;

  font-size: 15px;

  font-weight: 700;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.help-close:active {
  opacity: 0.65;
}


/* =========================================
   モーダル右上閉じる
========================================= */

.help-x {

  position: absolute;

  top: 13px;
  right: 14px;

  width: 32px;
  height: 32px;

  border: none;

  border-radius: 50%;

  background: #d92a21;

  color: #fff;

  font-size: 19px;

  line-height: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.help-x:active {
  opacity: 0.65;
}


/* =========================================
   スマートフォン
========================================= */

@media (max-width: 600px) {

  .floor-page {

    width: 100%;
    max-width: 100%;

    min-height: calc(100vh - 50px);

    overflow: visible;
  }


  .map-view {

    width: 100%;
    max-width: 100%;

    min-height: calc(100vh - 50px);

    height: auto;

    padding-top: 115px;

    padding-bottom: 75px;

    justify-content: flex-start;

    overflow: visible;
  }


  .map-image {

    max-width: 82vw;
    max-height: 68vh;
  }


  .map-image-wrapper {

    max-width: 82vw;
    max-height: 68vh;

    position: relative;

    left: auto;
    top: auto;

    transform: none;

    width: auto;
    height: auto;

    margin: 0 auto;
  }


  /* -------------------------
     上部ボタン
  ------------------------- */

  .top-controls {

    top: 58px;

    gap: 5px;
  }


  .back-to-map,
  .help-button {

    font-size: 14px;

    padding: 5px 10px;

    border-radius: 7px;
  }

  .crowd-toggle-button {
    font-size: 12px;
    padding: 5px 9px;
  }

  .crowd-legend {
    top: calc(100% + 6px);
    max-width: 96vw;
    gap: 5px;
    padding: 6px 7px;
  }

  .crowd-legend-item {
    font-size: 9px;
    gap: 3px;
  }

  .crowd-legend-color {
    width: 10px;
    height: 10px;
  }


  /* -------------------------
     左右矢印
  ------------------------- */

  .floor-arrow {

    width: 40px;
    height: 70px;

    font-size: 44px;

    top: 0;

    color: #d92a21;
  }

  .floor-prev {
    left: 0;
  }

  .floor-next {
    right: 0;

    color: #d92a21;
  }


  /* -------------------------
     棟切り替え
  ------------------------- */

  .building-switch {

    width: 40px;
    height: 50px;

    font-size: 44px;

    top: 100%;
  }


  /* -------------------------
     操作説明
  ------------------------- */

  .help-overlay {
    padding: 15px;
  }


  .help-modal {

    width: 94vw;

    max-height: 84vh;

    padding: 21px 16px 16px;

    border-radius: 16px;

    border-top-width: 6px;
  }


  .help-title {
    font-size: 20px;
  }


  .help-subtitle {
    font-size: 12px;

    margin-bottom: 14px;
  }


  .help-item {
    gap: 10px;

    margin-bottom: 8px;

    padding: 9px 10px;

    border-left-width: 4px;
  }


  .help-icon {

    width: 31px;
    min-width: 31px;
    height: 31px;

    font-size: 18px;
  }


  .help-icon.gesture-red-square {

    width: 31px;
    min-width: 31px;
    height: 31px;

    background: #d92a21;

    border-radius: 7px;
  }


  .help-icon.gesture-square {

    width: 31px;
    min-width: 31px;
    height: 31px;

    background: #ff9d1c;

    border-radius: 7px;
  }


  .help-icon.gesture-pan-square {

    width: 31px;
    min-width: 31px;
    height: 31px;

    background: #15929e;

    border-radius: 7px;
  }


  .help-text {
    font-size: 12px;
  }


  .help-text strong {
    font-size: 13px;
  }


  /* -------------------------
     背景
     TOPページと同じように
     スマホではさらに控えめ
  ------------------------- */

  .bg-shapes {

    width: 100%;
    height: 100%;

    opacity: 0.18 !important;

    filter: blur(1px);
  }

}


/* =========================================
   極端に狭い画面への対応
========================================= */

@media (max-width: 360px) {

  .map-view {
    padding-top: 105px;
  }

  .top-controls {
    top: 52px;
  }

  .back-to-map,
  .help-button {
    font-size: 12px;
    padding: 5px 8px;
  }

}


/* =========================================
   横向きスマートフォン
========================================= */

@media screen and (max-width: 900px) and (orientation: landscape) {

  .map-view {

    padding-top: 75px;
    padding-bottom: 60px;

  }


  .top-controls {

    top: 48px;

  }


  .map-image {

    max-width: 80vw;
    max-height: 72vh;

  }


  .map-image-wrapper {

    max-width: 80vw;
    max-height: 72vh;

  }

}



/* =========================================
   赤文字エリアのクリック判定
   ※クリック判定のみ。表示は完全透明
========================================= */

.map-hotspot {
  position: absolute;
  z-index: 25;
  display: block;
  padding: 0;
  margin: 0;
  border: 2px solid transparent;
  border-radius: 10px;
  background: transparent;
  box-shadow: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  box-sizing: border-box;
  transition: none;
}

.map-hotspot:hover {
  background: transparent;
  border-color: transparent;
}

.map-hotspot:active {
  background: transparent;
  border-color: transparent;
  transform: none;

<script>

/* =========================================
   1棟 フロア設定
========================================= */

const floors = [

  {
    name: "1棟 1階",
    image: "images/1tou_1f.jpg"
  },

  {
    name: "1棟 2階",
    image: "images/1tou_2f.jpg"
  },

  {
    name: "1棟 3階",
    image: "images/1tou_3f.jpg"
  },

  {
    name: "1棟 4階",
    image: "images/1tou_4f.jpg"
  }

];


let currentFloor = 0;


/* =========================================
   要素
========================================= */

const floorImage =
  document.getElementById("floorImage");

const prevButton =
  document.getElementById("prevButton");

const nextButton =
  document.getElementById("nextButton");

const buildingSwitch =
  document.getElementById("buildingSwitch");

const imageWrapper =
  document.getElementById("imageWrapper");

const backToMap =
  document.getElementById("backToMap");

const mapView =
  document.querySelector(".map-view");


/* =========================================
   場所詳細モーダル
========================================= */

const placeModalOverlay =
  document.getElementById("placeModalOverlay");

const placeModalFrame =
  document.getElementById("placeModalFrame");

const mapHotspots =
  document.querySelectorAll(".map-hotspot");


function openPlaceModal(type) {

  if (!placeModalOverlay || !placeModalFrame) {
    return;
  }

  placeModalFrame.src =
    "modal2.html?type=" + encodeURIComponent(type);

  placeModalOverlay.classList.add("active");
  placeModalOverlay.setAttribute("aria-hidden", "false");

  document.body.style.overflow = "hidden";
}


function closePlaceModal() {

  if (!placeModalOverlay || !placeModalFrame) {
    return;
  }

  placeModalOverlay.classList.remove("active");
  placeModalOverlay.setAttribute("aria-hidden", "true");
  placeModalFrame.src = "about:blank";

  document.body.style.overflow = "";
}


mapHotspots.forEach((hotspot) => {

  hotspot.addEventListener("click", (e) => {

    e.preventDefault();
    e.stopPropagation();

    const type = hotspot.dataset.modalType;

    if (type) {
      openPlaceModal(type);
    }

  });

});


window.addEventListener("message", (e) => {

  if (e.source !== placeModalFrame?.contentWindow) {
    return;
  }

  if (e.data && e.data.type === "close-map-modal") {
    closePlaceModal();
  }

});


function updateHotspots() {

  mapHotspots.forEach((hotspot) => {

    const isFloor1Hotspot =
      hotspot.classList.contains("floor-1-hotspot");

    const isFloor2Hotspot =
      hotspot.classList.contains("floor-2-hotspot");

    const isFloor3Hotspot =
      hotspot.classList.contains("floor-3-hotspot");

    const isFloor4Hotspot =
      hotspot.classList.contains("floor-4-hotspot");

    if (isFloor1Hotspot) {
      hotspot.hidden = currentFloor !== 0;
      return;
    }

    if (isFloor2Hotspot) {
      hotspot.hidden = currentFloor !== 1;
      return;
    }

    if (isFloor3Hotspot) {
      hotspot.hidden = currentFloor !== 2;
      return;
    }

    if (isFloor4Hotspot) {
      hotspot.hidden = currentFloor !== 3;
      return;
    }

    hotspot.hidden = true;

  });

}


/* =========================================
   操作説明
========================================= */

const helpButton =
  document.getElementById("helpButton");

const helpOverlay =
  document.getElementById("helpOverlay");

const helpClose =
  document.getElementById("helpClose");

const helpX =
  document.getElementById("helpX");


const HELP_STORAGE_KEY =
  "choko_floor_map_help_shown";


function openHelp() {

  helpOverlay.classList.add("active");

}


function closeHelp() {

  helpOverlay.classList.remove("active");

  localStorage.setItem(
    HELP_STORAGE_KEY,
    "true"
  );

}


helpButton.addEventListener(
  "click",
  () => {

    openHelp();

  }
);


helpClose.addEventListener(
  "click",
  () => {

    closeHelp();

  }
);


helpX.addEventListener(
  "click",
  () => {

    closeHelp();

  }
);


helpOverlay.addEventListener(
  "click",
  (e) => {

    if (e.target === helpOverlay) {

      closeHelp();

    }

  }
);


if (
  localStorage.getItem(
    HELP_STORAGE_KEY
  ) !== "true"
) {

  setTimeout(
    () => {

      openHelp();

    },
    350
  );

}


/* =========================================
   ズーム・移動
========================================= */

let scale = 1;

let translateX = 0;
let translateY = 0;

let startDistance = 0;
let startScale = 1;

let startPanX = 0;
let startPanY = 0;

let startTouchX = 0;
let startTouchY = 0;

let startCenterX = 0;
let startCenterY = 0;

let isDragging = false;


function getDistance(touches) {

  const dx =
    touches[0].clientX -
    touches[1].clientX;

  const dy =
    touches[0].clientY -
    touches[1].clientY;

  return Math.sqrt(
    dx * dx + dy * dy
  );

}


function updateArrowPosition() {

  if (!imageWrapper) {
    return;
  }

  const imageTop =
    imageWrapper.offsetTop;

  const imageHeight =
    imageWrapper.offsetHeight;

  const centerY =
    imageTop + (imageHeight / 2);

  prevButton.style.top =
    centerY + "px";

  nextButton.style.top =
    centerY + "px";

}


function clampPosition() {

  const wrapperWidth =
    imageWrapper.offsetWidth;

  const wrapperHeight =
    imageWrapper.offsetHeight;


  const maxX =
    Math.max(
      0,
      (wrapperWidth * (scale - 1)) / 2
    );

  const maxY =
    Math.max(
      0,
      (wrapperHeight * (scale - 1)) / 2
    );


  translateX =
    Math.min(
      Math.max(translateX, -maxX),
      maxX
    );

  translateY =
    Math.min(
      Math.max(translateY, -maxY),
      maxY
    );

}


function updateTransform() {

  clampPosition();

  imageWrapper.style.transform =
    "translate3d(" +
    translateX +
    "px, " +
    translateY +
    "px, 0) scale(" +
    scale +
    ")";

}


function setZoom(value) {

  scale =
    Math.min(
      Math.max(value, 1),
      5
    );

  updateTransform();

}


function resetZoom() {

  scale = 1;

  translateX = 0;
  translateY = 0;

  imageWrapper.style.transform =
    "translate3d(0, 0, 0) scale(1)";

  updateArrowPosition();

}


function showFloor(index) {

  currentFloor =
    (index + floors.length) % floors.length;

  floorImage.src =
    floors[currentFloor].image;

  floorImage.alt =
    floors[currentFloor].name +
    " フロアマップ";

  resetZoom();
  updateHotspots();

}


floorImage.addEventListener(
  "load",
  () => {

    resetZoom();

    updateArrowPosition();

  }
);


prevButton.addEventListener(
  "click",
  () => {

    showFloor(currentFloor - 1);

  }
);


nextButton.addEventListener(
  "click",
  () => {

    showFloor(currentFloor + 1);

  }
);


backToMap.addEventListener(
  "click",
  () => {

    location.href = "map.html";

  }
);


buildingSwitch.addEventListener(
  "click",
  (e) => {

    e.stopPropagation();

    location.href = "2tou.html";

  }
);


imageWrapper.addEventListener(
  "touchstart",
  (e) => {

    if (e.touches.length === 2) {

      startDistance =
        getDistance(e.touches);

      startScale =
        scale;

      startPanX =
        translateX;

      startPanY =
        translateY;

      startCenterX =
        (
          e.touches[0].clientX +
          e.touches[1].clientX
        ) / 2;

      startCenterY =
        (
          e.touches[0].clientY +
          e.touches[1].clientY
        ) / 2;

      isDragging = false;

      return;

    }


    if (
      e.touches.length === 1 &&
      scale > 1
    ) {

      isDragging = true;

      startTouchX =
        e.touches[0].clientX;

      startTouchY =
        e.touches[0].clientY;

      startPanX =
        translateX;

      startPanY =
        translateY;

    }

  },
  { passive: false }
);


imageWrapper.addEventListener(
  "touchmove",
  (e) => {

    if (e.touches.length === 2) {

      e.preventDefault();

      const distance =
        getDistance(e.touches);

      if (startDistance > 0) {

        const ratio =
          distance / startDistance;

        scale =
          Math.min(
            Math.max(
              startScale * ratio,
              1
            ),
            5
          );

      }


      const centerX =
        (
          e.touches[0].clientX +
          e.touches[1].clientX
        ) / 2;

      const centerY =
        (
          e.touches[0].clientY +
          e.touches[1].clientY
        ) / 2;


      translateX =
        startPanX +
        (centerX - startCenterX);

      translateY =
        startPanY +
        (centerY - startCenterY);

      updateTransform();

      return;

    }


    if (
      e.touches.length === 1 &&
      isDragging &&
      scale > 1
    ) {

      e.preventDefault();

      const x =
        e.touches[0].clientX;

      const y =
        e.touches[0].clientY;

      translateX =
        startPanX +
        (x - startTouchX);

      translateY =
        startPanY +
        (y - startTouchY);

      updateTransform();

    }

  },
  { passive: false }
);


imageWrapper.addEventListener(
  "touchend",
  (e) => {

    if (e.touches.length === 0) {

      isDragging = false;

      startDistance = 0;

      startTouchX = 0;
      startTouchY = 0;

      startCenterX = 0;
      startCenterY = 0;

    }

  },
  { passive: false }
);


imageWrapper.addEventListener(
  "mousedown",
  (e) => {

    if (
      e.button !== 0 ||
      scale <= 1
    ) {
      return;
    }

    isDragging = true;

    startTouchX =
      e.clientX;

    startTouchY =
      e.clientY;

    startPanX =
      translateX;

    startPanY =
      translateY;

    imageWrapper.style.cursor =
      "grabbing";

    e.preventDefault();

  }
);


document.addEventListener(
  "mousemove",
  (e) => {

    if (
      !isDragging ||
      scale <= 1
    ) {
      return;
    }

    translateX =
      startPanX +
      (e.clientX - startTouchX);

    translateY =
      startPanY +
      (e.clientY - startTouchY);

    updateTransform();

  }
);


document.addEventListener(
  "mouseup",
  () => {

    if (isDragging) {

      isDragging = false;

      imageWrapper.style.cursor =
        scale > 1
          ? "grab"
          : "default";

    }

  }
);


imageWrapper.addEventListener(
  "wheel",
  (e) => {

    e.preventDefault();

    const delta =
      e.deltaY > 0
        ? -0.15
        : 0.15;

    setZoom(scale + delta);

    imageWrapper.style.cursor =
      scale > 1
        ? "grab"
        : "default";

  },
  { passive: false }
);


imageWrapper.style.cursor = "default";

updateHotspots();


window.addEventListener(
  "load",
  () => {

    updateArrowPosition();

  }
);


window.addEventListener(
  "resize",
  () => {

    if (scale > 1) {

      updateTransform();

    }

    updateArrowPosition();

  }
);

</script>

<script>
/* =========================================
   1棟フロアマップ 混雑状況表示

   crowd.html と同じ /api/crowd を使用し、
   APIから返された「企画ID → 混雑状態」を
   各ホットスポットへ直接反映する。

   重要：
   ・classだけに頼らず、レイヤーへ直接色を設定
   ・status / crowdStatus / crowd_status / state / level に対応
   ・scoreしかない場合も score から状態を判定
   ・events.html の modalId と照合してID違いにも対応
   ・15秒ごと、タブ復帰時、オンライン復帰時に更新
========================================= */
(function(){

  const CROWD_API_URL =
    "https://chosei-fes.onrender.com";

  const CROWD_API_PATH =
    "/api/crowd";

  const CROWD_STORAGE_KEY =
    "choko_crowd_map_visible";

  const CROWD_REFRESH_MS =
    15000;

  let crowdDisplayEnabled =
    localStorage.getItem(CROWD_STORAGE_KEY) !== "false";

  let crowdRequestController = null;

  let eventsIdMap = null;


  /* =========================================
     混雑状態を統一
  ========================================= */
  function normalizeCrowdStatus(value){

    if(value === null || value === undefined){
      return "unknown";
    }

    const status =
      String(value)
        .trim()
        .toLowerCase();

    if([
      "empty",
      "low",
      "free",
      "空いている",
      "空き",
      "比較的空いている"
    ].includes(status)){
      return "empty";
    }

    if([
      "normal",
      "medium",
      "moderate",
      "通常",
      "普通",
      "やや混雑している"
    ].includes(status)){
      return "normal";
    }

    if([
      "crowded",
      "high",
      "busy",
      "混雑",
      "混雑している"
    ].includes(status)){
      return "crowded";
    }

    return "unknown";
  }


  /* =========================================
     scoreから混雑状態を判定
     server.js と同じ境界値
  ========================================= */
  function scoreToCrowdStatus(score){

    const number = Number(score);

    if(!Number.isFinite(number)){
      return "unknown";
    }

    if(number < 34){
      return "empty";
    }

    if(number < 67){
      return "normal";
    }

    return "crowded";
  }


  /* =========================================
     ID正規化
  ========================================= */
  function normalizeId(value){

    return String(value ?? "")
      .trim()
      .toLowerCase();
  }


  /* =========================================
     文字列正規化
     IDが違う場合の照合用
  ========================================= */
  function normalizeText(value){

    return String(value ?? "")
      .trim()
      .toLowerCase()
      .replace(/\s+/g, "")
      .replace(/[　]/g, "");
  }


  /* =========================================
     レコードから状態取得
  ========================================= */
  function getStatusFromRecord(record){

    if(
      record === null ||
      record === undefined
    ){
      return "unknown";
    }

    /* APIが直接 "crowded" のような文字列を返す場合 */
    if(typeof record === "string"){
      return normalizeCrowdStatus(record);
    }

    if(typeof record !== "object"){
      return "unknown";
    }

    const statusValue =
      record.status ??
      record.crowdStatus ??
      record.crowd_status ??
      record.state ??
      record.level;

    const status =
      normalizeCrowdStatus(statusValue);

    if(status !== "unknown"){
      return status;
    }

    /* statusがなくscoreだけあるAPI形式にも対応 */
    return scoreToCrowdStatus(
      record.score
    );
  }


  /* =========================================
     レコード取得

     server.jsの実際のGET /api/crowdは

       {
         "企画ID": {
           status: "normal",
           score: 50,
           ...
         }
       }

     というオブジェクト形式。
     配列・data/events/crowd/resultsにも対応。
  ========================================= */
  function getCrowdRecord(
    crowdData,
    targetId
  ){

    const id =
      normalizeId(targetId);

    if(!crowdData || !id){
      return null;
    }

    const containers = [
      crowdData,
      crowdData.data,
      crowdData.events,
      crowdData.crowd,
      crowdData.results
    ];

    for(const container of containers){

      if(!container){
        continue;
      }

      /* 配列形式 */
      if(Array.isArray(container)){

        const found =
          container.find(item => {

            if(
              !item ||
              typeof item !== "object"
            ){
              return false;
            }

            const itemId =
              normalizeId(
                item.id ??
                item.eventId ??
                item.event_id ??
                item.modalId ??
                item.modal_id ??
                item.key
              );

            return itemId === id;
          });

        if(found){
          return found;
        }

        continue;
      }

      /* オブジェクト形式 */
      if(typeof container === "object"){

        if(
          Object.prototype.hasOwnProperty.call(
            container,
            targetId
          )
        ){
          return container[targetId];
        }

        if(
          Object.prototype.hasOwnProperty.call(
            container,
            id
          )
        ){
          return container[id];
        }

        const foundKey =
          Object.keys(container).find(
            key =>
              normalizeId(key) === id
          );

        if(foundKey !== undefined){
          return container[foundKey];
        }
      }
    }

    return null;
  }


  /* =========================================
     混雑レイヤーを必ず作る
  ========================================= */
  function setupCrowdLayers(){

    document
      .querySelectorAll(".map-hotspot")
      .forEach(hotspot => {

        let layer =
          hotspot.querySelector(
            ":scope > .crowd-visual-layer"
          );

        if(!layer){

          layer =
            document.createElement("span");

          layer.className =
            "crowd-visual-layer";

          layer.setAttribute(
            "aria-hidden",
            "true"
          );

          hotspot.appendChild(layer);
        }

        /* CSS競合があっても必ずレイヤーとして表示できるようにする */
        layer.style.position = "absolute";
        layer.style.inset = "0";
        layer.style.display = "block";
        layer.style.pointerEvents = "none";
        layer.style.boxSizing = "border-box";
        layer.style.borderRadius = "inherit";
        layer.style.zIndex = "2";

      });
  }


  /* =========================================
     色を直接設定

     CSS classだけでは他のCSSに上書きされる
     可能性があるため、ここでinline styleも設定。
  ========================================= */
  function setCrowdLayerColor(
    layer,
    status
  ){

    if(!layer){
      return;
    }

    const safeStatus =
      normalizeCrowdStatus(status);

    let background = "transparent";
    let border = "1px solid transparent";

    if(safeStatus === "empty"){

      background =
        "rgba(79,157,105,0.34)";

      border =
        "1px solid rgba(79,157,105,0.55)";

    }else if(safeStatus === "normal"){

      background =
        "rgba(215,168,61,0.34)";

      border =
        "1px solid rgba(215,168,61,0.55)";

    }else if(safeStatus === "crowded"){

      background =
        "rgba(212,91,88,0.34)";

      border =
        "1px solid rgba(212,91,88,0.55)";
    }

    layer.style.setProperty(
      "background",
      background,
      "important"
    );

    layer.style.setProperty(
      "border",
      border,
      "important"
    );

    layer.style.setProperty(
      "opacity",
      crowdDisplayEnabled ? "1" : "0",
      "important"
    );

    layer.style.setProperty(
      "visibility",
      crowdDisplayEnabled ? "visible" : "hidden",
      "important"
    );

    layer.style.setProperty(
      "pointer-events",
      "none",
      "important"
    );
  }


  /* =========================================
     ホットスポットへ状態を反映
  ========================================= */
  function applyCrowdVisual(
    hotspot,
    status
  ){

    if(!hotspot){
      return;
    }

    const safeStatus =
      normalizeCrowdStatus(status);

    hotspot.dataset.crowdStatus =
      safeStatus;

    hotspot.classList.remove(
      "crowd-empty",
      "crowd-normal",
      "crowd-crowded",
      "crowd-unknown",
      "crowd-visible"
    );

    hotspot.classList.add(
      "crowd-" + safeStatus
    );

    const layer =
      hotspot.querySelector(
        ":scope > .crowd-visual-layer"
      );

    setCrowdLayerColor(
      layer,
      safeStatus
    );

    if(crowdDisplayEnabled){
      hotspot.classList.add(
        "crowd-visible"
      );
    }
  }


  /* =========================================
     表示ON/OFF
  ========================================= */
  function getToggleButton(){

    return document.getElementById(
      "crowdToggleButton"
    );
  }


  function updateToggleButton(){

    const button =
      getToggleButton();

    if(!button){
      return;
    }

    button.classList.toggle(
      "off",
      !crowdDisplayEnabled
    );

    button.setAttribute(
      "aria-pressed",
      String(crowdDisplayEnabled)
    );

    button.innerHTML =
      '<span class="crowd-toggle-dot"></span>' +
      (
        crowdDisplayEnabled
          ? "混雑表示：ON"
          : "混雑表示：OFF"
      );
  }


  function refreshCrowdVisibility(){

    document
      .querySelectorAll(".map-hotspot")
      .forEach(hotspot => {

        applyCrowdVisual(
          hotspot,
          hotspot.dataset.crowdStatus ||
            "unknown"
        );
      });

    updateToggleButton();
  }


  /* =========================================
     events.htmlから正式な企画IDを取得

     crowd.html自身もevents.htmlの
     data-modal-idを企画IDとして使っている。
     ここを1棟マップでも利用する。
  ========================================= */
  async function loadEventsIdMap(){

    if(eventsIdMap !== null){
      return eventsIdMap;
    }

    eventsIdMap = new Map();

    try{

      const response =
        await fetch(
          "events.html?_=" + Date.now(),
          {
            cache:"no-store"
          }
        );

      if(!response.ok){
        return eventsIdMap;
      }

      const html =
        await response.text();

      const parser =
        new DOMParser();

      const doc =
        parser.parseFromString(
          html,
          "text/html"
        );

      doc
        .querySelectorAll(
          ".card"
        )
        .forEach(card => {

          const id =
            card.dataset.modalId || "";

          if(!id){
            return;
          }

          const titleElement =
            card.querySelector(
              ".card-title"
            );

          const title =
            titleElement
              ? titleElement.textContent.trim()
              : "";

          const text =
            card.textContent.trim();

          const normalizedId =
            normalizeId(id);

          eventsIdMap.set(
            normalizedId,
            normalizedId
          );

          if(title){
            eventsIdMap.set(
              normalizeText(title),
              normalizedId
            );
          }

          if(text){
            eventsIdMap.set(
              normalizeText(text),
              normalizedId
            );
          }
        });

    }catch(error){

      console.warn(
        "events.htmlの企画ID取得に失敗しました",
        error
      );
    }

    return eventsIdMap;
  }


  /* =========================================
     ホットスポット → crowd API ID候補
  ========================================= */
  function getHotspotIdCandidates(
    hotspot
  ){

    const rawType =
      hotspot.dataset.modalType || "";

    const candidates = [];

    function add(value){

      const id =
        normalizeId(value);

      if(id && !candidates.includes(id)){
        candidates.push(id);
      }
    }

    add(rawType);

    /* 1Eの2つ目のクリック範囲も同じ企画 */
    if(
      rawType === "room-1e" ||
      hotspot.classList.contains(
        "room-1e-second"
      ) ||
      hotspot.classList.contains(
        "room-1e-right"
      )
    ){
      add("room-1e");
    }

    /* 表記ゆれ用 */
    const aliases = {
      "ten-yen-bread":[
        "ten-yen-bread",
        "tenyen-bread",
        "10yen-bread"
      ],
      "special-support":[
        "special-support"
      ],
      "room-1c":[
        "room-1c",
        "1c"
      ],
      "room-2f":[
        "room-2f",
        "2f"
      ],
      "room-1f":[
        "room-1f",
        "1f"
      ],
      "room-ssh":[
        "room-ssh",
        "ssh"
      ],
      "room-3e":[
        "room-3e",
        "3e"
      ],
      "room-3f":[
        "room-3f",
        "3f"
      ],
      "room-1e":[
        "room-1e",
        "1e"
      ],
      "room-3b":[
        "room-3b",
        "3b"
      ],
      "room-2e":[
        "room-2e",
        "2e"
      ],
      "room-3g":[
        "room-3g",
        "3g"
      ],
      "room-1a":[
        "room-1a",
        "1a"
      ],
      "room-2a":[
        "room-2a",
        "2a"
      ],
      "room-3a":[
        "room-3a",
        "3a"
      ],
      "room-2d":[
        "room-2d",
        "2d"
      ],
      "room-3d":[
        "room-3d",
        "3d"
      ],
      "room-jrc":[
        "room-jrc",
        "jrc"
      ],
      "room-2c":[
        "room-2c",
        "2c"
      ],
      "room-1b":[
        "room-1b",
        "1b"
      ],
      "room-2b":[
        "room-2b",
        "2b"
      ],
      "room-ess":[
        "room-ess",
        "ess"
      ],
      "room-2g":[
        "room-2g",
        "2g"
      ],
      "room-1g":[
        "room-1g",
        "1g"
      ],
      "room-3c":[
        "room-3c",
        "3c"
      ],
      "room-bungei":[
        "room-bungei",
        "bungei"
      ],
      "room-shodo":[
        "room-shodo",
        "shodo"
      ]
    };

    if(aliases[rawType]){
      aliases[rawType].forEach(add);
    }

    /* 体育館を使う場合の共通ID */
    if(
      rawType === "gymnasium" ||
      rawType === "gymnasium-performance"
    ){
      add("gymnasium-performance");
    }

    return candidates;
  }


  /* =========================================
     APIの全キーから「似たID」を探す

     直接一致しない場合の最後の保険。
  ========================================= */
  function findMatchingApiRecord(
    crowdData,
    hotspot
  ){

    const candidates =
      getHotspotIdCandidates(
        hotspot
      );

    /* まず完全一致 */
    for(const candidate of candidates){

      const record =
        getCrowdRecord(
          crowdData,
          candidate
        );

      if(record !== null){
        return record;
      }
    }

    /* APIを各コンテナについて走査 */
    const containers = [
      crowdData,
      crowdData?.data,
      crowdData?.events,
      crowdData?.crowd,
      crowdData?.results
    ];

    for(const container of containers){

      if(
        !container ||
        Array.isArray(container) ||
        typeof container !== "object"
      ){
        continue;
      }

      for(const key of Object.keys(container)){

        const normalizedKey =
          normalizeId(key);

        if(
          candidates.includes(
            normalizedKey
          )
        ){
          return container[key];
        }
      }
    }

    return null;
  }


  /* =========================================
     タイトルによる最終照合
  ========================================= */
  function findRecordByTitle(
    crowdData,
    hotspot
  ){

    if(!eventsIdMap || !eventsIdMap.size){
      return null;
    }

    const titleCandidates = [];

    const title =
      hotspot.getAttribute("title") || "";

    const aria =
      hotspot.getAttribute("aria-label") || "";

    if(title){
      titleCandidates.push(
        normalizeText(title)
      );
    }

    if(aria){
      titleCandidates.push(
        normalizeText(aria)
      );
    }

    for(
      const titleCandidate
        of titleCandidates
    ){

      const mappedId =
        eventsIdMap.get(
          titleCandidate
        );

      if(mappedId){

        const record =
          getCrowdRecord(
            crowdData,
            mappedId
          );

        if(record !== null){
          return record;
        }
      }
    }

    /* 部分一致 */
    for(
      const [key, mappedId]
      of eventsIdMap.entries()
    ){

      if(!key || !mappedId){
        continue;
      }

      for(
        const titleCandidate
          of titleCandidates
      ){

        if(
          key.includes(titleCandidate) ||
          titleCandidate.includes(key)
        ){

          const record =
            getCrowdRecord(
              crowdData,
              mappedId
            );

          if(record !== null){
            return record;
          }
        }
      }
    }

    return null;
  }


  /* =========================================
     全ホットスポットへAPI状態を反映
  ========================================= */
  async function applyCrowdData(
    crowdData
  ){

    const hotspots =
      Array.from(
        document.querySelectorAll(
          ".map-hotspot"
        )
      );

    if(!hotspots.length){
      return;
    }

    /* ID照合用のevents.html情報を準備 */
    await loadEventsIdMap();

    hotspots.forEach(hotspot => {

      let record =
        findMatchingApiRecord(
          crowdData,
          hotspot
        );

      /* 直接IDが合わない場合はtitleから照合 */
      if(record === null){

        record =
          findRecordByTitle(
            crowdData,
            hotspot
          );
      }

      let status =
        getStatusFromRecord(record);

      /*
        APIに該当データがない場合は
        unknownにする。
        ただし通信エラーではなく正常取得なので、
        実際にAPIに存在しない企画だけunknown。
      */
      if(record === null){
        status = "unknown";
      }

      applyCrowdVisual(
        hotspot,
        status
      );
    });

    refreshCrowdVisibility();
  }


  /* =========================================
     最新API取得
  ========================================= */
  async function loadCrowdMapStatus(){

    setupCrowdLayers();

    if(crowdRequestController){

      try{
        crowdRequestController.abort();
      }catch(error){
        /* no-op */
      }
    }

    crowdRequestController =
      new AbortController();

    const url =
      CROWD_API_URL +
      CROWD_API_PATH +
      "?_=" +
      Date.now();

    try{

      const response =
        await fetch(
          url,
          {
            method:"GET",
            cache:"no-store",
            signal:
              crowdRequestController.signal,
            headers:{
              "Accept":"application/json",
              "Cache-Control":"no-cache"
            }
          }
        );

      if(!response.ok){
        throw new Error(
          "HTTP " +
          response.status
        );
      }

      const crowdData =
        await response.json();

      if(
        !crowdData ||
        typeof crowdData !== "object"
      ){
        throw new Error(
          "混雑情報の形式が正しくありません"
        );
      }

      console.log(
        "1棟マップ：最新の混雑情報",
        crowdData
      );

      await applyCrowdData(
        crowdData
      );

    }catch(error){

      if(
        error &&
        error.name === "AbortError"
      ){
        return;
      }

      console.error(
        "1棟マップの混雑情報取得に失敗しました",
        error
      );

      /*
        通信失敗時は既存の色を維持する。
        API障害だけで全てunknownへ戻さない。
      */
      refreshCrowdVisibility();
    }
  }


  /* =========================================
     ON/OFFボタン
  ========================================= */
  function setupCrowdToggle(){

    const button =
      getToggleButton();

    if(!button){
      return;
    }

    if(button.dataset.crowdToggleReady === "true"){
      updateToggleButton();
      return;
    }

    button.dataset.crowdToggleReady =
      "true";

    button.addEventListener(
      "click",
      function(event){

        event.preventDefault();
        event.stopPropagation();

        crowdDisplayEnabled =
          !crowdDisplayEnabled;

        localStorage.setItem(
          CROWD_STORAGE_KEY,
          String(
            crowdDisplayEnabled
          )
        );

        refreshCrowdVisibility();
      }
    );

    updateToggleButton();
  }


  /* =========================================
     初期化
  ========================================= */
  function setup(){

    setupCrowdLayers();

    setupCrowdToggle();

    refreshCrowdVisibility();

    /* 初回は即時取得 */
    loadCrowdMapStatus();

    /* crowd.htmlと同じ15秒間隔 */
    setInterval(
      loadCrowdMapStatus,
      CROWD_REFRESH_MS
    );

    /* タブ復帰時 */
    document.addEventListener(
      "visibilitychange",
      function(){

        if(
          document.visibilityState ===
          "visible"
        ){
          loadCrowdMapStatus();
        }
      }
    );

    /* ネットワーク復帰時 */
    window.addEventListener(
      "online",
      function(){
        loadCrowdMapStatus();
      }
    );
  }


  if(
    document.readyState ===
    "loading"
  ){

    document.addEventListener(
      "DOMContentLoaded",
      setup,
      {once:true}
    );

  }else{

    setup();
  }

})();
</script>
