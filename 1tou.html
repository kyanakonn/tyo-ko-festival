<title>1棟 フロアマップ</title>

<style>

/* =========================================
   全体
========================================= */

html,
body {
  width: 100%;
  min-width: 0;
  min-height: 100%;

  margin: 0;
  padding: 0;

  overflow-x: hidden;
  overflow-y: auto;

  background-color: #eeedeb !important;
  color: black;

  font-family: sans-serif;

  overscroll-behavior-x: none;
}


/* =========================================
   背景
   TOPページと統一
========================================= */

.bg-shapes {
  position: fixed !important;

  inset: 0;

  width: 100%;
  height: 100%;

  z-index: 0 !important;

  pointer-events: none;

  overflow: hidden;

  /* TOPページと同じように透けて表示 */
  opacity: 0.24 !important;

  /* 背景として少し馴染ませる */
  filter: blur(1px);

  transform: translateZ(0);
}


/* 背景図形 */

.bg-shapes .shape {
  display: block !important;

  position: absolute;
}


/* =========================================
   三角形
========================================= */

.s1 {
  top: 5%;
  left: -50px;

  width: 0;
  height: 0;

  border-left: 90px solid transparent;
  border-right: 90px solid transparent;
  border-bottom: 170px solid #c96d80;

  transform: rotate(-25deg);
}

.s2 {
  top: 25%;
  left: -35px;

  width: 0;
  height: 0;

  border-left: 70px solid transparent;
  border-right: 70px solid transparent;
  border-bottom: 130px solid #8870a8;

  transform: rotate(20deg);
}

.s3 {
  bottom: 5%;
  left: -30px;

  width: 0;
  height: 0;

  border-left: 100px solid transparent;
  border-right: 100px solid transparent;
  border-bottom: 180px solid #cfb25a;

  transform: rotate(12deg);
}

.s4 {
  bottom: 28%;
  left: 20px;

  width: 0;
  height: 0;

  border-left: 60px solid transparent;
  border-right: 60px solid transparent;
  border-bottom: 120px solid #65a6ae;

  transform: rotate(-15deg);
}

.s5 {
  top: 12%;
  right: -80px;

  width: 0;
  height: 0;

  border-left: 150px solid transparent;
  border-right: 150px solid transparent;
  border-bottom: 260px solid #6aa8ad;

  transform: rotate(30deg);
}

.s6 {
  bottom: -40px;
  right: -30px;

  width: 0;
  height: 0;

  border-left: 100px solid transparent;
  border-right: 100px solid transparent;
  border-bottom: 190px solid #c96d80;

  transform: rotate(-15deg);
}

.s7 {
  top: 8%;
  right: 40px;

  width: 0;
  height: 0;

  border-left: 55px solid transparent;
  border-right: 55px solid transparent;
  border-bottom: 100px solid #8870a8;

  transform: rotate(35deg);
}

.s8 {
  bottom: 20%;
  right: 40px;

  width: 0;
  height: 0;

  border-left: 70px solid transparent;
  border-right: 70px solid transparent;
  border-bottom: 130px solid #cfb25a;

  transform: rotate(-20deg);
}


/* =========================================
   四角形
========================================= */

.bg-shapes::before,
.bg-shapes::after {
  content: "";

  position: absolute;

  display: block;
}


.bg-shapes::before {
  width: 85px;
  height: 150px;

  left: 7%;
  top: 45%;

  background: #a57999;

  transform: rotate(28deg);
}


.bg-shapes::after {
  width: 110px;
  height: 70px;

  right: 4%;
  top: 55%;

  background: #65a0a8;

  transform: rotate(-20deg);
}


/* =========================================
   追加四角形
========================================= */

.s9 {
  top: 38%;
  left: 12%;

  width: 90px;
  height: 55px;

  background: #c87382;

  transform: rotate(-18deg);
}


.s10 {
  top: 70%;
  left: 18%;

  width: 65px;
  height: 100px;

  background: #766990;

  transform: rotate(25deg);
}


.s11 {
  top: 32%;
  right: 15%;

  width: 75px;
  height: 75px;

  background: #c8a75a;

  transform: rotate(18deg);
}


.s12 {
  bottom: 10%;
  right: 20%;

  width: 100px;
  height: 55px;

  background: #609da4;

  transform: rotate(-30deg);
}


/* =========================================
   ヘッダー
========================================= */

#header {
  position: relative;
  z-index: 100;
}


/* =========================================
   フロアマップ画面
========================================= */

.floor-page {
  position: relative;

  top: auto;
  left: auto;

  width: 100%;
  max-width: 100%;

  min-height: calc(100vh - 80px);

  overflow: visible;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  touch-action: pan-y;

  background: transparent !important;

  z-index: 1;
}


/* =========================================
   マップ表示エリア
========================================= */

.map-view {
  position: relative;

  width: 100%;
  max-width: 100%;

  min-height: calc(100vh - 80px);

  height: auto;

  padding-top: 92px;
  padding-bottom: 80px;

  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;

  overflow: visible;

  touch-action: pan-y;

  background: transparent !important;

  box-sizing: border-box;
}


/* =========================================
   マップ画像
========================================= */

.map-image-wrapper {
  position: relative;

  max-width: 90vw;
  max-height: 75vh;

  display: flex;
  align-items: center;
  justify-content: center;

  transform-origin: center center;

  touch-action: pan-y;

  user-select: none;
  -webkit-user-select: none;

  flex-shrink: 0;

  cursor: default;

  will-change: transform;

  margin: 0 auto;
}


.map-image {
  display: block;

  max-width: 90vw;
  max-height: 75vh;

  width: auto;
  height: auto;

  object-fit: contain;

  user-select: none;
  -webkit-user-drag: none;
  -webkit-user-select: none;

  pointer-events: none;
}


/* =========================================
   上部ボタンエリア
========================================= */

.top-controls {
  position: absolute;

  top: 12px;
  left: 50%;

  transform: translateX(-50%);

  display: flex;
  align-items: center;
  justify-content: center;

  gap: 8px;

  z-index: 50;

  white-space: nowrap;
}


/* =========================================
   全体図に戻るボタン
========================================= */

.back-to-map {
  appearance: none;
  border: 2px solid rgba(36,36,42,.12);
  background: #fff;
  color: #555;
  padding: 8px 14px;
  border-radius: 0;
  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  cursor: pointer;
  box-shadow: 4px 4px 0 rgba(0,0,0,.09);
  -webkit-tap-highlight-color: transparent;
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease, color .18s ease;
}

.back-to-map:hover {
  transform: translate(-1px,-1px);
  background: #fff;
  box-shadow: 6px 6px 0 rgba(0,0,0,.09);
}

.back-to-map:active {
  transform: translate(2px,2px);
  box-shadow: 2px 2px 0 rgba(0,0,0,.09);
  opacity: 1;
}


/* =========================================
   操作説明ボタン
========================================= */

.help-button {
  appearance: none;
  border: 2px solid #65a6ae;
  background: #65a6ae;
  color: #fff;
  padding: 8px 14px;
  border-radius: 0;
  font-family: inherit;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.02em;
  white-space: nowrap;
  cursor: pointer;
  box-shadow: 4px 4px 0 rgba(0,0,0,.09);
  -webkit-tap-highlight-color: transparent;
  transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
}

.help-button:hover {
  transform: translate(-1px,-1px);
  background: #5b969d;
  box-shadow: 6px 6px 0 rgba(0,0,0,.09);
}

.help-button:active {
  transform: translate(2px,2px);
  box-shadow: 2px 2px 0 rgba(0,0,0,.09);
  opacity: 1;
}

/* =========================================
   左右ボタン
========================================= */

.floor-arrow {
  position: absolute;

  top: 0;

  transform: translateY(-50%);

  width: 48px;
  height: 80px;

  border: none;

  background: transparent;

  font-size: 52px;
  line-height: 1;

  color: #d92a21;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  z-index: 30;

  padding: 0;

  text-shadow: none;

  -webkit-tap-highlight-color: transparent;
}

.floor-arrow:active {
  opacity: 0.5;
}

.floor-prev {
  left: 4px;
}

.floor-next {
  right: 4px;

  color: #d92a21;
}


/* =========================================
   棟切り替えボタン
========================================= */

.building-switch {
  position: absolute;

  left: 50%;
  top: 100%;

  transform: translateX(-50%) rotate(180deg);

  width: 48px;
  height: 50px;

  border: none;

  background: transparent;

  color: #15929e;

  font-size: 52px;
  line-height: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  z-index: 40;

  padding: 0;

  border-radius: 0;

  text-shadow: none;

  -webkit-tap-highlight-color: transparent;
}

.building-switch:active {
  opacity: 0.5;
}


/* =========================================
   操作説明モーダル
========================================= */

.help-overlay {

  position: fixed;

  inset: 0;

  z-index: 1000;

  display: none;

  align-items: center;
  justify-content: center;

  padding: 20px;

  background: rgba(6, 37, 79, 0.55);

  backdrop-filter: blur(5px);

  -webkit-backdrop-filter: blur(5px);
}

.help-overlay.active {
  display: flex;
}


/* =========================================
   操作説明本体
========================================= */

.help-modal {

  position: relative;

  width: min(430px, 92vw);

  max-height: 82vh;

  overflow-y: auto;

  background: #eeedeb;

  border-radius: 18px;

  padding: 24px 20px 20px;

  box-shadow: 0 15px 40px rgba(0,0,0,0.25);

  border-top: 7px solid #06254f;

  box-sizing: border-box;
}


/* =========================================
   モーダルタイトル
========================================= */

.help-title {

  margin: 0 35px 5px 0;

  color: #06254f;

  font-size: 23px;

  font-weight: 800;

  letter-spacing: 0.05em;
}


.help-subtitle {

  margin: 0 0 18px;

  color: #555;

  font-size: 13px;

  font-weight: 600;
}


/* =========================================
   操作項目
========================================= */

.help-item {

  display: flex;

  align-items: center;

  gap: 13px;

  margin-bottom: 10px;

  padding: 11px 12px;

  background: #fff;

  border-radius: 10px;

  border-left: 5px solid #15929e;

  box-sizing: border-box;
}


.help-icon {

  width: 34px;
  min-width: 34px;
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 21px;

  border-radius: 8px;

  background: #eeedeb;
}


/* =========================================
   赤い文字タップアイコン
========================================= */

.help-icon.gesture-red-square {

  width: 34px;
  min-width: 34px;
  height: 34px;

  background: #d92a21;

  border-radius: 8px;

  font-size: 0;
}


/* =========================================
   2本指アイコン部分
========================================= */

.help-icon.gesture-square {

  width: 34px;
  min-width: 34px;
  height: 34px;

  background: #ff9d1c;

  border-radius: 8px;

  font-size: 0;
}


/* =========================================
   1本指移動アイコン部分
========================================= */

.help-icon.gesture-pan-square {

  width: 34px;
  min-width: 34px;
  height: 34px;

  background: #15929e;

  border-radius: 8px;

  font-size: 0;
}


/* =========================================
   操作説明テキスト
========================================= */

.help-text {

  color: #222;

  font-size: 13px;

  line-height: 1.55;

  font-weight: 600;
}


.help-text strong {

  color: #06254f;

  font-size: 14px;
}


/* =========================================
   閉じるボタン
========================================= */

.help-close {

  width: 100%;

  margin-top: 8px;

  border: none;

  border-radius: 9px;

  padding: 11px;

  background: #06254f;

  color: #fff;

  font-size: 15px;

  font-weight: 700;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.help-close:active {
  opacity: 0.65;
}


/* =========================================
   モーダル右上閉じる
========================================= */

.help-x {

  position: absolute;

  top: 13px;
  right: 14px;

  width: 32px;
  height: 32px;

  border: none;

  border-radius: 50%;

  background: #d92a21;

  color: #fff;

  font-size: 19px;

  line-height: 1;

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  -webkit-tap-highlight-color: transparent;
}

.help-x:active {
  opacity: 0.65;
}


/* =========================================
   スマートフォン
========================================= */

@media (max-width: 600px) {

  .floor-page {

    width: 100%;
    max-width: 100%;

    min-height: 0;

    overflow: visible;
  }


  .map-view {

    width: 100%;
    max-width: 100%;

    min-height: 0;

    height: auto;

    padding-top: 115px;

    padding-bottom: 52px;

    justify-content: flex-start;

    overflow: visible;
  }


  .map-image {

    max-width: 82vw;
    max-height: 68vh;
  }


  .map-image-wrapper {

    max-width: 82vw;
    max-height: 68vh;

    position: relative;

    left: auto;
    top: auto;

    transform: none;

    width: auto;
    height: auto;

    margin: 0 auto;
  }


  /* -------------------------
     上部ボタン
  ------------------------- */

  .top-controls {

    top: 58px;

    gap: 5px;
  }


  .back-to-map,
  .help-button {

    font-size: 12px;

    padding: 7px 9px;

    border-radius: 0;
  }


  /* -------------------------
     左右矢印
  ------------------------- */

  .floor-arrow {

    width: 40px;
    height: 70px;

    font-size: 44px;

    top: 0;

    color: #d92a21;
  }

  .floor-prev {
    left: 0;
  }

  .floor-next {
    right: 0;

    color: #d92a21;
  }


  /* -------------------------
     棟切り替え
  ------------------------- */

  .building-switch {

    width: 40px;
    height: 50px;

    font-size: 44px;

    top: 100%;
  }


  /* -------------------------
     操作説明
  ------------------------- */

  .help-overlay {
    padding: 15px;
  }


  .help-modal {

    width: 94vw;

    max-height: 84vh;

    padding: 21px 16px 16px;

    border-radius: 16px;

    border-top-width: 6px;
  }


  .help-title {
    font-size: 20px;
  }


  .help-subtitle {
    font-size: 12px;

    margin-bottom: 14px;
  }


  .help-item {
    gap: 10px;

    margin-bottom: 8px;

    padding: 9px 10px;

    border-left-width: 4px;
  }


  .help-icon {

    width: 31px;
    min-width: 31px;
    height: 31px;

    font-size: 18px;
  }


  .help-icon.gesture-red-square {

    width: 31px;
    min-width: 31px;
    height: 31px;

    background: #d92a21;

    border-radius: 7px;
  }


  .help-icon.gesture-square {

    width: 31px;
    min-width: 31px;
    height: 31px;

    background: #ff9d1c;

    border-radius: 7px;
  }


  .help-icon.gesture-pan-square {

    width: 31px;
    min-width: 31px;
    height: 31px;

    background: #15929e;

    border-radius: 7px;
  }


  .help-text {
    font-size: 12px;
  }


  .help-text strong {
    font-size: 13px;
  }


  /* -------------------------
     背景
     TOPページと同じように
     スマホではさらに控えめ
  ------------------------- */

  .bg-shapes {

    width: 100%;
    height: 100%;

    opacity: 0.18 !important;

    filter: blur(1px);
  }

}


/* =========================================
   極端に狭い画面への対応
========================================= */

@media (max-width: 360px) {

  .map-view {
    padding-top: 135px;
  }

  .top-controls {
    top: 52px;
  }

  .back-to-map,
  .help-button {
    font-size: 11px;
    padding: 6px 8px;
  }

}


/* =========================================
   横向きスマートフォン
========================================= */

@media screen and (max-width: 900px) and (orientation: landscape) {

  .map-view {

    padding-top: 100px;
    padding-bottom: 60px;

  }


  .top-controls {

    top: 48px;

  }


  .map-image {

    max-width: 80vw;
    max-height: 72vh;

  }


  .map-image-wrapper {

    max-width: 80vw;
    max-height: 72vh;

  }

}

========================================= */

.crowd-status-panel {
  width: min(94%, 760px);
  margin: 10px auto 40px;
  padding: 0;
  box-sizing: border-box;
  background: transparent;
}
.crowd-status-title {
  margin: 0 0 12px;
  padding: 10px 14px;
  text-align: left;
  color: #24242a;
  font-size: 18px;
  font-weight: 900;
  letter-spacing: .05em;
  border-left: 5px solid #d92a21;
  background: rgba(255,255,255,.82);
  box-shadow: 3px 3px 0 rgba(0,0,0,.06);
}
.crowd-status-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  margin: 0 0 10px;
  padding: 0 2px;
  color: #55555c;
  font-size: 11px;
  font-weight: 700;
}
.crowd-status-legend-item { display:flex; align-items:center; gap:6px; white-space:nowrap; }
.crowd-status-legend-dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
.crowd-status-legend-dot.empty { background:rgba(79,157,105,.72); }
.crowd-status-legend-dot.normal { background:rgba(215,168,61,.78); }
.crowd-status-legend-dot.crowded { background:rgba(212,91,88,.78); }
.crowd-status-list {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:7px 9px;
}
.crowd-status-item {
  position:relative;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  min-height:52px;
  padding:8px 10px 8px 15px;
  box-sizing:border-box;
  background:rgba(255,255,255,.88);
  border:1px solid rgba(36,36,42,.10);
  border-left:6px solid rgba(120,120,120,.28);
  box-shadow:2px 2px 0 rgba(0,0,0,.045);
  overflow:hidden;
}
.crowd-status-item::after {
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:6px;
  opacity:.95;
}
.crowd-status-name { min-width:0; color:#29292f; font-size:12px; font-weight:900; line-height:1.4; }
.crowd-status-badge {
  position:relative;
  flex:0 0 auto;
  display:inline-flex;
  align-items:center;
  gap:5px;
  min-width:76px;
  justify-content:center;
  padding:6px 9px;
  border-radius:999px;
  font-size:9px;
  font-weight:900;
  letter-spacing:.03em;
  white-space:nowrap;
}
.crowd-status-badge::before {
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:currentColor;
  box-shadow:0 0 0 2px rgba(255,255,255,.65);
}
.crowd-status-item:has(.crowd-status-badge.empty)::after { background:#4f9d69; }
.crowd-status-item:has(.crowd-status-badge.normal)::after { background:#d7a83d; }
.crowd-status-item:has(.crowd-status-badge.crowded)::after { background:#d45b58; }
.crowd-status-item:has(.crowd-status-badge.unknown)::after { background:#999; }
.crowd-status-badge.empty { color:#356f49; background:rgba(79,157,105,.20); border:1px solid rgba(79,157,105,.45); }
.crowd-status-badge.normal { color:#80631b; background:rgba(215,168,61,.23); border:1px solid rgba(215,168,61,.48); }
.crowd-status-badge.crowded { color:#9a3f3b; background:rgba(212,91,88,.22); border:1px solid rgba(212,91,88,.48); }
.crowd-status-badge.unknown { color:#666; background:rgba(100,100,100,.10); border:1px solid rgba(100,100,100,.22); }
.crowd-status-empty-message { padding:14px; background:rgba(255,255,255,.78); color:#666; text-align:center; font-size:11px; font-weight:700; }
@media (max-width:600px) {
  .crowd-status-panel { width:calc(100% - 20px); margin:4px auto 28px; }
  .crowd-status-title { margin-bottom:9px; padding:8px 11px; font-size:15px; border-left-width:4px; }
  .crowd-status-legend { gap:6px 11px; margin-bottom:8px; font-size:9px; }
  .crowd-status-list { grid-template-columns:1fr; gap:5px; }
  .crowd-status-item { min-height:47px; padding:7px 8px 7px 14px; border-left-width:5px; }
  .crowd-status-item::after { width:5px; }
  .crowd-status-name { font-size:11px; }
  .crowd-status-badge { min-width:72px; padding:5px 7px; font-size:8px; }
  .crowd-status-badge::before { width:6px; height:6px; }
}

<script>

/* =========================================
   1棟 フロア設定
========================================= */

const floors = [

  {
    name: "1棟 1階",
    image: "images/1tou_1f.jpg"
  },

  {
    name: "1棟 2階",
    image: "images/1tou_2f.jpg"
  },

  {
    name: "1棟 3階",
    image: "images/1tou_3f.jpg"
  },

  {
    name: "1棟 4階",
    image: "images/1tou_4f.jpg"
  }

];


let currentFloor = 0;


/* =========================================
   要素
========================================= */

const floorImage =
  document.getElementById("floorImage");

const prevButton =
  document.getElementById("prevButton");

const nextButton =
  document.getElementById("nextButton");

const buildingSwitch =
  document.getElementById("buildingSwitch");

const imageWrapper =
  document.getElementById("imageWrapper");

const backToMap =
  document.getElementById("backToMap");

const mapView =
  document.querySelector(".map-view");


/* =========================================
   場所詳細モーダル
========================================= */

const placeModalOverlay =
  document.getElementById("placeModalOverlay");

const placeModalFrame =
  document.getElementById("placeModalFrame");

const mapHotspots =
  document.querySelectorAll(".map-hotspot");


function openPlaceModal(type) {

  if (!placeModalOverlay || !placeModalFrame) {
    return;
  }

  placeModalFrame.src =
    "modal2.html?type=" + encodeURIComponent(type);

  placeModalOverlay.classList.add("active");
  placeModalOverlay.setAttribute("aria-hidden", "false");

  document.body.style.overflow = "hidden";
}


function closePlaceModal() {

  if (!placeModalOverlay || !placeModalFrame) {
    return;
  }

  placeModalOverlay.classList.remove("active");
  placeModalOverlay.setAttribute("aria-hidden", "true");
  placeModalFrame.src = "about:blank";

  document.body.style.overflow = "";
}


mapHotspots.forEach((hotspot) => {

  hotspot.addEventListener("click", (e) => {

    e.preventDefault();
    e.stopPropagation();

    const type = hotspot.dataset.modalType;

    if (type) {
      openPlaceModal(type);
    }

  });

});


window.addEventListener("message", (e) => {

  if (e.source !== placeModalFrame?.contentWindow) {
    return;
  }

  if (e.data && e.data.type === "close-map-modal") {
    closePlaceModal();
  }

});


function updateHotspots() {

  mapHotspots.forEach((hotspot) => {

    const isFloor1Hotspot =
      hotspot.classList.contains("floor-1-hotspot");

    const isFloor2Hotspot =
      hotspot.classList.contains("floor-2-hotspot");

    const isFloor3Hotspot =
      hotspot.classList.contains("floor-3-hotspot");

    const isFloor4Hotspot =
      hotspot.classList.contains("floor-4-hotspot");

    if (isFloor1Hotspot) {
      hotspot.hidden = currentFloor !== 0;
      return;
    }

    if (isFloor2Hotspot) {
      hotspot.hidden = currentFloor !== 1;
      return;
    }

    if (isFloor3Hotspot) {
      hotspot.hidden = currentFloor !== 2;
      return;
    }

    if (isFloor4Hotspot) {
      hotspot.hidden = currentFloor !== 3;
      return;
    }

    hotspot.hidden = true;

  });

}


/* =========================================
   操作説明
========================================= */

const helpButton =
  document.getElementById("helpButton");

const helpOverlay =
  document.getElementById("helpOverlay");

const helpClose =
  document.getElementById("helpClose");

const helpX =
  document.getElementById("helpX");


const HELP_STORAGE_KEY =
  "choko_floor_map_help_shown";


function openHelp() {

  helpOverlay.classList.add("active");

}


function closeHelp() {

  helpOverlay.classList.remove("active");

  localStorage.setItem(
    HELP_STORAGE_KEY,
    "true"
  );

}


helpButton.addEventListener(
  "click",
  () => {

    openHelp();

  }
);


helpClose.addEventListener(
  "click",
  () => {

    closeHelp();

  }
);


helpX.addEventListener(
  "click",
  () => {

    closeHelp();

  }
);


helpOverlay.addEventListener(
  "click",
  (e) => {

    if (e.target === helpOverlay) {

      closeHelp();

    }

  }
);


if (
  localStorage.getItem(
    HELP_STORAGE_KEY
  ) !== "true"
) {

  setTimeout(
    () => {

      openHelp();

    },
    350
  );

}


/* =========================================
   ズーム・移動
========================================= */

let scale = 1;

let translateX = 0;
let translateY = 0;

let startDistance = 0;
let startScale = 1;

let startPanX = 0;
let startPanY = 0;

let startTouchX = 0;
let startTouchY = 0;

let startCenterX = 0;
let startCenterY = 0;

let isDragging = false;


function getDistance(touches) {

  const dx =
    touches[0].clientX -
    touches[1].clientX;

  const dy =
    touches[0].clientY -
    touches[1].clientY;

  return Math.sqrt(
    dx * dx + dy * dy
  );

}


function updateArrowPosition() {

  if (!imageWrapper) {
    return;
  }

  const imageTop =
    imageWrapper.offsetTop;

  const imageHeight =
    imageWrapper.offsetHeight;

  const centerY =
    imageTop + (imageHeight / 2);

  prevButton.style.top =
    centerY + "px";

  nextButton.style.top =
    centerY + "px";

}


function clampPosition() {

  const wrapperWidth =
    imageWrapper.offsetWidth;

  const wrapperHeight =
    imageWrapper.offsetHeight;


  const maxX =
    Math.max(
      0,
      (wrapperWidth * (scale - 1)) / 2
    );

  const maxY =
    Math.max(
      0,
      (wrapperHeight * (scale - 1)) / 2
    );


  translateX =
    Math.min(
      Math.max(translateX, -maxX),
      maxX
    );

  translateY =
    Math.min(
      Math.max(translateY, -maxY),
      maxY
    );

}


function updateTransform() {

  clampPosition();

  imageWrapper.style.transform =
    "translate3d(" +
    translateX +
    "px, " +
    translateY +
    "px, 0) scale(" +
    scale +
    ")";

}


function setZoom(value) {

  scale =
    Math.min(
      Math.max(value, 1),
      5
    );

  updateTransform();

}


function resetZoom() {

  scale = 1;

  translateX = 0;
  translateY = 0;

  imageWrapper.style.transform =
    "translate3d(0, 0, 0) scale(1)";

  updateArrowPosition();

}


function showFloor(index) {

  currentFloor =
    (index + floors.length) % floors.length;

  floorImage.src =
    floors[currentFloor].image;

  floorImage.alt =
    floors[currentFloor].name +
    " フロアマップ";

  resetZoom();
  updateHotspots();

}


/* =========================================
   URLで指定された階を最初に表示
   例：1tou.html?floor=2
========================================= */

(function initFloorFromURL() {

  const params =
    new URLSearchParams(window.location.search);

  const floor =
    Number(params.get("floor"));

  if (
    Number.isInteger(floor) &&
    floor >= 1 &&
    floor <= floors.length
  ) {
    showFloor(floor - 1);
  }

})();

    resetZoom();

    updateArrowPosition();

);


prevButton.addEventListener(

buildingSwitch.addEventListener(

    location.href = "2tou.html";

  }
);


imageWrapper.addEventListener(
  "touchstart",
  (e) => {

    if (e.touches.length === 2) {

      startDistance =
        getDistance(e.touches);

      startScale =
        scale;

      startPanX =
        translateX;

      startPanY =
        translateY;

      startCenterX =
        (
          e.touches[0].clientX +
          e.touches[1].clientX
        ) / 2;

      startCenterY =
        (
          e.touches[0].clientY +
          e.touches[1].clientY
        ) / 2;

      isDragging = false;

      return;

    }


    if (
      e.touches.length === 1 &&
      scale > 1
    ) {

      isDragging = true;

      startTouchX =
        e.touches[0].clientX;

      startTouchY =
        e.touches[0].clientY;

      startPanX =
        translateX;

      startPanY =
        translateY;

    }

  },
  { passive: false }
);


imageWrapper.addEventListener(
  "touchmove",
  (e) => {

    if (e.touches.length === 2) {

      e.preventDefault();

      const distance =
        getDistance(e.touches);

      if (startDistance > 0) {

        const ratio =
          distance / startDistance;

        scale =
          Math.min(
            Math.max(
              startScale * ratio,
              1
            ),
            5
          );

      }


      const centerX =
        (
          e.touches[0].clientX +
          e.touches[1].clientX
        ) / 2;

      const centerY =
        (
          e.touches[0].clientY +
          e.touches[1].clientY
        ) / 2;


      translateX =
        startPanX +
        (centerX - startCenterX);

      translateY =
        startPanY +
        (centerY - startCenterY);

      updateTransform();

      return;

    }


    if (
      e.touches.length === 1 &&
      isDragging &&
      scale > 1
    ) {

      e.preventDefault();

      const x =
        e.touches[0].clientX;

      const y =
        e.touches[0].clientY;

      translateX =
        startPanX +
        (x - startTouchX);

      translateY =
        startPanY +
        (y - startTouchY);

      updateTransform();

    }

  },
  { passive: false }
);


imageWrapper.addEventListener(
  "touchend",
  (e) => {

    if (e.touches.length === 0) {

      isDragging = false;

      startDistance = 0;

      startTouchX = 0;
      startTouchY = 0;

      startCenterX = 0;
      startCenterY = 0;

    }

  },
  { passive: false }
);


imageWrapper.addEventListener(
  "mousedown",
  (e) => {

    if (
      e.button !== 0 ||
      scale <= 1
    ) {
      return;
    }

    isDragging = true;

    startTouchX =
      e.clientX;

    startTouchY =
      e.clientY;

    startPanX =
      translateX;

    startPanY =
      translateY;

    imageWrapper.style.cursor =
      "grabbing";

    e.preventDefault();

  }
);


document.addEventListener(
  "mousemove",
  (e) => {

    if (
      !isDragging ||
      scale <= 1
    ) {
      return;
    }

    translateX =
      startPanX +
      (e.clientX - startTouchX);

    translateY =
      startPanY +
      (e.clientY - startTouchY);

    updateTransform();

  }
);


document.addEventListener(
  "mouseup",
  () => {

    if (isDragging) {

      isDragging = false;

      imageWrapper.style.cursor =
        scale > 1
          ? "grab"
          : "default";

    }

  }
);


imageWrapper.addEventListener(
  "wheel",
  (e) => {

    e.preventDefault();

    const delta =
      e.deltaY > 0
        ? -0.15
        : 0.15;

    setZoom(scale + delta);

    imageWrapper.style.cursor =
      scale > 1
        ? "grab"
        : "default";

  },
  { passive: false }
);


imageWrapper.style.cursor = "default";

updateHotspots();


window.addEventListener(
  "load",
  () => {

    updateArrowPosition();

  }
);


window.addEventListener(
  "resize",
  () => {

    if (scale > 1) {

      updateTransform();

    }

    updateArrowPosition();

  }
);

</script>




<script>
/* =========================================
   1棟フロアマップ 混雑状況一覧

   ・2棟と同じ一覧デザイン・表示方式
   ・crowd.html と同じ /api/crowd を使用
   ・15秒ごとに最新状態へ更新
   ・現在表示している階の企画だけを一覧表示
   ・マップ画像上への透過色表示は使用しない
   ・モーダルには混雑状況を表示しない
========================================= */
(() => {

  const API_URL =
    "https://chosei-fes.onrender.com/api/crowd";

  const REFRESH_MS = 15000;

  let crowdRequestInFlight = false;

  const floorStatusList =
    document.getElementById("crowdStatusList");

  const floorStatusTitle =
    document.getElementById("crowdStatusTitle");

  /* =========================================
     1棟 企画ID → ホットスポット
     既存の1棟マップ対応をそのまま使用
  ========================================= */

  const FIXED_CROWD_MAP = Object.freeze({
    "1d": ["ten-yen-bread"],

    "3g": ["room-3g"],
    "1a": ["room-1a"],
    "2a": ["room-2a"],
    "3a": ["room-3a"],
    "2d": ["room-2d"],
    "3d": ["room-3d"],
    "jrc": ["room-jrc"],

    "1c": ["room-1c", "room-1e-second"],
    "2f": ["room-2f"],
    "1f": ["room-1f"],
    "ssh": ["room-ssh"],
    "3e": ["room-3e"],
    "3f": ["room-3f"],
    "1e": ["room-1e", "room-1e-right"],
    "3b": ["room-3b"],

    "shodo": ["room-shodo"],
    "3c": ["room-3c"],
    "1g": ["room-1g"],
    "2g": ["room-2g"],
    "ess": ["room-ess"],
    "2b": ["room-2b"],
    "1b": ["room-1b"],
    "2c": ["room-2c"],
    "bungei": ["room-bungei"]
  });

  const HOTSPOT_TO_CROWD_ID = Object.freeze(
    Object.entries(FIXED_CROWD_MAP).reduce(
      (result, [crowdId, hotspotIds]) => {
        hotspotIds.forEach(hotspotId => {
          result[hotspotId] = crowdId;
        });
        return result;
      },
      {}
    )
  );

  const CROWD_ID_ALIASES = Object.freeze({
    "1d": ["1d"],
    "2e": ["2e"],
    "3g": ["3g"],
    "1a": ["1a"],
    "2a": ["2a"],
    "3a": ["3a"],
    "2d": ["2d"],
    "3d": ["3d"],
    "jrc": ["jrc"],
    "1c": ["1c"],
    "2f": ["2f"],
    "1f": ["1f"],
    "ssh": ["ssh"],
    "3e": ["3e"],
    "3f": ["3f"],
    "1e": ["1e"],
    "3b": ["3b"],
    "shodo": ["shodo"],
    "3c": ["3c"],
    "1g": ["1g"],
    "2g": ["2g"],
    "ess": ["ess"],
    "2b": ["2b"],
    "1b": ["1b"],
    "2c": ["2c"],
    "bungei": ["bungei"]
  });

  const STATUS_INFO = Object.freeze({
    empty: {
      text: "比較的空いている",
      className: "empty"
    },
    normal: {
      text: "やや混雑している",
      className: "normal"
    },
    crowded: {
      text: "混雑している",
      className: "crowded"
    },
    unknown: {
      text: "情報なし",
      className: "unknown"
    }
  });

  function normalizeId(value) {
    return String(value || "")
      .trim()
      .toLowerCase()
      .replace(/[\s_]+/g, "-");
  }

  function normalizeStatus(value) {
    const valueText = String(value || "")
      .trim()
      .toLowerCase();

    if ([
      "empty", "low", "free",
      "空", "空き", "空いている", "空いています",
      "比較的空いている"
    ].includes(valueText)) {
      return "empty";
    }

    if ([
      "normal", "medium", "moderate",
      "普通", "やや混雑", "やや混雑している"
    ].includes(valueText)) {
      return "normal";
    }

    if ([
      "crowded", "high", "busy",
      "混雑", "混雑している", "非常に混雑"
    ].includes(valueText)) {
      return "crowded";
    }

    return "unknown";
  }

  function scoreToStatus(score) {
    const number = Number(score);

    if (!Number.isFinite(number)) {
      return "unknown";
    }

    if (number < 34) {
      return "empty";
    }

    if (number < 67) {
      return "normal";
    }

    return "crowded";
  }

  function getStatus(record) {
    if (record == null) {
      return "unknown";
    }

    if (typeof record === "string") {
      return normalizeStatus(record);
    }

    if (typeof record !== "object") {
      return "unknown";
    }

    const directStatus =
      record.status ??
      record.crowdStatus ??
      record.crowd_status ??
      record.state ??
      record.level;

    const normalized = normalizeStatus(directStatus);

    if (normalized !== "unknown") {
      return normalized;
    }

    if (record.score != null) {
      return scoreToStatus(record.score);
    }

    return "unknown";
  }

  function getApiRecord(crowdData, targetId) {
    const wanted = normalizeId(targetId);

    if (!crowdData || !wanted) {
      return null;
    }

    const containers = [
      crowdData,
      crowdData.data,
      crowdData.events,
      crowdData.crowd,
      crowdData.results,
      crowdData.crowdData
    ];

    for (const container of containers) {
      if (!container) {
        continue;
      }

      if (Array.isArray(container)) {
        for (const item of container) {
          if (!item || typeof item !== "object") {
            continue;
          }

          const ids = [
            item.id, item.eventId, item.event_id,
            item.modalId, item.modal_id,
            item.key, item.type
          ];

          if (ids.some(id => normalizeId(id) === wanted)) {
            return item;
          }
        }
      } else if (typeof container === "object") {
        for (const key of Object.keys(container)) {
          if (normalizeId(key) === wanted) {
            const value = container[key];
            if (value && typeof value === "object") {
              return value;
            }
          }
        }

        const directIds = [
          container.id, container.eventId, container.event_id,
          container.modalId, container.modal_id,
          container.key, container.type
        ];

        if (directIds.some(id => normalizeId(id) === wanted)) {
          return container;
        }
      }
    }

    return null;
  }

  function findRecordForCrowdId(crowdData, crowdId) {
    const candidates =
      CROWD_ID_ALIASES[crowdId] || [crowdId];

    for (const candidate of candidates) {
      const record = getApiRecord(crowdData, candidate);

      if (record !== null) {
        return record;
      }
    }

    return null;
  }

  function getCurrentFloor() {
    const visible = document.querySelector(
      ".map-hotspot:not([hidden])"
    );

    if (!visible) {
      return 0;
    }

    for (let floor = 1; floor <= 4; floor++) {
      if (visible.classList.contains("floor-" + floor + "-hotspot")) {
        return floor - 1;
      }
    }

    return 0;
  }

  function getFloorHotspots(currentFloor) {
    const className =
      "floor-" + (currentFloor + 1) + "-hotspot";

    return Array.from(
      document.querySelectorAll(
        ".map-hotspot." + className
      )
    );
  }

  function renderStatusList() {
    if (!floorStatusList) {
      return;
    }

    const currentFloor = getCurrentFloor();
    const rawHotspots = getFloorHotspots(currentFloor);

    /* 同じ企画に複数のクリック範囲がある場合は1件にまとめる */
    const seenCrowdIds = new Set();
    const hotspots = rawHotspots.filter(hotspot => {
      const hotspotClass =
        Array.from(hotspot.classList).find(className =>
          Object.prototype.hasOwnProperty.call(
            HOTSPOT_TO_CROWD_ID,
            className
          )
        );

      const crowdId = hotspotClass
        ? HOTSPOT_TO_CROWD_ID[hotspotClass]
        : null;

      if (!crowdId) {
        return false;
      }

      if (seenCrowdIds.has(crowdId)) {
        return false;
      }

      seenCrowdIds.add(crowdId);
      return true;
    });

    if (floorStatusTitle) {
      floorStatusTitle.textContent =
        "1棟 " + (currentFloor + 1) + "階の混雑状況";
    }

    floorStatusList.innerHTML = "";

    if (!hotspots.length) {
      floorStatusList.innerHTML =
        '<div class="crowd-status-empty-message">この階に混雑状況を表示する企画はありません。</div>';
      return;
    }

    hotspots.forEach(hotspot => {
      const hotspotClass =
        Array.from(hotspot.classList).find(className =>
          Object.prototype.hasOwnProperty.call(
            HOTSPOT_TO_CROWD_ID,
            className
          )
        );

      const crowdId = hotspotClass
        ? HOTSPOT_TO_CROWD_ID[hotspotClass]
        : null;

      const status = normalizeStatus(
        hotspot.dataset.crowdStatus || "unknown"
      );

      const info = STATUS_INFO[status] || STATUS_INFO.unknown;

      const title =
        hotspot.getAttribute("title") ||
        hotspot.getAttribute("aria-label") ||
        "企画";

      const item = document.createElement("div");
      item.className = "crowd-status-item";

      item.innerHTML =
        '<div class="crowd-status-name"></div>' +
        '<div class="crowd-status-badge"></div>';

      item.querySelector(".crowd-status-name").textContent = title;

      const badge = item.querySelector(".crowd-status-badge");
      badge.className =
        "crowd-status-badge " + info.className;
      badge.textContent = info.text;

      if (crowdId) {
        item.dataset.crowdId = crowdId;
      }

      floorStatusList.appendChild(item);
    });
  }

  function applyCrowdData(crowdData) {
    const hotspots = Array.from(
      document.querySelectorAll(".map-hotspot")
    );

    hotspots.forEach(hotspot => {
      const hotspotClass =
        Array.from(hotspot.classList).find(className =>
          Object.prototype.hasOwnProperty.call(
            HOTSPOT_TO_CROWD_ID,
            className
          )
        );

      const crowdId = hotspotClass
        ? HOTSPOT_TO_CROWD_ID[hotspotClass]
        : null;

      const record = crowdId
        ? findRecordForCrowdId(crowdData, crowdId)
        : null;

      hotspot.dataset.crowdStatus = getStatus(record);
    });

    renderStatusList();
  }

  async function loadCrowd() {
    if (crowdRequestInFlight) {
      return;
    }

    crowdRequestInFlight = true;

    try {
      const response = await fetch(
        API_URL + "?_=" + Date.now(),
        {
          method: "GET",
          cache: "no-store",
          headers: {
            "Accept": "application/json",
            "Cache-Control": "no-cache"
          }
        }
      );

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();
      applyCrowdData(data);

    } catch (error) {
      console.error(
        "1棟：混雑情報取得失敗",
        error
      );

      renderStatusList();

    } finally {
      crowdRequestInFlight = false;
    }
  }

  let lastVisibleFloor = null;

  function watchFloor() {
    const floor = getCurrentFloor();

    if (floor !== lastVisibleFloor) {
      lastVisibleFloor = floor;
      renderStatusList();
    }
  }

  function init() {
    document
      .querySelectorAll(".map-hotspot")
      .forEach(hotspot => {
        hotspot.dataset.crowdStatus =
          hotspot.dataset.crowdStatus || "unknown";
      });

    renderStatusList();
    loadCrowd();

    setInterval(loadCrowd, REFRESH_MS);
    setInterval(watchFloor, 100);

    document.addEventListener(
      "visibilitychange",
      () => {
        if (document.visibilityState === "visible") {
          loadCrowd();
        }
      }
    );

    window.addEventListener("online", loadCrowd);
  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      init,
      { once: true }
    );
  } else {
    init();
  }

})();
</script>
